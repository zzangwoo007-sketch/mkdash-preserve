y\": severity,\n        \"target_url\": we[\"url\"],\n        \"summary\": summary,\n        \"body_md\": body_md,\n        \"ref\": funnel[\"six\"][\"ref\"],\n        \"ai_used\": funnel.get(\"ai_used\", False),\n    }\n", "ai/__init__.py": "\"\"\"AI(LLM) 패키지 — Claude 기본, OpenAI 선택. 키 없으면 mock 응답.\"\"\"\n", "ai/client.py": "\"\"\"LLM 호출 래퍼.\n\n- 기본 제공자: Anthropic Claude (vision 지원 → 광고영상 프레임 분석 가능)\n- AI_PROVIDER=openai 로 전환 가능 (GPT Vision)\n- 키가 없으면 호출하지 않고 None 을 반환 → 분석기는 내장 템플릿으로 폴백한다.\n\n프롬프트(.md)는 prompts/ 에서 로드한다.\n\"\"\"\nfrom __future__ import annotations\n\nimport base64\nfrom pathlib import Path\n\nimport config\n\nPROMPTS_DIR = config.PROMPTS_DIR\n\n\ndef load_prompt(name: str) -> str:\n    \"\"\"prompts/<name>.md 로드 (확장자 생략 가능).\"\"\"\n    fname = name if name.endswith(\".md\") else f\"{name}.md\"\n    path = PROMPTS_DIR / fname\n    return path.read_text(encoding=\"utf-8\") if path.exists() else \"\"\n\n\ndef available() -> bool:\n    return config.has_ai()\n\n\ndef complete(system: str, user: str, max_tokens: int = 2000) -> str | None:\n    \"\"\"텍스트 분석 호출. 키 없으면 None.\"\"\"\n    if not available():\n        return None\n    if config.AI_PROVIDER == \"anthropic\":\n        return _anthropic_text(system, user, max_tokens)\n    if config.AI_PROVIDER == \"openai\":\n        return _openai_text(system, user, max_tokens)\n    return None\n\n\ndef vision(system: str, user: str, image_paths: list[str], max_tokens: int = 2000) -> str | None:\n    \"\"\"이미지(광고영상 캡처 프레임 등) + 텍스트 분석. 키 없으면 None.\"\"\"\n    if not available():\n        return None\n    if config.AI_PROVIDER == \"anthropic\":\n        return _anthropic_vision(system, user, image_paths, max_tokens)\n    if config.AI_PROVIDER == \"openai\":\n        return _openai_vision(system, user, image_paths, max_tokens)\n    return None\n\n\n# ---------------- Anthropic ----------------\ndef _anthropic_text(system: str, user: str, max_tokens: int) -> str:\n    import anthropic\n\n    client = anthropic.Anthropic(api_key=config.ANTHROPIC_API_KEY)\n    msg = client.messages.create(\n        model=config.ANTHROPIC_MODEL,\n        max_tokens=max_tokens,\n        system=system,\n        messages=[{\"role\": \"user\", \"content\": user}],\n    )\n    return \"\".join(b.text for b in msg.content if b.type == \"text\")\n\n\ndef _anthropic_vision(system: str, user: str, image_paths: list[str], max_tokens: int) -> str:\n    import anthropic\n\n    client = anthropic.Anthropic(api_key=config.ANTHROPIC_API_KEY)\n    content: list[dict] = []\n    for p in image_paths:\n        data = base64.standard_b64encode(Path(p).read_bytes()).decode()\n        media = \"image/png\" if p.lower().endswith(\"png\") else \"image/jpeg\"\n        content.append({\"type\": \"image\", \"source\": {\n            \"type\": \"base64\", \"media_type\": media, \"data\": data}})\n    content.append({\"type\": \"text\", \"text\": user})\n    msg = client.messages.create(\n        model=config.ANTHROPIC_MODEL, max_tokens=max_tokens,\n        system=system, messages=[{\"role\": \"user\", \"content\": content}],\n    )\n    return \"\".join(b.text for b in msg.content if b.type == \"text\")\n\n\n# ---------------- OpenAI ----------------\ndef _openai_text(system: str, user: str, max_tokens: int) -> str:\n    from openai import OpenAI\n\n    client = OpenAI(api_key=config.OPENAI_API_KEY)\n    resp = client.chat.completions.create(\n        model=config.OPENAI_MODEL, max_tokens=max_tokens,\n        messages=[{\"role\": \"system\", \"content\": system},\n                  {\"role\": \"user\", \"content\": user}],\n    )\n    return resp.choices[0].message.content or \"\"\n\n\ndef _openai_vision(system: str, user: str, image_paths: list[str], max_tokens: int) -> str:\n    from openai import OpenAI\n\n    client = OpenAI(api_key=config.OPENAI_API_KEY)\n    parts: list[dict] = [{\"type\": \"text\", \"text\": user}]\n    for p in image_paths:\n        data = base64.standard_b64encode(Path(p).read_bytes()).decode()\n        media = \"image/png\" if p.lower().endswith(\"png\") else \"image/jpeg\"\n        parts.append({\"type\": \"image_url\",\n                      \"image_url\": {\"url\": f\"data:{media};base64,{data}\"}})\n    resp = client.chat.completions.create(\n        model=config.OPENAI_MODEL, max_tokens=max_tokens,\n        messages=[{\"role\": \"system\", \"content\": system},\n                  {\"role\": \"user\", \"content\": parts}],\n    )\n    return resp.choices[0].message.content or \"\"\n", "handoff/__init__.py": "\"\"\"디자이너 자동 전달 패키지.\"\"\"\n", "handoff/designer.py": "\"\"\"디자이너 자동 전달.\n\n흐름:  인사이트 → DB(insights) 저장 → Slack Webhook 전송(있으면)\n       → 없으면 reports/handoffs/ 에 마크다운 파일로 저장.\n대시보드에서 '전달' 버튼으로도 호출된다.\n\"\"\"\nfrom __future__ import annotations\n\nimport re\nfrom datetime import datetime\nfrom pathlib import Path\n\nimport requests\n\nimport config\nimport db\n\n\ndef _slugify(text: str) -> str:\n    return re.sub(r\"[^a-zA-Z0-9._-]+\", \"-\", text).strip(\"-\")[:60] or \"page\"\n\n\ndef _write_file(insight: dict, now: str) -> Path:\n    config.REPORTS_DIR.joinpath(\"handoffs\").mkdir(parents=True, exist_ok=True)\n    stamp = now.replace(\":\", \"\").replace(\"-\", \"\").replace(\" \", \"_\")[:15]\n    fname = f\"{stamp}_{_slugify(insight['target_url'])}.md\"\n    path = config.REPORTS_DIR / \"handoffs\" / fname\n    header = (f\"---\\ntitle: {insight['title']}\\nseverity: {insight['severity']}\\n\"\n              f\"target_url: {insight['target_url']}\\ncreated_at: {now}\\n---\\n\\n\")\n    path.write_text(header + insight[\"body_md\"], encoding=\"utf-8\")\n    return path\n\n\ndef _send_slack(insight: dict) -> bool:\n    webhook = config.DESIGNER_SLACK_WEBHOOK\n    if not webhook:\n        return False\n    emoji = {\"High\": \"🔴\", \"Medium\": \"🟡\", \"Low\": \"🟢\"}.get(insight[\"severity\"], \"🔵\")\n    text = (f\"{emoji} *[{insight['severity']}] 디자이너 전달*\\n\"\n            f\"*{insight['title']}*\\n{insight['summary']}\\n\"\n            f\"대상 페이지: `{insight['target_url']}`\")\n    resp = requests.post(webhook, json={\"text\": text}, timeout=15)\n    resp.raise_for_status()\n    return True\n\n\ndef send_message(text: str, title: str = \"퍼포먼스 액션\") -> dict:\n    \"\"\"임의 텍스트를 Slack 으로 전송. Webhook 없으면 reports/handoffs 에 파일 저장.\"\"\"\n    webhook = config.DESIGNER_SLACK_WEBHOOK\n    if webhook:\n        try:\n            resp = requests.post(webhook, json={\"text\": text}, timeout=15)\n            resp.raise_for_status()\n            return {\"status\": \"sent\", \"channel\": \"slack\", \"detail\": \"Slack 전송 완료\"}\n        except Exception as e:  # noqa: BLE001\n            pass  # 실패 시 파일로 폴백\n    config.REPORTS_DIR.joinpath(\"handoffs\").mkdir(parents=True, exist_ok=True)\n    path = config.REPORTS_DIR / \"handoffs\" / f\"perf_{_slugify(title)}.md\"\n    path.write_text(text, encoding=\"utf-8\")\n    return {\"status\": \"sent\", \"channel\": \"file\",\n            \"detail\": f\"Webhook 미설정 → 파일 저장: {path}\"}\n\n\ndef send(insight: dict, now: str | None = None) -> dict:\n    \"\"\"인사이트를 저장하고 디자이너에게 전달. 결과 dict 반환.\"\"\"\n    now = now or datetime.now().isoformat(timespec=\"seconds\")\n    db.init_db()\n\n    insight_id = db.save_insight({\n        \"created_at\": now, \"kind\": insight.get(\"kind\", \"clarity\"),\n        \"title\": insight[\"title\"], \"severity\": insight[\"severity\"],\n        \"target_url\": insight[\"target_url\"], \"summary\": insight[\"summary\"],\n        \"body_md\": insight[\"body_md\"], \"handoff_status\": \"pending\", \"handoff_channel\": \"\",\n    })\n\n    channel, status, detail = \"file\", \"sent\", \"\"\n    try:\n        if _send_slack(insight):\n            channel = \"slack\"\n            detail = \"Slack Webhook 전송 완료\"\n        else:\n            path = _write_file(insight, now)\n            detail = f\"파일 저장: {path}\"\n    except Exception as e:  # noqa: BLE001\n        status = \"failed\"\n        # Slack 실패 시 파일로라도 남긴다\n        path = _write_file(insight, now)\n        channel = \"file\"\n        detail = f\"Slack 실패({e}) → 파일 저장: {path}\"\n        status = \"sent\"\n\n    db.update_handoff(insight_id, status, channel)\n    return {\"insight_id\": insight_id, \"status\": status, \"channel\": channel, \"detail\": detail}\n", "dashboards/__init__.py": "\"\"\"대시보드 패키지 (Streamlit 페이지 + 공통 스타일).\"\"\"\n", "dashboards/_style.py": "\"\"\"대시보드 공통 스타일 — datanugget 스타일 카드/헤더/사이드바 CSS.\n\n각 페이지 상단에서 inject_css() 1회 호출. 통합앱(Home.py)에서도 호출하므로\n단독 실행/통합 실행 모두 동일한 룩앤필이 적용된다.\n\"\"\"\nfrom __future__ import annotations\n\nfrom datetime import timedelta\n\nimport pandas as pd\nimport streamlit as st\n\n# 퍼센트성 컬럼 힌트(값에 % 표기).\n_PCT_HINT = (\"율\", \"CTR\", \"CVR\", \"이탈\", \"전환율\", \"비중\")\n\n\ndef roas_pct(v) -> str:\n    \"\"\"ROAS 비율(예: 1.73)을 퍼센트 문자열로(예: 173%). None/NaN → '-'.\"\"\"\n    try:\n        if v is None or pd.isna(v):\n            return \"-\"\n        return f\"{float(v) * 100:,.0f}%\"\n    except (TypeError, ValueError):\n        return \"-\"\n\n\ndef _roas_cell(v):\n    return roas_pct(v)\n\n\ndef fmt_df(df: pd.DataFrame):\n    \"\"\"숫자 컬럼 표시 규칙:\n      · ROAS  → 퍼센트 (예: 1.73 → 173%)\n      · 퍼센트(컬럼명 끝 '%' 또는 율/CTR/CVR 등) → 소수 2자리 + '%'  (예: 55.80%)\n      · 빈도/Frequency → 소수 2자리\n      · 그 외 금액·건수 → 000,000,000 (정수, 천단위 콤마)\n    퍼센트 컬럼명이 '%'로 끝나면 값에 %가 붙으므로 헤더의 중복 '%'는 제거한다.\n    \"\"\"\n    if df is None or df.empty:\n        return df\n    df = df.copy()\n    ren = {c: str(c)[:-1] for c in df.columns\n           if df[c].dtype.kind in \"if\" and str(c).endswith(\"%\") and len(str(c)) > 1}\n    if ren:\n        df = df.rename(columns=ren)\n    pct_cols = set(ren.values())\n    fmt = {}\n    for c in df.columns:\n        if df[c].dtype.kind not in \"if\":\n            continue\n        name = str(c)\n        if \"ROAS\" in name.upper():\n            fmt[c] = _roas_cell                       # 1.73 → 173%\n        elif c in pct_cols or any(h in name for h in _PCT_HINT):\n            fmt[c] = \"{:,.2f}%\"\n        elif \"빈도\" in name or \"frequency\" in name.lower():\n            fmt[c] = \"{:,.2f}\"\n        else:\n            fmt[c] = \"{:,.0f}\"\n    return df.style.format(fmt, na_rep=\"-\")\n\n\ndef page_intro(text: str) -> None:\n    \"\"\"제목 아래 한두 줄 설명.\"\"\"\n    st.markdown(\n        f\"<div style='color:#667085;font-size:.9rem;margin:-6px 0 14px 0;'>{text}</div>\",\n        unsafe_allow_html=True)\n\n\ndef brand_pills(brands: list[str], key: str, label: str = \"브랜드\", default=None, format_func=None):\n    \"\"\"항목들을 '이름 클릭 토글 + 다중선택'으로 고르는 위젯(브랜드·채널 공용).\n    st.pills(다중) 우선, 없으면 segmented_control(다중), 그래도 없으면 multiselect 폴백.\n    아무것도 선택 안 하면 전체로 간주(빈 화면 방지).\"\"\"\n    default = brands if default is None else default\n    kw = {\"selection_mode\": \"multi\", \"default\": default, \"key\": key}\n    if format_func is not None:\n        kw[\"format_func\"] = format_func\n    try:\n        if hasattr(st, \"pills\"):\n            sel = st.pills(label, brands, **kw)\n        elif hasattr(st, \"segmented_control\"):\n            sel = st.segmented_control(label, brands, **kw)\n        else:\n            sel = st.multiselect(label, brands, default=default, key=key,\n                                 **({\"format_func\": format_func} if format_func else {}))\n    except TypeError:  # 구버전 시그니처 차이\n        sel = st.multiselect(label, brands, default=default, key=key,\n                             **({\"format_func\": format_func} if format_func else {}))\n    return list(sel) if sel else list(brands)\n\n\ndef top_filter(brands: list[str], dmin=None, dmax=None, key: str = \"f\",\n               default_days: int = 29, with_date: bool = True):\n    \"\"\"페이지 최상단 필터바(기간 + 브랜드). (start, end, selected_brands) 반환.\"\"\"\n    start = end = None\n    if with_date and dmin is not None:\n        c = st.columns([2.4, 0.2, 4.4])\n        with c[0]:\n            rng = st.date_input(\"기간\", value=(dmax, dmax),   # 기본=최신 1일(필요시 사용자가 넓힘)\n                                min_value=dmin, max_value=dmax, key=key + \"_date\")\n            start, end = (rng if isinstance(rng, tuple) and len(rng) == 2 else (dmin, dmax))\n        bcol = c[2]\n    else:\n        bcol = st.container()\n    with bcol:\n        sel = brand_pills(brands, key=key + \"_brand\")\n    st.divider()\n    return start, end, sel\n\n_CSS = \"\"\"\n<style>\n/* ===== 레이아웃 ===== */\n.block-container { padding-top: 2.2rem; padding-bottom: 2.5rem; max-width: 1480px; }\n[data-testid=\"stHeader\"] { background: transparent; }\n\n/* ===== KPI 카드 ===== */\ndiv[data-testid=\"stMetric\"] {\n  background: #FFFFFF;\n  border: 1px solid #ECEFF3;\n  border-radius: 14px;\n  padding: 16px 18px;\n  box-shadow: 0 1px 3px rgba(16,24,40,.06);\n  transition: box-shadow .15s ease;\n}\ndiv[data-testid=\"stMetric\"]:hover { box-shadow: 0 4px 14px rgba(16,24,40,.10); }\ndiv[data-testid=\"stMetricLabel\"] p { font-size: .80rem; color: #667085; font-weight: 600; }\ndiv[data-testid=\"stMetricValue\"] { font-size: 1.55rem; font-weight: 800; color: #101828; }\ndiv[data-testid=\"stMetricDelta\"] { font-size: .82rem; }\n\n/* ===== 헤더 ===== */\nh1 { font-weight: 800; color: #101828; letter-spacing: -.02em; }\nh2, h3 { font-weight: 700; color: #1D2939; }\n\n/* ===== 사이드바 ===== */\nsection[data-testid=\"stSidebar\"] {\n  background: #FFFFFF;\n  border-right: 1px solid #ECEFF3;\n}\nsection[data-testid=\"stSidebar\"] .block-container { padding-top: 1.2rem; }\n/* 사이드바 네비게이션 그룹/링크 */\ndiv[data-testid=\"stSidebarNav\"] ul { gap: 2px; }\ndiv[data-testid=\"stSidebarNav\"] a { border-radius: 9px; }\n\n/* ===== 표 ===== */\ndiv[data-testid=\"stDataFrame\"], div[data-testid=\"stTable\"] {\n  border: 1px solid #ECEFF3; border-radius: 12px; overflow: hidden;\n}\n\n/* ===== 버튼 / 입력 ===== */\n.stButton button { border-radius: 10px; font-weight: 600; border: 1px solid #D8DEE7; }\n.stButton button[kind=\"primary\"] { background: #4C7DF0; border-color: #4C7DF0; }\ndiv[data-testid=\"stExpander\"] { border: 1px solid #ECEFF3; border-radius: 12px; }\n\n/* ===== 탭 ===== */\nbutton[data-baseweb=\"tab\"] { font-weight: 600; }\n\n/* 구분선 */\nhr { margin: 1.1rem 0; border-color: #ECEFF3; }\n</style>\n\"\"\"\n\n\ndef inject_css() -> None:\n    st.markdown(_CSS, unsafe_allow_html=True)\n\n\ndef brand_sidebar(title: str = \"마케팅 인텔리전스\",\n                  subtitle: str = \"Google · Meta · TikTok · GA4 · Clarity\") -> None:\n    \"\"\"사이드바 상단 브랜드 영역.\"\"\"\n    st.sidebar.markdown(\n        f\"\"\"\n        <div style=\"padding:6px 4px 14px 4px;border-bottom:1px solid #ECEFF3;margin-bottom:10px;\">\n          <div style=\"font-size:1.15rem;font-weight:800;color:#101828;\">📊 {title}</div>\n          <div style=\"font-size:.72rem;color:#98A2B3;margin-top:3px;\">{subtitle}</div>\n          <div style=\"font-size:.72rem;color:#98A2B3;\">매일 자동 수집 · 기간 누적</div>\n        </div>\n        \"\"\",\n        unsafe_allow_html=True,\n    )\n", "dashboards/ad_report.py": "\"\"\"통합 광고 리포트 대시보드 (datanugget 스타일).\n\n브랜드별 · 광고플랫폼별(Meta / Google / TikTok) 성과를 기간 누적으로 본다.\n데이터: daily_ads (cafe24-dashboard 스냅샷에서 매일 적재 → 기간이 계속 쌓임).\n\n실행:\n  cd marketing-intelligence\n  streamlit run dashboards/ad_report.py\n\"\"\"\nfrom __future__ import annotations\n\nimport sys\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parent.parent\nsys.path.insert(0, str(ROOT))\n\nimport json  # noqa: E402\nimport re  # noqa: E402\nfrom datetime import timedelta  # noqa: E402\n\nimport numpy as np  # noqa: E402\nimport pandas as pd  # noqa: E402\nimport plotly.express as px  # noqa: E402\nimport plotly.graph_objects as go  # noqa: E402\nimport streamlit as st  # noqa: E402\n\nfrom analyzers import _common as C  # noqa: E402\n\nPLAT_NAME = {\"meta\": \"Meta\", \"google\": \"Google Ads\", \"tiktok\": \"TikTok\",\n             \"naver\": \"Naver 검색\", \"naver_gfa\": \"Naver GFA\"}\nPLAT_COLOR = {\"meta\": \"#4267B2\", \"google\": \"#EA4335\", \"tiktok\": \"#000000\",\n              \"naver\": \"#03C75A\", \"naver_gfa\": \"#19A95C\"}\n\ntry:\n    st.set_page_config(page_title=\"통합 광고 리포트\", layout=\"wide\")\nexcept Exception:\n    pass\nfrom dashboards._style import brand_pills, fmt_df, inject_css, page_intro, roas_pct  # noqa: E402\ninject_css()\n\n\n@st.cache_data(ttl=600)\ndef load() -> pd.DataFrame:\n    return C.load_ads()\n\n\n@st.cache_data(ttl=600)\ndef load_sales() -> pd.DataFrame:\n    \"\"\"실매출(실결제) — 통합 요약과 동일 소스(카페24 실결제+쿠팡+스마트스토어, 취소 제외).\"\"\"\n    return C.load_sales5()\n\n\ndef won(x: float) -> str:\n    return f\"₩{x:,.0f}\"\n\n\nads = C.add_ad_brand(load())\nst.title(\"📊 통합 광고 리포트\")\npage_intro(\"Meta·Google·TikTok 광고 성과를 브랜드·플랫폼별로 봅니다. \"\n           \"지출·ROAS·CTR·노출/클릭 추이와 캠페인 비교. 기간은 매일 누적됩니다.\")\nst.warning(\"⚠️ 상단 KPI의 **실매출·실매출 ROAS는 실제 매출(카페24 실결제+쿠팡+스마트스토어, 취소 제외) 기준**입니다\"\n           \"(통합 요약과 동일). 반면 아래 **플랫폼·소재별 '전환수익(플랫폼)'은 각 플랫폼이 자체 보고한 '기여' 기준**이라 \"\n           \"메타·구글이 클릭+뷰스루로 각자 전환을 잡아 **중복·과대**됩니다(합산이 실매출의 3~4배가 되기도 함). \"\n           \"플랫폼 전환수익은 **소재 상대비교용**으로만 보세요.\")\n\nif ads.empty:\n    st.warning(\"광고 데이터가 없습니다. 개요의 ‘실시간 API 취합’ 또는 `python main.py` 실행.\")\n    st.stop()\n\nads[\"d\"] = ads[\"date\"].dt.date\ndmin, dmax = ads[\"d\"].min(), ads[\"d\"].max()\n\n# ---------------- 최상단: 기간 / 브랜드 / 플랫폼 ----------------\nfc = st.columns([2.4, 0.2, 3.0, 3.0])\nwith fc[0]:\n    rng = st.date_input(\"기간\", value=(dmax, dmax),   # 기본=최신 1일(필요시 사용자가 넓힘)\n                        min_value=dmin, max_value=dmax, key=\"ad_date\")\n    start, end = (rng if isinstance(rng, tuple) and len(rng) == 2 else (dmin, dmax))\nwith fc[2]:\n    present = [b for b in C.AD_BRANDS if b in ads[\"brand\"].unique()]\n    extra = sorted(set(ads[\"brand\"].dropna().unique()) - set(C.AD_BRANDS))\n    all_brands = present + extra\n    sel_brands = brand_pills(all_brands, key=\"ad_brand\")\nwith fc[3]:\n    all_plats = [p for p in [\"meta\", \"google\", \"tiktok\", \"naver\", \"naver_gfa\"] if p in ads[\"platform\"].unique()]\n    sel_plats = brand_pills(all_plats, key=\"ad_plat\", label=\"플랫폼\",\n                            format_func=lambda p: PLAT_NAME.get(p, p))\nst.divider()\n\nmask = (ads[\"d\"] >= start) & (ads[\"d\"] <= end) & ads[\"brand\"].isin(sel_brands) \\\n    & ads[\"platform\"].isin(sel_plats)\ndf = ads[mask].copy()\nif df.empty:\n    st.info(\"선택한 조건에 데이터가 없습니다.\")\n    st.stop()\n\n# ⚠️ 과집계('장난질') 자동 감지·제외 — 전환매출이 비현실적으로 크고 ROAS가 과도한 행(어트리뷰션 중복/집계 오류)\n_oc = C.flag_overcount(df[\"conv_value\"], df[\"cost\"])\nif _oc.any():\n    _ocsum = df.loc[_oc, \"conv_value\"].sum()\n    st.warning(f\"⚠️ **과집계('장난질') 의심 {int(_oc.sum())}건**(전환수익 {_ocsum/1e8:.1f}억) 감지 — \"\n               \"지출 대비 ROAS가 비현실적으로 높은 행으로, 플랫폼 어트리뷰션 중복/집계 오류로 추정됩니다.\")\n    _ex = st.toggle(\"🧹 과집계 의심 제외하고 분석 (권장)\", value=True, key=\"ad_excl_oc\")\n    with st.expander(f\"의심 내역 {int(_oc.sum())}건 보기\"):\n        _od = df[_oc].copy()\n        _od[\"ROAS\"] = (_od[\"conv_value\"] / _od[\"cost\"].replace(0, np.nan)).round(1)\n        _oc_cols = [\"date\", \"platform\", \"brand\", \"campaign_name\", \"cost\", \"conv_value\", \"ROAS\"]\n        st.dataframe(fmt_df(_od[_oc_cols].sort_values(\"conv_value\", ascending=False)\n                            .rename(columns={\"campaign_name\": \"소재\", \"conv_value\": \"전환수익\", \"cost\": \"지출\"})),\n                     use_container_width=True, hide_index=True)\n    if _ex:\n        df = df[~_oc].copy()\n\n\ndef metrics(frame: pd.DataFrame) -> dict:\n    imp, clk = frame[\"impressions\"].sum(), frame[\"clicks\"].sum()\n    cost, conv, val = frame[\"cost\"].sum(), frame[\"conversions\"].sum(), frame[\"conv_value\"].sum()\n    reach = frame[\"reach\"].sum() if \"reach\" in frame.columns else 0\n    likes = frame[\"likes\"].fillna(0).sum() if \"likes\" in frame.columns else 0\n    shares = frame[\"shares\"].fillna(0).sum() if \"shares\" in frame.columns else 0\n    return {\"impr\": imp, \"clicks\": clk, \"cost\": cost, \"conv\": conv, \"val\": val,\n            \"reach\": reach, \"likes\": likes, \"shares\": shares,\n            \"freq\": (imp / reach) if reach else 0,\n            \"ctr\": (clk / imp * 100) if imp else 0, \"cpc\": (cost / clk) if clk else 0,\n            \"cpm\": (cost / imp * 1000) if imp else 0,\n            \"roas\": (val / cost) if cost else 0, \"cvr\": (conv / clk * 100) if clk else 0}\n\n\ntot = metrics(df)\n\n# 실매출(실결제) — 통합 요약과 동일 정의: 선택 브랜드의 전 채널(카페24 실결제+쿠팡+스마트스토어, 취소 제외).\n# 매출은 플랫폼에 귀속되지 않으므로 플랫폼 필터와 무관하게 브랜드·기간 기준으로 집계한다.\n_sales = load_sales()\nif not _sales.empty:\n    _sd = _sales[\"date\"].dt.date\n    real_rev = _sales[(_sd >= start) & (_sd <= end) & _sales[\"brand\"].isin(sel_brands)][\"sales_amount\"].sum()\nelse:\n    real_rev = 0.0\nreal_roas = (real_rev / tot[\"cost\"]) if tot[\"cost\"] else 0\n\n# ---------------- 상단 KPI (플랫폼 미니 분해 포함) ----------------\nst.caption(f\"기간: **{start} ~ {end}**  ·  브랜드 {len(sel_brands)}개  ·  플랫폼 {len(sel_plats)}개\")\n# 1번째 줄: 핵심 4 — 수익은 '실매출(실결제)' 기준(통합 요약과 동일)\nk = st.columns(4)\nk[0].metric(\"총 광고 지출\", won(tot[\"cost\"]))\nk[1].metric(\"실매출(실결제)\", won(real_rev))\nk[2].metric(\"실매출 ROAS\", roas_pct(real_roas))\nk[3].metric(\"총 전환수\", f\"{tot['conv']:,.0f}\")\nst.caption(\"※ **실매출 = 카페24 실결제액 + 쿠팡 + 스마트스토어**(취소 제외) — 통합 요약과 동일. 선택 브랜드의 전 채널 합이며 \"\n           \"플랫폼 필터와 무관합니다(전 플랫폼 선택 시 실매출 ROAS = 통합 요약의 통합 ROAS와 일치). \"\n           \"플랫폼이 보고한 전환수익은 아래 표에서 확인하세요.\")\n\npmet = {p: metrics(df[df[\"platform\"] == p]) for p in sel_plats}\n\n# 채널별 총 광고 지출 (전환수익 박스 위)\nst.caption(\"채널별 총 광고 지출\")\nscols = st.columns(len(sel_plats))\nfor col, p in zip(scols, sel_plats):\n    m = pmet[p]\n    share = (m[\"cost\"] / tot[\"cost\"] * 100) if tot[\"cost\"] else 0\n    col.metric(PLAT_NAME.get(p, p), won(m[\"cost\"]), f\"비중 {share:.0f}%\")\n\n# 총 전환 수익 — 광고 플랫폼별 분해\nst.caption(\"총 전환 수익 — 플랫폼별\")\npcols = st.columns(len(sel_plats))\nfor col, p in zip(pcols, sel_plats):\n    m = pmet[p]\n    col.metric(PLAT_NAME.get(p, p), won(m[\"val\"]), f\"지출 {won(m['cost'])} · ROAS {roas_pct(m['roas'])}\")\n\n# 2번째 줄: 참여·효율 6\nst.write(\"\")\nk2 = st.columns(6)\nk2[0].metric(\"평균 클릭률 (CTR)\", f\"{tot['ctr']:.2f}%\")\nk2[1].metric(\"평균 CPC\", won(tot[\"cpc\"]))\nk2[2].metric(\"평균 CPM\", won(tot[\"cpm\"]))\nk2[3].metric(\"빈도수 (노출/도달)\", f\"{tot['freq']:.2f}\")\nk2[4].metric(\"게시물 공유\", f\"{tot['shares']:,.0f}\")\nk2[5].metric(\"좋아요\", f\"{tot['likes']:,.0f}\")\n\nst.divider()\n\n# ---------------- 시계열: 플랫폼별 성과 추이 ----------------\nst.subheader(\"내가 돌린 광고는 얼마나 성과가 있었을까?\")\nmetric_label = st.radio(\"지표\", [\"전환수익\", \"지출\", \"클릭\", \"노출\", \"ROAS\"],\n                        horizontal=True, label_visibility=\"collapsed\")\ncol_map = {\"전환수익\": \"conv_value\", \"지출\": \"cost\", \"클릭\": \"clicks\", \"노출\": \"impressions\"}\ndaily = df.groupby([\"d\", \"platform\"], as_index=False).agg(\n    conv_value=(\"conv_value\", \"sum\"), cost=(\"cost\", \"sum\"),\n    clicks=(\"clicks\", \"sum\"), impressions=(\"impressions\", \"sum\"))\nif metric_label == \"ROAS\":\n    daily[\"y\"] = daily[\"conv_value\"] / daily[\"cost\"].replace(0, np.nan)\nelse:\n    daily[\"y\"] = daily[col_map[metric_label]]\ndaily[\"플랫폼\"] = daily[\"platform\"].map(PLAT_NAME).fillna(daily[\"platform\"])\nfig = px.line(daily, x=\"d\", y=\"y\", color=\"플랫폼\", markers=True,\n              color_discrete_map={PLAT_NAME[k]: v for k, v in PLAT_COLOR.items() if k in PLAT_NAME},\n              labels={\"d\": \"\", \"y\": metric_label})\nfig.update_layout(height=340, legend_title=\"\", margin=dict(t=10, b=0))\nst.plotly_chart(fig, use_container_width=True)\n\nst.divider()\n\n# ---------------- 플랫폼별 패널 (가로 3칸씩, 다음 줄로 채움) ----------------\nst.subheader(\"플랫폼별 상세\")\n\n\ndef _render_platform_panel(p):\n    pdf = df[df[\"platform\"] == p]\n    m = metrics(pdf)\n    st.markdown(f\"### {PLAT_NAME.get(p, p)}\")\n    # 도넛: 브랜드별 지출 비중\n    by_brand = pdf.groupby(\"brand\", as_index=False)[\"cost\"].sum()\n    donut = go.Figure(go.Pie(labels=by_brand[\"brand\"], values=by_brand[\"cost\"],\n                             hole=0.62, textinfo=\"percent\"))\n    donut.update_layout(height=240, margin=dict(t=10, b=10, l=0, r=0),\n                        showlegend=True, legend=dict(orientation=\"h\", y=-0.1),\n                        annotations=[dict(text=f\"ROAS<br><b>{m['roas']:.1f}x</b>\",\n                                          showarrow=False, font_size=15)])\n    donut.update_traces(marker=dict(colors=px.colors.qualitative.Pastel))\n    st.plotly_chart(donut, use_container_width=True, key=f\"donut_{p}\")\n\n    a, b = st.columns(2)\n    a.metric(\"노출수\", f\"{m['impr']:,.0f}\")\n    b.metric(\"클릭수\", f\"{m['clicks']:,.0f}\")\n    a.metric(\"전환수\", f\"{m['conv']:,.0f}\")\n    b.metric(\"클릭률\", f\"{m['ctr']:.2f}%\")\n\n    # 캠페인(소재)별 비교 — 메타만 PA 토글 + 합계\n    if p == \"meta\":\n        hc = st.columns([2.4, 1.0, 1.2])\n        hc[0].caption(\"클릭률 · 전환율 · 전환수익 비교 (지출 상위 캠페인)\")\n        pa_only = hc[1].toggle(\"PA만\", key=f\"pa_{p}\", help=\"소재명에 'PA' 포함만 보기\")\n        pa_exclude = hc[2].toggle(\"PA 제외\", key=f\"paex_{p}\", disabled=pa_only,\n                                  help=\"소재명에 'PA' 포함 제외하고 보기 (PA만과 동시 사용 불가)\")\n    else:\n        st.caption(\"클릭률 · 전환율 · 전환수익 비교 (지출 상위 캠페인)\")\n        pa_only = False   # PA는 메타에만 있어 다른 매체는 토글 없음\n        pa_exclude = False\n    if pa_only:\n        cdf = pdf[pdf[\"campaign_name\"].str.contains(\"PA\", na=False)]\n    elif pa_exclude:\n        cdf = pdf[~pdf[\"campaign_name\"].str.contains(\"PA\", na=False)]\n    else:\n        cdf = pdf\n\n    # 메타는 소재마다 구분(🖼️ 인스타튠 / 👤 인플루언서 / 일반)을 항상 부여해 섞이지 않게 한다.\n    is_meta = (p == \"meta\") and (\"intune\" in cdf.columns) and not cdf.empty\n    if is_meta:\n        cdf = cdf.copy()\n        cdf[\"구분\"] = \"일반\"\n        cdf.loc[cdf[\"campaign_name\"].str.contains(\"PA\", na=False), \"구분\"] = \"👤 인플루언서\"\n        cdf.loc[cdf[\"intune\"].fillna(0) >= 1, \"구분\"] = \"🖼️ 인스타튠\"\n\n    if pa_only and is_meta:\n        # PA 효율 요약 — 인스타튠 vs 인플루언서 (완전 분리)\n        pg = cdf.groupby(\"구분\", as_index=False).agg(\n            지출=(\"cost\", \"sum\"), 노출=(\"impressions\", \"sum\"), 클릭=(\"clicks\", \"sum\"),\n            전환=(\"conversions\", \"sum\"), 전환매출=(\"conv_value\", \"sum\"))\n        pg[\"ROAS\"] = (pg[\"전환매출\"] / pg[\"지출\"].replace(0, np.nan)).round(2)\n        pg[\"CTR%\"] = (pg[\"클릭\"] / pg[\"노출\"].replace(0, np.nan) * 100).round(2)\n        st.caption(\"PA 효율 — 🖼️ 인스타튠(광고세트 '인튠') vs 👤 인플루언서 (분리)\")\n        st.dataframe(fmt_df(pg[[\"구분\", \"지출\", \"CTR%\", \"전환\", \"전환매출\", \"ROAS\"]]),\n                     use_container_width=True, hide_index=True)\n\n    keys = ([\"구분\"] if is_meta else []) + [\"campaign_name\"]\n    camp = cdf.groupby(keys, as_index=False).agg(\n        노출=(\"impressions\", \"sum\"), 클릭=(\"clicks\", \"sum\"), 지출=(\"cost\", \"sum\"),\n        전환=(\"conversions\", \"sum\"), 전환수익=(\"conv_value\", \"sum\"))\n    camp[\"클릭률%\"] = (camp[\"클릭\"] / camp[\"노출\"].replace(0, np.nan) * 100).round(2)\n    camp[\"전환율%\"] = (camp[\"전환\"] / camp[\"클릭\"].replace(0, np.nan) * 100).round(2)\n    camp[\"ROAS\"] = (camp[\"전환수익\"] / camp[\"지출\"].replace(0, np.nan)).round(2)\n    cols = ([\"구분\"] if is_meta else []) + [\"campaign_name\", \"지출\", \"클릭률%\", \"전환율%\", \"전환수익\", \"ROAS\"]\n    top = camp.sort_values(\"지출\", ascending=False).head(8)[cols]\n    # 합계 행 (필터 전체 기준)\n    ti, tk = cdf[\"impressions\"].sum(), cdf[\"clicks\"].sum()\n    tc, tv, tcn = cdf[\"cost\"].sum(), cdf[\"conv_value\"].sum(), cdf[\"conversions\"].sum()\n    trow = {\"campaign_name\": \"🔢 합계\", \"지출\": tc,\n            \"클릭률%\": round(tk / ti * 100, 2) if ti else 0,\n            \"전환율%\": round(tcn / tk * 100, 2) if tk else 0,\n            \"전환수익\": tv, \"ROAS\": round(tv / tc, 2) if tc else 0}\n    if is_meta:\n        trow[\"구분\"] = \"\"\n    show = pd.concat([top, pd.DataFrame([trow])], ignore_index=True)\n    st.dataframe(fmt_df(show.rename(columns={\"campaign_name\": \"소재\", \"전환수익\": \"전환매출(플랫폼)\",\n                                             \"ROAS\": \"전환ROAS(플랫폼)\"})),\n                 use_container_width=True, hide_index=True)\n\n\nPER_ROW = 3\nfor i in range(0, len(sel_plats), PER_ROW):\n    row_plats = sel_plats[i:i + PER_ROW]\n    cols = st.columns(PER_ROW)   # 항상 3칸 유지(빈칸은 비워둠)\n    for col, p in zip(cols, row_plats):\n        with col:\n            _render_platform_panel(p)\n\nst.divider()\n\n# ---------------- 브랜드 × 플랫폼 누적 매트릭스 ----------------\nst.subheader(\"브랜드 × 플랫폼 성과 (기간 누적)\")\npiv = df.groupby([\"brand\", \"platform\"], as_index=False).agg(\n    지출=(\"cost\", \"sum\"), 전환수익=(\"conv_value\", \"sum\"), 클릭=(\"clicks\", \"sum\"),\n    노출=(\"impressions\", \"sum\"), 전환=(\"conversions\", \"sum\"))\npiv[\"ROAS\"] = (piv[\"전환수익\"] / piv[\"지출\"].replace(0, np.nan)).round(2)\npiv[\"CTR%\"] = (piv[\"클릭\"] / piv[\"노출\"].replace(0, np.nan) * 100).round(2)\npiv[\"플랫폼\"] = piv[\"platform\"].map(PLAT_NAME).fillna(piv[\"platform\"])\nst.dataframe(fmt_df(piv[[\"brand\", \"플랫폼\", \"지출\", \"전환수익\", \"ROAS\", \"CTR%\", \"전환\"]]\n             .rename(columns={\"brand\": \"브랜드\", \"전환수익\": \"전환매출(플랫폼)\",\n                              \"ROAS\": \"전환ROAS(플랫폼)\"}).sort_values(\"지출\", ascending=False)),\n             use_container_width=True, hide_index=True)\n\nst.divider()\n\n# ---------------- 👤 개인별 성과 (소재명에서 담당자 자동 인식) ----------------\nOWNER_CODES = [\"SY\", \"HS\", \"SA\", \"SE\", \"YW\", \"BR\", \"PA\", \"YR\", \"PM\", \"YE\"]\nALL_CODES = OWNER_CODES + [\"ZZ\"]  # ZZ = 코드 없는 나머지 전부\nOWNER_SET = set(OWNER_CODES)\n\n\ndef owner_from_name(name: str) -> str:\n    \"\"\"소재명 토큰 중 담당자 코드(예: …_PA_…, …_HS_…)를 자동 인식. 없으면 ZZ.\"\"\"\n    for t in re.split(r\"[ _\\-\\(\\)\\[\\]]+\", str(name)):\n        if t.upper() in OWNER_SET:\n            return t.upper()\n    return \"ZZ\"\n\n\nst.subheader(\"👤 개인별 성과\")\nst.caption(\"소재명에서 담당자 코드(예: `…_PA_…`, `…_HS_…`)를 자동 인식해 집계합니다. \"\n           \"코드가 없는 소재는 **ZZ(나머지)**. 위의 브랜드 필터로 브랜드별 개인 성과를 볼 수 있어요.\")\n\ncamp_all = df.groupby([\"brand\", \"campaign_name\"], as_index=False).agg(\n    지출=(\"cost\", \"sum\"), 노출=(\"impressions\", \"sum\"), 클릭=(\"clicks\", \"sum\"),\n    전환=(\"conversions\", \"sum\"), 전환수익=(\"conv_value\", \"sum\"))\ncamp_all[\"담당자\"] = camp_all[\"campaign_name\"].map(owner_from_name)\n\n# 개인별 집계 (SY~PM + ZZ, 0 포함)\nperf = camp_all.groupby(\"담당자\", as_index=False).agg(\n    지출=(\"지출\", \"sum\"), 노출=(\"노출\", \"sum\"), 클릭=(\"클릭\", \"sum\"),\n    전환=(\"전환\", \"sum\"), 전환수익=(\"전환수익\", \"sum\"), 소재수=(\"campaign_name\", \"size\"))\nperf = perf.set_index(\"담당자\").reindex(ALL_CODES).fillna(0).reset_index()\nperf[\"ROAS\"] = (perf[\"전환수익\"] / perf[\"지출\"].replace(0, np.nan)).round(2)\nperf[\"CTR%\"] = (perf[\"클릭\"] / perf[\"노출\"].replace(0, np.nan) * 100).round(2)\nperf[\"CPC\"] = (perf[\"지출\"] / perf[\"클릭\"].replace(0, np.nan)).round(0)\nst.dataframe(fmt_df(perf[[\"담당자\", \"소재수\", \"지출\", \"노출\", \"클릭\", \"CTR%\", \"CPC\",\n                          \"전환\", \"전환수익\", \"ROAS\"]]),\n             use_container_width=True, hide_index=True)\n_pp = perf[perf[\"지출\"] > 0].copy()\n_pp[\"ROAS표시\"] = _pp[\"ROAS\"].map(roas_pct)\nst.plotly_chart(px.bar(_pp, x=\"담당자\", y=\"지출\", color=\"담당자\",\n                       title=\"담당자별 지출\", text=\"ROAS표시\"), use_container_width=True)\n\nst.divider()\nif \"tiktok\" not in ads[\"platform\"].unique():\n    st.info(\"ℹ️ TikTok 은 현재 수집 데이터가 없습니다(메타·구글만 적재됨). \"\n            \"TikTok 은 cafe24-dashboard 의 엑셀 임포트(import_tiktok.py) 경로라 \"\n            \"해당 기간 데이터가 채워지면 자동으로 표시됩니다.\")\n", "dashboards/app.py": "\"\"\"마케팅 인텔리전스 대시보드 (Streamlit).\n\n실행:\n  cd marketing-intelligence\n  streamlit run dashboards/app.py\n데이터가 비어 있으면 먼저  python main.py  를 실행하세요.\n\n데이터 출처: cafe24-dashboard 스냅샷(실데이터)을 우선 사용하고,\nClarity 는 토큰이 없으면 실제 상위 상품 페이지 기반으로 시연합니다.\n\n탭:  ① 종합 성과   ② Clarity 상세페이지 분석   ③ 디자이너 전달   ④ 크리에이티브\n\"\"\"\nfrom __future__ import annotations\n\nimport sys\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parent.parent\nsys.path.insert(0, str(ROOT))\n\nfrom datetime import datetime  # noqa: E402\n\nimport pandas as pd  # noqa: E402\nimport plotly.express as px  # noqa: E402\nimport streamlit as st  # noqa: E402\n\nimport db  # noqa: E402\nfrom analyzers import (  # noqa: E402\n    _common as C,\n    anomaly_detector,\n    creative_analyzer,\n    funnel_analyzer,\n    performance_analyzer,\n    root_cause_engine,\n)\nfrom collectors import cafe24_snapshot  # noqa: E402\nfrom handoff import designer  # noqa: E402\n\nPLAT_KO = {\"meta\": \"메타\", \"google\": \"구글\", \"tiktok\": \"틱톡\"}\n\ntry:\n    st.set_page_config(page_title=\"마케팅 인텔리전스\", layout=\"wide\")\nexcept Exception:\n    pass  # 통합앱(Home.py)에서 이미 설정된 경우\nfrom dashboards._style import inject_css, roas_pct  # noqa: E402\ninject_css()\ndb.init_db()\n\n\n@st.cache_data(ttl=600)\ndef _load():\n    return (C.load_ads(), C.load_sales(), C.load_visitors(),\n            C.load_clarity())\n\n\n@st.cache_data(ttl=600)\ndef _perf():\n    return performance_analyzer.analyze()\n\n\n@st.cache_data(ttl=600)\ndef _funnel():\n    return funnel_analyzer.analyze()\n\n\n@st.cache_data(ttl=600)\ndef _anomalies():\n    return anomaly_detector.detect()\n\n\nads, sales, visitors, clar = _load()\n\nst.title(\"🧠 마케팅 인텔리전스 대시보드\")\nst.caption(\"Google · Meta · TikTok · GA4 · Microsoft Clarity → AI 분석 → 디자이너 전달\")\n\n# ---------- 사이드바: 데이터 출처 + 브랜드 필터 ----------\nwith st.sidebar:\n    st.header(\"⚙️ 설정\")\n    if cafe24_snapshot.available():\n        info = cafe24_snapshot.meta_info()\n        st.success(\"출처: **cafe24-dashboard 스냅샷(실데이터)**\")\n        if info:\n            st.caption(f\"수집: {info.get('refreshed_at','-')}\\n\\n\"\n                       f\"기간: {info.get('start','')} ~ {info.get('end','')}\")\n    else:\n        st.warning(\"출처: **데모(모의)** — 스냅샷 없음\")\n    st.caption(\"Clarity: 토큰 미설정 시 실제 상위 상품 페이지로 행동 시연\")\n\n    brands = sorted(ads[\"account_name\"].dropna().unique()) if not ads.empty else []\n    sel_brands = st.multiselect(\"브랜드 필터\", brands, default=brands)\n    if st.button(\"🔄 캐시 새로고침\"):\n        st.cache_data.clear()\n        st.rerun()\n\nif ads.empty and clar.empty:\n    st.warning(\"데이터가 없습니다. 터미널에서 `python main.py` 를 먼저 실행하세요.\")\n    st.stop()\n\n# 브랜드 필터 적용\nif sel_brands:\n    if not ads.empty:\n        ads = ads[ads[\"account_name\"].isin(sel_brands)]\n    if not sales.empty and \"brand\" in sales:\n        sales = sales[sales[\"brand\"].isin(sel_brands)]\n    if not visitors.empty and \"brand\" in visitors:\n        visitors = visitors[visitors[\"brand\"].isin(sel_brands)]\n\n# ---------- 상단 KPI ----------\nref = C.ref_date(ads) or C.ref_date(clar)\npm = C.period_metrics(ads, clar, ref)\nt = pm[\"today\"]\ntotal_sales = sales[\"sales_amount\"].sum() if not sales.empty else 0\ntotal_cost = ads[\"cost\"].sum() if not ads.empty else 0\ntotal_roas = (ads[\"conv_value\"].sum() / total_cost) if total_cost else 0\ntotal_visits = visitors[\"visits\"].sum() if not visitors.empty else 0\n\nk1, k2, k3, k4, k5 = st.columns(5)\nk1.metric(\"실매출(기간합)\", f\"₩{total_sales:,.0f}\")\nk2.metric(\"광고비(기간합)\", f\"₩{total_cost:,.0f}\")\nk3.metric(\"광고 ROAS\", roas_pct(total_roas))\nk4.metric(\"방문수(기간합)\", f\"{total_visits:,.0f}\")\nk5.metric(\"상세페이지 이탈률\", f\"{t['clarity']['exit_rate']:.1f}%\")\nst.caption(f\"기준일: {ref}\")\n\ntab1, tab2, tab3, tab4 = st.tabs(\n    [\"① 종합 성과\", \"② Clarity 상세페이지 분석\", \"③ 디자이너 전달\", \"④ 크리에이티브\"])\n\n# ============ ① 종합 성과 ============\nwith tab1:\n    st.subheader(\"일자별 실매출 vs 광고비\")\n    daily = pd.DataFrame()\n    if not sales.empty:\n        daily = sales.groupby(sales[\"date\"].dt.date)[\"sales_amount\"].sum().rename(\"실매출\").to_frame()\n    if not ads.empty:\n        cost_by = ads.groupby(ads[\"date\"].dt.date)[\"cost\"].sum().rename(\"광고비\")\n        daily = daily.join(cost_by, how=\"outer\") if not daily.empty else cost_by.to_frame()\n    if not daily.empty:\n        daily = daily.fillna(0).reset_index(names=\"date\")\n        st.plotly_chart(px.line(daily, x=\"date\", y=[c for c in [\"실매출\", \"광고비\"] if c in daily],\n                                markers=True), use_container_width=True)\n\n    c1, c2 = st.columns(2)\n    with c1:\n        st.subheader(\"채널별 광고 성과\")\n        if not ads.empty:\n            by = ads.groupby(\"platform\").agg(광고비=(\"cost\", \"sum\"), 노출=(\"impressions\", \"sum\"),\n                                             클릭=(\"clicks\", \"sum\"), 전환매출=(\"conv_value\", \"sum\")).reset_index()\n            by[\"채널\"] = by[\"platform\"].map(PLAT_KO).fillna(by[\"platform\"])\n            by[\"ROAS\"] = (by[\"전환매출\"] / by[\"광고비\"]).round(2)\n            by[\"CTR%\"] = (by[\"클릭\"] / by[\"노출\"] * 100).round(2)\n            st.dataframe(by[[\"채널\", \"광고비\", \"클릭\", \"전환매출\", \"ROAS\", \"CTR%\"]], use_container_width=True)\n    with c2:\n        st.subheader(\"브랜드별 광고 ROAS\")\n        if not ads.empty:\n            bb = ads.groupby(\"account_name\").agg(광고비=(\"cost\", \"sum\"),\n                                                 전환매출=(\"conv_value\", \"sum\")).reset_index()\n            bb[\"ROAS\"] = (bb[\"전환매출\"] / bb[\"광고비\"]).round(2)\n            bb = bb.rename(columns={\"account_name\": \"브랜드\"})\n            st.plotly_chart(px.bar(bb.sort_values(\"ROAS\"), x=\"ROAS\", y=\"브랜드\", orientation=\"h\"),\n                            use_container_width=True)\n\n    c3, c4 = st.columns(2)\n    with c3:\n        st.subheader(\"방문 추세 (신규/재방문)\")\n        if not visitors.empty:\n            vv = visitors.groupby(visitors[\"date\"].dt.date).agg(\n                신규방문=(\"new_visits\", \"sum\"), 재방문=(\"returning_visits\", \"sum\")).reset_index(names=\"date\")\n            st.plotly_chart(px.area(vv, x=\"date\", y=[\"신규방문\", \"재방문\"]), use_container_width=True)\n        else:\n            st.info(\"방문 데이터 없음(데모 모드)\")\n    with c4:\n        st.subheader(\"🚨 이상 급변 감지\")\n        anomalies = _anomalies()\n        if anomalies:\n            st.dataframe(pd.DataFrame(anomalies)[\n                [\"metric\", \"source\", \"direction\", \"current\", \"baseline\", \"z\", \"is_bad\"]],\n                use_container_width=True)\n        else:\n            st.info(\"기준선 대비 유의미한 급변 없음\")\n\n    st.subheader(\"브랜드×채널별 매출(실데이터)\")\n    if not sales.empty:\n        piv = sales.groupby([\"brand\", \"mall_id\"])[\"sales_amount\"].sum().reset_index()\n        st.dataframe(piv.rename(columns={\"brand\": \"브랜드\", \"mall_id\": \"몰\", \"sales_amount\": \"매출\"})\n                     .sort_values(\"매출\", ascending=False), use_container_width=True)\n\n    st.divider()\n    st.subheader(\"📋 시니어 퍼포먼스 분석 리포트 (17개 지표 · ①~⑥)\")\n    perf = _perf()\n    st.caption(\"AI 서술\" if perf.get(\"ai_used\") else \"내장 템플릿(AI 키 입력 시 심층 서술)\")\n    st.markdown(perf[\"report_md\"])\n\n# ============ ② Clarity 상세페이지 분석 ============\nwith tab2:\n    funnel = _funnel()\n    six = funnel[\"six\"]\n    if not six.get(\"answers\"):\n        st.info(\"Clarity 데이터가 없습니다.\")\n    else:\n        a = six[\"answers\"]\n        st.subheader(\"Clarity 6대 분석\")\n        g1, g2, g3 = st.columns(3)\n        g1.metric(\"가장 이탈 심한 위치\", a[\"q1_worst_exit\"][\"url\"],\n                  f\"{a['q1_worst_exit']['exit_rate']}%\")\n        g2.metric(\"Rage Click 최다\", a[\"q2_rage\"][\"url\"], f\"{a['q2_rage']['rage_clicks']}회\")\n        g3.metric(\"Dead Click 최다\", a[\"q3_dead\"][\"url\"], f\"{a['q3_dead']['dead_clicks']}회\")\n        g4, g5, g6 = st.columns(3)\n        g4.metric(\"최단 체류 페이지\", a[\"q4_duration\"][\"url\"],\n                  f\"{a['q4_duration']['avg_session_duration']}초\")\n        g5.metric(\"가장 많이 본 상세\", a[\"q5_most_viewed\"][\"url\"],\n                  f\"{a['q5_most_viewed']['visits']:,} 방문\")\n        g6.metric(\"광고 건강도\", \"양호 ✅\" if funnel[\"ads\"].get(\"healthy\") else \"점검 필요 ⚠️\",\n                  f\"ROAS {roas_pct(funnel['ads'].get('roas'))}\")\n\n        st.subheader(\"상품 상세페이지별 UX 지표\")\n        pages = pd.DataFrame(six[\"pages\"])\n        if not pages.empty:\n            show = pages[[\"page_title\", \"url\", \"visits\", \"exit\", \"rage_rate\", \"dead_rate\", \"scroll\", \"dur\"]]\n            show = show.rename(columns={\"page_title\": \"페이지\", \"exit\": \"이탈률%\", \"rage_rate\": \"rage%\",\n                                        \"dead_rate\": \"dead%\", \"scroll\": \"스크롤%\", \"dur\": \"체류초\"})\n            st.dataframe(show.sort_values(\"이탈률%\", ascending=False), use_container_width=True)\n            st.plotly_chart(px.bar(pages.sort_values(\"exit\"), x=\"exit\", y=\"url\", orientation=\"h\",\n                                   labels={\"exit\": \"이탈률 %\", \"url\": \"\"}, title=\"상세페이지별 이탈률\"),\n                            use_container_width=True)\n\n        st.divider()\n        st.subheader(\"🔍 AI 분석 (Clarity → 상세페이지 → AI)\")\n        st.caption(\"AI 서술\" if funnel.get(\"ai_used\") else \"내장 템플릿(AI 키 입력 시 심층 서술)\")\n        st.markdown(funnel[\"report_md\"])\n\n# ============ ③ 디자이너 전달 ============\nwith tab3:\n    st.info(\"ℹ️ 디자이너 자동전달 로직은 재정의 예정입니다. 아래는 현재 동작(수동 전달/이력) 미리보기입니다.\")\n    st.subheader(\"핵심 인사이트\")\n    insight = root_cause_engine.primary_insight()\n    if not insight:\n        st.info(\"전달할 인사이트가 없습니다.\")\n    else:\n        sev = {\"High\": \"🔴\", \"Medium\": \"🟡\", \"Low\": \"🟢\"}.get(insight[\"severity\"], \"🔵\")\n        st.markdown(f\"### {sev} {insight['title']}\")\n        st.markdown(insight[\"summary\"])\n        st.code(f\"대상 페이지: {insight['target_url']}\", language=\"text\")\n        if st.button(\"📨 디자이너에게 전달하기\", type=\"primary\"):\n            res = designer.send(insight, now=datetime.now().isoformat(timespec=\"seconds\"))\n            (st.success if res[\"status\"] == \"sent\" else st.error)(\n                f\"{res['status']} → {res['channel']}\\n\\n{res['detail']}\")\n        with st.expander(\"전달 브리프 미리보기\"):\n            st.markdown(insight[\"body_md\"])\n\n    st.divider()\n    st.subheader(\"📜 전달 이력\")\n    try:\n        hist = pd.read_sql_table(\"insights\", db.engine)\n        if not hist.empty:\n            st.dataframe(hist[[\"created_at\", \"severity\", \"title\", \"target_url\",\n                               \"handoff_status\", \"handoff_channel\"]]\n                         .sort_values(\"created_at\", ascending=False), use_container_width=True)\n        else:\n            st.info(\"아직 전달 이력이 없습니다.\")\n    except Exception:\n        st.info(\"아직 전달 이력이 없습니다.\")\n\n# ============ ④ 크리에이티브 ============\nwith tab4:\n    st.subheader(\"광고영상 크리에이티브 분석 (Vision → 후킹 → CTA → 기획안)\")\n    st.caption(\"영상 프레임 이미지를 올리면 Claude Vision 분석, 없으면 성과 기반 진단입니다.\")\n    cc1, cc2 = st.columns(2)\n    name = cc1.text_input(\"크리에이티브 이름\", \"스파크_후킹A\")\n    ctr = cc1.number_input(\"CTR(%)\", value=1.2, step=0.1)\n    roas = cc1.number_input(\"ROAS(x)\", value=1.8, step=0.1)\n    hook = cc2.number_input(\"3초 시청률(%)\", value=22.0, step=1.0)\n    bench_hook = cc2.number_input(\"벤치마크 3초 시청률(%)\", value=35.0, step=1.0)\n    bench_roas = cc2.number_input(\"벤치마크 ROAS(x)\", value=2.5, step=0.1)\n    frames = st.file_uploader(\"영상 캡처 프레임(첫 3초 등)\", type=[\"png\", \"jpg\", \"jpeg\"],\n                              accept_multiple_files=True)\n    comments_raw = st.text_area(\"댓글(줄바꿈 구분, 선택)\", \"\")\n    if st.button(\"크리에이티브 분석 실행\"):\n        frame_paths = []\n        if frames:\n            tmp = ROOT / \"reports\" / \"_frames\"\n            tmp.mkdir(parents=True, exist_ok=True)\n            for f in frames:\n                p = tmp / f.name\n                p.write_bytes(f.getbuffer())\n                frame_paths.append(str(p))\n        creative = {\"name\": name, \"ctr\": ctr, \"roas\": roas, \"hook_rate\": hook,\n                    \"benchmark\": {\"hook_rate\": bench_hook, \"roas\": bench_roas, \"ctr\": 1.5}}\n        comments = [c for c in comments_raw.splitlines() if c.strip()]\n        with st.spinner(\"분석 중...\"):\n            out = creative_analyzer.analyze(creative, frame_paths, comments)\n        st.caption(\"AI/Vision 서술\" if out.get(\"ai_used\") else \"내장 템플릿\")\n        st.markdown(out[\"report_md\"])\n", "dashboards/clarity_page.py": "\"\"\"Clarity 상세페이지 분석 페이지 (좌측 메뉴 항목).\n\nClarity → 상세페이지 → AI 분석. (기존 app.py ②탭을 독립 페이지로)\n\"\"\"\nfrom __future__ import annotations\n\nimport re\nimport sys\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parent.parent\nsys.path.insert(0, str(ROOT))\n\nimport pandas as pd  # noqa: E402\nimport plotly.express as px  # noqa: E402\nimport streamlit as st  # noqa: E402\n\nfrom analyzers import anomaly_detector, funnel_analyzer, performance_analyzer  # noqa: E402\n\ntry:\n    st.set_page_config(page_title=\"Clarity 분석\", layout=\"wide\")\nexcept Exception:\n    pass\nfrom analyzers import _common as C  # noqa: E402\nfrom collectors import cafe24_snapshot as S  # noqa: E402\nfrom dashboards._style import brand_pills, inject_css, page_intro, roas_pct  # noqa: E402\ninject_css()\n\n# 클래리티 프로젝트 = 브랜드. antical 프로젝트는 안티칼알파+에이징핏 공용 몰.\nPROJECT_BRAND = {\"lymday\": \"림데이\", \"antical\": \"안티칼(알파·에이징핏)\", \"neurofocus\": \"뉴로포커스\"}\n_FAMILY = {\"lymday\": [\"림데이\"], \"neurofocus\": [\"뉴로포커스\"],\n           \"antical\": [\"안티칼알파\", \"에이징핏\", \"안티칼\"]}\nMEDIA_ORDER = [\"유튜브\", \"틱톡\", \"네이버\", \"메타/SNS\", \"기타광고\", \"전용(비광고)\", \"자연/기타\"]\n\n\n@st.cache_data(ttl=600)\ndef _product_names() -> dict:\n    \"\"\"(project_id, 상품번호) → 상품명. carts 스냅샷의 상품명으로 광고매체를 추정하기 위함.\"\"\"\n    try:\n        carts = S.carts_df()\n    except Exception:  # noqa: BLE001\n        return {}\n    if carts is None or carts.empty:\n        return {}\n    carts = carts.copy()\n    carts[\"브랜드\"] = C.norm_brand(carts[\"브랜드\"])\n    m: dict = {}\n    for proj, fams in _FAMILY.items():\n        sub = carts[carts[\"브랜드\"].isin(fams)]\n        for _, r in sub.iterrows():\n            try:\n                pno = str(int(r[\"상품번호\"]))\n            except (ValueError, TypeError):\n                continue\n            m[(proj, pno)] = str(r.get(\"상품명\", \"\"))\n    return m\n\n\ndef _media_of(name: str) -> str:\n    \"\"\"상품명 키워드로 광고매체(랜딩 전용링크 기준) 추정.\"\"\"\n    n = str(name)\n    if \"유튜브\" in n:\n        return \"유튜브\"\n    if \"틱톡\" in n:\n        return \"틱톡\"\n    if \"N광고\" in n or \"네이버\" in n:\n        return \"네이버\"\n    if \"SNS\" in n:\n        return \"메타/SNS\"\n    if \"회원\" in n or \"VIP\" in n or \"병\" in n:\n        return \"전용(비광고)\"\n    if \"광고전용\" in n or \"광고 전용\" in n:\n        return \"기타광고\"\n    return \"자연/기타\"\n\n\ndef _pno_of(url: str):\n    m = re.search(r\"/surl/p/(\\d+)\", str(url)) or re.search(r\"product_no=(\\d+)\", str(url))\n    return m.group(1) if m else None\n\n\n@st.cache_data(ttl=600)\ndef _funnel(start=None, end=None):\n    return funnel_analyzer.analyze(start=start, end=end)\n\n\n@st.cache_data(ttl=600)\ndef _perf():\n    return performance_analyzer.analyze()\n\n\n@st.cache_data(ttl=600)\ndef _anomalies():\n    return anomaly_detector.detect()\n\n\nst.title(\"🖱️ Clarity 상세페이지 분석\")\npage_intro(\"Microsoft Clarity 행동 데이터로 상세페이지의 이탈·Rage/Dead 클릭·체류·스크롤을 분석합니다. \"\n           \"어디서·왜 이탈하는지 AI가 진단합니다.\")\n\n# ===== 상단 필터: 기간 · 브랜드 · 광고매체 (다른 메뉴와 동일 스타일) =====\n_clar = C.load_clarity()\ncstart = cend = None\nselb: list = []\nselm: list = []\ncdf = pd.DataFrame()\nif not _clar.empty:\n    # 브랜드·광고매체 enrich (필터 옵션 산출 + 분석 공용)\n    cdf = _clar.copy()\n    cdf[\"브랜드\"] = cdf[\"project_id\"].map(PROJECT_BRAND).fillna(cdf[\"project_id\"])\n    _nm = _product_names()\n    cdf[\"_pno\"] = cdf[\"url\"].map(_pno_of)\n    cdf[\"상품명\"] = [_nm.get((p, n), \"\") for p, n in zip(cdf[\"project_id\"], cdf[\"_pno\"])]\n    cdf[\"광고매체\"] = cdf[\"상품명\"].map(lambda x: _media_of(x) if x else \"자연/기타\")\n\n    _cd = _clar[\"date\"].dt.date\n    _dmin, _dmax = _cd.min(), _cd.max()\n    _brands = sorted(cdf[\"브랜드\"].unique())\n    _medias = [m for m in MEDIA_ORDER if m in cdf[\"광고매체\"].unique()]\n\n    fc = st.columns([2.4, 0.2, 3.0, 3.0])\n    with fc[0]:\n        rng = st.date_input(\"기간\", value=(_dmax, _dmax), min_value=_dmin, max_value=_dmax, key=\"clr_date\")  # 기본=최신 1일\n        cstart, cend = (rng if isinstance(rng, tuple) and len(rng) == 2 else (_dmin, _dmax))\n    with fc[2]:\n        selb = brand_pills(_brands, key=\"clr_brand\")\n    with fc[3]:\n        selm = brand_pills(_medias, key=\"clr_media\", label=\"광고매체\")\n    st.caption(f\"분석 기간: {cstart} ~ {cend}  ·  브랜드 {len(selb)}개  ·  광고매체 {len(selm)}개\")\n    st.divider()\n\n# ===== 브랜드 · 광고매체별 Clarity 분석 (위 필터 반영) =====\nif not cdf.empty:\n    st.subheader(\"🏷️ 브랜드 · 광고매체별 UX 분석\")\n    st.caption(\"프로젝트=브랜드로 분류하고, 광고 전용링크(`/surl/p/번호`)의 상품명 키워드로 \"\n               \"광고매체(유튜브·틱톡·네이버·메타/SNS)를 추정해 기간별로 봅니다.\")\n\n    f = cdf.copy()\n    f[\"d\"] = f[\"date\"].dt.date\n    if cstart is not None:\n        f = f[(f[\"d\"] >= cstart) & (f[\"d\"] <= cend)]\n    f = f[f[\"브랜드\"].isin(selb) & f[\"광고매체\"].isin(selm)]\n\n    if f.empty:\n        st.info(\"선택 조건에 데이터가 없습니다.\")\n    else:\n        def _wavg(g, col):\n            v = g[\"visits\"].sum()\n            return (g[col] * g[\"visits\"]).sum() / v if v else 0.0\n\n        def _agg(keys):\n            out = []\n            for k, g in f.groupby(keys):\n                kv = k if isinstance(k, tuple) else (k,)\n                row = dict(zip(keys, kv))\n                row.update({\n                    \"방문\": int(g[\"visits\"].sum()),\n                    \"이탈률%\": round(_wavg(g, \"exit_rate\"), 1),\n                    \"Rage\": int(g[\"rage_clicks\"].sum()),\n                    \"Dead\": int(g[\"dead_clicks\"].sum()),\n                    \"스크롤%\": round(_wavg(g, \"avg_scroll_depth\"), 1),\n                    \"체류초\": round(_wavg(g, \"avg_session_duration\"), 1),\n                })\n                out.append(row)\n            return pd.DataFrame(out)\n\n        # KPI\n        tot_v = int(f[\"visits\"].sum())\n        k = st.columns(4)\n        k[0].metric(\"방문(선택)\", f\"{tot_v:,}\")\n        k[1].metric(\"평균 이탈률\", f\"{_wavg(f, 'exit_rate'):.1f}%\")\n        k[2].metric(\"평균 스크롤\", f\"{_wavg(f, 'avg_scroll_depth'):.1f}%\")\n        k[3].metric(\"평균 체류\", f\"{_wavg(f, 'avg_session_duration'):.1f}초\")\n\n        media_tbl = _agg([\"광고매체\"]).sort_values(\"방문\", ascending=False)\n        c1, c2 = st.columns([1.2, 1])\n        with c1:\n            st.markdown(\"**광고매체별 요약**\")\n            st.dataframe(media_tbl, use_container_width=True, hide_index=True)\n        with c2:\n            st.plotly_chart(px.bar(media_tbl, x=\"광고매체\", y=\"이탈률%\", color=\"광고매체\",\n                                   title=\"광고매체별 이탈률\", labels={\"이탈률%\": \"이탈률 %\"}),\n                            use_container_width=True)\n\n        st.markdown(\"**브랜드 × 광고매체**\")\n        st.dataframe(_agg([\"브랜드\", \"광고매체\"]).sort_values([\"브랜드\", \"방문\"], ascending=[True, False]),\n                     use_container_width=True, hide_index=True)\n\n        # 광고 랜딩(상품) 상세 — 매체가 식별된 페이지만\n        land = f[f[\"상품명\"] != \"\"]\n        if not land.empty:\n            st.markdown(\"**광고 랜딩페이지 상세 (상품·매체별)**\")\n            detail = []\n            for k, g in land.groupby([\"브랜드\", \"광고매체\", \"상품명\"]):\n                detail.append({\"브랜드\": k[0], \"광고매체\": k[1], \"상품(랜딩)\": k[2],\n                               \"방문\": int(g[\"visits\"].sum()),\n                               \"이탈률%\": round(_wavg(g, \"exit_rate\"), 1),\n                               \"Rage\": int(g[\"rage_clicks\"].sum()),\n                               \"Dead\": int(g[\"dead_clicks\"].sum()),\n                               \"스크롤%\": round(_wavg(g, \"avg_scroll_depth\"), 1)})\n            dt = pd.DataFrame(detail).sort_values(\"방문\", ascending=False).head(30)\n            st.dataframe(dt, use_container_width=True, hide_index=True)\n\n        # 자동 분석 정리\n        if len(media_tbl) >= 2:\n            worst = media_tbl.sort_values(\"이탈률%\", ascending=False).iloc[0]\n            best = media_tbl.sort_values(\"이탈률%\").iloc[0]\n            top_v = media_tbl.iloc[0]\n            rage_m = media_tbl.sort_values(\"Rage\", ascending=False).iloc[0]\n            st.info(\n                f\"📌 **정리** · 방문 최다 매체는 **{top_v['광고매체']}**({top_v['방문']:,}) 입니다. \"\n                f\"이탈률은 **{worst['광고매체']}**가 {worst['이탈률%']}%로 가장 높고(랜딩·소재 점검 필요), \"\n                f\"**{best['광고매체']}**가 {best['이탈률%']}%로 가장 양호합니다. \"\n                f\"Rage 클릭은 **{rage_m['광고매체']}**({rage_m['Rage']}회)에서 많아 해당 매체 유입 페이지의 \"\n                f\"클릭 오작동/오해 요소를 우선 확인하세요.\"\n            )\n    st.divider()\n\nfunnel = _funnel(cstart, cend)\nsix = funnel[\"six\"]\nif not six.get(\"answers\"):\n    st.info(\"Clarity 데이터가 없습니다. 개요의 '실시간 API 취합' 또는 `python main.py` 실행.\")\n    st.stop()\n\na = six[\"answers\"]\nst.subheader(\"Clarity 6대 분석\")\ng1, g2, g3 = st.columns(3)\ng1.metric(\"가장 이탈 심한 위치\", a[\"q1_worst_exit\"][\"url\"], f\"{a['q1_worst_exit']['exit_rate']}%\")\ng2.metric(\"Rage Click 최다\", a[\"q2_rage\"][\"url\"], f\"{a['q2_rage']['rage_clicks']}회\")\ng3.metric(\"Dead Click 최다\", a[\"q3_dead\"][\"url\"], f\"{a['q3_dead']['dead_clicks']}회\")\ng4, g5, g6 = st.columns(3)\ng4.metric(\"최단 체류 페이지\", a[\"q4_duration\"][\"url\"], f\"{a['q4_duration']['avg_session_duration']}초\")\ng5.metric(\"가장 많이 본 상세\", a[\"q5_most_viewed\"][\"url\"], f\"{a['q5_most_viewed']['visits']:,} 방문\")\ng6.metric(\"광고 건강도\", \"양호 ✅\" if funnel[\"ads\"].get(\"healthy\") else \"점검 필요 ⚠️\",\n          f\"ROAS {roas_pct(funnel['ads'].get('roas'))}\")\n\nst.subheader(\"상품 상세페이지별 UX 지표\")\npages = pd.DataFrame(six[\"pages\"])\nif not pages.empty:\n    show = pages[[\"page_title\", \"url\", \"visits\", \"exit\", \"rage_rate\", \"dead_rate\", \"scroll\", \"dur\"]]\n    show = show.rename(columns={\"page_title\": \"페이지\", \"exit\": \"이탈률%\", \"rage_rate\": \"rage%\",\n                                \"dead_rate\": \"dead%\", \"scroll\": \"스크롤%\", \"dur\": \"체류초\"})\n    st.dataframe(show.sort_values(\"이탈률%\", ascending=False), use_container_width=True, hide_index=True)\n    st.plotly_chart(px.bar(pages.sort_values(\"exit\"), x=\"exit\", y=\"url\", orientation=\"h\",\n                           labels={\"exit\": \"이탈률 %\", \"url\": \"\"}, title=\"상세페이지별 이탈률\"),\n                    use_container_width=True)\n\nst.divider()\nst.subheader(\"🔍 AI 분석 (Clarity → 상세페이지 → AI)\")\nst.caption(\"AI 서술\" if funnel.get(\"ai_used\") else \"내장 템플릿(AI 키 입력 시 심층 서술)\")\nst.markdown(funnel[\"report_md\"])\n\nwith st.expander(\"📋 시니어 퍼포먼스 분석 (17개 지표 · ①~⑥)\"):\n    perf = _perf()\n    st.markdown(perf[\"report_md\"])\n\nwith st.expander(\"🚨 이상 급변 감지\"):\n    an = _anomalies()\n    if an:\n        st.dataframe(pd.DataFrame(an)[[\"metric\", \"source\", \"direction\", \"current\", \"baseline\", \"z\", \"is_bad\"]],\n                     use_container_width=True, hide_index=True)\n    else:\n        st.info(\"기준선 대비 유의미한 급변 없음\")\n", "dashboards/cohort_report.py": "\"\"\"코호트·리텐션 대시보드 — 재구매 고객 분석.\n\n데이터: daily_orders (회원 식별 member_id, 첫주문 is_first, 취소 is_cancel).\n- 신규/재구매 고객, 구매빈도 분포\n- 주차 코호트 리텐션 매트릭스(첫 구매 주차 → 이후 주차 재구매율)\n※ 비회원(member_id 없음)은 식별 불가라 코호트에서 제외.\n\n실행:  streamlit run dashboards/cohort_report.py\n\"\"\"\nfrom __future__ import annotations\n\nimport sys\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parent.parent\nsys.path.insert(0, str(ROOT))\n\nimport numpy as np  # noqa: E402\nimport pandas as pd  # noqa: E402\nimport plotly.express as px  # noqa: E402\nimport streamlit as st  # noqa: E402\n\nfrom analyzers import _common as C  # noqa: E402\n\ntry:\n    st.set_page_config(page_title=\"코호트·리텐션\", layout=\"wide\")\nexcept Exception:\n    pass\nfrom dashboards._style import inject_css, page_intro, top_filter  # noqa: E402\ninject_css()\n\n\n@st.cache_data(ttl=600)\ndef load():\n    return C.load_orders()\n\n\norders = load()\nst.title(\"🔁 코호트·리텐션 (재구매 분석)\")\npage_intro(\"‘한 번 산 고객이 다시 사는가’를 봅니다. 처음 구매한 시점이 같은 고객끼리 묶어(코호트), \"\n           \"시간이 지나며 얼마나 다시 구매하는지(리텐션)를 추적합니다. (회원만 분석)\")\n\nwith st.expander(\"❓ 코호트·리텐션이 뭔가요? (쉬운 설명)\"):\n    st.markdown(\n        \"- **코호트**: ‘같은 주에 첫 구매한 고객 묶음’입니다. 예) ‘6월 1일 주에 처음 산 사람들’.\\n\"\n        \"- **리텐션(재구매율)**: 그 묶음이 *이후 주차*에 다시 구매한 비율(%)입니다.\\n\"\n        \"- 아래 **표(히트맵)**: 가로축 = 첫 구매 후 경과 주차(+1주, +2주…), 세로축 = 첫 구매 주차.\\n\"\n        \"  칸 색이 진할수록 그 주에 다시 산 고객이 많다는 뜻입니다(좋음).\\n\"\n        \"- **재구매 고객비중**: 기간 안에 2번 이상 산 회원 비율. **구매빈도**: 1인당 평균 구매 횟수.\\n\"\n        \"- 수집 기간이 길어질수록(매일 누적) 더 먼 주차까지 채워져 추세가 또렷해집니다.\")\n\nif orders.empty:\n    st.warning(\"주문 데이터가 없습니다. 개요의 ‘실시간 API 취합’ 또는 `python main.py` 실행.\")\n    st.stop()\n\no = orders[orders[\"is_cancel\"] == 0].copy()\no[\"member_id\"] = o[\"member_id\"].astype(str).str.strip()\no[\"d\"] = o[\"date\"].dt.date\nis_member = o[\"member_id\"].ne(\"\") & o[\"member_id\"].str.lower().ne(\"nan\")\n\ndmin, dmax = o[\"d\"].min(), o[\"d\"].max()\nstart, end, sel_brands = top_filter(sorted(o[\"brand\"].dropna().unique()), dmin, dmax, key=\"coh\")\nst.caption(\"※ 비회원은 식별 불가 → 코호트/리텐션에서 제외\")\n\no = o[is_member & o[\"brand\"].isin(sel_brands)\n      & (o[\"d\"] >= start) & (o[\"d\"] <= end)].copy()\nif o.empty:\n    st.info(\"회원 주문 데이터가 없습니다.\")\n    st.stop()\n\n# ---------------- 고객 단위 집계 ----------------\nper_member = o.groupby(\"member_id\").agg(orders=(\"order_id\", \"size\"),\n                                        revenue=(\"sales_amount\", \"sum\")).reset_index()\nn_customers = len(per_member)\nrepeat_customers = int((per_member[\"orders\"] >= 2).sum())\nrepeat_rate = repeat_customers / n_customers * 100 if n_customers else 0\navg_freq = per_member[\"orders\"].mean()\navg_ltv = per_member[\"revenue\"].mean()\n\nk1, k2, k3, k4 = st.columns(4)\nk1.metric(\"분석 고객수(회원)\", f\"{n_customers:,}\")\nk2.metric(\"재구매 고객수\", f\"{repeat_customers:,}\", f\"{repeat_rate:.1f}%\")\nk3.metric(\"평균 구매빈도\", f\"{avg_freq:.2f}회\")\nk4.metric(\"평균 고객가치(기간)\", f\"₩{avg_ltv:,.0f}\")\nst.divider()\n\n# ---------------- 구매 빈도 분포 ----------------\nc1, c2 = st.columns(2)\nwith c1:\n    st.subheader(\"구매 빈도 분포\")\n    per_member[\"구간\"] = np.where(per_member[\"orders\"] >= 5, \"5회+\",\n                                 per_member[\"orders\"].astype(str) + \"회\")\n    order_map = {\"1회\": 1, \"2회\": 2, \"3회\": 3, \"4회\": 4, \"5회+\": 5}\n    freq = per_member.groupby(\"구간\", as_index=False).size()\n    freq[\"s\"] = freq[\"구간\"].map(order_map)\n    freq = freq.sort_values(\"s\")\n    st.plotly_chart(px.bar(freq, x=\"구간\", y=\"size\", labels={\"size\": \"고객수\"},\n                           color=\"구간\"), use_container_width=True)\nwith c2:\n    st.subheader(\"신규 vs 재구매 고객 (주차별)\")\n    o[\"week\"] = o[\"date\"].dt.to_period(\"W\").dt.start_time.dt.date\n    seg = o.copy()\n    seg[\"구분\"] = np.where(seg[\"is_first\"] == 1, \"신규\", \"재구매\")\n    wk = seg.groupby([\"week\", \"구분\"])[\"member_id\"].nunique().reset_index(name=\"고객수\")\n    st.plotly_chart(px.bar(wk, x=\"week\", y=\"고객수\", color=\"구분\", barmode=\"group\",\n                           color_discrete_map={\"신규\": \"#4C9BE8\", \"재구매\": \"#F2A65A\"},\n                           labels={\"week\": \"\"}), use_container_width=True)\n\n# ---------------- 코호트 리텐션 매트릭스 ----------------\nst.subheader(\"주차 코호트 리텐션 (첫 구매 주차 → 이후 주차 재구매율 %)\")\no[\"wk\"] = o[\"date\"].dt.to_period(\"W\")\ncohort = o.groupby(\"member_id\")[\"wk\"].min().rename(\"cohort\")\no = o.join(cohort, on=\"member_id\")\no[\"offset\"] = (o[\"wk\"].astype(\"int64\") - o[\"cohort\"].astype(\"int64\"))\n\nsize = cohort.value_counts().rename(\"size\")\nmat = o.groupby([\"cohort\", \"offset\"])[\"member_id\"].nunique().reset_index(name=\"n\")\nmat = mat.join(size, on=\"cohort\")\nmat[\"retention\"] = (mat[\"n\"] / mat[\"size\"] * 100).round(1)\npiv = mat.pivot(index=\"cohort\", columns=\"offset\", values=\"retention\").sort_index()\npiv.index = [str(p.start_time.date()) for p in piv.index]\npiv.columns = [f\"+{c}주\" for c in piv.columns]\n\nif not piv.empty:\n    st.plotly_chart(px.imshow(piv, text_auto=\".0f\", aspect=\"auto\",\n                              color_continuous_scale=\"Blues\",\n                              labels=dict(x=\"경과 주차\", y=\"첫 구매 주차(코호트)\", color=\"재구매율%\")),\n                    use_container_width=True)\n    st.caption(\"0주=100%(코호트 기준). 이후 주차의 값이 높을수록 리텐션이 좋음. \"\n               \"수집 기간이 길어질수록(매일 누적) 더 먼 주차까지 채워집니다.\")\nelse:\n    st.info(\"코호트 매트릭스를 만들 데이터가 부족합니다(수집 기간 누적 필요).\")\n", "dashboards/creative_page.py": "\"\"\"광고영상 크리에이티브 분석.\n\n🧪 검증전(셋팅 전): 영상 프레임(+스크립트) → AI가 '방향성'만으로 소재력 체크리스트(7항목 하/중/상).\n   성과 데이터 미사용. 분석 후 업로드 영상은 삭제하고 경량 기록(JSON)만 남긴다.\n✅ 검증된 소재: 이미 집행된 소재의 메타/틱톡/구글 실전 영향력(지출·ROAS).\n\"\"\"\nfrom __future__ import annotations\n\nimport json\nimport os\nimport re\nimport sys\nfrom datetime import date\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parent.parent\nsys.path.insert(0, str(ROOT))\n\nimport pandas as pd  # noqa: E402\nimport streamlit as st  # noqa: E402\n\nfrom ai import client  # noqa: E402\nfrom analyzers import _common as C, creative_analyzer  # noqa: E402\n\ntry:\n    st.set_page_config(page_title=\"크리에이티브\", layout=\"wide\")\nexcept Exception:\n    pass\nfrom dashboards._style import inject_css  # noqa: E402\ninject_css()\n\nRECORDS = ROOT / \"reports\" / \"data\" / \"creative_records.json\"\nFRAME_TMP = ROOT / \"reports\" / \"_frames\"\nLEVEL_COLOR = {\"상\": \"#036b26\", \"중\": \"#96650a\", \"하\": \"#9C0006\"}\nPOSS_COLOR = {\"높음\": \"#036b26\", \"보통\": \"#96650a\", \"낮음\": \"#9C0006\"}\nLEVEL_SCORE = {\"상\": 2, \"중\": 1, \"하\": 0}\n\n\ndef won(x): return f\"₩{x:,.0f}\"\n\n\ndef load_records() -> list:\n    if RECORDS.exists():\n        try:\n            return json.loads(RECORDS.read_text(encoding=\"utf-8\"))\n        except (json.JSONDecodeError, ValueError):\n            return []\n    return []\n\n\ndef save_record(rec: dict):\n    recs = load_records()\n    recs.insert(0, rec)\n    RECORDS.parent.mkdir(parents=True, exist_ok=True)\n    RECORDS.write_text(json.dumps(recs, ensure_ascii=False, indent=1), encoding=\"utf-8\")\n\n\ndef render_power(data: dict):\n    o = data.get(\"overall\", {})\n    poss = o.get(\"가능성\", \"보통\")\n    st.markdown(f\"#### 🔋 소재력 종합 — <span style='color:{POSS_COLOR.get(poss,'#333')};font-weight:800'>\"\n                f\"가능성 {poss} · {o.get('점수','-')}점</span>\", unsafe_allow_html=True)\n    if o.get(\"요약\"):\n        st.caption(o[\"요약\"])\n    # 🎬 영상판독 — \"어떻게 영상을 분석했는지\"(Gemini/Anthropic 방식에서만 존재)\n    vr = data.get(\"영상판독\")\n    if isinstance(vr, dict) and any(vr.get(k) for k in\n                                    (\"분석근거\", \"스크립트\", \"영상소스\", \"키워드\", \"기승전결\", \"박자감\", \"속도감\")):\n        st.markdown(\"#### 🎬 영상판독 <span style='font-size:.75rem;color:#888'>— 이렇게 영상을 분석했어요</span>\",\n                    unsafe_allow_html=True)\n        if vr.get(\"분석근거\"):\n            st.caption(\"🔎 분석근거 · \" + str(vr[\"분석근거\"]))\n        kw = vr.get(\"키워드\")\n        if kw:\n            chips = kw if isinstance(kw, (list, tuple)) else [kw]\n            st.markdown(\" \".join(\n                f\"<span style='background:#eef2ff;color:#3538cd;border-radius:12px;padding:2px 10px;\"\n                f\"margin:2px;display:inline-block;font-size:.8rem'>#{c}</span>\" for c in chips if c),\n                unsafe_allow_html=True)\n\n        def _vrow(label, val, bg):\n            if val:\n                st.markdown(f\"<div style='background:{bg};border-radius:8px;padding:8px 12px;margin:4px 0;\"\n                            f\"font-size:.87rem'><b>{label}</b> {val}</div>\", unsafe_allow_html=True)\n        _vrow(\"📝 스크립트\", vr.get(\"스크립트\"), \"#f3f4f6\")\n        _vrow(\"🎞️ 영상소스\", vr.get(\"영상소스\"), \"#f3f4f6\")\n        gj = vr.get(\"기승전결\")\n        if isinstance(gj, dict) and any(gj.values()):\n            st.markdown(\"<div style='background:#f0f7ff;border-radius:8px;padding:8px 12px;margin:4px 0;font-size:.87rem'>\"\n                        \"<b>🎭 기승전결</b><ul style='margin:4px 0 0;padding-left:18px'>\"\n                        + \"\".join(f\"<li><b>{k}</b> · {gj.get(k)}</li>\" for k in (\"기\", \"승\", \"전\", \"결\") if gj.get(k))\n                        + \"</ul></div>\", unsafe_allow_html=True)\n        elif gj:\n            _vrow(\"🎭 기승전결\", gj, \"#f0f7ff\")\n        vc1, vc2 = st.columns(2)\n        if vr.get(\"박자감\"):\n            vc1.markdown(f\"<div style='background:#fff7e6;border-radius:8px;padding:8px 12px;font-size:.87rem'>\"\n                         f\"🥁 <b>박자감</b><br>{vr['박자감']}</div>\", unsafe_allow_html=True)\n        if vr.get(\"속도감\"):\n            vc2.markdown(f\"<div style='background:#fff7e6;border-radius:8px;padding:8px 12px;font-size:.87rem'>\"\n                         f\"⏩ <b>속도감</b><br>{vr['속도감']}</div>\", unsafe_allow_html=True)\n        st.write(\"\")\n    for it in data.get(\"items\", []):\n        lv = it.get(\"레벨\", \"중\")\n        col = LEVEL_COLOR.get(lv, \"#666\")\n        c1, c2 = st.columns([1, 4])\n        c1.markdown(f\"**{it.get('항목','')}**<br><span style='background:{col};color:#fff;padding:2px 14px;\"\n                    f\"border-radius:12px;font-weight:700;font-size:.85rem'>{lv}</span>\", unsafe_allow_html=True)\n        c2.markdown(\n            f\"<div style='background:#f3f4f6;border-radius:8px;padding:8px 12px;font-size:.87rem'>🩺 {it.get('진단','-')}</div>\"\n            f\"<div style='background:#fdeef0;border-radius:8px;padding:8px 12px;margin-top:4px;font-size:.87rem'>\"\n            f\"✏️ <b>수정가이드:</b> {it.get('수정가이드','-')}</div>\", unsafe_allow_html=True)\n        st.write(\"\")\n    # 하이브리드: AI 자유 통찰(ai_insights) — Gemini/Anthropic 방식에서만 존재\n    ins = data.get(\"ai_insights\")\n    if isinstance(ins, dict) and any(ins.get(k) for k in (\"강점\", \"약점\", \"놓친기회\", \"리라이트제안\")):\n        st.markdown(\"#### 💡 AI 자유 통찰 <span style='font-size:.75rem;color:#888'>(규칙이 못 잡는 관점)</span>\",\n                    unsafe_allow_html=True)\n        def _lst(v):\n            if isinstance(v, (list, tuple)):\n                return \"\".join(f\"<li>{x}</li>\" for x in v if x)\n            return f\"<li>{v}</li>\" if v else \"\"\n        ic1, ic2 = st.columns(2)\n        if ins.get(\"강점\"):\n            ic1.markdown(f\"<b style='color:#036b26'>강점</b><ul style='margin-top:2px'>{_lst(ins['강점'])}</ul>\", unsafe_allow_html=True)\n        if ins.get(\"약점\"):\n            ic2.markdown(f\"<b style='color:#9C0006'>약점</b><ul style='margin-top:2px'>{_lst(ins['약점'])}</ul>\", unsafe_allow_html=True)\n        if ins.get(\"놓친기회\"):\n            st.markdown(f\"<div style='background:#eef4fd;border-radius:8px;padding:8px 12px;font-size:.87rem'>🔍 <b>놓친 기회:</b> {ins['놓친기회']}</div>\", unsafe_allow_html=True)\n        if ins.get(\"리라이트제안\"):\n            st.markdown(f\"<div style='background:#fff7e6;border-radius:8px;padding:8px 12px;margin-top:4px;font-size:.87rem'>✍️ <b>리라이트 제안:</b> {ins['리라이트제안']}</div>\", unsafe_allow_html=True)\n        st.write(\"\")\n\n\nPOWER_ITEMS = [\"오프닝 후킹\", \"스토리텔링\", \"신뢰 및 증거\", \"구매 혜택 및 트리거\",\n               \"클로징 & CTA\", \"시청각적 연출\", \"모바일 가독성\"]\nVIDEO_EXT = (\"mp4\", \"mov\", \"webm\", \"m4v\", \"avi\")\n\n\ndef extract_frames(video_path: str, n: int = 6, max_w: int = 1280) -> list[str]:\n    \"\"\"영상에서 n프레임 추출 → jpg 경로 리스트. (cv2)\n    첫 프레임을 영상 3% 지점(≈초반 후킹)부터 뽑아 오프닝 후킹 판독을 보강한다.\"\"\"\n    import cv2\n    import numpy as np\n    cap = cv2.VideoCapture(video_path)\n    total = int(cap.get(cv2.CAP_PROP_FRAME_COUNT) or 0)\n    out = []\n    if total <= 0:\n        cap.release()\n        return out\n    d = Path(video_path).parent\n    stem = Path(video_path).stem\n    for j, frac in enumerate(np.linspace(0.03, 0.97, n)):\n        cap.set(cv2.CAP_PROP_POS_FRAMES, int(total * float(frac)))\n        ok, frame = cap.read()\n        if not ok:\n            continue\n        h, w = frame.shape[:2]\n        if w > max_w:\n            frame = cv2.resize(frame, (max_w, int(h * max_w / w)))\n        p = d / f\"_{stem}_f{j}.jpg\"\n        cv2.imwrite(str(p), frame)\n        out.append(str(p))\n    cap.release()\n    return out\n\n\ndef video_signals(path: str) -> dict:\n    \"\"\"cv2로 영상 실측 — 길이·비율·추정 컷수·평균 샷길이·움직임(박자감/속도감 근거).\"\"\"\n    import cv2\n    import numpy as np\n    try:\n        cap = cv2.VideoCapture(path)\n        fps = float(cap.get(cv2.CAP_PROP_FPS) or 0)\n        total = int(cap.get(cv2.CAP_PROP_FRAME_COUNT) or 0)\n        w = float(cap.get(cv2.CAP_PROP_FRAME_WIDTH) or 0)\n        h = float(cap.get(cv2.CAP_PROP_FRAME_HEIGHT) or 0)\n        dur = total / fps if fps else 0.0\n        step = max(1, int(fps * 0.5)) if fps else max(1, total // 40 or 1)\n        prev, cuts, diffs, i = None, 0, [], 0\n        while i < total:\n            cap.set(cv2.CAP_PROP_POS_FRAMES, i)\n            ok, fr = cap.read()\n            if not ok:\n                break\n            g = cv2.cvtColor(cv2.resize(fr, (160, 90)), cv2.COLOR_BGR2GRAY)\n            if prev is not None:\n                dv = float(np.mean(cv2.absdiff(g, prev)))\n                diffs.append(dv)\n                if dv > 22:          # 큰 화면변화 = 컷/장면전환 추정\n                    cuts += 1\n            prev, i = g, i + step\n        cap.release()\n        return {\"dur\": dur, \"fps\": fps, \"aspect\": (w / h) if h else 0.0,\n                \"cuts\": cuts, \"shot\": (dur / max(cuts, 1)) if dur else 0.0,\n                \"motion\": (sum(diffs) / len(diffs)) if diffs else 0.0}\n    except Exception:  # noqa: BLE001\n        return {}\n\n\ndef format_video_meta(sig: dict, nframes: int) -> str:\n    \"\"\"video_signals + 프레임수 → Gemini 프롬프트용 한 줄 메타.\"\"\"\n    if not sig:\n        return f\"분석 프레임 {nframes}장 (정지 이미지 기반 · 영상 실측 없음 — 박자감/속도감은 추정)\"\n    a = sig[\"aspect\"]\n    ori = \"9:16 세로\" if a and a < 0.9 else (\"1:1 정사각\" if a < 1.2 else \"가로형\")\n    shot = sig[\"shot\"]\n    tempo = \"빠름\" if shot and shot < 2 else (\"보통\" if shot < 3.5 else \"느림\")\n    mv = \"동적\" if sig[\"motion\"] > 18 else (\"보통\" if sig[\"motion\"] > 8 else \"정적\")\n    return (f\"길이 {sig['dur']:.1f}초 · {ori}({a:.2f}) · 추정 컷 {sig['cuts']}회\"\n            f\"(평균 샷 {shot:.1f}초→템포 {tempo}) · 움직임 {mv} · 분석 프레임 {nframes}장\")\n\n\ndef media_aspect(path: str) -> float | None:\n    \"\"\"영상/이미지의 가로÷세로 비율(모바일 가독성 판정용).\"\"\"\n    import cv2\n    ext = path.lower().rsplit(\".\", 1)[-1]\n    try:\n        if ext in VIDEO_EXT:\n            cap = cv2.VideoCapture(path)\n            w = cap.get(cv2.CAP_PROP_FRAME_WIDTH)\n            h = cap.get(cv2.CAP_PROP_FRAME_HEIGHT)\n            cap.release()\n        else:\n            img = cv2.imread(path)\n            if img is None:\n                return None\n            h, w = img.shape[:2]\n        return (w / h) if h else None\n    except Exception:  # noqa: BLE001\n        return None\n\n\nst.title(\"🎬 광고영상 크리에이티브 분석\")\ntab_new, tab_proven = st.tabs([\"🧪 검증전 (소재력 체크리스트)\", \"✅ 검증된 소재 (실전 영향력)\"])\n\n# ─────────────────────────── 검증전 (셋팅 전) ───────────────────────────\nwith tab_new:\n    st.caption(\"셋팅 전 소재의 **방향성**을 성과 없이 판정합니다. 아래 **분석 방식**을 골라 검증하세요. \"\n               \"분석 후 업로드 영상은 **삭제**하고 결과 기록만 남깁니다.\")\n    gemini_ok = bool(os.getenv(\"GEMINI_API_KEY\", \"\").strip())\n    methods = [\"AI 자동 · Gemini(무료 티어)\" + (\"\" if gemini_ok else \" · 키필요\"), \"규칙 기반 (무료·키없음)\"]\n    if client.available():\n        methods.append(\"AI 자동 · Anthropic\")\n    method = st.radio(\"분석 방식\", methods, horizontal=True, key=\"cp_method\")  # 기본=첫 항목(Gemini)\n    use = \"rules\" if method.startswith(\"규칙\") else (\"gemini\" if \"Gemini\" in method else \"anthropic\")\n    if use == \"rules\":\n        st.caption(\"🅐 규칙 기반: 스크립트 키워드 신호 + 영상 비율로 자동 채점(무료·키 불필요). 내용 항목은 **스크립트 필요**.\")\n    elif use == \"gemini\":\n        st.caption(\"🅑 Gemini: 영상 소재력 AI 채점. 결과에 **«영상판독»**\"\n                   \"(스크립트·영상소스·키워드·기승전결·박자감·속도감) 포함. `.env`의 GEMINI_API_KEY 필요.\")\n\n    deep_av = False\n    if use == \"gemini\":\n        deep_av = st.toggle(\"🎧 음성까지 이해 (영상 전체 업로드 · File API)\", value=True, key=\"cp_deepav\",\n                            help=\"켜면 영상 파일을 통째로 Gemini에 올려 내레이션·BGM·효과음·움직임까지 이해합니다\"\n                                 \"(무료 티어라 30~90초 소요). 끄면 정지 6프레임만 봅니다(빠르지만 음성 미반영).\")\n        st.caption(\"🎧 **ON = 영상+음성 전체 이해**(느림·정확) · OFF = 정지 6프레임(빠름·음성 미반영). \"\n                   \"업로드/처리 실패 시 자동으로 프레임 방식으로 대체합니다.\")\n\n    name = st.text_input(\"소재명\", \"예시소재_A\", key=\"cp_name\")\n    script = st.text_area(\"소재 스크립트 / 설명 (방향성 판단의 주근거)\", height=120, key=\"cp_script\",\n                          placeholder=\"영상 흐름·후킹 문구·핵심 메시지·CTA 등을 적어주세요.\")\n    up = st.file_uploader(\"영상 1개(mp4/mov) — 또는 그 소재의 캡처 프레임 여러 장 · **한 번에 소재 1개만**\",\n                          type=[\"mp4\", \"mov\", \"webm\", \"m4v\", \"avi\", \"png\", \"jpg\", \"jpeg\"],\n                          accept_multiple_files=True, key=\"cp_frames\")\n\n    if st.button(\"소재력 분석 실행\", type=\"primary\"):\n        if use == \"gemini\" and not gemini_ok:\n            st.error(\"Gemini 키 미설정 — .env에 GEMINI_API_KEY(무료 발급) 추가 후 재시작. 또는 '규칙 기반' 선택.\")\n        elif use == \"anthropic\" and not client.available():\n            st.error(\"Anthropic 키 미설정.\")\n        elif not (up or script.strip()):\n            st.warning(\"영상/프레임 또는 스크립트 중 최소 하나는 입력하세요.\")\n        else:\n            paths, tmp, aspect, vsig, first_video_path = [], [], None, {}, None\n            if up:\n                FRAME_TMP.mkdir(parents=True, exist_ok=True)\n                video_files = [f for f in up if f.name.lower().rsplit(\".\", 1)[-1] in VIDEO_EXT]\n                if len(video_files) > 1:\n                    st.warning(\"⚠️ 한 번에 **소재 1개**만 분석합니다 — 업로드한 영상 중 **첫 번째만** 사용하고 \"\n                               \"나머지 영상은 무시합니다. 다른 소재는 따로 실행해 주세요.\")\n                used_video = False\n                for f in up:\n                    ext = f.name.lower().rsplit(\".\", 1)[-1]\n                    fp = FRAME_TMP / f.name\n                    fp.write_bytes(f.getbuffer())\n                    tmp.append(str(fp))\n                    if aspect is None:\n                        aspect = media_aspect(str(fp))\n                    if use in (\"gemini\", \"anthropic\"):          # 비전 방식만 프레임 추출\n                        if ext in VIDEO_EXT:\n                            if used_video:\n                                continue                        # 단일 소재: 두 번째 영상부터 무시\n                            used_video = True\n                            first_video_path = str(fp)\n                            with st.spinner(f\"영상 '{f.name}' 프레임 추출·실측 중...\"):\n                                got = extract_frames(str(fp), n=6)\n                                vsig = video_signals(str(fp))\n                            paths += got\n                            tmp += got\n                        else:\n                            paths.append(str(fp))\n            video_meta = (format_video_meta(vsig, len(paths[:6]))\n                          if use in (\"gemini\", \"anthropic\") else \"\")\n            if video_meta:\n                st.caption(f\"📐 영상 실측: {video_meta}\")\n            spin = (\"영상 업로드·음성/영상 전체 이해 중 (무료 티어라 30~90초 걸릴 수 있어요)...\"\n                    if (use == \"gemini\" and deep_av and first_video_path)\n                    else \"소재 방향성 분석 중...\")\n            with st.spinner(spin):\n                if use == \"rules\":\n                    data = creative_analyzer.analyze_power_rules(name, script, aspect)\n                elif use == \"gemini\":\n                    data = None\n                    if deep_av and first_video_path:      # 🎧 영상+음성 전체 이해(File API)\n                        data = creative_analyzer.analyze_power_gemini_video(\n                            name, first_video_path, script, video_meta)\n                        if data is None:\n                            st.warning(\"음성·영상 전체 이해(File API)가 실패/지연 → 프레임 기반으로 대체 분석합니다.\")\n                    if data is None:                      # 폴백/토글 OFF/이미지만\n                        data = creative_analyzer.analyze_power_gemini(name, paths, script, video_meta)\n                else:\n                    data = creative_analyzer.analyze_power(name, paths, script)\n            for p in set(tmp):                              # 업로드 영상·추출 프레임 삭제(용량 절감)\n                try:\n                    Path(p).unlink()\n                except OSError:\n                    pass\n            if not data:\n                st.error(\"분석 실패(응답 형식 오류 또는 키 문제). 규칙 기반으로 바꾸거나 스크립트를 보태서 다시 시도하세요.\")\n            else:\n                mtag = {\"rules\": \"규칙기반\", \"gemini\": \"Gemini\", \"anthropic\": \"Anthropic\"}[use]\n                rec = {\"소재명\": name, \"분석일\": date.today().isoformat(), \"방식\": mtag, \"입력\": script and \"스크립트\" or \"영상\", **data}\n                save_record(rec)\n                st.success(f\"분석 완료({mtag}) · 기록 저장됨 (업로드 영상은 삭제).\")\n                render_power(data)\n\n    with st.expander(\"✍️ 수동 채점 (AI 키 없이 바로 사용)\"):\n        st.caption(\"7항목을 직접 하/중/상으로 선택 → 종합 점수·가능성 자동 계산·기록.\")\n        man = []\n        for item in POWER_ITEMS:\n            mc = st.columns([2, 2, 4])\n            mc[0].markdown(f\"**{item}**\")\n            lv = mc[1].radio(\"레벨\", [\"상\", \"중\", \"하\"], index=1, key=f\"man_{item}\",\n                             horizontal=True, label_visibility=\"collapsed\")\n            guide = mc[2].text_input(\"가이드\", key=f\"mang_{item}\", label_visibility=\"collapsed\",\n                                     placeholder=\"수정가이드(선택)\")\n            man.append({\"항목\": item, \"레벨\": lv, \"진단\": \"(수동 채점)\", \"수정가이드\": guide or \"-\"})\n        if st.button(\"수동 채점 저장\", key=\"man_save\"):\n            score = round(sum(LEVEL_SCORE[m[\"레벨\"]] for m in man) / 14 * 100)\n            poss = \"높음\" if score >= 67 else (\"보통\" if score >= 34 else \"낮음\")\n            data = {\"overall\": {\"가능성\": poss, \"점수\": score, \"요약\": \"담당자 수동 채점\"}, \"items\": man}\n            save_record({\"소재명\": name, \"분석일\": date.today().isoformat(), \"방식\": \"수동\", \"입력\": \"수동\", **data})\n            st.success(f\"저장됨 — 가능성 {poss} · {score}점\")\n            render_power(data)\n\n    st.divider()\n    st.subheader(\"📒 검증전 소재 기록\")\n    recs = load_records()\n    if recs:\n        summ = pd.DataFrame([{\"소재명\": r.get(\"소재명\", \"\"), \"분석일\": r.get(\"분석일\", \"\"),\n                              \"방식\": r.get(\"방식\", \"-\"),\n                              \"가능성\": r.get(\"overall\", {}).get(\"가능성\", \"-\"),\n                              \"점수\": r.get(\"overall\", {}).get(\"점수\", \"-\")} for r in recs])\n        st.dataframe(summ, use_container_width=True, hide_index=True)\n        labels = [f\"{r.get('소재명','')} · {r.get('분석일','')}\" for r in recs]\n        sel = st.selectbox(\"상세 볼 소재\", [\"—\"] + labels, key=\"cp_sel\")\n        if sel != \"—\":\n            render_power(recs[labels.index(sel)])\n    else:\n        st.info(\"아직 분석한 소재가 없습니다. 위에서 소재를 분석하면 여기 기록됩니다.\")\n\n# ─────────────────────────── 검증된 소재 (집행됨) ───────────────────────────\nwith tab_proven:\n    st.caption(\"집행했던 소재를 **소재명으로 검색**해 검증전 예측 ↔ 실제 집행 결과를 확인합니다.\")\n    ad = C.add_ad_brand(C.load_ads())\n    if ad.empty:\n        st.warning(\"광고 데이터가 없습니다.\")\n        st.stop()\n    ad[\"d\"] = ad[\"date\"].dt.date\n    dmin_pv, latest = ad[\"d\"].min(), ad[\"d\"].max()   # 데이터 최신일 — 이 날까지 지출 있으면 '운영중'으로 판정\n\n    st.markdown(\"#### 🔎 소재명으로 결과 조회\")\n    st.caption(\"셋팅했던 소재명을 검색하면 **검증전 예측(소재력) ↔ 실제 집행 결과**를 함께 봅니다. \"\n               \"기록이 없으면 공란입니다. 아래 **조회 기간**으로 집계 범위를 좁힐 수 있습니다(기본=최신일 하루, 필요시 넓히세요).\")\n    pvc1, pvc2 = st.columns([2.2, 4.8])\n    with pvc1:\n        # key에 latest(데이터 최신일)를 넣어야 함 — 위젯 key가 고정이면 세션 state가 예전 선택값을\n        # 그대로 들고 있어(브라우저 탭을 여러 날 걸쳐 켜두는 경우) 데이터가 최신일로 갱신돼도\n        # 조회 기간 기본값이 과거에 멈춰 보인다. latest가 바뀔 때마다 새 위젯으로 취급돼 항상\n        # (latest, latest)로 리셋된다.\n        prng = st.date_input(\"조회 기간\", value=(latest, latest),\n                             min_value=dmin_pv, max_value=latest, key=f\"cp_pv_date_{latest.isoformat()}\")\n        pv_start, pv_end = (prng if isinstance(prng, tuple) and len(prng) == 2 else (dmin_pv, latest))\n    with pvc2:\n        st.write(\"\")\n        q = st.text_input(\"소재명 검색\", key=\"cp_pv_search\", label_visibility=\"collapsed\",\n                          placeholder=\"예: 무다리, 빠지는 속도, 임블리 …\")\n    if q.strip():\n        qq = q.strip()\n        recs = [r for r in load_records() if qq.lower() in str(r.get(\"소재명\", \"\")).lower()]\n        m_all = ad[ad[\"platform\"].isin([\"meta\", \"tiktok\", \"google\"])\n
