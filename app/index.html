mut); margin-top:2px; }\n.hs-tbl { width:100%; border-collapse:collapse; font-size:13px; font-family:'Pretendard','Malgun Gothic',sans-serif; }\n.hs-tbl th, .hs-tbl td { padding:7px 9px; border-bottom:1px solid var(--line); text-align:left; }\n.hs-tbl th { color:var(--mut); font-weight:600; font-size:11px; background:#f5f0e6; }\n.hs-tbl td.num { text-align:right; font-variant-numeric:tabular-nums; }\n.badge-full { background:rgba(31,157,116,.15); color:var(--good); border-radius:7px; padding:0 6px; font-size:10px; font-weight:600; }\n.badge-part { background:rgba(168,118,10,.15); color:var(--warn); border-radius:7px; padding:0 6px; font-size:10px; font-weight:600; }\n</style>\n\"\"\", unsafe_allow_html=True)\n\nst.title(\"⏱ 시간대별 매출 확인\")\n\ndb_days = _db_days()\nlast_db = dt.date.fromisoformat(db_days[-1]) if db_days else None\ntoday = dt.date.today()\nmax_day = today if LIVE else (last_db or today)\n\nst.markdown(f\"\"\"\n<div class=\"hs-wrap\"><div class=\"hs-card hyp\">\n<p><b>카페24는 주문 API의 실제 주문시각</b>으로 시간대별 집계합니다(GA4 추정 아님).\n두 날짜를 골라 시간대별·누적 매출 속도를 비교하세요.</p>\n<p style=\"color:var(--warn)\">⚠ <b>스마트스토어·쿠팡은 일 총액으로만</b> 표시합니다. 스마트스토어는 커머스 API가\n지난 날 결제분을 돌려주지 않고, 쿠팡은 로켓그로스 정산 지연으로 시각이 부정확합니다 —\n어떤 날은 넣고 어떤 날은 빼면 속도 비교가 틀어지므로 <b>누적 곡선은 카페24만</b> 씁니다.</p>\n</div></div>\n\"\"\", unsafe_allow_html=True)\n\nif not LIVE:\n    st.info(f\"📦 **보존 사본 모드** — 저장된 지난 날 데이터만 볼 수 있습니다\"\n            f\"{f'(최신 {last_db})' if last_db else ''}. 당일 매출은 실시간 주문 API가 필요해 \"\n            f\"여기서는 표시되지 않습니다(정상).\")\n    if not db_days:\n        st.warning(\"저장된 시간대별 데이터가 없습니다. 로컬에서 \"\n                   \"`python scripts/collect_hourly_sales.py --days 30` 을 돌린 뒤 재배포하세요.\")\n        st.stop()\n\nc1, c2, c3 = st.columns([1, 1, 1])\nwith c1:\n    brand = st.selectbox(\"브랜드\", list(H.BRAND_MALL), key=\"hs_brand\")\n_def_base = max_day - dt.timedelta(days=1)\nwith c2:\n    base_day = st.date_input(\"기준일\", value=max(_def_base, dt.date(2020, 1, 1)),\n                             max_value=max_day, key=\"hs_base\")\nwith c3:\n    cmp_day = st.date_input(\"비교일\", value=max_day, max_value=max_day, key=\"hs_cmp\")\n\nwith st.spinner(\"매출 조회 중…\"):\n    base = day_data(brand, base_day, today)\n    cmp_ = day_data(brand, cmp_day, today)\n\nmissing = [d.isoformat() for d, x in ((base_day, base), (cmp_day, cmp_)) if x[\"src\"] == \"none\"]\nif missing:\n    st.warning(f\"{'·'.join(missing)} 은 저장된 데이터가 없습니다\"\n               + (f\" (저장 범위 {db_days[0]} ~ {db_days[-1]}).\" if db_days else \".\")\n               + \" 다른 날짜를 골라 주세요.\")\n    st.stop()\n\nbase_total, cmp_total = base[\"hours\"], cmp_[\"hours\"]\ncmp_is_today = cmp_day >= today\nnow_hr = dt.datetime.now().hour if cmp_is_today else 23\ncur_hour = min(now_hr, 23)\n\nbase_cp, cmp_cp = base[\"totals\"].get(\"쿠팡\", 0.0), cmp_[\"totals\"].get(\"쿠팡\", 0.0)\nbase_ss, cmp_ss = base[\"totals\"].get(\"스마트스토어\", 0.0), cmp_[\"totals\"].get(\"스마트스토어\", 0.0)\n\nbase_grand = float(base_total.sum()) + base_cp + base_ss\ncmp_rt = float(cmp_total.iloc[:cur_hour + 1].sum()) if cmp_is_today else float(cmp_total.sum())\ncmp_grand = cmp_rt + cmp_cp + cmp_ss\n\n\ndef _tag(full: bool) -> str:\n    return '<span class=\"badge-full\">마감 확정</span>' if full else '<span class=\"badge-part\">오늘·라이브(부분)</span>'\n\ncum_base = base_total.cumsum()\ncum_cmp_full = cmp_total.cumsum()\ncum_cmp = cum_cmp_full.where(cum_cmp_full.index <= cur_hour) if cmp_is_today else cum_cmp_full.copy()\n\npace_base_now = float(cum_base.iloc[cur_hour])\npace_cmp_now = float(cum_cmp_full.iloc[cur_hour])\nif pace_base_now:\n    pace_label = f\"{(pace_cmp_now / pace_base_now - 1) * 100:+.1f}%\"\nelif pace_cmp_now:\n    pace_label = \"신규(기준일 0원)\"\nelse:\n    pace_label = \"0.0%\"\n\nst.markdown(f\"\"\"\n<div class=\"hs-wrap\"><div class=\"hs-card\">\n<div class=\"hs-kpi-row\">\n  <div class=\"hs-kpi\"><div class=\"n\">{won(base_grand)}</div>\n    <div class=\"l\">{base_day.isoformat()} 총매출 (카페24+스마트+쿠팡) {_tag(base['full'])}<br>\n    <span style=\"color:var(--mut)\">└ 스마트 {won(base_ss)} · 쿠팡 {won(base_cp)}</span></div></div>\n  <div class=\"hs-kpi\"><div class=\"n\">{won(cmp_grand)}</div>\n    <div class=\"l\">{cmp_day.isoformat()} {'현재까지' if cmp_is_today else '총'}매출 {_tag(cmp_['full'])}<br>\n    <span style=\"color:var(--mut)\">└ 스마트 {won(cmp_ss)} · 쿠팡 {won(cmp_cp)}</span></div></div>\n  <div class=\"hs-kpi\"><div class=\"n acc\">{pace_label}</div>\n    <div class=\"l\">{cur_hour}시 기준 <b>카페24</b> 누적 속도</div></div>\n</div>\n</div></div>\n\"\"\", unsafe_allow_html=True)\n\n\ndef build_cum_svg(cum_base: \"pd.Series\", cum_cmp: \"pd.Series\", cur_hour: int, show_now: bool) -> str:\n    W, H_, pad = 900, 300, 34\n    x0, x1 = pad + 48, W - 16\n    plotw, ploth = x1 - x0, H_ - pad - 30\n    vals_b = [float(v) for v in cum_base.values]\n    vals_c = [float(v) for v in cum_cmp.values if pd.notna(v)]\n    maxv = max(vals_b + vals_c) or 1.0\n    svg = [f'<svg viewBox=\"0 0 {W} {H_}\" width=\"100%\" role=\"img\" style=\"font-family:Pretendard,\\'Malgun Gothic\\',sans-serif\">']\n    for gy in (0, 0.5, 1.0):\n        yy = pad + ploth - gy * ploth\n        svg.append(f'<line x1=\"{x0}\" y1=\"{yy:.0f}\" x2=\"{x1}\" y2=\"{yy:.0f}\" stroke=\"#e6ded0\" stroke-width=\"1\"/>')\n        svg.append(f'<text x=\"{x0-8}\" y=\"{yy+4:.0f}\" text-anchor=\"end\" font-size=\"11\" fill=\"#8a8072\">{maxv*gy/1e6:.1f}M</text>')\n    for h in range(0, 24, 3):\n        cx = x0 + h / 23 * plotw\n        svg.append(f'<text x=\"{cx:.0f}\" y=\"{pad+ploth+18:.0f}\" text-anchor=\"middle\" font-size=\"11\" fill=\"#8a8072\">{h}</text>')\n    if show_now:\n        now_x = x0 + cur_hour / 23 * plotw\n        svg.append(f'<line x1=\"{now_x:.0f}\" y1=\"{pad}\" x2=\"{now_x:.0f}\" y2=\"{pad+ploth}\" '\n                   f'stroke=\"#c9702b\" stroke-width=\"1\" stroke-dasharray=\"3,3\" opacity=\"0.55\"/>')\n        svg.append(f'<text x=\"{now_x+4:.0f}\" y=\"{pad+12}\" font-size=\"11\" fill=\"#c9702b\">지금({cur_hour}시)</text>')\n    pts_b = \" \".join(f\"{x0+h/23*plotw:.1f},{pad+ploth-cum_base.iloc[h]/maxv*ploth:.1f}\" for h in range(24))\n    pts_c = \" \".join(f\"{x0+h/23*plotw:.1f},{pad+ploth-cum_cmp.iloc[h]/maxv*ploth:.1f}\"\n                     for h in range(24) if pd.notna(cum_cmp.iloc[h]))\n    svg.append(f'<polyline points=\"{pts_b}\" fill=\"none\" stroke=\"#8a8072\" stroke-width=\"2.4\" opacity=\"0.8\"/>')\n    svg.append(f'<polyline points=\"{pts_c}\" fill=\"none\" stroke=\"#c9702b\" stroke-width=\"3\"/>')\n    svg.append(f'<text x=\"{x1-4}\" y=\"{pad-10}\" text-anchor=\"end\" font-size=\"12\" fill=\"#8a8072\">● 기준일({base_day.isoformat()})　'\n               f'<tspan fill=\"#c9702b\">● 비교일({cmp_day.isoformat()})</tspan></text>')\n    svg.append(\"</svg>\")\n    return \"\".join(svg)\n\n\nst.markdown('<div class=\"hs-wrap\"><div class=\"hs-card\">', unsafe_allow_html=True)\nst.markdown('<div class=\"hs-label\">누적매출 속도(pace) — 카페24 실주문 시각 기준</div>', unsafe_allow_html=True)\nst.markdown(build_cum_svg(cum_base, cum_cmp, cur_hour, cmp_is_today), unsafe_allow_html=True)\nst.markdown('<div class=\"hs-note\">점선=지금 시각(비교일이 오늘일 때만). 비교일 선이 기준일 선보다 위에 있으면 '\n            '비교일이 더 빠르게 팔리는 중. <b>스마트스토어·쿠팡은 시각 데이터가 없어 이 곡선에서 제외</b>하고 '\n            '아래 표에 일 총액으로 표시합니다.</div></div></div>', unsafe_allow_html=True)\n\n# ── 채널별 분해 표 ─────────────────────────────────────────────\nch_rows = (f'<tr><td>카페24</td><td class=\"num\">{won(float(base_total.sum()))}</td>'\n           f'<td class=\"num\">{won(cmp_rt)}</td></tr>')\nfor ch, b, c in ((\"스마트스토어\", base_ss, cmp_ss), (\"쿠팡\", base_cp, cmp_cp)):\n    ch_rows += (f'<tr><td>{ch} <span style=\"font-size:10px;color:var(--mut)\">일 총액</span></td>'\n                f'<td class=\"num\">{won(b)}</td><td class=\"num\">{won(c)}</td></tr>')\nch_rows += (f'<tr style=\"font-weight:700\"><td>합계</td><td class=\"num\">{won(base_grand)}</td>'\n            f'<td class=\"num\">{won(cmp_grand)}</td></tr>')\n\nst.markdown(f\"\"\"\n<div class=\"hs-wrap\"><div class=\"hs-card\">\n<div class=\"hs-label\">채널별 매출 — {base_day.isoformat()}(전체) vs {cmp_day.isoformat()}({'현재까지' if cmp_is_today else '전체'})</div>\n<table class=\"hs-tbl\"><thead><tr><th>채널</th><th class=\"num\">기준일</th><th class=\"num\">비교일</th></tr></thead>\n<tbody>{ch_rows}</tbody></table>\n<div class=\"hs-note\">스마트스토어·쿠팡은 시각(hour) 데이터가 없어 <b>일 총액</b>으로만 표시합니다.\n마감된 날은 수집된 <b>확정값</b>(쿠팡은 로켓그로스 포함), 오늘은 라이브 API <b>부분값</b>(마감 시 늘어남)입니다.</div>\n</div></div>\n\"\"\", unsafe_allow_html=True)\n\n# ── 시간대별 상세 표 (카페24) ────────────────────────────────\nst.markdown('<div class=\"hs-wrap\"><div class=\"hs-label\" style=\"margin-top:6px\">시간대별 매출 — 카페24</div></div>',\n            unsafe_allow_html=True)\ndetail = pd.DataFrame({\n    \"시\": [str(h) for h in range(24)] + [\"합계\"],\n    \"기준일 매출\": list(base_total.values) + [float(base_total.sum())],\n    \"비교일 매출\": list(cmp_total.values) + [float(cmp_total.sum())],\n})\nst.dataframe(detail.style.format({c: \"{:,.0f}\" for c in detail.columns if c != \"시\"}),\n             use_container_width=True, hide_index=True)\n\n_src_txt = {\"db\": \"보존 DB(hourly_sales)\", \"live\": \"주문 API 라이브\", \"none\": \"없음\"}\nst.caption(f\"출처 — 기준일 {_src_txt[base['src']]} · 비교일 {_src_txt[cmp_['src']]}. \"\n           \"카페24 주문 API(order_date)의 실제 주문시각, 매출=실결제액(취소·부분취소 반영). \"\n           \"스마트스토어·쿠팡 일 총액은 수집 스냅샷(products.pkl) 확정값, 오늘만 라이브 부분값. 캐시 10분.\")\n", "dashboards/lowspend_report.py": "\"\"\"재셋팅 필요 소재 — 저금액 + 저성과(ROAS) 진단 (브랜드·플랫폼별).\n\n두 가지 재셋팅 진단을 한 화면(탭)에서 본다.\n 1) 저금액 소재 : 최근 3일 누적 지출이 5만원 이하 → 노출·학습 부족(미검증). 예산 증액 또는 교체.\n 2) 저성과 소재 : 충분히 집행(최근 7일 지출 > 5만원)됐는데 ROAS 가 200% 미만 → 재셋팅 대상.\n\n브랜드는 5개로 정규화한다: 안티칼알파 / 에이징핏 / 림데이 / 뉴로포커스 / 씨코랩.\n - '안티칼' 계정 소재는 캠페인명에 '에이징핏'이 있으면 에이징핏, 그 외(키워드 없음 포함)는 안티칼알파.\ndaily_ads(스냅샷 + 실시간 API 적재) 사용.\n\"\"\"\nfrom __future__ import annotations\n\nimport sys\nfrom datetime import timedelta\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parent.parent\nsys.path.insert(0, str(ROOT))\n\nimport pandas as pd  # noqa: E402\nimport streamlit as st  # noqa: E402\n\nfrom analyzers import _common as C  # noqa: E402\nfrom collectors import cafe24_snapshot as _snap  # noqa: E402\n\nPLAT_NAME = {\"meta\": \"Meta\", \"google\": \"Google Ads\", \"tiktok\": \"TikTok\",\n             \"naver\": \"Naver 검색\", \"naver_gfa\": \"Naver GFA\"}\nPLAT_BADGE = {\"meta\": \"🔵 Meta\", \"google\": \"🔴 Google\", \"tiktok\": \"⚫ TikTok\",\n              \"naver\": \"🟢 Naver\", \"naver_gfa\": \"🟩 GFA\"}\n\nTHRESH = 50_000          # 저금액 기준: 5만원\nWINDOW = 3               # 저금액 판정 창(최근 3일)\n\nBRANDS = C.AD_BRANDS     # 5개 표준 브랜드(안티칼알파·에이징핏·림데이·뉴로포커스·씨코랩)\n\ntry:\n    st.set_page_config(page_title=\"재셋팅 소재\", layout=\"wide\")\nexcept Exception:\n    pass\nfrom dashboards._style import brand_pills, inject_css, page_intro  # noqa: E402\ninject_css()\n\n\n@st.cache_data(ttl=600)\ndef load() -> pd.DataFrame:\n    return C.load_ads()\n\n\n@st.cache_data(ttl=600)\ndef load_status() -> dict:\n    \"\"\"소재명(campaign_name=ad_name) → 상태 문자열(ACTIVE/PAUSED/…). 메타만 수집됨.\"\"\"\n    try:\n        s = _snap.ad_status()\n    except Exception:  # noqa: BLE001\n        return {}\n    if s is None or s.empty or \"제품\" not in s.columns:\n        return {}\n    return dict(zip(s[\"제품\"].astype(str), s[\"상태\"].astype(str)))\n\n\ndef _status_badge(name: str, smap: dict) -> str:\n    \"\"\"소재 ON/OFF 배지. 메타 미수집·비매칭은 '– 미수집'.\"\"\"\n    stt = smap.get(str(name))\n    if stt is None:\n        return \"– 미수집\"\n    return \"🟢 ON\" if stt == \"ACTIVE\" else \"⏸️ OFF\"\n\n\ndef _won(v) -> str:\n    return f\"{float(v or 0):,.0f}\"\n\n\ndef _attempt(name: str) -> str:\n    \"\"\"소재명의 '사본' 개수로 시도 차수 판단(메타 소재 복제 규칙). 0=원본, n=n차 시도.\"\"\"\n    n = str(name).count(\"사본\")\n    return \"원본\" if n == 0 else f\"{n}차 시도\"\n\n\n# ---------- 로드 ----------\nst.title(\"⚠️ 저금액 소재 (재셋팅 필요)\")\npage_intro(\n    \"최근 3일 누적 지출이 <b>5만원 이하</b>인 소재입니다. 노출·학습이 부족해 성과 판단이 어려우니 \"\n    \"<b>예산 증액 또는 소재 교체(재셋팅)</b>가 필요합니다. \"\n    \"브랜드(안티칼알파·에이징핏·림데이·뉴로포커스·씨코랩)·플랫폼(Meta·Google·TikTok)별로 점검하세요.\"\n)\n\nads = load()\nif ads.empty:\n    st.warning(\"광고 데이터가 없습니다. 통합 요약에서 '🔄 실시간 API 취합'을 먼저 실행하세요.\")\n    st.stop()\n\nads = C.add_ad_brand(ads)\nads[\"date\"] = pd.to_datetime(ads[\"date\"], errors=\"coerce\")\ndmax = ads[\"date\"].max()\n\nls_start = dmax - timedelta(days=WINDOW - 1)\nls = ads[ads[\"date\"] >= ls_start]\n\n# ---------- 필터 ----------\npresent_brands = [b for b in BRANDS if b in ads[\"brand\"].unique()]\nextra = sorted(set(ads[\"brand\"].unique()) - set(BRANDS))  # 매핑 안 된 계정(있으면)\nall_brands = present_brands + extra\nall_plats = [p for p in [\"meta\", \"google\", \"tiktok\", \"naver\", \"naver_gfa\"] if p in ads[\"platform\"].unique()]\n\nfc = st.columns([3.2, 3.2])\nwith fc[0]:\n    sel_brands = brand_pills(all_brands, key=\"low_brand\")\nwith fc[1]:\n    sel_plats = brand_pills(all_plats, key=\"low_plat\", label=\"플랫폼\",\n                            format_func=lambda p: PLAT_NAME.get(p, p))\n\nsmap = load_status()\nif smap:\n    st.caption(\"✅ **게재 중(ON) 소재만** 표시합니다 — 메타 OFF(일시중지/보관)는 자동 제외(매일 스냅샷 갱신 시점 기준). \"\n               \"구글/틱톡/네이버는 상태 미수집이라 그대로 포함됩니다.\")\nelse:\n    st.caption(\"⚠️ 소재 ON/OFF 상태 데이터가 아직 없습니다 — 다음 일일 스냅샷(또는 datastore.py 재실행) 후 OFF가 자동 제외됩니다.\")\nst.divider()\n\n\n# ---------- 집계 ----------\ndef _agg(df: pd.DataFrame) -> pd.DataFrame:\n    g = df.groupby([\"brand\", \"platform\", \"campaign_name\"], as_index=False).agg(\n        지출=(\"cost\", \"sum\"), 노출=(\"impressions\", \"sum\"), 클릭=(\"clicks\", \"sum\"),\n        전환수=(\"conversions\", \"sum\"), 전환매출=(\"conv_value\", \"sum\"))\n    return g[g[\"brand\"].isin(sel_brands) & g[\"platform\"].isin(sel_plats)]\n\n\nlow = _agg(ls)\nlow = low[(low[\"지출\"] > 0) & (low[\"지출\"] <= THRESH)]\n\n# 캠페인 ON 필터(항상 적용) — 상태 수집된 소재 중 ACTIVE 아닌 것(OFF) 제외. 미수집(None)은 유지.\nlow[\"_status\"] = low[\"campaign_name\"].map(lambda n: smap.get(str(n)))\nif smap:\n    low = low[low[\"_status\"].isna() | (low[\"_status\"] == \"ACTIVE\")]\n\nst.caption(f\"기준 기간: {ls_start.date()} ~ {dmax.date()} (최근 {WINDOW}일) · 지출 ≤ {THRESH:,}원\"\n           + (\"  ·  ✅ ON만\" if smap else \"\"))\nif low.empty:\n    st.success(\"선택 조건에 해당하는 저금액 소재가 없습니다. 👍\")\n    st.stop()\n\nk = st.columns(4)\nk[0].metric(\"저금액 소재 수\", f\"{len(low):,}개\")\nk[1].metric(\"합산 지출\", f\"{_won(low['지출'].sum())} 원\")\nk[2].metric(\"브랜드 수\", f\"{low['brand'].nunique()}개\")\nk[3].metric(\"플랫폼 수\", f\"{low['platform'].nunique()}개\")\nst.write(\"\")\nfor b in sel_brands:\n    sub_all = low[low[\"brand\"] == b].sort_values(\"지출\")\n    if sub_all.empty:\n        continue\n    # 헤더 행: 좌측 제목 + 우측 상단 소재 검색창\n    hcol = st.columns([3, 1.4])\n    q = hcol[1].text_input(\"소재 검색\", key=f\"low_search_{b}\",\n                           placeholder=\"🔍 소재명 검색\", label_visibility=\"collapsed\")\n    sub = sub_all if not q else sub_all[\n        sub_all[\"campaign_name\"].astype(str).str.contains(q, case=False, na=False)]\n    hcol[0].subheader(f\"{b}  ·  {len(sub)}개 소재  ·  지출 {_won(sub['지출'].sum())}원\")\n    if sub.empty:\n        st.caption(f\"‘{q}’ 검색 결과가 없습니다.\")\n        continue\n    sub = sub.assign(_att=sub[\"campaign_name\"].map(_attempt))\n    roas = sub[\"전환매출\"] / sub[\"지출\"]   # 저금액 필터로 지출>0 보장\n    show = pd.DataFrame({\n        \"플랫폼\": sub[\"platform\"].map(lambda p: PLAT_BADGE.get(p, p)),\n        \"시도\": sub[\"_att\"],\n        \"소재(ad)\": sub[\"campaign_name\"].astype(str),\n        f\"{WINDOW}일 지출\": sub[\"지출\"].map(lambda v: f\"{v:,.0f}원\"),\n        \"노출\": sub[\"노출\"].map(lambda v: f\"{int(v):,}\"),\n        \"클릭\": sub[\"클릭\"].map(lambda v: f\"{int(v):,}\"),\n        \"전환수\": sub[\"전환수\"].map(lambda v: f\"{v:,.0f}\"),\n        \"전환매출\": sub[\"전환매출\"].map(lambda v: f\"{v:,.0f}원\"),\n        \"ROAS\": roas.map(lambda v: f\"{v*100:,.0f}%\"),\n        \"판정\": \"🔁 재셋팅 필요\",\n    })\n    # 맨 아랫단 합계 행\n    t_cost = sub[\"지출\"].sum()\n    t_val = sub[\"전환매출\"].sum()\n    total_row = {\n        \"플랫폼\": \"🔢 합계\",\n        \"시도\": \"\",\n        \"소재(ad)\": f\"{len(sub)}개 소재\",\n        f\"{WINDOW}일 지출\": f\"{t_cost:,.0f}원\",\n        \"노출\": f\"{int(sub['노출'].sum()):,}\",\n        \"클릭\": f\"{int(sub['클릭'].sum()):,}\",\n        \"전환수\": f\"{sub['전환수'].sum():,.0f}\",\n        \"전환매출\": f\"{t_val:,.0f}원\",\n        \"ROAS\": f\"{(t_val / t_cost * 100) if t_cost else 0:,.0f}%\",\n        \"판정\": \"\",\n    }\n    show = pd.concat([show, pd.DataFrame([total_row])], ignore_index=True)\n    vc = sub[\"_att\"].value_counts()\n    st.caption(\"시도 구분: \" + \" · \".join(f\"{k_} {v_}개\" for k_, v_ in vc.items()))\n    st.dataframe(show, width=\"stretch\", hide_index=True)\nst.info(\"판정 기준: 최근 3일 지출 5만원 이하 = 예산 부족으로 충분히 노출·학습되지 않은 소재. \"\n        \"예산을 올려 테스트하거나, 성과가 계속 안 나오면 소재를 교체하세요.\")\n", "dashboards/pa_report.py": "\"\"\"PA소재 분석 — 메타 PA(인스타튠/인플루언서) 소재 전용 리포트.\n\n메타 총 지출 대비 🖼️ 인스타튠 vs 👤 인플루언서 구성·비율과, 어떤 PA 소재가 효율적인지\n(지출/CTR/ROAS)를 기간·브랜드별로 본다.\n\n분류 규칙(통합 광고 리포트와 동일):\n - 🖼️ 인스타튠 : 광고세트명에 '인튠' (intune>=1)\n - 👤 인플루언서: 소재명에 'PA' 포함 (인튠 아님)\n - 일반        : 그 외\nPA 소재 = 인스타튠 + 인플루언서.\n\n실행:\n  streamlit run dashboards/pa_report.py\n\"\"\"\nfrom __future__ import annotations\n\nimport sys\nfrom datetime import timedelta\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parent.parent\nsys.path.insert(0, str(ROOT))\n\nimport numpy as np  # noqa: E402\nimport pandas as pd  # noqa: E402\nimport plotly.express as px  # noqa: E402\nimport streamlit as st  # noqa: E402\n\nfrom analyzers import _common as C  # noqa: E402\n\ntry:\n    st.set_page_config(page_title=\"PA소재 분석\", layout=\"wide\")\nexcept Exception:  # noqa: BLE001\n    pass\nfrom dashboards._style import brand_pills, fmt_df, inject_css, page_intro, roas_pct  # noqa: E402\ninject_css()\n\nINSTA, INFLU, NORMAL = \"🖼️ 인스타튠\", \"👤 인플루언서\", \"일반\"\n\n\ndef won(x) -> str:\n    return f\"₩{float(x or 0):,.0f}\"\n\n\n@st.cache_data(ttl=600)\ndef load() -> pd.DataFrame:\n    return C.load_ads()\n\n\ndef classify(df: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"메타 소재를 인스타튠/인플루언서/일반으로 구분.\"\"\"\n    df = df.copy()\n    df[\"구분\"] = NORMAL\n    df.loc[df[\"campaign_name\"].astype(str).str.contains(\"PA\", na=False), \"구분\"] = INFLU\n    if \"intune\" in df.columns:\n        df.loc[df[\"intune\"].fillna(0) >= 1, \"구분\"] = INSTA\n    return df\n\n\ndef agg_metrics(frame: pd.DataFrame) -> dict:\n    imp, clk = frame[\"impressions\"].sum(), frame[\"clicks\"].sum()\n    cost, conv, val = frame[\"cost\"].sum(), frame[\"conversions\"].sum(), frame[\"conv_value\"].sum()\n    return {\"cost\": cost, \"impr\": imp, \"clicks\": clk, \"conv\": conv, \"val\": val,\n            \"ctr\": (clk / imp * 100) if imp else 0, \"cpc\": (cost / clk) if clk else 0,\n            \"cpm\": (cost / imp * 1000) if imp else 0,\n            \"cvr\": (conv / clk * 100) if clk else 0, \"roas\": (val / cost) if cost else 0}\n\n\n# ---------------- 로드 ----------------\nads = C.add_ad_brand(load())\nst.title(\"👤 PA소재 분석\")\npage_intro(\"메타 <b>PA 소재</b>를 🖼️ 인스타튠(광고세트 '인튠') vs 👤 인플루언서(소재명 'PA')로 나눠 봅니다. \"\n           \"메타 총 지출 대비 구성 비율과 어떤 PA 소재가 효율적인지(지출·CTR·ROAS)를 기간·브랜드별로 점검하세요.\")\nst.caption(\"⚠️ 전환수익·ROAS는 메타가 보고한 '기여' 기준(클릭+뷰스루)이라 과대될 수 있습니다 — 소재 간 상대 비교용으로 보세요.\")\n\nif ads.empty or \"meta\" not in ads[\"platform\"].unique():\n    st.warning(\"메타 광고 데이터가 없습니다. 개요의 ‘실시간 API 취합’ 또는 `python main.py` 실행.\")\n    st.stop()\n\nads = ads[ads[\"platform\"] == \"meta\"].copy()\nads[\"d\"] = ads[\"date\"].dt.date\ndmin, dmax = ads[\"d\"].min(), ads[\"d\"].max()\n\n# ---------------- 필터: 기간 / 브랜드 ----------------\nfc = st.columns([2.4, 0.2, 6.0])\nwith fc[0]:\n    rng = st.date_input(\"기간\", value=(dmax, dmax),   # 기본=최신 1일(필요시 사용자가 넓힘)\n                        min_value=dmin, max_value=dmax, key=\"pa_date\")\n    start, end = (rng if isinstance(rng, tuple) and len(rng) == 2 else (dmin, dmax))\nwith fc[2]:\n    present = [b for b in C.AD_BRANDS if b in ads[\"brand\"].unique()]\n    extra = sorted(set(ads[\"brand\"].dropna().unique()) - set(C.AD_BRANDS))\n    sel_brands = brand_pills(present + extra, key=\"pa_brand\")\nst.divider()\n\nmask = (ads[\"d\"] >= start) & (ads[\"d\"] <= end) & ads[\"brand\"].isin(sel_brands)\ndf = classify(ads[mask])\nif df.empty:\n    st.info(\"선택한 조건에 메타 데이터가 없습니다.\")\n    st.stop()\n\ntot = agg_metrics(df)\nm_insta = agg_metrics(df[df[\"구분\"] == INSTA])\nm_influ = agg_metrics(df[df[\"구분\"] == INFLU])\nm_norm = agg_metrics(df[df[\"구분\"] == NORMAL])\npa_cost = m_insta[\"cost\"] + m_influ[\"cost\"]\n\n\ndef _share(x) -> str:\n    return f\"{(x / tot['cost'] * 100) if tot['cost'] else 0:.1f}%\"\n\n\n# ---------------- KPI ----------------\nst.caption(f\"기간: **{start} ~ {end}**  ·  브랜드 {len(sel_brands)}개  ·  메타 전용\")\nk = st.columns(4)\nk[0].metric(\"메타 총 지출\", won(tot[\"cost\"]))\nk[1].metric(\"🖼️ 인스타튠 지출\", won(m_insta[\"cost\"]), f\"비중 {_share(m_insta['cost'])}\")\nk[2].metric(\"👤 인플루언서 지출\", won(m_influ[\"cost\"]), f\"비중 {_share(m_influ['cost'])}\")\nk[3].metric(\"일반 소재 지출\", won(m_norm[\"cost\"]), f\"비중 {_share(m_norm['cost'])}\")\n\nst.write(\"\")\nk2 = st.columns(4)\nk2[0].metric(\"PA 합계 지출\", won(pa_cost), f\"메타의 {_share(pa_cost)}\")\nk2[1].metric(\"🖼️ 인스타튠 ROAS\", roas_pct(m_insta[\"roas\"]), f\"CTR {m_insta['ctr']:.2f}%\")\nk2[2].metric(\"👤 인플루언서 ROAS\", roas_pct(m_influ[\"roas\"]), f\"CTR {m_influ['ctr']:.2f}%\")\nk2[3].metric(\"PA 평균 ROAS\",\n             roas_pct((m_insta[\"val\"] + m_influ[\"val\"]) / pa_cost if pa_cost else 0))\n\n# ---------------- 지출 구성 차트 + 구분별 효율 ----------------\ng1, g2 = st.columns([1, 1.4])\nwith g1:\n    comp = pd.DataFrame({\n        \"구분\": [INSTA, INFLU, NORMAL],\n        \"지출\": [m_insta[\"cost\"], m_influ[\"cost\"], m_norm[\"cost\"]]})\n    comp = comp[comp[\"지출\"] > 0]\n    fig = px.pie(comp, names=\"구분\", values=\"지출\", hole=0.45,\n                 title=\"메타 지출 구성 (인스타튠 · 인플루언서 · 일반)\",\n                 color=\"구분\",\n                 color_discrete_map={INSTA: \"#7E57C2\", INFLU: \"#42A5F5\", NORMAL: \"#B0BEC5\"})\n    fig.update_layout(height=330, margin=dict(t=46, b=0), legend_title=\"\")\n    st.plotly_ch annotations\n\nimport sys\nfrom datetime import timedelta\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parent.parent\nsys.path.insert(0, str(ROOT))\n\nimport numpy as np  # noqa: E402\nimport pandas as pd  # noqa: E402\nimport streamlit as st  # noqa: E402\n\nfrom analyzers import _common as C, root_cause_engine  # noqa: E402\nfrom collectors import cafe24_snapshot  # noqa: E402\nfrom handoff import designer  # noqa: E402\n\ntry:\n    st.set_page_config(page_title=\"퍼포먼스 액션\", layout=\"wide\")\nexcept Exception:\n    pass\nfrom dashboards._style import fmt_df, inject_css, page_intro, roas_pct, top_filter  # noqa: E402\ninject_css()\n\n\ndef won(x):\n    return f\"₩{x:,.0f}\"\n\n\n@st.cache_data(ttl=600)\ndef load():\n    ps = cafe24_snapshot.product_sales_df()\n    if not ps.empty:\n        ps = ps.copy()\n        ps[\"브랜드\"] = C.norm_brand(ps[\"브랜드\"])\n        ps[\"구매액\"] = pd.to_numeric(ps[\"구매액\"], errors=\"coerce\").fillna(0)\n    return C.load_ads(), C.load_orders(), ps\n\n\n@st.cache_data(ttl=600)\ndef insight():\n    return root_cause_engine.primary_insight()\n\n\nst.title(\"🎯 퍼포먼스 액션\")\npage_intro(\"잘 되고 있는 점과 개선이 필요한 점을 한 번에 취합하고, \"\n           \"Slack 으로 보낼 수 있는 액션 리포트를 만듭니다.\")\n\nads, orders, ps = load()\nif ads.empty and orders.empty:\n    st.warning(\"데이터가 없습니다. 개요의 ‘실시간 API 취합’ 또는 `python main.py` 실행.\")\n    st.stop()\n\ndmin = min([d[\"date\"].min().date() for d in (ads, orders) if not d.empty])\ndmax = max([d[\"date\"].max().date() for d in (ads, orders) if not d.empty])\nstart, end, sel_brands = top_filter(C.CANON_BRANDS, dmin, dmax, key=\"pa\")\n\n\ndef inr(df, bcol):\n    d = df[\"date\"].dt.date\n    out = df[(d >= start) & (d <= end)]\n    return out[out[bcol].isin(sel_brands)] if bcol in out.columns else out\n\n\na = inr(ads, \"account_name\") if not ads.empty else ads\no = inr(orders, \"brand\") if not orders.empty else orders\nov = o[o[\"is_cancel\"] == 0] if not o.empty else o\npsb = ps[ps[\"브랜드\"].isin(sel_brands)] if not ps.empty else ps\n\n# ---------- 집계 ----------\npositives, problems = [], []\n\n# 광고 효율\ncamp = pd.DataFrame()\n_oc = None\nif not a.empty:\n    camp = a.groupby([\"account_name\", \"campaign_name\"], as_index=False).agg(\n        지출=(\"cost\", \"sum\"), 전환매출=(\"conv_value\", \"sum\"))\n    camp[\"ROAS\"] = camp[\"전환매출\"] / camp[\"지출\"].replace(0, np.nan)\n    # 과집계('장난질') 의심행(전환매출 과대·ROAS 비현실적 = 어트리뷰션 중복/집계 오류) 분리.\n    # 효율 판단(최고/저효율)에서 제외해야 과집계가 '최고 효율'로 둔갑하지 않는다.\n    _oc = C.flag_overcount(camp[\"전환매출\"], camp[\"지출\"])\n    _cc = camp[~_oc]\n    sp = _cc[_cc[\"지출\"] >= max(100000, _cc[\"지출\"].sum() * 0.005)].dropna(subset=[\"ROAS\"])\n    if not sp.empty:\n        b = sp.loc[sp[\"ROAS\"].idxmax()]\n        w = sp.loc[sp[\"ROAS\"].idxmin()]\n        positives.append(f\"최고 효율 광고: {b['account_name']} · {b['campaign_name']} \"\n                         f\"(ROAS {roas_pct(b['ROAS'])}, 지출 {won(b['지출'])})\")\n        if w[\"ROAS\"] < 1.5:\n            problems.append(f\"저효율 광고: {w['account_name']} · {w['campaign_name']} \"\n                            f\"(ROAS {roas_pct(w['ROAS'])}, 지출 {won(w['지출'])}) → 소재/타겟 점검\")\n\n# 매출/상품\nif not psb.empty:\n    tp = psb.nlargest(1, \"구매액\").iloc[0]\n    positives.append(f\"베스트셀러: {tp['상품명'][:24]} ({won(tp['구매액'])})\")\n    low = psb[psb[\"구매액\"] > 0].nsmallest(1, \"구매액\")\n    if not low.empty:\n        lp = low.iloc[0]\n        problems.append(f\"저조 상품: {lp['상품명'][:24]} ({won(lp['구매액'])}) → 노출/상세 점검\")\n\n# 브랜드 매출/ROAS\nif not ov.empty:\n    by = ov.groupby(\"brand\")[\"sales_amount\"].sum().sort_values(ascending=False)\n    if len(by):\n        positives.append(f\"매출 1위 브랜드: {by.index[0]} ({won(by.iloc[0])})\")\n    cancel = o[\"is_cancel\"].mean() * 100 if not o.empty else 0\n    repeat = (ov[\"is_first\"] == 0).mean() * 100 if len(ov) else 0\n    if repeat >= 40:\n        positives.append(f\"재구매 주문비중 {repeat:.0f}% (충성 고객 견조)\")\n    if cancel >= 10:\n        problems.append(f\"취소율 {cancel:.1f}% → 결제/배송/품절 원인 점검\")\n\n# UX (Clarity)\nins = insight()\nif ins:\n    if ins[\"severity\"] in (\"High\", \"Medium\"):\n        problems.append(f\"UX: {ins['title']} ({ins['target_url']})\")\n    else:\n        positives.append(f\"UX: 상세페이지 이탈 양호({ins['severity']})\")\n\n# ---------- 화면 ----------\nc1, c2 = st.columns(2)\nwith c1:\n    st.subheader(\"✅ 잘 되고 있는 것\")\n    for p in positives:\n        st.markdown(f\"- {p}\")\n    if not positives:\n        st.info(\"해당 없음\")\nwith c2:\n    st.subheader(\"⚠️ 개선이 필요한 것\")\n    for p in problems:\n        st.markdown(f\"- {p}\")\n    if not problems:\n        st.success(\"특이 문제 없음\")\n\nif not camp.empty:\n    _ocn = int(_oc.sum()) if _oc is not None else 0\n    _title = f\"캠페인 ROAS 상세 (과집계 {_ocn}건 제외)\" if _ocn else \"캠페인 ROAS 상세\"\n    with st.expander(_title):\n        base = camp[~_oc] if _oc is not None else camp\n        sp2 = base.dropna(subset=[\"ROAS\"]).sort_values(\"ROAS\", ascending=False)\n        sp2 = sp2.rename(columns={\"account_name\": \"브랜드\", \"campaign_name\": \"캠페인\"})\n        st.dataframe(fmt_df(sp2[[\"브랜드\", \"캠페인\", \"지출\", \"ROAS\"]]),\n                     use_container_width=True, hide_index=True)\n        # 과집계 의심행은 위 상세에서 빼고 아래에 '별도 표기'\n        if _ocn:\n            _ocsum = float(camp.loc[_oc, \"전환매출\"].sum())\n            st.caption(f\"⚠️ **과집계('장난질') 의심 {_ocn}건**(전환매출 {_ocsum/1e8:.1f}억)은 위 상세·효율 판단에서 \"\n                       \"제외했습니다 — 지출 대비 ROAS가 비현실적으로 높은 행으로 플랫폼 어트리뷰션 중복/집계 오류 추정. \"\n                       \"아래는 참고용 별도 표기입니다.\")\n            oc_df = (camp[_oc].sort_values(\"전환매출\", ascending=False)\n                     .rename(columns={\"account_name\": \"브랜드\", \"campaign_name\": \"캠페인\"}))\n            st.dataframe(fmt_df(oc_df[[\"브랜드\", \"캠페인\", \"지출\", \"전환매출\", \"ROAS\"]]),\n                         use_container_width=True, hide_index=True)\n\nst.divider()\n\n# ---------- Slack 전송용 글 ----------\nst.subheader(\"📨 Slack 전송용 리포트\")\nperiod = f\"{start} ~ {end}\"\nlines = [f\"*📊 퍼포먼스 액션 리포트* ({period} · {', '.join(sel_brands)})\", \"\"]\nlines.append(\"*✅ 잘 되고 있는 것*\")\nlines += [f\"• {p}\" for p in positives] or [\"• (없음)\"]\nlines.append(\"\")\nlines.append(\"*⚠️ 개선 필요*\")\nlines += [f\"• {p}\" for p in problems] or [\"• (없음)\"]\nlines.append(\"\")\nlines.append(\"*🎯 추천 액션*\")\nactions = []\nif any(\"저효율 광고\" in p for p in problems):\n    actions.append(\"저효율 캠페인 예산 축소 + 소재 A/B 테스트\")\nif any(\"저조 상품\" in p for p in problems):\n    actions.append(\"저조 상품 상세페이지/썸네일 개선, 노출 재배치\")\nif ins and ins[\"severity\"] in (\"High\", \"Medium\"):\n    actions.append(f\"{ins['target_url']} 상세페이지 UX 수정(첫 화면·CTA·dead click)\")\nif any(\"취소율\" in p for p in problems):\n    actions.append(\"취소 사유 분석(품절/배송/결제) 후 프로세스 개선\")\nif not actions:\n    actions.append(\"현 기조 유지 + 베스트셀러 예산 확대 검토\")\nlines += [f\"• {x}\" for x in actions]\nslack_text = \"\\n\".join(lines)\n\nmsg = st.text_area(\"내용(수정 가능)\", slack_text, height=320)\nb1, b2 = st.columns([1, 4])\nif b1.button(\"📨 Slack 전송\", type=\"primary\"):\n    res = designer.send_message(msg, title=\"퍼포먼스액션\")\n    (st.success if res[\"status\"] == \"sent\" else st.error)(f\"{res['channel']} — {res['detail']}\")\nb2.caption(\"Slack Webhook(.env DESIGNER_SLACK_WEBHOOK) 설정 시 전송, 없으면 reports/handoffs 에 저장. \"\n           \"위 글은 그대로 복사해 붙여넣어도 됩니다.\")\n", "dashboards/sales_report.py": "\"\"\"매출·고객 리포트 — 주문 단위(daily_orders) 기반.\n\n순매출·AOV·취소율·재구매·회원여부를 브랜드/기간으로 본다.\n\"\"\"\nfrom __future__ import annotations\n\nimport sys\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parent.parent\nsys.path.insert(0, str(ROOT))\n\nimport numpy as np  # noqa: E402\nimport pandas as pd  # noqa: E402\nimport plotly.express as px  # noqa: E402\nimport streamlit as st  # noqa: E402\n\nfrom analyzers import _common as C  # noqa: E402\n\ntry:\n    st.set_page_config(page_title=\"매출·고객 리포트\", layout=\"wide\")\nexcept Exception:\n    pass\nfrom dashboards._style import fmt_df, inject_css, page_intro, top_filter  # noqa: E402\ninject_css()\n\n\ndef won(x):\n    return f\"₩{x:,.0f}\"\n\n\n@st.cache_data(ttl=600)\ndef load():\n    return C.load_orders()\n\n\norders = load()\nst.title(\"🛒 매출·고객 리포트\")\npage_intro(\"실제 주문 데이터로 순매출·객단가(AOV)·취소율·재구매율·회원 비중을 봅니다. \"\n           \"취소 주문은 기본 제외(유효주문 기준).\")\n\nif orders.empty:\n    st.warning(\"주문 데이터가 없습니다. 개요의 ‘실시간 API 취합’ 또는 `python main.py` 실행.\")\n    st.stop()\n\norders[\"d\"] = orders[\"date\"].dt.date\norders[\"is_member\"] = orders[\"member_id\"].astype(str).str.strip().ne(\"\") & \\\n    orders[\"member_id\"].astype(str).str.lower().ne(\"nan\")\ndmin, dmax = orders[\"d\"].min(), orders[\"d\"].max()\n\n# 상단 필터 (브랜드/몰 통일 → 브랜드 하나로)\nstart, end, sel_brands = top_filter(sorted(orders[\"brand\"].dropna().unique()), dmin, dmax, key=\"sales\")\ninc_cancel = st.checkbox(\"취소 주문 포함\", value=False)\n\nm = (orders[\"d\"] >= start) & (orders[\"d\"] <= end) & orders[\"brand\"].isin(sel_brands)\ndf = orders[m].copy()\nvalid = df[df[\"is_cancel\"] == 0]\nbase = df if inc_cancel else valid\nif df.empty:\n    st.info(\"선택 조건에 데이터가 없습니다.\")\n    st.stop()\n\n# KPI\nnet_rev = valid[\"sales_amount\"].sum()\npaid = valid[valid[\"sales_amount\"] > 0]\naov = paid[\"sales_amount\"].mean() if len(paid) else 0\ncancel_rate = df[\"is_cancel\"].mean() * 100\nrepeat_rate = (valid[\"is_first\"] == 0).mean() * 100 if len(valid) else 0\nmember_share = valid[valid[\"is_member\"]][\"sales_amount\"].sum() / net_rev * 100 if net_rev else 0\n\nst.caption(f\"기간: **{start} ~ {end}**  ·  브랜드: {', '.join(sel_brands)}\")\nk = st.columns(6)\nk[0].metric(\"순매출\", won(net_rev))\nk[1].metric(\"주문수\", f\"{len(base):,.0f}\")\nk[2].metric(\"AOV(객단가)\", won(aov))\nk[3].metric(\"취소율\", f\"{cancel_rate:,.1f}%\")\nk[4].metric(\"재구매 주문비중\", f\"{repeat_rate:,.1f}%\")\nk[5].metric(\"회원 매출비중\", f\"{member_share:,.1f}%\")\nst.divider()\n\nc1, c2 = st.columns(2)\nwith c1:\n    st.subheader(\"일자별 순매출 / 주문수\")\n    daily = valid.groupby(\"d\").agg(매출=(\"sales_amount\", \"sum\"), 주문=(\"order_id\", \"size\")).reset_index()\n    fig = px.bar(daily, x=\"d\", y=\"매출\", labels={\"d\": \"\"})\n    fig.add_scatter(x=daily[\"d\"], y=daily[\"주문\"], name=\"주문수\", yaxis=\"y2\", mode=\"lines+markers\")\n    fig.update_layout(height=330, yaxis2=dict(overlaying=\"y\", side=\"right\", showgrid=False, title=\"주문수\"),\n                      margin=dict(t=10), legend=dict(orientation=\"h\", y=1.1))\n    st.plotly_chart(fig, use_container_width=True)\nwith c2:\n    st.subheader(\"신규 vs 재구매 매출\")\n    seg = valid.copy()\n    seg[\"구분\"] = np.where(seg[\"is_first\"] == 1, \"신규\", \"재구매\")\n    sd = seg.groupby([\"d\", \"구분\"], as_index=False)[\"sales_amount\"].sum()\n    fig2 = px.area(sd, x=\"d\", y=\"sales_amount\", color=\"구분\",\n                   color_discrete_map={\"신규\": \"#4C9BE8\", \"재구매\": \"#F2A65A\"},\n                   labels={\"d\": \"\", \"sales_amount\": \"매출\"})\n    fig2.update_layout(height=330, margin=dict(t=10), legend=dict(orientation=\"h\", y=1.1))\n    st.plotly_chart(fig2, use_container_width=True)\n\nst.subheader(\"회원 vs 비회원\")\nmem = valid.copy()\nmem[\"고객\"] = np.where(mem[\"is_member\"], \"회원\", \"비회원\")\nmg = mem.groupby(\"고객\", as_index=False).agg(매출=(\"sales_amount\", \"sum\"), 주문=(\"order_id\", \"size\"))\ncc1, cc2 = st.columns([1, 2])\nfig3 = px.pie(mg, names=\"고객\", values=\"매출\", hole=0.55,\n              color_discrete_sequence=[\"#5B8FF9\", \"#CDD7E2\"])\nfig3.update_layout(height=280, margin=dict(t=10))\ncc1.plotly_chart(fig3, use_container_width=True)\ncc2.dataframe(fmt_df(mg), use_container_width=True, hide_index=True)\n\n# 브랜드별 종합\nst.subheader(\"브랜드별 종합 (기간 누적)\")\ndef brand_row(g):\n    v = g[g[\"is_cancel\"] == 0]\n    pd_ = v[v[\"sales_amount\"] > 0]\n    return pd.Series({\n        \"순매출\": v[\"sales_amount\"].sum(), \"주문수\": len(v),\n        \"AOV\": round(pd_[\"sales_amount\"].mean(), 0) if len(pd_) else 0,\n        \"취소율%\": round(g[\"is_cancel\"].mean() * 100, 1),\n        \"재구매%\": round((v[\"is_first\"] == 0).mean() * 100, 1) if len(v) else 0,\n        \"회원매출%\": round(v[v[\"is_member\"]][\"sales_amount\"].sum() / v[\"sales_amount\"].sum() * 100, 1)\n        if v[\"sales_amount\"].sum() else 0})\n\nbt = df.groupby(\"brand\").apply(brand_row, include_groups=False).reset_index()\nbt = bt.rename(columns={\"brand\": \"브랜드\"}).sort_values(\"순매출\", ascending=False)\nst.dataframe(fmt_df(bt), use_container_width=True, hide_index=True)\nst.caption(\"※ 순매출/AOV/재구매는 취소 제외(유효주문) 기준. 브랜드=몰(카페24) 1:1 매핑으로 통일했습니다.\")\n", "dashboards/ux_funnel_page.py": "\"\"\"UX·퍼널 분석 — GA4 + Clarity 로 유입·이탈·전환의 병목을 찾는다.\n\n데이터 주의사항 (2026-07-15 실측 확인):\n  - 유입·이탈의 기준 테이블은 **ga4_traffic** 이다. ga4_landing 은 수집기에\n    페이지네이션이 없어 GA4 기본 10,000행 상한에 잘려 세션이 2배 가까이 누락됐다\n    (07-10 림데이: landing 18,869 vs traffic 41,831). 수집기는 고쳤지만 기준은\n    채널 정보까지 있는 ga4_traffic 으로 통일한다.\n  - 구매 단계는 GA4 가 아니라 daily_orders 를 쓴다. GA4 order_result 태깅이 깨져서\n    실주문의 1% 미만(림데이 209/30,000)만 잡힌다.\n  - GA4 conversions/purchase_value 도 실주문과 크게 다르다 → '참고용'으로만 표기.\n    단 채널별로는 실주문을 쪼갤 수 없어(주문에 채널 정보 없음) 이것뿐이다.\n  - clarity_pages 에 데모 오염 행이 있다(project_id 가 한글). 실데이터는\n    lymday/antical/neurofocus 뿐이라 CLARITY_BRAND 로 화이트리스트 필터한다.\n  - clarity exit_rate 는 진짜 이탈률이 아니라 QuickbackClick proxy → '퀵백'으로 표기.\n  - 에이징핏은 안티칼 property/도메인에 섞여 있어 분리 불가 → '안티칼'에 합산됨.\n  - Clarity 는 API 상 최근 1~3일치만 주므로 06-19 부터만 존재(백필 불가).\n\"\"\"\n\nfrom __future__ import annotations\n\nimport sys\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parent.parent\nsys.path.insert(0, str(ROOT))\n\nimport pandas as pd  # noqa: E402\nimport plotly.express as px  # noqa: E402\nimport plotly.graph_objects as go  # noqa: E402\nimport streamlit as st  # noqa: E402\n\nfrom analyzers import _common as C  # noqa: E402\n\ntry:\n    st.set_page_config(page_title=\"UX·퍼널 분석\", layout=\"wide\")\nexcept Exception:\n    pass\n\nfrom dashboards._style import brand_pills, fmt_df, inject_css, page_intro  # noqa: E402\n\ninject_css()\n\n# ── 매핑 ──────────────────────────────────────────────────────────────\nGA4_BRAND = {\"540260993\": \"림데이\", \"540355094\": \"안티칼\", \"541286892\": \"뉴로포커스\"}\nCLARITY_BRAND = {\"lymday\": \"림데이\", \"antical\": \"안티칼\", \"neurofocus\": \"뉴로포커스\"}\n\nDETAIL_PAT = r\"/surl/|product/detail\"\nCART_PAT = r\"basket\"\nCHECKOUT_PAT = r\"orderform\"\n\nBLUE, GREEN, YELLOW, RED = \"#5B8FF9\", \"#5AD8A6\", \"#F6BD16\", \"#E8684A\"\n\nst.title(\"🧭 UX·퍼널 분석\")\npage_intro(\"GA4 유입 채널·이탈과 Clarity 마찰 지표로 매출 퍼널의 병목을 찾습니다. \"\n           \"구매는 GA4 태깅이 부정확해 실주문(daily_orders)으로 집계합니다.\")\n\n\n# ── 로드 ──────────────────────────────────────────────────────────────\n@st.cache_data(ttl=600)\ndef load():\n    land = C.load_ga4()          # 총량·이탈 기준 (차원 2개 = 카디널리티 손실 최소)\n    traf = C.load_ga4_traffic()  # 채널 분석 전용 (차원 4개)\n    pages = C.load_ga4_pages()\n    orders = C.load_orders()\n    clar = C.load_clarity()\n\n    for d in (land, traf, pages):\n        if not d.empty:\n            d[\"브랜드\"] = d[\"property_id\"].astype(str).map(GA4_BRAND)\n    if not land.empty:\n        land = land[land[\"브랜드\"].notna()]\n    if not traf.empty:\n        traf = traf[traf[\"브랜드\"].notna()]\n    if not pages.empty:\n        pages = pages[pages[\"브랜드\"].notna()]\n\n    if not clar.empty:\n        clar = clar[clar[\"project_id\"].isin(CLARITY_BRAND)].copy()  # 데모 오염 제거\n        clar[\"브랜드\"] = clar[\"project_id\"].map(CLARITY_BRAND)\n\n    if not orders.empty:\n        if \"is_cancel\" in orders.columns:\n            orders = orders[orders[\"is_cancel\"].fillna(0).astype(int) == 0]\n        orders = orders.rename(columns={\"brand\": \"브랜드\"})\n\n    return land, traf, pages, orders, clar\n\n\nland, traf, pages, orders, clar = load()\n\nif land.empty:\n    st.warning(\"GA4 데이터가 없습니다. collectors/ga4.py 수집을 먼저 실행하세요.\")\n    st.stop()\n\n# ── 필터 ──────────────────────────────────────────────────────────────\n_d = land[\"date\"].dt.date\ndmin, dmax = _d.min(), _d.max()\nbrand_pool = sorted(set(land[\"브랜드\"].dropna()) & set(GA4_BRAND.values()))\n\nfc = st.columns([2.4, 0.2, 5.4])\nwith fc[0]:\n    rng = st.date_input(\"기간\", value=(max(dmin, dmax - pd.Timedelta(days=13).to_pytimedelta()), dmax),\n                        min_value=dmin, max_value=dmax, key=\"uxf_date\")\n    start, end = rng if isinstance(rng, tuple) and len(rng) == 2 else (dmin, dmax)\nwith fc[2]:\n    sel = brand_pills(brand_pool, key=\"uxf_brand\")\n\nsel = sel or brand_pool\nst.caption(f\"분석 기간: {start} ~ {end} · 브랜드 {len(sel)}개 \"\n           f\"· GA4 {dmin}~{dmax} · Clarity는 06-19부터만 존재\")\nst.divider()\n\n\ndef _clip(df: pd.DataFrame) -> pd.DataFrame:\n    if df.empty:\n        return df\n    d = df.copy()\n    d[\"d\"] = d[\"date\"].dt.date\n    d = d[(d[\"d\"] >= start) & (d[\"d\"] <= end)]\n    return d[d[\"브랜드\"].isin(sel)]\n\n\nfl, ft, fp, fo, fc_ = _clip(land), _clip(traf), _clip(pages), _clip(orders), _clip(clar)\n\nif fl.empty:\n    st.info(\"선택 조건에 데이터가 없습니다.\")\n    st.stop()\n\n\ndef _split_unattr(df: pd.DataFrame):\n    \"\"\"GA4 (not set) 랜딩 분리 — landing_page 가 비고 이탈률 100% 로 박히는 행.\n    진짜 세션이라 유입 총량엔 남기되, 이탈률·랜딩 랭킹에선 반드시 제외한다.\"\"\"\n    lp = df[\"landing_page\"].fillna(\"\").astype(str).str.strip()\n    bad = lp.eq(\"\") | lp.str.lower().isin([\"(not set)\", \"(none)\"])\n    return df[~bad], int(df[bad][\"sessions\"].sum())\n\n\nfl_named, unattr_sess = _split_unattr(fl)   # 총량·이탈 기준 = ga4_landing\nft_named, _ = _split_unattr(ft)             # 채널 분석 기준 = ga4_traffic\n\n\ndef wavg(df: pd.DataFrame, col: str, w: str = \"sessions\") -> float:\n    s = df[w].sum()\n    return (df[col] * df[w]).sum() / s if s else 0.0\n\n\ndef agg_w(df: pd.DataFrame, keys: list[str], sums: list[str],\n          weighted: dict[str, str], w: str = \"sessions\") -> pd.DataFrame:\n    \"\"\"키별 합계 + 가중평균을 벡터화로 계산한다.\n\n    groupby().apply(lambda g: pd.Series({...})) 는 그룹이 수만 개면 수 분씩 걸린다\n    (ga4_landing 이 백필 후 90만 행이 되면서 페이지가 3분 타임아웃 났다).\n    가중평균은 (값*가중치)를 미리 곱해 sum 으로 접은 뒤 나누면 같은 결과가 훨씬 빠르다.\n\n    weighted: {출력컬럼명: 원본컬럼명}\n    \"\"\"\n    d = df.copy()\n    tmp = {}\n    for out, src in weighted.items():\n        t = f\"__w_{out}\"\n        d[t] = d[src] * d[w]\n        tmp[out] = t\n\n    spec = {s: (s, \"sum\") for s in sums}\n    spec.update({t: (t, \"sum\") for t in tmp.values()})\n    if w not in spec:\n        spec[w] = (w, \"sum\")\n\n    g = d.groupby(keys, as_index=False, observed=True).agg(**spec)\n    for out, t in tmp.items():\n        g[out] = (g[t] / g[w]).where(g[w] > 0, 0.0)\n        g = g.drop(columns=[t])\n    return g\n\n\n# ── 퍼널 집계 ─────────────────────────────────────────────────────────\ndef stage_sessions(df: pd.DataFrame, pat: str) -> int:\n    if df.empty:\n        return 0\n    return int(df[df[\"page_path\"].str.contains(pat, case=False, na=False)][\"sessions\"].sum())\n\n\nentry = int(fl[\"sessions\"].sum())\ndetail = stage_sessions(fp, DETAIL_PAT)\ncart = stage_sessions(fp, CART_PAT)\ncheckout = stage_sessions(fp, CHECKOUT_PAT)\npurchase = int(len(fo))\n\nsteps = [(\"유입 세션\", entry), (\"상세 조회\", detail), (\"장바구니\", cart),\n         (\"결제 시작\", checkout), (\"구매(실주문)\", purchase)]\n\n# ── KPI ──────────────────────────────────────────────────────────────\ncvr = purchase / entry * 100 if entry else 0\nbounce = wavg(fl_named, \"bounce_rate\")\nrevenue = float(fo[\"sales_amount\"].sum()) if not fo.empty and \"sales_amount\" in fo.columns else 0\n\nk = st.columns(5)\nk[0].metric(\"유입 세션\", f\"{entry:,}\")\nk[1].metric(\"구매(실주문)\", f\"{purchase:,}\")\nk[2].metric(\"전환율\", f\"{cvr:.2f}%\")\nk[3].metric(\"평균 이탈률\", f\"{bounce:.1f}%\",\n            help=\"랜딩페이지가 측정된 세션 기준 가중평균. GA4 (not set) 세션은 제외.\")\nk[4].metric(\"매출\", f\"₩{revenue:,.0f}\")\n\nif unattr_sess:\n    st.caption(f\"⚠️ 랜딩페이지 미측정(GA4 not set) 세션 {unattr_sess:,} \"\n               f\"({unattr_sess / entry * 100:.1f}%) — 이탈률·랜딩 분석에서 제외했습니다. \"\n               f\"이 행은 이탈률이 100%로 박혀 있어 포함하면 평균이 크게 왜곡됩니다.\")\n\nst.divider()\n\n# ── 1) 퍼널 ───────────────────────────────────────────────────────────\nst.subheader(\"퍼널 단계별 드랍\")\n\nc1, c2 = st.columns([1.1, 1])\nwith c1:\n    fig = go.Figure(go.Funnel(\n        y=[s[0] for s in steps], x=[s[1] for s in steps],\n        textinfo=\"value+percent initial\",\n        marker=dict(color=[BLUE, \"#7DA6F7\", GREEN, YELLOW, RED]),\n    ))\n    fig.update_layout(height=380, margin=dict(l=10, r=10, t=10, b=10))\n    st.plotly_chart(fig, use_container_width=True)\n\nwith c2:\n    rows = []\n    for i, (name, v) in enumerate(steps):\n        prev = steps[i - 1][1] if i else None\n        rows.append({\n            \"단계\": name, \"세션\": v,\n            \"직전 대비 전환율%\": (v / prev * 100) if prev else None,\n            \"드랍수\": (prev - v) if prev else None,\n            \"유입 대비%\": (v / entry * 100) if entry else None,\n        })\n    fdf = pd.DataFrame(rows)\n    st.dataframe(fmt_df(fdf), use_container_width=True, hide_index=True)\n\n    drops = fdf.dropna(subset=[\"직전 대비 전환율%\"])\n    if not drops.empty:\n        worst = drops.loc[drops[\"직전 대비 전환율%\"].idxmin()]\n        st.info(f\"📌 **최대 병목** · `{worst['단계']}` 단계에서 직전 대비 \"\n                f\"**{worst['직전 대비 전환율%']:.1f}%** 만 넘어옵니다 \"\n                f\"(드랍 {int(worst['드랍수']):,}세션).\")\n\nst.caption(\"※ 단계별 '세션'은 해당 페이지를 본 세션 수이며 순차 중첩이 아닙니다. \"\n           \"장바구니를 거치지 않은 바로구매·외부결제(네이버페이 등)는 단계에서 누락될 수 있습니다.\")\nst.divider()\n\n# ── 2) 유입 채널 ──────────────────────────────────────────────────────\nst.subheader(\"유입 채널 · 어디서 오고 어디서 튕기나\")\n\n_W = {\"이탈률%\": \"bounce_rate\", \"체류초\": \"avg_engagement_time\"}\n\ncg = (agg_w(ft_named, [\"channel_group\"], [\"conversions\"], _W)\n      .rename(columns={\"channel_group\": \"채널그룹\", \"sessions\": \"세션\", \"conversions\": \"GA4전환\"}))\ncg[\"유입 비중%\"] = cg[\"세션\"] / cg[\"세션\"].sum() * 100\ncg = cg[[\"채널그룹\", \"세션\", \"유입 비중%\", \"이탈률%\", \"체류초\", \"GA4전환\"]].sort_values(\"세션\", ascending=False)\n\nsm = (agg_w(ft_named, [\"source_medium\"], [\"conversions\"], _W)\n      .rename(columns={\"source_medium\": \"소스/매체\", \"sessions\": \"세션\", \"conversions\": \"GA4전환\"}))\nsm = sm[[\"소스/매체\", \"세션\", \"이탈률%\", \"체류초\", \"GA4전환\"]]\nsm = sm[sm[\"세션\"] >= 50].sort_values(\"세션\", ascending=False)\n\ncc = st.columns([1, 1])\nwith cc[0]:\n    st.markdown(\"**채널그룹별**\")\n    st.dataframe(fmt_df(cg), use_container_width=True, hide_index=True, height=300)\nwith cc[1]:\n    st.markdown(\"**소스/매체별** (세션 50 이상)\")\n    st.dataframe(fmt_df(sm.head(15)), use_container_width=True, hide_index=True, height=300)\n\nif not sm.empty:\n    med_b = wavg(ft_named, \"bounce_rate\")\n    top = sm.head(18)\n    fig4 = px.scatter(top, x=\"세션\", y=\"이탈률%\", size=\"세션\", color=\"이탈률%\",\n                      hover_name=\"소스/매체\", size_max=48,\n                      color_continuous_scale=[[0, GREEN], [0.5, YELLOW], [1, RED]])\n    fig4.add_hline(y=med_b, line_dash=\"dot\", line_color=\"#98A2B3\",\n                   annotation_text=f\"전체 평균 이탈률 {med_b:.1f}%\")\n    fig4.update_layout(height=360, margin=dict(l=10, r=10, t=10, b=10))\n    st.plotly_chart(fig4, use_container_width=True)\n\n    # 유입은 많은데 이탈이 평균 초과 = 돈이 새는 채널\n    leak = sm[(sm[\"세션\"] >= sm[\"세션\"].median()) & (sm[\"이탈률%\"] > med_b)].sort_values(\"세션\", ascending=False)\n    if not leak.empty:\n        w = leak.iloc[0]\n        lost = int(w[\"세션\"] * (w[\"이탈률%\"] - med_b) / 100)\n        st.info(f\"📌 **유입 병목** · `{w['소스/매체']}` — 세션 {int(w['세션']):,}로 유입 상위인데 \"\n                f\"이탈률 **{w['이탈률%']:.1f}%** (평균 {med_b:.1f}% 초과). \"\n                f\"평균만 맞춰도 약 **{lost:,}세션**을 더 붙잡습니다. 해당 채널 {len(leak)}개.\")\n\nst.caption(\"※ GA4전환은 실주문과 다릅니다(태깅 이슈). 주문에는 채널 정보가 없어 \"\n           \"채널별 실주문 분해는 불가능합니다 — 채널 간 상대 비교용으로만 보세요. \"\n           \"또한 채널 테이블의 세션 합은 상단 '유입 세션'보다 25% 가량 적습니다: \"\n           \"채널까지 쪼개면 GA4가 카디널리티 한계로 일부를 (other)로 묶기 때문입니다. \"\n           \"총량은 상단 KPI, 채널 간 비교는 이 표를 보세요.\")\nst.divider()\n\n# ── 3) 채널 × 랜딩 병목 ───────────────────────────────────────────────\nst.subheader(\"채널 × 랜딩페이지 병목\")\nst.caption(\"어느 채널이 어느 페이지로 보내서 튕기는지 — 소재·링크를 바꿔야 할 조합입니다.\")\n\ncl_pair = (agg_w(ft_named, [\"브랜드\", \"source_medium\", \"landing_page\"], [], _W)\n           .rename(columns={\"sessions\": \"세션\"}))\ncl_pair = cl_pair[cl_pair[\"세션\"] >= 100].copy()\n\nif cl_pair.empty:\n    st.info(\"세션 100 이상인 채널×랜딩 조합이 없습니다.\")\nelse:\n    _mb = wavg(ft_named, \"bounce_rate\")\n    cl_pair[\"이탈 초과%p\"] = (cl_pair[\"이탈률%\"] - _mb).round(1)\n    cl_pair[\"낭비 세션\"] = (cl_pair[\"세션\"] * cl_pair[\"이탈 초과%p\"].clip(lower=0) / 100).round(0).astype(int)\n    worst = cl_pair.sort_values(\"낭비 세션\", ascending=False).head(15)\n    st.dataframe(\n        fmt_df(worst.rename(columns={\"source_medium\": \"소스/매체\", \"landing_page\": \"랜딩페이지\"})),\n        use_container_width=True, hide_index=True)\n    if worst[\"낭비 세션\"].iloc[0] > 0:\n        w = worst.iloc[0]\n        st.info(f\"📌 **개선 1순위 조합** · `{w['source_medium']}` → `{w['landing_page']}` — \"\n                f\"세션 {int(w['세션']):,}, 이탈률 {w['이탈률%']:.1f}% \"\n                f\"(평균 대비 +{w['이탈 초과%p']:.1f}%p) → 약 **{int(w['낭비 세션']):,}세션 낭비**.\")\n    st.caption(\"※ '낭비 세션' = 세션 × (이탈률 − 전체 평균 이탈률). 평균만큼만 해도 건질 수 있었던 양.\")\n\nst.divider()\n\n# ── 4) 추이 ───────────────────────────────────────────────────────────\nst.subheader(\"유입·전환율 추이\")\n\ndaily_e = fl.groupby(\"d\", as_index=False)[\"sessions\"].sum().rename(columns={\"sessions\": \"유입\"})\ndaily_o = (fo.groupby(\"d\", as_index=False).size().rename(columns={\"size\": \"구매\"})\n           if not fo.empty else pd.DataFrame(columns=[\"d\", \"구매\"]))\ntr = daily_e.merge(daily_o, on=\"d\", how=\"left\").fillna({\"구매\": 0})\ntr[\"전환율%\"] = tr.apply(lambda r: r[\"구매\"] / r[\"유입\"] * 100 if r[\"유입\"] else 0, axis=1)\n\nfig2 = go.Figure()\nfig2.add_bar(x=tr[\"d\"], y=tr[\"유입\"], name=\"유입 세션\", marker_color=BLUE)\nfig2.add_trace(go.Scatter(x=tr[\"d\"], y=tr[\"전환율%\"], name=\"전환율%\", yaxis=\"y2\",\n                          mode=\"lines+markers\", line=dict(color=RED, width=2)))\nfig2.update_layout(height=330, margin=dict(l=10, r=10, t=10, b=10),\n                   yaxis=dict(title=\"유입 세션\"),\n                   yaxis2=dict(title=\"전환율%\", overlaying=\"y\", side=\"right\"),\n                   legend=dict(orientation=\"h\", y=1.1))\nst.plotly_chart(fig2, use_container_width=True)\nst.divider()\n\n# ── 5) 이탈 병목 (랜딩페이지) ─────────────────────────────────────────\nst.subheader(\"이탈 병목 · 랜딩페이지\")\nst.caption(\"세션이 많은데 이탈률이 높은 페이지 = 우선 개선 대상. 버블 크기는 세션 수입니다.\")\n\nlp = (agg_w(fl_named, [\"브랜드\", \"landing_page\"], [], _W)\n      .rename(columns={\"sessions\": \"세션\"}))\nlp = lp[lp[\"세션\"] >= 30].sort_values(\"세션\", ascending=False)\n\nif lp.empty:\n    st.info(\"세션 30 이상인 랜딩페이지가 없습니다.\")\nelse:\n    med_b = lp[\"이탈률%\"].median()\n    fig3 = px.scatter(lp.head(40), x=\"세션\", y=\"이탈률%\", size=\"세션\", color=\"브랜드\",\n                      hover_name=\"landing_page\", size_max=45,\n                      color_discrete_sequence=[BLUE, GREEN, YELLOW])\n    fig3.add_hline(y=med_b, line_dash=\"dot\", line_color=\"#98A2B3\",\n                   annotation_text=f\"이탈률 중앙값 {med_b:.1f}%\")\n    fig3.update_layout(height=380, margin=dict(l=10, r=10, t=10, b=10))\n    st.plotly_chart(fig3, use_container_width=True)\n    st.dataframe(fmt_df(lp.head(20).rename(columns={\"landing_page\": \"랜딩페이지\"})),\n                 use_container_width=True, hide_index=True)\n\nst.divider()\n\n# ── 6) Clarity 마찰 ───────────────────────────────────────────────────\nst.subheader(\"사용성 마찰 · Clarity\")\n\nif fc_.empty:\n    st.info(\"선택 기간에 Clarity 데이터가 없습니다. Clarity는 06-19부터만 존재하며 \"\n            \"API 특성상 과거 백필이 불가합니다.\")\nelse:\n    cl = (agg_w(fc_, [\"브랜드\", \"url\"],\n                [\"rage_clicks\", \"dead_clicks\", \"quick_backs\"],\n                {\"스크롤%\": \"avg_scroll_depth\", \"체류초\": \"avg_session_duration\"}, w=\"visits\")\n          .rename(columns={\"visits\": \"방문\", \"rage_clicks\": \"분노클릭\",\n                           \"dead_clicks\": \"죽은클릭\", \"quick_backs\": \"퀵백\"}))\n    cl = cl[cl[\"방문\"] >= 20].copy()\n    if cl.empty:\n        st.info(\"방문 20 이상인 URL이 없습니다.\")\n    else:\n        cl[\"마찰지수%\"] = ((cl[\"분노클릭\"] + cl[\"죽은클릭\"] + cl[\"퀵백\"]) / cl[\"방문\"] * 100).round(2)\n        cl = cl.sort_values(\"마찰지수%\", ascending=False)\n\n        m = st.columns(4)\n        m[0].metric(\"Clarity 방문\", f\"{int(cl['방문'].sum()):,}\")\n        m[1].metric(\"평균 스크롤\", f\"{wavg(cl, '스크롤%', '방문'):.1f}%\")\n        m[2].metric(\"분노클릭\", f\"{int(cl['분노클릭'].sum()):,}\")\n        m[3].metric(\"죽은클릭\", f\"{int(cl['죽은클릭'].sum()):,}\")\n\n        st.dataframe(fmt_df(cl.head(20).rename(columns={\"url\": \"URL\"})),\n                     use_container_width=True, hide_index=True)\n\n        w = cl.iloc[0]\n        st.info(f\"📌 **마찰 최다** · `{w['url']}` — 방문 {int(w['방문']):,} 중 \"\n                f\"분노 {int(w['분노클릭'])}·죽은클릭 {int(w['죽은클릭'])}·퀵백 {int(w['퀵백'])} \"\n                f\"(마찰지수 {w['마찰지수%']:.1f}%). 스크롤 {w['스크롤%']:.1f}%.\")\n\n    st.caption(\"※ 마찰지수 = (분노클릭+죽은클릭+퀵백) ÷ 방문. \"\n               \"Clarity의 exit_rate는 실제 이탈률이 아닌 퀵백 proxy라 이 페이지에서는 쓰지 않습니다.\")\n\nst.divider()\n\n# ── 7) 브랜드별 요약 ──────────────────────────────────────────────────\nst.subheader(\"브랜드별 퍼널 요약\")\n\nrows = []\nfor b in sel:\n    bt, bp = fl[fl[\"브랜드\"] == b], fp[fp[\"브랜드\"] == b]\n    btn = fl_named[fl_named[\"브랜드\"] == b]\n    bo = fo[fo[\"브랜드\"] == b] if not fo.empty else fo\n    e = int(bt[\"sessions\"].sum())\n    rows.append({\n        \"브랜드\": b, \"유입\": e,\n        \"상세\": stage_sessions(bp, DETAIL_PAT),\n        \"장바구니\": stage_sessions(bp, CART_PAT),\n        \"결제시작\": stage_sessions(bp, CHECKOUT_PAT),\n        \"구매\": len(bo),\n        \"전환율%\": (len(bo) / e * 100) if e else 0,\n        \"이탈률%\": wavg(btn, \"bounce_rate\"),\n    })\nbdf = pd.DataFrame(rows).sort_values(\"유입\", ascending=False)\nst.dataframe(fmt_df(bdf), use_container_width=True, hide_index=True)\n\nwith st.expander(\"데이터 한계 및 주의사항\"):\n    st.markdown(\"\"\"\n- **테이블 두 개를 용도별로 씁니다** — 총량·이탈은 `ga4_landing`(차원 2개), 채널 분석은 `ga4_traffic`(차원 4개). GA4는 차원을 늘릴수록 카디널리티 한계로 일부를 `(other)`로 묶어 총량이 줄기 때문에(traffic이 landing의 약 73%), 총량은 차원이 적은 쪽이 정확합니다.\n- **2026-07-15 수집기 버그 수정** — `collect()`/`collect_pages()` 에 `limit`이 없어 GA4 기본 10,000행에서 조용히 잘렸습니다(07-10 림데이 랜딩: 저장 468행/18,869세션 → 실제 15,557행/54,206세션). 페이지네이션을 넣고 06-04~07-14 전 구간을 백필했습니다. 이 때문에 이전에 보던 세션·전환율 수치는 전부 틀렸습니다.\n- **매일 수집이 과거를 안 채웁니다** — GA4는 데이터 확정에 1~2일 걸리는데 수집이 당일/익일 한 번만 돌고 재수집을 안 해, 백필 전까지 과거 날짜가 부실한 채로 굳어 있었습니다. 일일 수집 창을 최근 3일로 넓히는 것을 권합니다.\n- **구매 단계는 실주문(daily_orders)** — GA4 `order_result` 태깅이 실주문의 1% 미만만 잡아 퍼널 마지막을 GA4로 닫을 수 없습니다.\n- **채널별 실주문 분해 불가** — 주문 데이터에 채널 정보가 없어, 채널별 전환은 GA4 conversions(실주문과 다름)로만 볼 수 있습니다. 채널 간 상대 비교용입니다.\n- **에이징핏은 분리 불가** — GA4 property·Clarity 프로젝트·도메인이 안티칼알파와 같아 '안티칼'에 합산됩니다.\n- **Clarity는 06-19부터** — API가 최근 1~3일치만 제공해 과거 백필이 원천적으로 불가합니다. 주말 결측이 잦습니다.\n- **Clarity 데모 오염 행 제외** — `project_id` 가 한글인 행(가짜)은 자동 필터합니다.\n- **GA4 (not set) 세션 제외** — 랜딩이 빈 값이고 이탈률 100%로 박힌 행은 유입 총량엔 남기되 이탈률·랜딩 랭킹에서 제외합니다.\n- **단계 세션은 중첩이 아닙니다** — 각 단계는 해당 페이지를 본 세션 수라 순차 퍼널이 아니며, 외부결제(네이버페이) 이탈은 잡히지 않습니다.\n- **랜딩 URL의 추적 파라미터 제거** — `ga4_traffic` 은 utm/cafe_mkt 등을 떼서 저장합니다(채널은 별도 컬럼에 있으므로 중복). `product_no` 같은 기능 파라미터는 보존합니다.\n\"\"\")\n", "dashboards/weekly_compare.py": "\"\"\"주차별 비교 — 브랜드 × 플랫폼(월~일) 광고 성과 주간 비교.\n\n메타·구글·틱톡 광고를 월~일 주 단위로 묶어 비교한다.\n- 2주 선택(기본): 브랜드×플랫폼 한 행에 두 주를 나란히(지출·ROAS·CPA 직전→최근 + Δ). ← 가독성 최적\n- 1주 또는 3주+: 주별 행 목록(▼악화/🟢개선 마크).\n\n통합 대시보드(Home.py) '매출·고객' 메뉴, '7일치 동향' 아래 페이지.\n독립 실행:  streamlit run dashboards/weekly_compare.py\n\"\"\"\nfrom __future__ import annotations\n\nimport sys\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parent.parent\nsys.path.insert(0, str(ROOT))\n\nimport numpy as np  # noqa: E402\nimport pandas as pd  # noqa: E402\nimport streamlit as st  # noqa: E402\n\nfrom analyzers import _common as C  # noqa: E402\n\ntry:\n    st.set_page_config(page_title=\"주차별 비교\", layout=\"wide\")\nexcept Exception:  # noqa: BLE001\n    pass\nfrom dashboards._style import brand_pills, inject_css, page_intro  # noqa: E402\ninject_css()\n\nPLAT_NAME = {\"meta\": \"Meta\", \"google\": \"Google Ads\", \"tiktok\": \"TikTok\",\n             \"naver\": \"Naver 검색\", \"naver_gfa\": \"Naver GFA\"}\nBRAND_EMO = {\"림데이\": \"🟦\", \"안티칼알파\": \"🟨\", \"에이징핏\": \"🟥\",\n             \"뉴로포커스\": \"🟩\", \"씨코랩\": \"🟪\"}\nWEEKLY_PLATFORMS = [\"meta\", \"google\", \"tiktok\"]\n\n\n@st.cache_data(ttl=600)\ndef _load_ads() -> pd.DataFrame:\n    return C.add_ad_brand(C.load_ads())\n\n\nads = _load_ads()\nst.title(\"📅 주차별 비교 — 브랜드 × 플랫폼 (월~일)\")\npage_intro(\"메타·구글·틱톡 광고를 월~일 주 단위로 비교합니다. 기본은 **최근 2주(전전주·전주)** 나란히 비교이며, \"\n           \"주차 선택에서 원하는 주들을 고를 수 있습니다.\")\n\nif ads.empty:\n    st.warning(\"광고 데이터가 없습니다. (data.db daily_ads 확인)\")\n    st.stop()\n\nads[\"date\"] = pd.to_datetime(ads[\"date\"])\nads = ads[ads[\"brand\"].notna()]\n\n# 필터 (통합 대시보드 스타일 pill)\nEXCLUDE_BRANDS = {\"씨코랩\", \"뉴로포커스\"}\npresent_brands = [b for b in C.AD_BRANDS if b in set(ads[\"brand\"]) and b not in EXCLUDE_BRANDS]\npresent_plats = [p for p in WEEKLY_PLATFORMS if p in set(ads[\"platform\"])]\nsel_brand = brand_pills(present_brands, key=\"wc_brand\", label=\"브랜드\")\nsel_plat = brand_pills(present_plats, key=\"wc_plat\", label=\"플랫폼\",\n                       format_func=lambda p: PLAT_NAME.get(p, p))\n\nbase = ads[ads[\"brand\"].isin(sel_brand) & ads[\"platform\"].isin(sel_plat)].copy()\n\n# ===== 주 단위(월~일) 집계 =====\nw = base[base[\"platform\"].isin(WEEKLY_PLATFORMS)].copy()\nw[\"mon\"] = w[\"date\"] - pd.to_timedelta(w[\"date\"].dt.weekday, unit=\"D\")\ng = w.groupby([\"brand\", \"platform\", \"mon\"], as_index=False).agg(\n    지출=(\"cost\", \"sum\"), imp=(\"impressions\", \"sum\"), clk=(\"clicks\", \"sum\"),\n    구매=(\"conversions\", \"sum\"), cv=(\"conv_value\", \"sum\"))\ng = g[g[\"지출\"] > 0]\n\nif g.empty:\n    st.info(\"선택한 브랜드·플랫폼에 지출 데이터가 없습니다.\")\n    st.stop()\n\ng[\"ROAS\"] = np.where(g[\"지출\"] > 0, g[\"cv\"] / g[\"지출\"] * 100, 0)\ng[\"CTR\"] = np.where(g[\"imp\"] > 0, g[\"clk\"] / g[\"imp\"] * 100, 0)\ng[\"CPM\"] = np.where(g[\"imp\"] > 0, g[\"지출\"] / g[\"imp\"] * 1000, 0)\ng[\"CPA\"] = np.where(g[\"구매\"] > 0, g[\"지출\"] / g[\"구매\"], 0)\n\n\ndef _wk_label(m):\n    return f\"{m.month}/{m.day}~{(m + pd.Timedelta(days=6)).month}/{(m + pd.Timedelta(days=6)).day}\"\n\n\n# 주차 선택 (최근 주가 위로). 기본 = 최근 2주(전전주·전주).\nweeks_desc = sorted(g[\"mon\"].unique(), reverse=True)\nlabel_by_mon = {m: _wk_label(pd.Timestamp(m)) for m in weeks_desc}\nopts = [label_by_mon[m] for m in weeks_desc]\ndefault_weeks = opts[:2]\npicked = st.multiselect(\"주차 선택 (월~일) — 2주 고르면 나란히 비교, 그 외엔 주별 목록\", opts,\n                        default=default_weeks, key=\"wc_weeks\",\n                        help=\"선택 안 하면 전체 주를 표시합니다.\")\npicked_lab = picked if picked else opts\n\n\ndef _delta(new, old, mode=\"up\"):\n    \"\"\"new/old 변화율(%) 문자열 + 마크. mode: up=클수록좋음 / down=작을수록좋음 / neutral=마크없음.\"\"\"\n    if old in (None, 0) or new is None:\n        return \"신규\" if new else \"—\"\n    ch = (new / old - 1) * 100\n    if mode == \"neutral\" or abs(ch) < 1:\n        return f\"{ch:+.0f}%\"\n    good = (ch > 0) if mode == \"up\" else (ch < 0)\n    return f\"{ch:+.0f}%{' 🟢' if good else ' ▼'}\"\n\n\nif len(picked_lab) == 2:\n    # ─────────── 2주 나란히 비교 뷰 (가독성) ───────────\n    two_mons = sorted([m for m in weeks_desc if label_by_mon[m] in set(picked_lab)])\n    mOld, mNew = two_mons[0], two_mons[-1]\n    wOld, wNew = label_by_mon[mOld], label_by_mon[mNew]\n    st.caption(f\"비교: 직전주 **{wOld}**  →  최근주 **{wNew}**  ·  Δ=최근주÷직전주−1 \"\n               \"(ROAS 🟢=개선/▼=악화, CPA는 낮을수록 🟢, 지출은 증감만)\")\n\n    def _val(b, p, m, col):\n        r = g[(g[\"brand\"] == b) & (g[\"platform\"] == p) & (g[\"mon\"] == m)]\n        return float(r[col].iloc[0]) if len(r) else None\n\n    def _fmt(x, suf=\"\"):\n        return \"—\" if x is None else f\"{x:,.0f}{suf}\"\n\n    rows = []\n    for b in [x for x in C.AD_BRANDS if x in sel_brand]:\n        for p in [x for x in WEEKLY_PLATFORMS if x in sel_plat]:\n            so, sn = _val(b, p, mOld, \"지출\"), _val(b, p, mNew, \"지출\")\n            if not so and not sn:\n                continue\n            ro, rn = _val(b, p, mOld, \"ROAS\"), _val(b, p, mNew, \"ROAS\")\n            co, cn = _val(b, p, mOld, \"CPA\"), _val(b, p, mNew, \"CPA\")\n            rows.append({\n                \"브랜드\": f\"{BRAND_EMO.get(b, '')} {b}\", \"플랫폼\": PLAT_NAME.get(p, p),\n                f\"지출 {wOld}\": _fmt(so), f\"지출 {wNew}\": _fmt(sn), \"지출Δ\": _delta(sn, so, \"neutral\"),\n                f\"ROAS {wOld}\": _fmt(ro, \"%\"), f\"ROAS {wNew}\": _fmt(rn, \"%\"), \"ROASΔ\": _delta(rn, ro, \"up\"),\n                f\"CPA {wOld}\": _fmt(co), f\"CPA {wNew}\": _fmt(cn), \"CPAΔ\": _delta(cn, co, \"down\"),\n            })\n    df2 = pd.DataFrame(rows)\n    _h = (len(df2) + 1) * 36 + 3 if len(df2) else 80\n    st.dataframe(df2, use_container_width=True, hide_index=True, height=_h)\n    st.caption(\"⚠️ ROAS>1000%는 플랫폼 보고 전환 과대집계일 수 있어 참고만. 지출·CPA=원, ROAS=구매전환값÷지출.\")\nelse:\n    # ─────────── 1주 / 3주+ : 주별 행 목록 ───────────\n    picked_set = set(picked_lab)\n    rows = []\n    for b in [x for x in C.AD_BRANDS if x in sel_brand]:\n        for p in [x for x in WEEKLY_PLATFORMS if x in sel_plat]:\n            sub = g[(g[\"brand\"] == b) & (g[\"platform\"] == p)].sort_values(\"mon\")\n            prev_roas = prev_cpa = None\n            for _, r in sub.iterrows():\n                wk = label_by_mon[r[\"mon\"]]\n                roas, cpa = r[\"ROAS\"], r[\"CPA\"]\n                rmark = cmark = \"\"\n                if prev_roas is not None and prev_roas > 0 and roas > 0:\n                    rmark = \" 🟢\" if roas > prev_roas else (\" ▼\" if roas < prev_roas else \"\")\n                if prev_cpa is not None and prev_cpa > 0 and cpa > 0:\n                    cmark = \" 🟢\" if cpa < prev_cpa else (\" ▼\" if cpa > prev_cpa else \"\")\n                warn = \" ⚠️\" if roas > 1000 else \"\"\n                prev_roas, prev_cpa = roas, cpa\n                if wk not in picked_set:\n                    continue\n                rows.append({\n                    \"브랜드\": f\"{BRAND_EMO.get(b, '')} {b}\", \"플랫폼\": PLAT_NAME.get(p, p),\n                    \"주차\": wk, \"지출비용\": f\"{r['지출']:,.0f}\", \"구매\": f\"{r['구매']:,.0f}\",\n                    \"ROAS\": f\"{roas:.0f}%{rmark}{warn}\", \"CTR\": f\"{r['CTR']:.1f}%\",\n                    \"CPM\": f\"{r['CPM']:,.0f}\", \"CPA\": f\"{cpa:,.0f}{cmark}\"})\n    st.caption(\"▼=직전 주 대비 악화, 🟢=개선, ⚠️=플랫폼 보고 전환 과대집계(ROAS 참고만). \"\n               \"마크는 항상 ‘직전 주’ 대비로 계산됩니다.\")\n    _wk_df = pd.DataFrame(rows)\n    _h = (len(_wk_df) + 1) * 36 + 3 if len(_wk_df) else 80\n    st.dataframe(_wk_df, use_container_width=True, hide_index=True, height=_h)\n", "dashboards/weekly_trend.py": "\"\"\"7일치 동향 — 브랜드별 전주 vs 전전주 핵심 지표 데일리 리포트.\n\n브랜드: 안티칼알파·에이징핏·림데이·뉴로포커스.\n지표: 몰별 매출(카페24/쿠팡/스토어)·총광고비·블렌디드ROAS·객단가·유입·전환율·\n      취소율·몰믹스·채널별 광고배분+ROAS·신규vs재구매 + 이상치 하이라이트·데이터 신뢰성 플래그.\n\n주의(브랜드 분리): 매출·광고비·몰믹스·객단가는 4개 브랜드 개별. 방문·전환율·신규/재구매·취소는\n자사몰이 '안티칼' 하나(안티칼알파+에이징핏 합산)라 이 둘은 자사몰 기준 합산으로 표기.\n\"\"\"\nfrom __future__ import annotations\nimport sys\nfrom datetime import date, timedelta\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parent.parent\nsys.path.insert(0, str(ROOT))\n\nimport pandas as pd  # noqa: E402\nimport plotly.express as px  # noqa: E402\nimport streamlit as st  # noqa: E402\n\nfrom analyzers import _common as C  # noqa: E402\n\ntry:\n    st.set_page_config(page_title=\"7일치 동향\", layout=\"wide\")\nexcept Exception:\n    pass\nfrom dashboards._style import inject_css, page_intro  # noqa: E402\ninject_css()\n\nTARGET = [\"안티칼알파\", \"에이징핏\", \"림데이\", \"뉴로포커스\"]\nROCKET = {\"안티칼알파\", \"뉴로포커스\"}          # 쿠팡 로켓그로스 → 최근 2~3일 잠정(과소)\nSELF_ANTICAL = {\"안티칼알파\", \"에이징핏\"}       # 자사몰 방문/주문이 '안티칼'로 합산되는 브랜드\nPLAT_KO = {\"meta\": \"메타\", \"google\": \"구글\", \"tiktok\": \"틱톡\", \"naver_gfa\": \"GFA\", \"naver\": \"네이버검색\"}\nMALLS = [\"카페24\", \"쿠팡\", \"스마트스토어\"]\n\n\ndef won(x): return f\"₩{x:,.0f}\"\ndef pct(cur, base):\n    return None if not base else (cur / base - 1) * 100\ndef dstr(cur, base):\n    \"\"\"부호있는 % · 직전 0이면 '신규'(최근>0) / '—'(둘다 0). st.metric·표 겸용.\"\"\"\n    if not base:\n        return \"신규\" if cur else \"—\"\n    return f\"{(cur / base - 1) * 100:+.0f}%\"\n\n\n@st.cache_data(ttl=600)\ndef load():\n    s = C.load_sales5()\n    a = C.add_ad_brand(C.load_ads())\n    v = C.load_visitors()\n    o = C.load_orders()\n    for d in (s, a, v, o):\n        if not d.empty:\n            d[\"d\"] = d[\"date\"].dt.date\n    return s, a, v, o\n\n\nsales, ads, vis, orders = load()\nst.title(\"📈 7일치 동향\")\npage_intro(\"브랜드별 전주 vs 전전주. 매출(몰별)·광고비·ROAS·객단가·유입·전환율·신규/재구매를 한눈에. \"\n           \"이상 신호는 상단에 자동 표기합니다.\")\n\nif sales.empty:\n    st.warning(\"매출 데이터가 없습니다. `python main.py` 로 수집하세요.\")\n    st.stop()\n\n# ── 기간: 전주(지난 완결 월~일) vs 전전주 ──\nmaxd = sales[\"d\"].max()\n# 이번 주(진행중)는 제외하고, 마지막 '완결된' 월~일 주를 전주로 잡는다.\nanchor = min(date.today(), maxd + timedelta(days=1))\nthis_mon = anchor - timedelta(days=anchor.weekday())   # 이번 주(진행중) 월요일\ncur_e = this_mon - timedelta(days=1)                   # 전주 일요일\ncur_s = cur_e - timedelta(days=6)                      # 전주 월요일  →  전주 = cur_s~cur_e\nprv_e = cur_s - timedelta(days=1)                      # 전전주 일요일\nprv_s = prv_e - timedelta(days=6)                      # 전전주 월요일 → 전전주 = prv_s~prv_e\nst.caption(f\"📅 **전주 {cur_s} ~ {cur_e} (월~일)**  vs  **전전주 {prv_s} ~ {prv_e} (월~일)**  ·  \"\n           f\"이번 주(진행중)는 제외 · 데이터 최신일 {maxd}\")\n\n\ndef wsum(df, b_col, b, s, e, val):\n    if df.empty or val not in df.columns: return 0.0\n    m = (df[\"d\"] >= s) & (df[\"d\"] <= e) & (df[b_col] == b)\n    return float(df.loc[m, val].sum())\n\n\ndef brand_metrics(b, s, e):\n    \"\"\"브랜드 b, 기간 [s,e] 핵심 지표 dict.\"\"\"\n    sb = sales[sales[\"brand\"] == b]\n    rev_mall = {}\n    for m in MALLS:\n        mm = (sb[\"d\"] >= s) & (sb[\"d\"] <= e) & (sb[\"채널\"] == m)\n        rev_mall[m] = float(sb.loc[mm, \"sales_amount\"].sum())\n    rev = sum(rev_mall.values())\n    tot_ord = float(sb[(sb[\"d\"] >= s) & (sb[\"d\"] <= e)][\"order_count\"].sum())\n    aov = rev / tot_ord if tot_ord else 0\n    spend = wsum(ads, \"brand\", b, s, e, \"cost\")\n    roas = rev / spend if spend else 0\n    # 자사몰 방문/주문(안티칼알파·에이징핏은 '안티칼' 합산)\n    vb = \"안티칼\" if b in SELF_ANTICAL else b\n    visits = wsum(vis, \"brand\", vb, s, e, \"visits\")\n    ob = orders[(orders[\"brand\"] == vb) & (orders[\"d\"] >= s) & (orders[\"d\"] <= e)]\n    ob_valid = ob[ob[\"is_cancel\"] == 0]\n    cafe_ord = float(sb[(sb[\"d\"] >= s) & (sb[\"d\"] <= e) & (sb[\"채널\"] == \"카페24\")][\"order_count\"].sum())\n    cvr = cafe_ord / visits * 100 if visits else 0\n    cancel = ob[\"is_cancel\"].mean() * 100 if len(ob) else 0\n    # 주간 재구매율 = 기간(7일) 내 2회+ 구매한 회원 ÷ 구매 회원 (취소·비회원 제외)\n    mem = ob_valid[~ob_valid[\"member_id\"].astype(str).str.strip().str.lower().isin([\"\", \"nan\"])]\n    mcnt = mem.groupby(\"member_id\")[\"order_id\"].count()\n    repeat = (mcnt >= 2).mean() * 100 if len(mcnt) else 0\n    return dict(rev=rev, rev_mall=rev_mall, spend=spend, roas=roas, aov=aov,\n                visits=visits, cvr=cvr, cancel=cancel, repeat=repeat, tot_ord=tot_ord)\n\n\ndef plat_breakdown(b, cs, ce, ps, pe):\n    \"\"\"채널별 (최근광고비, 직전광고비, 최근ROAS%, 직전ROAS%).\"\"\"\n    d = ads[ads[\"brand\"] == b]\n    rows = []\n    for p in [\"meta\", \"google\", \"tiktok\", \"naver_gfa\", \"naver\"]:\n        dc = d[(d[\"platform\"] == p) & (d[\"d\"] >= cs) & (d[\"d\"] <= ce)]\n        dp = d[(d[\"platform\"] == p) & (d[\"d\"] >= ps) & (d[\"d\"] <= pe)]\n        cc = float(dc[\"cost\"].sum()); cp = float(dp[\"cost\"].sum())\n        if cc <= 0 and cp <= 0: continue\n        roas_c = float(dc[\"conv_value\"].sum()) / cc * 100 if cc else 0\n        roas_p = float(dp[\"conv_value\"].sum()) / cp * 100 if cp else 0\n        rows.append((PLAT_KO[p], cc, cp, roas_c, roas_p))\n    return rows\n\n\nCUR = {b: brand_metrics(b, cur_s, cur_e) for b in TARGET}\nPRV = {b: brand_metrics(b, prv_s, prv_e) for b in TARGET}\n\n# ── 이상치 하이라이트 ──\nalerts = []\nfor b in TARGET:\n    c, p = CUR[b], PRV[b]\n    for m in MALLS:\n        ch = pct(c[\"rev_mall\"][m], p[\"rev_mall\"][m])\n        if ch is not None and abs(ch) >= 25 and max(c[\"rev_mall\"][m], p[\"rev_mall\"][m]) > 1_000_000:\n            alerts.append((b, f\"{m} 매출 {ch:+.0f}%\", ch < 0))\n    a_ch = pct(c[\"aov\"], p[\"aov\"])\n    if a_ch is not None and abs(a_ch) >= 30:\n        alerts.append((b, f\"객단가 {a_ch:+.0f}% (단품 노출·구성 변화 의심)\", False))\n    r_ch = pct(c[\"roas\"], p[\"roas\"])\n    if r_ch is not None and abs(r_ch) >= 25:\n        alerts.append((b, f\"블렌디드 ROAS {r_ch:+.0f}%\", r_ch < 0))\n    if c[\"cancel\"] >= 10:\n        alerts.append((b, f\"취소율 {c['cancel']:.0f}% 높음\", True))\n\nst.subheader(\"⚠️ 이상 신호 하이라이트\")\nif alerts:\n    for b, msg, bad in alerts:\n        (st.error if bad else st.info)(f\"**{b}** — {msg}\")\nelse:\n    st.success(\"전주 특이 급변 신호 없음(전전주 대비 ±25% 매출·±30% 객단가·±25% ROAS 기준).\")\n\n# ── 브랜드 요약 표 ──\nst.subheader(\"한눈에 — 브랜드 요약\")\nrows = []\nfor b in TARGET:\n    c, p = CUR[b], PRV[b]\n    rows.append({\n        \"브랜드\": b,\n        \"총매출\": won(c[\"rev\"]), \"매출Δ\": dstr(c[\"rev\"], p[\"rev\"]),\n        \"카페24Δ\": dstr(c[\"rev_mall\"][\"카페24\"], p[\"rev_mall\"][\"카페24\"]),\n        \"쿠팡Δ\": dstr(c[\"rev_mall\"][\"쿠팡\"], p[\"rev_mall\"][\"쿠팡\"]),\n        \"스토어Δ\": dstr(c[\"rev_mall\"][\"스마트스토어\"], p[\"rev_mall\"][\"스마트스토어\"]),\n        \"광고비\": won(c[\"spend\"]), \"광고비Δ\": dstr(c[\"spend\"], p[\"spend\"]),\n        \"ROAS\": f\"{c['roas']:.2f}\", \"ROASΔ\": dstr(c[\"roas\"], p[\"roas\"]),\n        \"객단가\": won(c[\"aov\"]), \"객단가Δ\": dstr(c[\"aov\"], p[\"aov\"]),\n    })\nst.dataframe(pd.DataFrame(rows), use_container_width=True, hide_index=True)\nst.caption(\"Δ = 전주 vs 전전주. ROAS=블렌디드(총매출÷총광고비). 객단가=총매출÷총주문(전 몰).\")\n\n# ── 브랜드별 상세 ──\nst.divider()\ntabs = st.tabs(TARGET)\nfor tab, b in zip(tabs, TARGET):\n    with tab:\n        c, p = CUR[b], PRV[b]\n        # 헤드라인 KPI\n        k = st.columns(5)\n        k[0].metric(\"총매출\", won(c[\"rev\"]), dstr(c[\"rev\"], p[\"rev\"]))\n        k[1].metric(\"총광고비\", won(c[\"spend\"]), dstr(c[\"spend\"], p[\"spend\"]), delta_color=\"off\")\n        k[2].metric(\"블렌디드 ROAS\", f\"{c['roas']:.2f}\", dstr(c[\"roas\"], p[\"roas\"]))\n        k[3].metric(\"객단가\", won(c[\"aov\"]), dstr(c[\"aov\"], p[\"aov\"]))\n        k[4].metric(\"취소율\", f\"{c['cancel']:.1f}%\")\n        flags = []\n        flags.append(\"🟠 쿠팡=로켓그로스 → 최근 2~3일 잠정(과소).\" if b in ROCKET\n                     else \"🟢 쿠팡=판매자배송 → 실시간.\")\n        if b in SELF_ANTICAL:\n            flags.append(\"🔵 자사몰 방문·전환·재구매·취소는 안티칼 자사몰(안티칼알파+에이징핏 합산) 기준.\")\n        st.caption(\"  \".join(flags))\n\n        def daily_bar(df, val, ylab):\n            if not len(df) or df[val].sum() <= 0:\n                st.info(\"데이터 없음\"); return\n            fig = px.bar(df, x=\"d\", y=val, color=\"채널\", labels={\"d\": \"\", val: ylab, \"채널\": \"\"})\n            fig.update_layout(height=280, margin=dict(t=6, b=0, l=0, r=0), xaxis_title=\"\", yaxis_title=ylab,\n                              legend=dict(orientation=\"h\", yanchor=\"bottom\", y=1.0, x=0, title_text=\"\"))\n            st.plotly_chart(fig, use_container_width=True)\n\n        # ── 1) 몰별 매출 ──\n        st.divider()\n        st.markdown(f\"##### 🛒 몰별 매출 · 전주({cur_s}~{cur_e}) vs 전전주({prv_s}~{prv_e})\")\n        m1, m2 = st.columns([5, 6])\n        with m1:\n            mrows = []\n            for m in MALLS:\n                cur_v, prv_v = c[\"rev_mall\"][m], p[\"rev_mall\"][m]\n                sh_c = cur_v / c[\"rev\"] * 100 if c[\"rev\"] else 0\n                sh_p = prv_v / p[\"rev\"] * 100 if p[\"rev\"] else 0\n                mrows.append({\"몰\": m, \"전주\": won(cur_v), \"전전주\": won(prv_v), \"변화\": dstr(cur_v, prv_v),\n                              \"비중(전주)\": f\"{sh_c:.0f}%\", \"비중(전전주)\": f\"{sh_p:.0f}%\"})\n            mrows.append({\"몰\": \"합계\", \"전주\": won(c[\"rev\"]), \"전전주\": won(p[\"rev\"]),\n                          \"변화\": dstr(c[\"rev\"], p[\"rev\"]), \"비중(전주)\": \"100%\", \"비중(전전주)\": \"100%\"})\n            st.dataframe(pd.DataFrame(mrows), use_container_width=True, hide_index=True)\n        with m2:\n            sd = sales[(sales[\"brand\"] == b) & (sales[\"d\"] >= cur_s) & (sales[\"d\"] <= cur_e)]\n            daily_bar(sd.groupby([\"d\", \"채널\"], as_index=False)[\"sales_amount\"].sum(), \"sales_amount\", \"매출\")\n\n        # ── 2) 채널별 광고비 ──\n        st.divider()\n        st.markdown(f\"##### 📣 채널별 광고비 · ROAS · 전주 vs 전전주\")\n        a1, a2 = st.columns([5, 6])\n        with a1:\n            pb = plat_breakdown(b, cur_s, cur_e, prv_s, prv_e)\n            if pb:\n                prows = [{\"채널\": nm, \"전주\": won(cc), \"전전주\": won(cp), \"변화\": dstr(cc, cp),\n                          \"비중(전주)\": f\"{cc/c['spend']*100:.0f}%\" if c[\"spend\"] else \"—\",\n                          \"ROAS전주\": f\"{rc:.0f}%\", \"ROAS전전주\": f\"{rp:.0f}%\"} for nm, cc, cp, rc, rp in pb]\n                st.dataframe(pd.DataFrame(prows), use_container_width=True, hide_index=True)\n                st.caption(\"비중=전주 광고비 기준 · ROAS=플랫폼 구매전환값÷지출(어트리뷰션·상대비교용).\")\n            else:\n                st.info(\"광고비 데이터 없음.\")\n        with a2:\n            adb = ads[(ads[\"brand\"] == b) & (ads[\"d\"] >= cur_s) & (ads[\"d\"] <= cur_e)].copy()\n            adb[\"채널\"] = adb[\"platform\"].map(PLAT_KO).fillna(adb[\"platform\"])\n            daily_bar(adb.groupby([\"d\", \"채널\"], as_index=False)[\"cost\"].sum(), \"cost\", \"광고비\")\n\n        # ── 3) 자사몰 유입·전환·재구매 ──\n        st.divider()\n        st.markdown(f\"##### 👥 자사몰 유입 · 전환 · 재구매 {'(안티칼 합산)' if b in SELF_ANTICAL else ''}\")\n        g = st.columns(3)\n        g[0].metric(\"자사몰 방문\", f\"{c['visits']:,.0f}\", dstr(c[\"visits\"], p[\"visits\"]), delta_color=\"off\")\n        g[1].metric(\"자사몰 전환율\", f\"{c['cvr']:.2f}%\", dstr(c[\"cvr\"], p[\"cvr\"]))\n        g[2].metric(\"주간 재구매율 (7일내 2회+ 회원)\", f\"{c['repeat']:.1f}%\", dstr(c[\"repeat\"], p[\"repeat\"]), delta_color=\"off\")\n\nst.divider()\nst.caption(\"데이터:
