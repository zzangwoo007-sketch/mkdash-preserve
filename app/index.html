<script type="module">
import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.8.1/build/stlite.js";
const arg = {"requirements": ["pandas", "numpy", "plotly", "sqlalchemy", "pyarrow"], "entrypoint": "dashboards/Home.py", "files": {"config.py": "\"\"\"중앙 설정 로더 — .env 와 accounts.json 을 읽어 한 곳에서 제공.\n\n기존 project 의 config.py 를 확장:\n  + TikTok Ads / GA4 / Microsoft Clarity 자격증명\n  + AI(LLM) 설정 (기본 Anthropic Claude)\n  + 디자이너 자동 전달용 Slack Webhook\n\"\"\"\nimport json\nimport os\nfrom pathlib import Path\n\nfrom dotenv import load_dotenv\n\nBASE_DIR = Path(__file__).resolve().parent\nload_dotenv(BASE_DIR / \".env\")\n\n# 보존용 사본 사이트는 MI_DB_PATH 로 다른 DB(archive/preserve.db)를 가리킨다(읽기전용 미러).\nDB_PATH = Path(os.getenv(\"MI_DB_PATH\", str(BASE_DIR / \"data.db\")))\n# 미러/보존 모드: 실시간 수집 버튼 등 쓰기 동작 숨김\nARCHIVE_MODE = True  # ← 보존 사본 빌드에서 강제(build_offline_stlite._force_archive_mode)\nREPORTS_DIR = BASE_DIR / \"reports\"\nPROMPTS_DIR = BASE_DIR / \"prompts\"\n\n\ndef _accounts() -> dict:\n    path = BASE_DIR / \"accounts.json\"\n    if not path.exists():\n        return {}\n    return json.loads(path.read_text(encoding=\"utf-8\"))\n\n\nACCOUNTS = _accounts()\n\n# 키가 하나도 없으면 데모(모의 데이터) 모드로 자동 동작\nDEMO_MODE = os.getenv(\"DEMO_MODE\", \"\").lower() in (\"1\", \"true\", \"yes\")\n\n# ---------- Google Ads ----------\nGOOGLE_ADS_CONFIG = {\n    \"developer_token\": os.getenv(\"GOOGLE_ADS_DEVELOPER_TOKEN\", \"\"),\n    \"client_id\": os.getenv(\"GOOGLE_ADS_CLIENT_ID\", \"\"),\n    \"client_secret\": os.getenv(\"GOOGLE_ADS_CLIENT_SECRET\", \"\"),\n    \"refresh_token\": os.getenv(\"GOOGLE_ADS_REFRESH_TOKEN\", \"\"),\n    \"login_customer_id\": os.getenv(\"GOOGLE_ADS_LOGIN_CUSTOMER_ID\", \"\"),\n    \"use_proto_plus\": True,\n}\nGOOGLE_ADS_ACCOUNTS = ACCOUNTS.get(\"google_ads_accounts\", [])\n\n# ---------- Meta ----------\nMETA_APP_ID = os.getenv(\"META_APP_ID\", \"\")\nMETA_APP_SECRET = os.getenv(\"META_APP_SECRET\", \"\")\nMETA_ACCESS_TOKEN = os.getenv(\"META_ACCESS_TOKEN\", \"\")\nMETA_AD_ACCOUNTS = ACCOUNTS.get(\"meta_ad_accounts\", [])\n\n# ---------- TikTok Ads ----------\nTIKTOK_ACCESS_TOKEN = os.getenv(\"TIKTOK_ACCESS_TOKEN\", \"\")\nTIKTOK_APP_ID = os.getenv(\"TIKTOK_APP_ID\", \"\")\nTIKTOK_SECRET = os.getenv(\"TIKTOK_SECRET\", \"\")\nTIKTOK_REDIRECT_URI = os.getenv(\"TIKTOK_REDIRECT_URI\", \"https://localhost/callback\")\nTIKTOK_ADVERTISERS = ACCOUNTS.get(\"tiktok_advertisers\", [])\n\n# ---------- Naver 검색광고 (Search Ad) ----------\n# 계정마다 (api_key=액세스라이선스, secret_key=비밀키, customer_id) 가 다르므로\n# accounts.json 의 naver_searchad_accounts 배열에 계정별로 넣는다.\n# (검색광고 > 도구 > API 사용 관리에서 발급. IP 화이트리스트 없음.)\nNAVER_SEARCHAD_ACCOUNTS = ACCOUNTS.get(\"naver_searchad_accounts\", [])\n\n# ---------- GA4 ----------\nGA4_PROPERTY_ID = os.getenv(\"GA4_PROPERTY_ID\", \"\")\n# 서비스 계정 JSON 키 경로 (google-analytics-data SDK 가 사용)\nGA4_CREDENTIALS_PATH = os.getenv(\"GOOGLE_APPLICATION_CREDENTIALS\", \"\")\nGA4_PROPERTIES = ACCOUNTS.get(\"ga4_properties\", [])\n\n# ---------- Microsoft Clarity ----------\n# Clarity > Settings > Data Export 에서 발급한 API 토큰(Bearer)\nCLARITY_API_TOKEN = os.getenv(\"CLARITY_API_TOKEN\", \"\")\nCLARITY_PROJECTS = ACCOUNTS.get(\"clarity_projects\", [])\n\n# ---------- AI (LLM) ----------\n# 기본 제공자: anthropic (Claude). openai 로도 전환 가능.\nAI_PROVIDER = os.getenv(\"AI_PROVIDER\", \"anthropic\").lower()\nANTHROPIC_API_KEY = os.getenv(\"ANTHROPIC_API_KEY\", \"\")\n# 최신·최상위 모델 기본값\nANTHROPIC_MODEL = os.getenv(\"ANTHROPIC_MODEL\", \"claude-opus-4-8\")\nOPENAI_API_KEY = os.getenv(\"OPENAI_API_KEY\", \"\")\nOPENAI_MODEL = os.getenv(\"OPENAI_MODEL\", \"gpt-4o\")\n\n# ---------- 디자이너 자동 전달 ----------\n# Slack Incoming Webhook URL (없으면 reports/handoffs 에 파일로만 저장)\nDESIGNER_SLACK_WEBHOOK = os.getenv(\"DESIGNER_SLACK_WEBHOOK\", \"\")\nDESIGNER_EMAIL = os.getenv(\"DESIGNER_EMAIL\", \"\")\n\n# ---------- 이메일(SMTP) 자동 발송 ----------\n# Gmail이면 SMTP_HOST=smtp.gmail.com / PORT=587 / PASSWORD=앱비밀번호(2단계인증 후 발급)\nSMTP_HOST = os.getenv(\"SMTP_HOST\", \"smtp.gmail.com\")\nSMTP_PORT = int(os.getenv(\"SMTP_PORT\", \"587\"))\nSMTP_USER = os.getenv(\"SMTP_USER\", \"\")           # 보내는 계정(로그인 ID)\nSMTP_PASSWORD = os.getenv(\"SMTP_PASSWORD\", \"\")   # 앱 비밀번호\nEMAIL_FROM = os.getenv(\"EMAIL_FROM\", \"\") or SMTP_USER\nEMAIL_TO = os.getenv(\"EMAIL_TO\", \"\")             # 받는사람(콤마로 여러 명)\n\n\ndef has_ai() -> bool:\n    if AI_PROVIDER == \"anthropic\":\n        return bool(ANTHROPIC_API_KEY)\n    if AI_PROVIDER == \"openai\":\n        return bool(OPENAI_API_KEY)\n    return False\n", "db.py": "\"\"\"SQLite 스키마 + 적재(upsert) 헬퍼. SQLAlchemy Core 사용.\n\n기존 project 의 daily_ads 를 확장하고(reach/frequency 추가),\nClarity / GA4 / AI 인사이트 테이블을 새로 정의한다.\n\"\"\"\nfrom sqlalchemy import (\n    Column,\n    Date,\n    Float,\n    Integer,\n    MetaData,\n    String,\n    Table,\n    Text,\n    UniqueConstraint,\n    create_engine,\n)\nfrom sqlalchemy.dialects.sqlite import insert as sqlite_insert\n\nfrom config import DB_PATH\n\nengine = create_engine(f\"sqlite:///{DB_PATH}\", future=True)\nmetadata = MetaData()\n\n# ---- 일자별 광고 성과 (google / meta / tiktok 공통) ----\ndaily_ads = Table(\n    \"daily_ads\", metadata,\n    Column(\"date\", Date),\n    Column(\"platform\", String),          # 'google' | 'meta' | 'tiktok'\n    Column(\"account_id\", String),\n    Column(\"account_name\", String),\n    Column(\"campaign_name\", String),\n    Column(\"impressions\", Integer),\n    Column(\"clicks\", Integer),\n    Column(\"cost\", Float),\n    Column(\"conversions\", Float),\n    Column(\"conv_value\", Float),\n    Column(\"reach\", Integer),\n    Column(\"frequency\", Float),\n    Column(\"likes\", Integer),\n    Column(\"shares\", Integer),\n    Column(\"intune\", Integer),\n    UniqueConstraint(\"date\", \"platform\", \"account_id\", \"campaign_name\", name=\"uq_ads\"),\n)\n\n# ---- 일자별 매출 (cafe24-dashboard 스냅샷: 카페24/쿠팡 × 브랜드) ----\ndaily_sales = Table(\n    \"daily_sales\", metadata,\n    Column(\"date\", Date),\n    Column(\"mall_id\", String),      # antical / coupang / ...\n    Column(\"brand\", String),\n    Column(\"sales_amount\", Float),          # 실결제액(순매출, 취소 제외)\n    Column(\"order_price_amount\", Float),    # 상품구매액(정가, 쿠폰·적립금 반영 전; 카페24만, 쿠팡/스토어는 =sales_amount)\n    Column(\"order_count\", Integer),\n    UniqueConstraint(\"date\", \"mall_id\", \"brand\", name=\"uq_sales\"),\n)\n\n# ---- 시간대(0~23)별 매출 — 「시간대별 매출 확인」 페이지의 과거분 보존용 ----\n# 이 페이지는 원래 주문 API 를 매번 라이브로 불러 그렸다. 그래서 API/토큰이 없는 환경\n# (보존 사본 정적 사이트 = stlite /app)에서는 아무것도 못 그린다. 완료된 날의 결과를\n# 여기 적재해 두면 그런 환경도 '지난 날' 을 그릴 수 있다(당일은 없음이 정상).\n# hour = 0~23 : 실제 주문시각 기준. hour = -1 : 시각 분해가 불가능한 채널의 '일 총액'\n#   (쿠팡=로켓그로스 정산 지연, 스마트스토어=커머스API 가 과거일 결제분을 못 돌려줌).\nhourly_sales = Table(\n    \"hourly_sales\", metadata,\n    Column(\"date\", Date),\n    Column(\"brand\", String),\n    Column(\"channel\", String),      # '카페24' | '스마트스토어' | '쿠팡'\n    Column(\"hour\", Integer),        # 0~23, 또는 -1(일 총액만)\n    Column(\"revenue\", Float),\n    UniqueConstraint(\"date\", \"brand\", \"channel\", \"hour\", name=\"uq_hourly_sales\"),\n)\n\n# ---- 주문 단위 (cafe24-dashboard 스냅샷: 재구매/취소/회원여부 분석용) ----\ndaily_orders = Table(\n    \"daily_orders\", metadata,\n    Column(\"date\", Date),\n    Column(\"mall_id\", String),\n    Column(\"brand\", String),\n    Column(\"member_id\", String),\n    Column(\"order_id\", String),\n    Column(\"sales_amount\", Float),\n    Column(\"is_first\", Integer),      # 1=첫주문(회원 신규, cafe24 first_order)\n    Column(\"is_new_buyer\", Integer),  # 1=신규 구매자(회원 첫구매 OR 비회원 첫등장; 휴대폰 해시 dedupe)\n    Column(\"is_cancel\", Integer),     # 1=취소\n    UniqueConstraint(\"mall_id\", \"order_id\", name=\"uq_orders\"),\n)\n\n# ---- 일자별 방문 (cafe24 애널리틱스: 브랜드별 신규/재방문) ----\ndaily_visitors = Table(\n    \"daily_visitors\", metadata,\n    Column(\"date\", Date),\n    Column(\"brand\", String),\n    Column(\"visits\", Integer),\n    Column(\"new_visits\", Integer),\n    Column(\"returning_visits\", Integer),\n    UniqueConstraint(\"date\", \"brand\", name=\"uq_visitors\"),\n)\n\n# ---- GA4: 랜딩페이지/세션 행동 ----\nga4_landing = Table(\n    \"ga4_landing\", metadata,\n    Column(\"date\", Date),\n    Column(\"property_id\", String),\n    Column(\"landing_page\", String),\n    Column(\"sessions\", Integer),\n    Column(\"bounce_rate\", Float),\n    Column(\"avg_engagement_time\", Float),   # 초\n    Column(\"scroll_depth\", Float),          # 0~100 (%)\n    Column(\"conversions\", Float),\n    Column(\"purchase_value\", Float),\n    UniqueConstraint(\"date\", \"property_id\", \"landing_page\", name=\"uq_ga4\"),\n)\n\n# ---- GA4: 페이지(경로)별 조회 — 카테고리/랜딩 무관 전체 페이지뷰 (ARS 카테고리 추적용) ----\nga4_pages = Table(\n    \"ga4_pages\", metadata,\n    Column(\"date\", Date),\n    Column(\"property_id\", String),\n    Column(\"page_path\", String),\n    Column(\"page_views\", Integer),\n    Column(\"sessions\", Integer),\n    Column(\"total_users\", Integer),\n    Column(\"conversions\", Float),\n    UniqueConstraint(\"date\", \"property_id\", \"page_path\", name=\"uq_ga4_pages\"),\n)\n\n# ---- GA4: 유입 채널(소스/매체) x 랜딩페이지 — 채널별 이탈·전환 병목 진단용 ----\n# ga4_landing 은 \"어디로 들어왔나\"만 알고 \"어디서 왔나\"를 모른다. 이 테이블이 그 빈칸을 채운다.\nga4_traffic = Table(\n    \"ga4_traffic\", metadata,\n    Column(\"date\", Date),\n    Column(\"property_id\", String),\n    Column(\"source_medium\", String),      # sessionSourceMedium (예: \"meta / cpc\")\n    Column(\"channel_group\", String),      # sessionDefaultChannelGroup (예: \"Paid Social\")\n    Column(\"landing_page\", String),\n    Column(\"sessions\", Integer),\n    Column(\"bounce_rate\", Float),\n    Column(\"avg_engagement_time\", Float),  # 초\n    Column(\"conversions\", Float),\n    Column(\"purchase_value\", Float),\n    UniqueConstraint(\"date\", \"property_id\", \"source_medium\", \"landing_page\",\n                     name=\"uq_ga4_traffic\"),\n)\n\n# ---- Microsoft Clarity: URL(상세페이지)별 UX 행동 ----\nclarity_pages = Table(\n    \"clarity_pages\", metadata,\n    Column(\"date\", Date),\n    Column(\"project_id\", String),\n    Column(\"url\", String),\n    Column(\"page_title\", String),\n    Column(\"visits\", Integer),\n    Column(\"avg_scroll_depth\", Float),       # %\n    Column(\"avg_session_duration\", Float),   # 초\n    Column(\"dead_clicks\", Integer),\n    Column(\"rage_clicks\", Integer),\n    Column(\"quick_backs\", Integer),          # 빠른 이탈(quickback)\n    Column(\"excessive_scrolls\", Integer),\n    Column(\"exit_rate\", Float),              # %\n    UniqueConstraint(\"date\", \"project_id\", \"url\", name=\"uq_clarity\"),\n)\n\n# ---- AI 인사이트 / 디자이너 핸드오프 로그 ----\ninsights = Table(\n    \"insights\", metadata,\n    Column(\"id\", Integer, primary_key=True, autoincrement=True),\n    Column(\"created_at\", String),       # ISO datetime (외부에서 주입)\n    Column(\"kind\", String),             # 'performance' | 'clarity' | 'creative'\n    Column(\"title\", String),\n    Column(\"severity\", String),         # 'High' | 'Medium' | 'Low'\n    Column(\"target_url\", String),\n    Column(\"summary\", Text),\n    Column(\"body_md\", Text),\n    Column(\"handoff_status\", String, default=\"pending\"),  # pending | sent | failed\n    Column(\"handoff_channel\", String, default=\"\"),        # slack | file | email\n)\n\n\ndef init_db() -> None:\n    metadata.create_all(engine)\n    # 기존 DB(order_price_amount 없던 스키마) 마이그레이션\n    from sqlalchemy import inspect as _inspect, text as _text\n    cols = {c[\"name\"] for c in _inspect(engine).get_columns(\"daily_sales\")}\n    if \"order_price_amount\" not in cols:\n        with engine.begin() as conn:\n            conn.execute(_text(\"ALTER TABLE daily_sales ADD COLUMN order_price_amount FLOAT\"))\n\n\ndef _upsert(table: Table, rows: list[dict], conflict_cols: list[str]) -> None:\n    if not rows:\n        return\n    with engine.begin() as conn:\n        for row in rows:\n            stmt = sqlite_insert(table).values(**row)\n            update_cols = {c: stmt.excluded[c] for c in row if c not in conflict_cols}\n            stmt = stmt.on_conflict_do_update(index_elements=conflict_cols, set_=update_cols)\n            conn.execute(stmt)\n\n\ndef _replace_by_day(table: Table, rows: list[dict]) -> None:\n    \"\"\"수집한 (날짜, property) 를 통째로 갈아끼운다 — upsert 만으로는 못 지우는 stale 행 때문.\n\n    GA4 는 최근 데이터를 나중에 재귀속한다. 어제는 landing_page='' (미귀속) 로 11,693세션을\n    주던 걸 오늘은 '/surl/p/27' 등으로 제대로 쪼개서 준다. upsert 는 덮어쓰기만 하므로\n    낡은 '' 행이 고아로 남아 같은 세션이 두 번 세어졌다 (2026-07-14 림데이: DB 35,632 vs\n    GA4 실제 23,843 — GA4 총세션 24,201 보다도 많은 불가능한 값이었다).\n\n    그래서 '그 날짜는 GA4 가 이번에 준 게 전부' 로 만든다.\n    **안전장치**: rows 가 비면 아무것도 지우지 않는다. API 장애·토큰만료로 빈 응답이 와도\n    기존 데이터가 통째로 날아가지 않도록.\n    \"\"\"\n    if not rows:\n        return\n    keys = {(r[\"date\"], r[\"property_id\"]) for r in rows}\n    with engine.begin() as conn:\n        for d, pid in keys:\n            conn.execute(table.delete().where(\n                (table.c.date == d) & (table.c.property_id == pid)))\n        for row in rows:\n            conn.execute(sqlite_insert(table).values(**row))\n\n\ndef save_ads(rows: list[dict]) -> None:\n    _upsert(daily_ads, rows, [\"date\", \"platform\", \"account_id\", \"campaign_name\"])\n\n\ndef delete_ads(platforms, start, end, accounts=None) -> None:\n    \"\"\"주어진 플랫폼의 [start,end] 기간 daily_ads 행 삭제(재적재 전 stale 정리).\n    수집 대상이 아닌 플랫폼(예: naver_gfa 수동 임포트)은 보존된다.\n\n    ★accounts 를 주면 **그 계정(account_id)들의 행만** 지운다. 반드시 이렇게 호출할 것.\n      광고계정이 정지(SUSPENDED)·해지되면 수집기 계정목록에서 통째로 빠지는데, 계정 스코프\n      없이 플랫폼 전체를 지우면 **그 계정의 과거가 롤링 창(메타·구글 ~60일)만큼 한 번에\n      증발한다.** 2026-08-05 실제 사고: 구글 antical.1 이 SUSPENDED 되자 안티칼 구글\n      6/5~8/3 약 2.11억원이 통째로 삭제됨(보존DB에만 남아 있었다). 수집된 계정만 지우면\n      목록에서 사라진 계정의 과거는 그대로 보존된다.\n      cf. 2026-07-16 틱톡 소실 사고는 '플랫폼별로 좁히기'까지만 해서 이 케이스를 못 막았다.\n    \"\"\"\n    plats = [p for p in platforms if p]\n    if not plats:\n        return\n    cond = (daily_ads.c.platform.in_(plats)\n            & (daily_ads.c.date >= start)\n            & (daily_ads.c.date <= end))\n    if accounts is not None:\n        accs = [str(a) for a in accounts if a is not None and str(a) != \"\"]\n        if not accs:          # 계정 스코프를 의도했는데 비었으면 아무것도 지우지 않는다\n            return\n        cond = cond & daily_ads.c.account_id.in_(accs)\n    with engine.begin() as conn:\n        conn.execute(daily_ads.delete().where(cond))\n\n\ndef known_ad_accounts(start, end) -> set:\n    \"\"\"[start,end] 구간 daily_ads 에 이미 들어 있는 (platform, account_id, account_name) 집합.\n    수집 직전에 호출해 '전에는 있었는데 이번 수집엔 없는 계정'을 경고하는 데 쓴다.\"\"\"\n    with engine.begin() as conn:\n        rows = conn.execute(\n            daily_ads.select().with_only_columns(\n                daily_ads.c.platform, daily_ads.c.account_id, daily_ads.c.account_name\n            ).where((daily_ads.c.date >= start) & (daily_ads.c.date <= end)).distinct()\n        ).fetchall()\n    return {(r[0], str(r[1]), r[2]) for r in rows}\n\n\ndef ad_cost_detail(start, end) -> dict:\n    \"\"\"[start,end] 구간의 (platform, account_id, date, campaign_name) → 광고비.\n\n    수집 직전에 찍어 두고 새로 들어올 값과 대조한다. 계정이 통째로 사라지는 건\n    known_ad_accounts 가 잡지만, **계정은 멀쩡한데 그 안의 일부만 빠지는 경우**는 못 잡는다.\n    2026-08-04~17 구글 PMAX 조회가 실패해 림데이 564만원이 2주간 조용히 빠졌는데,\n    계정은 정상으로 보였고 금액도 하루치의 14% 라 비율 임계값으로는 안 걸렸다.\n    «지난번엔 돈을 썼는데 이번엔 행 자체가 없는 캠페인» 을 보는 게 유일하게 확실하다.\"\"\"\n    from sqlalchemy import func\n\n    with engine.begin() as conn:\n        rows = conn.execute(\n            daily_ads.select().with_only_columns(\n                daily_ads.c.platform, daily_ads.c.account_id, daily_ads.c.date,\n                daily_ads.c.campaign_name, func.sum(daily_ads.c.cost),\n            ).where((daily_ads.c.date >= start) & (daily_ads.c.date <= end))\n            .group_by(daily_ads.c.platform, daily_ads.c.account_id, daily_ads.c.date,\n                      daily_ads.c.campaign_name)\n        ).fetchall()\n    return {(r[0], str(r[1]), r[2], str(r[3] or \"\")): float(r[4] or 0) for r in rows}\n\n\ndef save_sales(rows: list[dict]) -> None:\n    _upsert(daily_sales, rows, [\"date\", \"mall_id\", \"brand\"])\n\n\ndef save_hourly_sales(rows: list[dict]) -> None:\n    \"\"\"시간대별 매출 적재. 같은 (날짜·브랜드·채널)은 통째로 갈아끼운다.\n\n    upsert 만 하면 이전 수집 때 있었던 시각 행이 stale 로 남는다(주문 취소로 그 시각 매출이\n    0이 되면 새 수집분에는 그 행이 아예 없어 옛값이 살아남는다). rows 가 비면 아무것도\n    지우지 않는다(API 장애로 빈 응답이 와도 기존 데이터를 날리지 않기 위해).\n    \"\"\"\n    if not rows:\n        return\n    keys = {(r[\"date\"], r[\"brand\"], r[\"channel\"]) for r in rows}\n    with engine.begin() as conn:\n        for d, b, ch in keys:\n            conn.execute(hourly_sales.delete().where(\n                (hourly_sales.c.date == d) & (hourly_sales.c.brand == b)\n                & (hourly_sales.c.channel == ch)))\n        for row in rows:\n            conn.execute(sqlite_insert(hourly_sales).values(**row))\n\n\ndef save_visitors(rows: list[dict]) -> None:\n    _upsert(daily_visitors, rows, [\"date\", \"brand\"])\n\n\ndef save_orders(rows: list[dict]) -> None:\n    _upsert(daily_orders, rows, [\"mall_id\", \"order_id\"])\n\n\ndef save_ga4(rows: list[dict]) -> None:\n    _replace_by_day(ga4_landing, rows)\n\n\ndef save_ga4_pages(rows: list[dict]) -> None:\n    _replace_by_day(ga4_pages, rows)\n\n\ndef save_ga4_traffic(rows: list[dict]) -> None:\n    _replace_by_day(ga4_traffic, rows)\n\n\ndef purge_ga4_days(keys) -> int:\n    \"\"\"(date, property_id) 들을 GA4 3개 테이블에서 통째로 지운다.\n\n    GA4 확정 전(미확정) 데이터를 저장하지 않기 위한 것. 단순히 '저장 안 함'만으로는\n    부족하다 — _replace_by_day 는 **이번에 들어온 날짜만** 지우므로, 앞선 실행이 굳혀둔\n    미확정 행이 그대로 남아 계속 조회된다(2026-07-27 이탈률 99% 사고).\n    \"\"\"\n    n = 0\n    with engine.begin() as conn:\n        for d, pid in keys:\n            for table in (ga4_landing, ga4_pages, ga4_traffic):\n                res = conn.execute(table.delete().where(\n                    (table.c.date == d) & (table.c.property_id == str(pid))))\n                n += res.rowcount or 0\n    return n\n\n\ndef save_clarity(rows: list[dict]) -> None:\n    _upsert(clarity_pages, rows, [\"date\", \"project_id\", \"url\"])\n\n\ndef save_insight(row: dict) -> int:\n    \"\"\"인사이트 1건 저장 후 id 반환.\"\"\"\n    with engine.begin() as conn:\n        res = conn.execute(sqlite_insert(insights).values(**row))\n        return int(res.inserted_primary_key[0])\n\n\ndef update_handoff(insight_id: int, status: str, channel: str) -> None:\n    with engine.begin() as conn:\n        conn.execute(\n            insights.update()\n            .where(insights.c.id == insight_id)\n            .values(handoff_status=status, handoff_channel=channel)\n        )\n", "collectors/__init__.py": "\"\"\"수집기 패키지.\n\n각 모듈은 collect(start, end) -> list[dict] 를 노출한다.\n자격증명이 없으면 예외 대신 빈 리스트를 반환해 파이프라인이 멈추지 않게 한다.\n\"\"\"\n", "collectors/cafe24_snapshot.py": "\"\"\"cafe24-dashboard 스냅샷 어댑터 — '최신화된' 실 수집 데이터를 읽어온다.\n\n../../cafe24-dashboard/snapshot/*.pkl (datastore.refresh 가 저장)을 읽어\n이 프로젝트 스키마(daily_ads / daily_sales / daily_visitors)로 매핑한다.\n한국어 컬럼 → 표준 컬럼, 채널(메타/구글/틱톡) → platform(meta/google/tiktok).\n\"\"\"\nfrom __future__ import annotations\n\nfrom datetime import date\nfrom pathlib import Path\n\nimport pandas as pd\n\ndef _find_snapshot() -> Path:\n    \"\"\"상위 디렉터리들을 거슬러 올라가며 cafe24-dashboard/snapshot 을 찾는다.\"\"\"\n    here = Path(__file__).resolve()\n    for base in here.parents:\n        cand = base / \"cafe24-dashboard\" / \"snapshot\"\n        if cand.exists():\n            return cand\n    # 못 찾으면 기본 추정 경로(.../project/cafe24-dashboard/snapshot)\n    return here.parents[3] / \"cafe24-dashboard\" / \"snapshot\"\n\n\nSNAP_DIR = _find_snapshot()\n\nCHANNEL_MAP = {\"메타\": \"meta\", \"구글\": \"google\", \"틱톡\": \"tiktok\",\n               \"meta\": \"meta\", \"google\": \"google\", \"tiktok\": \"tiktok\"}\n\n# 표준 4개 브랜드로 묶기 — 안티칼알파/에이징핏은 안티칼 제품군이므로 '안티칼'에 합산.\n# (안 묶으면 통합요약이 4개 브랜드로 필터할 때 안티칼알파·에이징핏 광고비·매출이 누락돼 ROAS가 과대됨)\nBRAND_GROUP = {\"안티칼알파\": \"안티칼\", \"에이징핏\": \"안티칼\"}\n\n\ndef _canon(b) -> str:\n    b = str(b or \"\")\n    return BRAND_GROUP.get(b, b)\n\n\ndef available() -> bool:\n    return (SNAP_DIR / \"meta.json\").exists()\n\n\ndef _exists(name: str) -> bool:\n    \"\"\"스냅샷 파일 존재 여부 — 형식(parquet/pkl)은 상관없다.\"\"\"\n    return (SNAP_DIR / f\"{name}.parquet\").exists() or (SNAP_DIR / f\"{name}.pkl\").exists()\n\n\ndef _read(name: str) -> pd.DataFrame:\n    \"\"\"스냅샷 한 개를 읽는다. parquet 이 있으면 그걸 먼저 쓴다.\n\n    ⚠ pickle 은 pandas 버전 사이에 호환되지 않는다. 로컬(pandas 3.x)이 만든 pkl 을\n    오프라인 대시보드의 브라우저 pandas(구버전)가 못 읽어, 예외가 조용히 삼켜지고\n    화면엔 \"데이터가 없습니다\"만 떴다(2026-08-02 확인 — 파일은 멀쩡히 전달되고 있었다).\n    parquet 은 버전 독립적이라 오프라인 빌드가 이 형식을 같이 넣는다.\n    \"\"\"\n    pq = SNAP_DIR / f\"{name}.parquet\"\n    if pq.exists():\n        try:\n            return pd.read_parquet(pq)\n        except Exception:  # noqa: BLE001\n            pass  # parquet 이 깨졌으면 아래 pkl 로 폴백\n    f = SNAP_DIR / f\"{name}.pkl\"\n    if not f.exists():\n        return pd.DataFrame()\n    try:\n        return pd.read_pickle(f)\n    except Exception:  # noqa: BLE001\n        return pd.DataFrame()\n\n\ndef _in_range(df: pd.DataFrame, col: str, start: date, end: date) -> pd.DataFrame:\n    if df.empty or col not in df:\n        return df\n    d = pd.to_datetime(df[col]).dt.date\n    return df[(d >= start) & (d <= end)]\n\n\ndef ad_rows(start: date, end: date) -> list[dict]:\n    \"\"\"스냅샷 ads(소재/광고세트 단위 다중행)를 (일자·채널·브랜드·제품) 기준으로\n    합산해 반환한다. ⚠️ 합산하지 않으면 같은 키 중복행이 upsert 에서 덮어써져\n    지출/전환이 대량 누락된다(원본 20k행 중 대부분이 중복).\"\"\"\n    df = _in_range(_read(\"ads\"), \"일자\", start, end)\n    if df.empty:\n        return []\n    for c in (\"도달\", \"좋아요\", \"공유\", \"인튠\"):   # 구버전 스냅샷 호환(없으면 0)\n        if c not in df.columns:\n            df[c] = 0\n    df = df.rename(columns={\n        \"일자\": \"date\", \"채널\": \"channel\", \"브랜드\": \"brand\", \"제품\": \"campaign\",\n        \"지출\": \"cost\", \"노출\": \"impressions\", \"클릭\": \"clicks\",\n        \"구매전환수\": \"conversions\", \"구매전환값\": \"conv_value\",\n        \"도달\": \"reach\", \"좋아요\": \"likes\", \"공유\": \"shares\", \"인튠\": \"intune\"})\n    df[\"date\"] = pd.to_datetime(df[\"date\"]).dt.date\n    df[\"platform\"] = df[\"channel\"].map(CHANNEL_MAP).fillna(df[\"channel\"])\n    df[\"brand\"] = df[\"brand\"].map(_canon)  # 안티칼알파/에이징핏 → 안티칼 (광고비 누락 방지)\n    g = df.groupby([\"date\", \"platform\", \"brand\", \"campaign\"], as_index=False).agg(\n        impressions=(\"impressions\", \"sum\"), clicks=(\"clicks\", \"sum\"),\n        cost=(\"cost\", \"sum\"), conversions=(\"conversions\", \"sum\"),\n        conv_value=(\"conv_value\", \"sum\"), reach=(\"reach\", \"sum\"),\n        likes=(\"likes\", \"sum\"), shares=(\"shares\", \"sum\"), intune=(\"intune\", \"max\"))\n    rows = []\n    for r in g.itertuples(index=False):\n        reach = int(r.reach or 0)\n        imp = int(r.impressions or 0)\n        rows.append({\n            \"date\": r.date, \"platform\": r.platform,\n            \"account_id\": r.brand, \"account_name\": r.brand,\n            \"campaign_name\": str(r.campaign),\n            \"impressions\": imp, \"clicks\": int(r.clicks or 0),\n            \"cost\": float(r.cost or 0), \"conversions\": float(r.conversions or 0),\n            \"conv_value\": float(r.conv_value or 0),\n            \"reach\": reach, \"frequency\": round(imp / reach, 2) if reach else 0.0,\n            \"likes\": int(r.likes or 0), \"shares\": int(r.shares or 0),\n            \"intune\": int(r.intune or 0),\n        })\n    return rows\n\n\ndef sales_rows(start: date, end: date) -> list[dict]:\n    df = _in_range(_read(\"sales\"), \"일자\", start, end)\n    if df.empty:\n        return []\n    df = df.rename(columns={\"일자\": \"date\", \"브랜드\": \"brand\", \"매출\": \"sales_amount\",\n                            \"상품구매액\": \"order_price_amount\", \"주문수\": \"order_count\"})\n    df[\"date\"] = pd.to_datetime(df[\"date\"]).dt.date\n    df[\"brand\"] = df[\"brand\"].astype(str)  # 원본 브랜드 유지(안티칼알파/에이징핏 분리) — 정규화는 로더(_common)에서\n    # 구(舊) 스냅샷 호환: 상품구매액 컬럼이 없으면 매출로 대체\n    if \"order_price_amount\" not in df.columns:\n        df[\"order_price_amount\"] = df[\"sales_amount\"]\n    # 묶은 뒤 같은 (date,mall,brand)가 생기므로 합산(안 하면 upsert에서 덮어써져 매출 누락)\n    g = df.groupby([\"date\", \"mall_id\", \"brand\"], as_index=False).agg(\n        sales_amount=(\"sales_amount\", \"sum\"), order_price_amount=(\"order_price_amount\", \"sum\"),\n        order_count=(\"order_count\", \"sum\"))\n    return [{\n        \"date\": r.date, \"mall_id\": str(r.mall_id), \"brand\": str(r.brand),\n        \"sales_amount\": float(r.sales_amount or 0),\n        \"order_price_amount\": float(r.order_price_amount or 0),\n        \"order_count\": int(r.order_count or 0),\n    } for r in g.itertuples(index=False)]\n\n\ndef visitor_rows(start: date, end: date) -> list[dict]:\n    df = _in_range(_read(\"visitors\"), \"일자\", start, end)\n    if df.empty:\n        return []\n    return [{\n        \"date\": pd.Timestamp(getattr(r, \"일자\")).date(), \"brand\": str(getattr(r, \"브랜드\", \"\")),\n        \"visits\": int(getattr(r, \"방문수\", 0) or 0),\n        \"new_visits\": int(getattr(r, \"신규방문\", 0) or 0),\n        \"returning_visits\": int(getattr(r, \"재방문\", 0) or 0),\n    } for r in df.itertuples(index=False)]\n\n\ndef order_rows(start: date, end: date) -> list[dict]:\n    \"\"\"주문 단위(재구매/취소/회원여부) → daily_orders 매핑.\"\"\"\n    df = _in_range(_read(\"orders\"), \"일자\", start, end)\n    if df.empty:\n        return []\n    df = df.rename(columns={\"일자\": \"date\", \"브랜드\": \"brand\", \"매출\": \"amount\",\n                            \"첫주문\": \"is_first\", \"취소\": \"is_cancel\",\n                            \"신규구매자\": \"is_new_buyer\"})\n    if \"is_new_buyer\" not in df.columns:   # 구(舊) 스냅샷 폴백: 회원 첫주문만\n        df[\"is_new_buyer\"] = df[\"is_first\"]\n    df[\"date\"] = pd.to_datetime(df[\"date\"]).dt.date\n    return [{\n        \"date\": r.date, \"mall_id\": str(r.mall_id), \"brand\": _canon(r.brand),\n        \"member_id\": str(r.member_id), \"order_id\": str(r.order_id),\n        \"sales_amount\": float(r.amount or 0),\n        \"is_first\": int(bool(r.is_first)), \"is_cancel\": int(bool(r.is_cancel)),\n        \"is_new_buyer\": int(bool(r.is_new_buyer)),\n    } for r in df.itertuples(index=False)]\n\n\ndef top_products(n: int = 6) -> list[dict]:\n    \"\"\"carts 스냅샷에서 조회수 상위 상품 → Clarity 데모 페이지 시딩용.\"\"\"\n    df = _read(\"carts\")\n    if df.empty:\n        return []\n    df = df.sort_values(\"조회수\", ascending=False).head(n)\n    out = []\n    for r in df.itertuples(index=False):\n        no = int(getattr(r, \"상품번호\", 0) or 0)\n        out.append({\n            \"brand\": _canon(getattr(r, \"브랜드\", \"\")),\n            \"name\": str(getattr(r, \"상품명\", \"\"))[:40],\n            \"url\": f\"/product/detail/{no}\",\n            \"views\": float(getattr(r, \"조회수\", 0) or 0),\n            \"cart_rate\": float(getattr(r, \"장바구니율\", 0) or 0),\n        })\n    return out\n\n\ndef _canon_brand_col(df: pd.DataFrame) -> pd.DataFrame:\n    if not df.empty and \"브랜드\" in df.columns:\n        df = df.copy()\n        df[\"브랜드\"] = df[\"브랜드\"].map(_canon)\n    return df\n\n\ndef demographics() -> pd.DataFrame:\n    \"\"\"연령·성별 광고 성과(스냅샷 집계, 일자 없음). dim ∈ age/gender/cross. 브랜드는 4개로 묶음.\"\"\"\n    return _canon_brand_col(_read(\"demo\"))\n\n\ndef has_demo_ad() -> bool:\n    \"\"\"소재(ad) 단위 연령·성별 데이터(메타 ad-level demo) 존재 여부.\"\"\"\n    return _exists(\"demo_ad\")\n\n\ndef demographics_ad() -> pd.DataFrame:\n    \"\"\"소재(ad) 단위 연령·성별 광고 성과. 컬럼: 일자·채널·브랜드·소재·성별·나이대·지출·노출·클릭·구매전환수·구매전환값.\"\"\"\n    return _read(\"demo_ad\")\n\n\ndef carts_df() -> pd.DataFrame:\n    \"\"\"상품별 조회수·장바구니수·장바구니율(스냅샷 집계).\"\"\"\n    return _canon_brand_col(_read(\"carts\"))\n\n\ndef product_sales_df() -> pd.DataFrame:\n    \"\"\"상품별 구매액·주문수(전체 합산). 일자 컬럼이 있으면 상품 단위로 합산(기존 호환).\"\"\"\n    df = _canon_brand_col(_read(\"products\"))\n    if df.empty or \"일자\" not in df.columns:\n        return df\n    df = df.copy()\n    for c in (\"구매액\", \"주문수\"):\n        if c in df.columns:\n            df[c] = pd.to_numeric(df[c], errors=\"coerce\").fillna(0)\n    keys = [c for c in (\"브랜드\", \"채널\", \"상품명\", \"상품URL\") if c in df.columns]\n    return df.groupby(keys, as_index=False).agg(구매액=(\"구매액\", \"sum\"), 주문수=(\"주문수\", \"sum\"))\n\n\ndef product_sales_daily() -> pd.DataFrame:\n    \"\"\"일자별 상품 구매액(카페24). 컬럼에 일자 포함 — 기간 필터용.\n    ⚠️ 브랜드는 raw 유지(에이징핏/안티칼알파 분리). 4개로 묶으면(_canon) 에이징핏 매출이\n    안티칼로 합쳐져 5개 브랜드 필터에서 누락된다 — 정규화는 호출부(to_brand5)에서 한다.\"\"\"\n    return _read(\"products\")\n\n\ndef new_buyer_sales_daily() -> pd.DataFrame:\n    \"\"\"일자별 신규구매자 상품매출(카페24, 서브브랜드 raw). 컬럼: 일자·브랜드·mall_id·매출.\n    신규구매자 주문(is_new_buyer)의 상품매출을 order_id→서브브랜드로 분배해 집계한 값 →\n    daily_orders(몰단위)로는 못 나누는 '서브브랜드별 신규구매자 매출'을 제공. 정규화는 호출부(to_brand5).\"\"\"\n    return _read(\"new_buyer_sales\")\n\n\ndef ad_status() -> pd.DataFrame:\n    \"\"\"소재(제품/ad_name) ON/OFF 상태 — 메타 effective_status. 컬럼: 제품·상태·active.\n    저금액 소재 점검에서 '캠페인 ON' 필터에 사용(매일 스냅샷 때 갱신).\"\"\"\n    return _read(\"ad_status\")\n\n\ndef has_ad_status() -> bool:\n    return _exists(\"ad_status\")\n\n\ndef meta_info() -> dict:\n    f = SNAP_DIR / \"meta.json\"\n    if not f.exists():\n        return {}\n    import json\n    try:\n        return json.loads(f.read_text(encoding=\"utf-8\"))\n    except Exception:  # noqa: BLE001\n        return {}\n", "analyzers/__init__.py": "\"\"\"분석기 패키지.\n\nperformance / funnel / anomaly / creative / root_cause 분석기를 제공한다.\n키가 없어도(내장 템플릿) 동작하고, AI 키가 있으면 LLM 서술로 업그레이드된다.\n\"\"\"\n", "analyzers/_common.py": "\"\"\"분석기 공용 — DB 로딩 + 기간 슬라이스 + 지표 계산.\"\"\"\nfrom __future__ import annotations\n\nfrom datetime import date, timedelta\n\nimport pandas as pd\n\nimport db\n\n# 표준 브랜드 4개 + 변형 병합(안티칼알파→안티칼, 시코랩→씨코랩)\nCANON_BRANDS = [\"안티칼\", \"림데이\", \"뉴로포커스\", \"씨코랩\"]\nBRAND_MAP = {\"안티칼알파\": \"안티칼\", \"시코랩\": \"씨코랩\"}\n\n\ndef norm_brand(s: pd.Series) -> pd.Series:\n    return s.astype(str).str.strip().replace(BRAND_MAP)\n\n\n# 과집계('장난질') 탐지 기본 기준: 전환매출이 크면서(≥5천만) 지출 대비 ROAS 가 비현실적(≥30배).\n# 어트리뷰션 중복/플랫폼 집계 오류로 한 세그먼트에 전환매출이 수억씩 잘못 잡히는 경우를 잡는다.\nOVERCOUNT_MIN_VALUE = 50_000_000\nOVERCOUNT_MIN_ROAS = 30.0\n\n\ndef flag_overcount(value, spend, min_value: float = OVERCOUNT_MIN_VALUE,\n                   min_roas: float = OVERCOUNT_MIN_ROAS) -> pd.Series:\n    \"\"\"과집계('장난질') 의심 마스크(bool Series) 반환.\n    전환매출(value)이 min_value 이상이고, 지출 대비 ROAS 가 min_roas 이상(또는 지출 0)인 행을\n    True 로 표시한다. 예: 구글 연령분석에서 지출 10만원에 전환매출 7.8억(ROAS 수백~수천배).\"\"\"\n    v = pd.to_numeric(pd.Series(value).reset_index(drop=True), errors=\"coerce\").fillna(0.0)\n    s = pd.to_numeric(pd.Series(spend).reset_index(drop=True), errors=\"coerce\").fillna(0.0)\n    roas = v / s.where(s > 0)                      # 지출 0 → NaN\n    absurd = (roas >= min_roas) | (s <= 0)         # ROAS 과대 또는 지출 0(=무한대)\n    mask = (v >= min_value) & absurd.fillna(True)\n    mask.index = pd.Index(getattr(value, \"index\", range(len(mask))))\n    return mask\n\n\n# ---------- 광고(daily_ads) 전용 브랜드 정규화 ----------\n# 광고 계정/소재를 5개 표준 브랜드로 묶는다. '에이징핏'은 안티칼 계정 안에서\n# 캠페인명으로만 갈리므로 캠페인 키워드를 우선 본다(키워드 없는 안티칼 계정 → 안티칼알파).\nAD_BRANDS = [\"안티칼알파max\", \"안티칼알파\", \"에이징핏\", \"림데이\", \"뉴로포커스\", \"씨코랩\"]\n\n\ndef ad_brand(account_name, campaign_name) -> str:\n    a = str(account_name)\n    c = str(campaign_name)\n    al = a.lower()\n    # 주의: '안티칼알파max'는 '안티칼알파'를 문자열로 포함하므로 **반드시 먼저** 검사한다.\n    # 순서를 바꾸면 max 소재가 전부 안티칼알파로 흡수된다.\n    # 2026-07-23: 실제 소재명은 영문 \"max\"가 아니라 한글 \"맥스\"라 기존 조건이 매칭 안 됐음 — \"맥스\" 추가(안티칼 계정/소재 문맥에서만, 오탐 방지).\n    cn = c.replace(\" \", \"\")\n    is_antical = (\"안티칼\" in a) or (\"antical\" in al) or (\"안티칼\" in cn)\n    if \"안티칼알파max\" in cn or \"알파max\" in cn or (\"맥스\" in cn and is_antical):\n        return \"안티칼알파max\"\n    if \"에이징핏\" in c or \"에이징\" in c:\n        return \"에이징핏\"\n    # PA 인플루언서 캠페인(예: 260716_PA_chuchu.toon_인툰_메타)은 캠페인명에 라인 키워드가 없어\n    # 예전엔 전부 default(안티칼알파)로 샜음. 현재 안티칼 PA(1+1 비밀특가 CRM) 인플루언서 프로그램은\n    # 에이징핏 전용이라 안티칼 계정의 PA 캠페인은 에이징핏으로 귀속(2026-07-23 사용자 확인).\n    # ※ 반드시 안티칼로 스코프 — 림데이도 'PA'(인튠) 캠페인이 있어 오적용 시 림데이가 에이징핏이 됨.\n    # 인스타튠(intune)은 림데이 전용이라 여기 걸리지 않는다. 참고: pa-influencer-brand-misattribution.\n    if is_antical and \"PA\" in c:\n        return \"에이징핏\"\n    if \"안티칼\" in a or \"antical\" in al:\n        return \"안티칼알파\"\n    if \"림데이\" in a or \"lymday\" in al:\n        return \"림데이\"\n    if \"뉴로포커스\" in a or \"neurofocus\" in al:\n        return \"뉴로포커스\"\n    if \"씨코랩\" in a or \"시코랩\" in a or \"cicolab\" in al:\n        return \"씨코랩\"\n    return a  # 알 수 없는 계정은 원본 유지\n\n\n# 매출(daily_sales)용 5개 표준 브랜드 정규화. 안티칼(베이스)→안티칼알파, 시코랩→씨코랩.\n# (광고와 달리 매출은 상품명 기반이라 안티칼알파/에이징핏이 이미 분리돼 들어옴)\n_BRAND5_MAP = {\"안티칼\": \"안티칼알파\", \"시코랩\": \"씨코랩\"}\n_CAFE24_MALLS = {\"antical\", \"lymday\", \"neurofocus\", \"cicolab\"}\n\n\ndef to_brand5(s: pd.Series) -> pd.Series:\n    return s.astype(str).str.strip().replace(_BRAND5_MAP)\n\n\ndef channel_of(mall_id) -> str:\n    m = str(mall_id)\n    if m == \"coupang\":\n        return \"쿠팡\"\n    if m == \"smartstore\":\n        return \"스마트스토어\"\n    return \"카페24\"\n\n\ndef load_sales5() -> pd.DataFrame:\n    \"\"\"daily_sales 를 5개 표준 브랜드 + 판매채널(카페24/쿠팡/스마트스토어)로 로드.\"\"\"\n    try:\n        df = pd.read_sql_table(\"daily_sales\", db.engine, parse_dates=[\"date\"])\n    except ValueError:\n        return pd.DataFrame()\n    if df.empty:\n        return df\n    df = df.copy()\n    df[\"brand\"] = to_brand5(df[\"brand\"])\n    df[\"채널\"] = df[\"mall_id\"].map(channel_of)\n    return df\n\n\ndef add_ad_brand(df: pd.DataFrame) -> pd.DataFrame:\n    \"\"\"daily_ads 프레임에 5개 표준 브랜드 'brand' 컬럼을 추가.\"\"\"\n    if df.empty or \"account_name\" not in df.columns:\n        return df\n    df = df.copy()\n    camp = df[\"campaign_name\"] if \"campaign_name\" in df.columns else pd.Series([\"\"] * len(df), index=df.index)\n    df[\"brand\"] = [ad_brand(a, c) for a, c in zip(df[\"account_name\"], camp)]\n    return df\n\n\ndef _norm(df: pd.DataFrame, cols: list[str]) -> pd.DataFrame:\n    if df.empty:\n        return df\n    for c in cols:\n        if c in df.columns:\n            df[c] = norm_brand(df[c])\n    return df\n\n\ndef load_ads() -> pd.DataFrame:\n    try:\n        df = pd.read_sql_table(\"daily_ads\", db.engine, parse_dates=[\"date\"])\n    except ValueError:\n        return pd.DataFrame()\n    return _norm(df, [\"account_name\", \"account_id\"])\n\n\ndef load_sales() -> pd.DataFrame:\n    try:\n        df = pd.read_sql_table(\"daily_sales\", db.engine, parse_dates=[\"date\"])\n    except ValueError:\n        return pd.DataFrame()\n    return _norm(df, [\"brand\"])\n\n\ndef load_visitors() -> pd.DataFrame:\n    try:\n        df = pd.read_sql_table(\"daily_visitors\", db.engine, parse_dates=[\"date\"])\n    except ValueError:\n        return pd.DataFrame()\n    return _norm(df, [\"brand\"])\n\n\ndef load_orders() -> pd.DataFrame:\n    try:\n        df = pd.read_sql_table(\"daily_orders\", db.engine, parse_dates=[\"date\"])\n    except ValueError:\n        return pd.DataFrame()\n    return _norm(df, [\"brand\"])\n\n\ndef load_ga4() -> pd.DataFrame:\n    try:\n        return pd.read_sql_table(\"ga4_landing\", db.engine, parse_dates=[\"date\"])\n    except ValueError:\n        return pd.DataFrame()\n\n\ndef load_ga4_pages() -> pd.DataFrame:\n    try:\n        return pd.read_sql_table(\"ga4_pages\", db.engine, parse_dates=[\"date\"])\n    except ValueError:\n        return pd.DataFrame()\n\n\ndef load_ga4_traffic() -> pd.DataFrame:\n    \"\"\"채널(소스/매체) x 랜딩페이지별 유입. ga4_landing 과 달리 '어디서 왔나'를 안다.\"\"\"\n    try:\n        return pd.read_sql_table(\"ga4_traffic\", db.engine, parse_dates=[\"date\"])\n    except ValueError:\n        return pd.DataFrame()\n\n\ndef load_clarity() -> pd.DataFrame:\n    try:\n        return pd.read_sql_table(\"clarity_pages\", db.engine, parse_dates=[\"date\"])\n    except ValueError:\n        return pd.DataFrame()\n\n\ndef ref_date(df: pd.DataFrame) -> date | None:\n    \"\"\"데이터가 존재하는 가장 최근 날짜(=오늘 기준).\"\"\"\n    if df.empty:\n        return None\n    return df[\"date\"].max().date()\n\n\ndef _between(df: pd.DataFrame, start: date, end: date) -> pd.DataFrame:\n    if df.empty:\n        return df\n    d = df[\"date\"].dt.date\n    return df[(d >= start) & (d <= end)]\n\n\ndef ad_metrics(df: pd.DataFrame) -> dict:\n    \"\"\"광고 DataFrame → 집계 지표 dict (17개 중 광고측).\"\"\"\n    if df.empty:\n        return {k: 0.0 for k in (\n            \"impressions\", \"clicks\", \"cost\", \"conversions\", \"conv_value\",\n            \"reach\", \"roas\", \"cpm\", \"cpc\", \"ctr\", \"cvr\", \"frequency\")}\n    imp = df[\"impressions\"].sum()\n    clk = df[\"clicks\"].sum()\n    cost = df[\"cost\"].sum()\n    conv = df[\"conversions\"].sum()\n    val = df[\"conv_value\"].sum()\n    reach = df[\"reach\"].sum()\n    return {\n        \"impressions\": float(imp), \"clicks\": float(clk), \"cost\": float(cost),\n        \"conversions\": float(conv), \"conv_value\": float(val), \"reach\": float(reach),\n        \"roas\": float(val / cost) if cost else 0.0,\n        \"cpm\": float(cost / imp * 1000) if imp else 0.0,\n        \"cpc\": float(cost / clk) if clk else 0.0,\n        \"ctr\": float(clk / imp * 100) if imp else 0.0,\n        \"cvr\": float(conv / clk * 100) if clk else 0.0,\n        \"frequency\": float(df[\"frequency\"].replace(0, pd.NA).mean() or 0.0),\n    }\n\n\ndef clarity_metrics(df: pd.DataFrame) -> dict:\n    if df.empty:\n        return {k: 0.0 for k in (\n            \"visits\", \"avg_scroll_depth\", \"avg_session_duration\",\n            \"dead_clicks\", \"rage_clicks\", \"exit_rate\")}\n    visits = df[\"visits\"].sum()\n    # 방문 가중 평균\n    def wavg(col):\n        return float((df[col] * df[\"visits\"]).sum() / visits) if visits else 0.0\n    return {\n        \"visits\": float(visits),\n        \"avg_scroll_depth\": wavg(\"avg_scroll_depth\"),\n        \"avg_session_duration\": wavg(\"avg_session_duration\"),\n        \"dead_clicks\": float(df[\"dead_clicks\"].sum()),\n        \"rage_clicks\": float(df[\"rage_clicks\"].sum()),\n        \"exit_rate\": wavg(\"exit_rate\"),\n    }\n\n\ndef period_metrics(ads: pd.DataFrame, clar: pd.DataFrame, ref: date) -> dict:\n    \"\"\"오늘 / 어제 / 최근7일 / 최근30일 지표 묶음.\"\"\"\n    windows = {\n        \"today\": (ref, ref),\n        \"yesterday\": (ref - timedelta(days=1), ref - timedelta(days=1)),\n        \"last7\": (ref - timedelta(days=6), ref),\n        \"last30\": (ref - timedelta(days=29), ref),\n    }\n    out = {}\n    for name, (s, e) in windows.items():\n        out[name] = {\n            \"ads\": ad_metrics(_between(ads, s, e)),\n            \"clarity\": clarity_metrics(_between(clar, s, e)),\n        }\n    return out\n\n\ndef pct_change(cur: float, base: float) -> float | None:\n    if base == 0:\n        return None\n    return round((cur - base) / base * 100, 1)\n", "analyzers/anomaly_detector.py": "\"\"\"이상치 탐지 — 롤링 기준선 대비 z-score 로 급변 지표를 잡아낸다.\n\n광고(ROAS/CPC/CTR/Spend)와 Clarity(이탈률/rage/dead/체류)를 일자별 시계열로\n만들고, 마지막 날 값이 직전 N일 분포에서 얼마나 벗어났는지 평가한다.\n\"\"\"\nfrom __future__ import annotations\n\nfrom datetime import date\n\nimport pandas as pd\n\nfrom analyzers import _common as C\n\nZ_THRESHOLD = 2.0\n\n\ndef _daily_ads_series() -> pd.DataFrame:\n    ads = C.load_ads()\n    if ads.empty:\n        return pd.DataFrame()\n    g = ads.groupby(ads[\"date\"].dt.date).agg(\n        impressions=(\"impressions\", \"sum\"), clicks=(\"clicks\", \"sum\"),\n        cost=(\"cost\", \"sum\"), conv_value=(\"conv_value\", \"sum\"),\n        conversions=(\"conversions\", \"sum\")).reset_index(names=\"date\")\n    g[\"ROAS\"] = g[\"conv_value\"] / g[\"cost\"].replace(0, pd.NA)\n    g[\"CTR\"] = g[\"clicks\"] / g[\"impressions\"].replace(0, pd.NA) * 100\n    g[\"CPC\"] = g[\"cost\"] / g[\"clicks\"].replace(0, pd.NA)\n    g[\"Spend\"] = g[\"cost\"]\n    return g\n\n\ndef _daily_clarity_series() -> pd.DataFrame:\n    clar = C.load_clarity()\n    if clar.empty:\n        return pd.DataFrame()\n    g = clar.groupby(clar[\"date\"].dt.date).apply(\n        lambda d: pd.Series({\n            \"이탈률\": (d[\"exit_rate\"] * d[\"visits\"]).sum() / d[\"visits\"].sum() if d[\"visits\"].sum() else 0,\n            \"체류시간\": (d[\"avg_session_duration\"] * d[\"visits\"]).sum() / d[\"visits\"].sum() if d[\"visits\"].sum() else 0,\n            \"RageClick\": d[\"rage_clicks\"].sum(),\n            \"DeadClick\": d[\"dead_clicks\"].sum(),\n        }), include_groups=False).reset_index(names=\"date\")\n    return g\n\n\ndef _flag(series: pd.Series, higher_is_bad: bool) -> dict | None:\n    s = series.dropna()\n    if len(s) < 5:\n        return None\n    cur = s.iloc[-1]\n    base = s.iloc[:-1]\n    mu, sd = base.mean(), base.std(ddof=0)\n    if sd == 0:\n        return None\n    z = (cur - mu) / sd\n    bad = (z > Z_THRESHOLD) if higher_is_bad else (z < -Z_THRESHOLD)\n    if abs(z) < Z_THRESHOLD:\n        return None\n    return {\"current\": round(float(cur), 2), \"baseline\": round(float(mu), 2),\n            \"z\": round(float(z), 2), \"is_bad\": bool(bad),\n            \"direction\": \"급등\" if z > 0 else \"급락\"}\n\n\ndef detect(ref: date | None = None) -> list[dict]:\n    out = []\n    ads = _daily_ads_series()\n    if not ads.empty:\n        for col, bad_high in [(\"ROAS\", False), (\"CTR\", False), (\"CPC\", True), (\"Spend\", True)]:\n            f = _flag(ads[col], higher_is_bad=bad_high)\n            if f:\n                out.append({\"metric\": col, \"source\": \"ads\", **f})\n    clar = _daily_clarity_series()\n    if not clar.empty:\n        for col, bad_high in [(\"이탈률\", True), (\"RageClick\", True), (\"DeadClick\", True), (\"체류시간\", False)]:\n            f = _flag(clar[col], higher_is_bad=bad_high)\n            if f:\n                out.append({\"metric\": col, \"source\": \"clarity\", **f})\n    # 나쁜 이상치 우선, z 절대값 큰 순\n    out.sort(key=lambda x: (not x[\"is_bad\"], -abs(x[\"z\"])))\n    return out\n", "analyzers/creative_analyzer.py": "\"\"\"크리에이티브(광고영상) 분석기.\n\n광고 영상 → Vision → 후킹 분석 → 댓글 분석 → 성과 비교 → 약점 진단 → 새 기획안.\ncreative_analysis.md 프롬프트 + Vision(이미지 프레임) 호출.\nAI/이미지가 없으면 메트릭 기반 템플릿 진단으로 폴백한다.\n\nframes 인자: 영상에서 추출한 캡처 이미지 경로 리스트(특히 첫 3초).\n\"\"\"\nfrom __future__ import annotations\n\nimport json\nimport re\n\nfrom ai import client\n\nCREATIVE_POWER_ITEMS = [\"오프닝 후킹\", \"스토리텔링\", \"신뢰 및 증거\", \"구매 혜택 및 트리거\",\n                        \"클로징 & CTA\", \"시청각적 연출\", \"모바일 가독성\"]\n\n\ndef _parse_power(text: str | None) -> dict | None:\n    \"\"\"AI 응답에서 소재력 JSON 추출·검증.\"\"\"\n    if not text:\n        return None\n    m = re.search(r\"\\{.*\\}\", text, re.S)\n    if not m:\n        return None\n    try:\n        d = json.loads(m.group(0))\n    except (json.JSONDecodeError, ValueError):\n        return None\n    items = {i.get(\"항목\"): i for i in d.get(\"items\", []) if isinstance(i, dict)}\n    ordered = [items.get(k, {\"항목\": k, \"레벨\": \"중\", \"진단\": \"-\", \"수정가이드\": \"-\"})\n               for k in CREATIVE_POWER_ITEMS]\n    # 하이브리드: AI가 자율로 추가한 '브랜드 핵심 소구점' 항목은 뒤에 유지\n    if \"브랜드 핵심 소구점\" in items:\n        ordered.append(items[\"브랜드 핵심 소구점\"])\n    d[\"items\"] = ordered\n    d.setdefault(\"overall\", {\"가능성\": \"보통\", \"점수\": 50, \"요약\": \"-\"})\n    # 자유 통찰(ai_insights)은 있으면 그대로 보존 (없으면 손대지 않음)\n    return d\n\n\n# ── A) 규칙 기반(무료·키 불필요) 소재력 채점 ──\nPOWER_RULES = {\n    \"오프닝 후킹\": {\"kw\": [\"?\", \"!\", \"비밀\", \"충격\", \"단 하나\", \"멈춰\", \"이것\", \"왜\", \"진짜\", \"3초\", \"경고\", \"주목\", \"놀라\", \"실화\", \"단돈\"], \"scope\": \"head\"},\n    \"스토리텔링\": {\"kw\": [\"제가\", \"경험\", \"처음\", \"그런데\", \"결국\", \"변화\", \"비교\", \"실제\", \"리얼\", \"후기\", \"솔직\", \"반전\"], \"neg\": [\"성분\", \"함량\", \"mg\", \"밀리그램\", \"조성\", \"원료\"]},\n    \"신뢰 및 증거\": {\"kw\": [\"인증\", \"시험\", \"임상\", \"적용\", \"후기\", \"리뷰\", \"특허\", \"의사\", \"전문가\", \"수상\", \"검증\", \"공식\", \"%\", \"퍼센트\", \"보장\"]},\n    \"구매 혜택 및 트리거\": {\"kw\": [\"할인\", \"특가\", \"무료\", \"마감\", \"한정\", \"오늘\", \"1+1\", \"증정\", \"종료\", \"혜택\", \"이벤트\", \"최저\", \"단독\", \"쿠폰\"]},\n    \"클로징 & CTA\": {\"kw\": [\"지금\", \"클릭\", \"구매\", \"링크\", \"담기\", \"신청\", \"바로\", \"확인\", \"더보기\", \"눌러\", \"프로필\", \"구경\"]},\n    \"시청각적 연출\": {\"kw\": [\"자막\", \"효과음\", \"클로즈업\", \"비포애프터\", \"전환\", \"연출\"], \"neg\": [\"과장\", \"자극\", \"혐오\", \"공포\", \"도배\", \"깜빡\"], \"visual\": True},\n    \"모바일 가독성\": {\"visual_aspect\": True},\n}\nPOWER_GUIDES = {\n    \"오프닝 후킹\": \"첫 1.5초에 질문·충격·결과 선공개형 후킹을 넣으세요.\",\n    \"스토리텔링\": \"제품 설명 대신 실제 사용자의 변화 과정(리얼리티)을 담으세요.\",\n    \"신뢰 및 증거\": \"인체적용시험·인증마크·리뷰 등 객관적 근거를 반드시 삽입하세요.\",\n    \"구매 혜택 및 트리거\": \"실제 재고·기간 기반의 정직한 혜택 안내로 신뢰를 지키세요.\",\n    \"클로징 & CTA\": \"랜딩과 자연스럽게 연결되는 혜택(첫 구매 할인 등)을 명확히 제시하세요.\",\n    \"시청각적 연출\": \"자극적 장면 대신 제품 사용·효과 장면을 깔끔하게 연출하세요.\",\n    \"모바일 가독성\": \"9:16 세로 비율 + 자막을 크게 유지하세요.\",\n}\n\n\ndef _lvl(pos: int, neg: int = 0) -> str:\n    s = pos - neg\n    return \"상\" if s >= 2 else (\"중\" if s >= 1 else \"하\")\n\n\n# ── 브랜드별 핵심 소구점 사전 (초안 — 담당자가 추후 교체·보강) ──\n# 각 브랜드: core=핵심 작용기전(필수), appeals={카테고리: [신호 키워드...]}\n# 소재명/스크립트에 키워드가 있으면 해당 소구점이 '반영됨'으로 본다.\nBRAND_APPEALS = {\n    \"안티칼알파\": {\n        \"core\": \"작용기전(탄수·칼로리 차단)\",\n        \"appeals\": {\n            \"작용기전(탄수·칼로리 차단)\": [\"안티칼\", \"탄수\", \"칼로리\", \"흡수\", \"차단\", \"화이트빈\", \"깍지콩\", \"가르시니아\", \"키토\"],\n            \"감량 결과·속도\": [\"빠지\", \"감량\", \"지흡\", \"지방흡입\", \"사이즈\", \"kg\", \"킬로\", \"날씬\", \"다이어트\", \"체지방\"],\n            \"성분·원산지 신뢰\": [\"미국\", \"성분\", \"함량\", \"원료\", \"특허\", \"인증\", \"fda\", \"임상\", \"적용시험\"],\n            \"후기·증거\": [\"후기\", \"리뷰\", \"위리뷰\", \"실사용\", \"전후\", \"비포\", \"인증샷\", \"실화\"],\n            \"가격·혜택·긴급성\": [\"할인\", \"특가\", \"최저\", \"마감\", \"한정\", \"오늘\", \"이벤트\", \"증정\", \"발주\", \"품절\", \"못삼\"],\n        },\n    },\n    \"에이징핏\": {\n        \"core\": \"노화·탄력 개선 기전\",\n        \"appeals\": {\n            \"노화·탄력 개선 기전\": [\"노화\", \"노화세포\", \"탄력\", \"처짐\", \"처진\", \"불독살\", \"리프팅\", \"콜라겐\", \"항노화\", \"안티에이징\", \"탱탱\"],\n            \"미백·피부톤\": [\"미백\", \"피부톤\", \"화이트\", \"표백\", \"색소\", \"잡티\", \"브라이트\", \"톤업\"],\n            \"변화·비포애프터\": [\"9배\", \"미친\", \"추구미\", \"변화\", \"달라\", \"전후\", \"비포\", \"황후\", \"동안\"],\n            \"성분·증거\": [\"성분\", \"함량\", \"임상\", \"인증\", \"특허\", \"시험\", \"리뷰\", \"후기\", \"적용시험\"],\n            \"혜택·긴급성\": [\"할인\", \"특가\", \"마감\", \"한정\", \"오늘\", \"죄송\", \"이벤트\", \"증정\", \"최저\"],\n        },\n    },\n    \"림데이\": {\n        \"core\": \"림프순환 기전\",\n        \"appeals\": {\n            \"림프순환 기전\": [\"림프\", \"순환\", \"림프순환\", \"클렌즈\", \"막혀\", \"부종\", \"노폐물\", \"배출\", \"디톡스\"],\n            \"부기·무다리\": [\"부기\", \"붓\", \"무다리\", \"다리\", \"코끼리\", \"붓기\", \"슬림\", \"종아리\"],\n            \"셀럽·인플루언서 신뢰\": [\"임블리\", \"인플루언서\", \"셀럽\", \"65만\", \"협찬\", \"찐템\", \"임블리템\"],\n            \"감량·정체기돌파\": [\"마운자로\", \"정체기\", \"감량\", \"다이어트\", \"살\", \"체중\"],\n            \"루틴·지속결과\": [\"매일\", \"했더니\", \"20초\", \"찐\", \"루틴\", \"꾸준\", \"습관\"],\n        },\n    },\n}\n# 소재명 접두 별칭 → 표준 브랜드 (예: '안티칼_...', '안티칼_에이징핏_...')\n_BRAND_ALIASES = [(\"에이징핏\", \"에이징핏\"), (\"에이징\", \"에이징핏\"),\n                  (\"안티칼알파\", \"안티칼알파\"), (\"안티칼\", \"안티칼알파\"),\n                  (\"림데이\", \"림데이\")]\n\n\ndef detect_brand(name: str, script: str = \"\") -> str | None:\n    \"\"\"소재명/스크립트에서 브랜드 자동 감지. 없으면 None.\"\"\"\n    hay = f\"{name} {script}\"\n    for a, b in _BRAND_ALIASES:      # 더 구체적인 별칭 우선\n        if a in hay:\n            return b\n    return None\n\n\ndef score_brand_appeal(brand: str, name: str, script: str = \"\") -> dict | None:\n    \"\"\"브랜드 핵심 소구점이 소재에 얼마나 반영됐나 → 상/중/하 (엄격: 핵심기전 필수).\n    상 = 핵심기전 포함 + 소구점 카테고리 3개 이상 / 중 = 1~2개 / 하 = 0개.\"\"\"\n    conf = BRAND_APPEALS.get(brand)\n    if not conf:\n        return None\n    hay = f\"{name} {script}\"\n    core_cat = conf[\"core\"]\n    hit_cats, core_hit = [], False\n    for cat, kws in conf[\"appeals\"].items():\n        if any(k in hay for k in kws):\n            hit_cats.append(cat)\n            if cat == core_cat:\n                core_hit = True\n    n, total = len(hit_cats), len(conf[\"appeals\"])\n    if core_hit and n >= 3:\n        lv = \"상\"\n    elif n >= 1:\n        lv = \"중\"\n    else:\n        lv = \"하\"\n    diag = f\"[{brand}] 소구점 {n}/{total} 반영: {', '.join(hit_cats) or '없음'}\"\n    if not core_hit:\n        diag += f\" · ⚠️핵심기전({core_cat}) 미반영\"\n    if lv == \"상\":\n        guide = \"핵심 소구점이 충분히 담김 — 현재 방향 유지.\"\n    else:\n        need = ([f\"핵심기전({core_cat})\"] if not core_hit else []) + \\\n               [c for c in conf[\"appeals\"] if c not in hit_cats and c != core_cat][:2]\n        guide = \"보강 필요 소구점: \" + \", \".join(need) if need else \"핵심기전은 담되 소구점 다양화 필요.\"\n    return {\"항목\": \"브랜드 핵심 소구점\", \"레벨\": lv, \"진단\": diag, \"수정가이드\": guide}\n\n\ndef _brand_ref_block(name: str, script: str = \"\") -> str:\n    \"\"\"Gemini 프롬프트에 붙일 [브랜드 참고] 블록. 브랜드 미감지 시 빈 문자열.\n    소구점은 '참고용'으로만 주고, 판정은 영상 실제 전달력으로 AI가 자율.\"\"\"\n    brand = detect_brand(name, script)\n    conf = BRAND_APPEALS.get(brand) if brand else None\n    if not conf:\n        return \"\"\n    cats = \"\\n\".join(f\"  - {c} (참고 키워드: {', '.join(kw[:5])})\"\n                     for c, kw in conf[\"appeals\"].items())\n    return (f\"\\n\\n[브랜드 참고: {brand}] 아래 소구점은 '참고용'이다 — 키워드 유무가 아니라 \"\n            f\"영상이 각 소구점을 **실제로 얼마나 잘 살렸는지**로 판단하라.\\n{cats}\\n\"\n            f\"핵심 작용기전(영상이 반드시 납득시켜야 '상'): {conf['core']}\\n\"\n            f\"→ items 끝에 '브랜드 핵심 소구점' 항목을 추가하고, 진단에 살린/놓친 소구점을 적어라.\")\n\n\ndef analyze_power_rules(name: str, script: str = \"\", aspect: float | None = None) -> dict:\n    \"\"\"규칙 기반(무료) 소재력 채점. 텍스트=키워드 신호, 모바일가독성=영상 비율.\"\"\"\n    txt = str(script or \"\")\n    head, has_text = txt[:60], bool(txt.strip())\n    items = []\n    for cat, rule in POWER_RULES.items():\n        if rule.get(\"visual_aspect\"):\n            if aspect is None:\n                lv, diag, guide = \"중\", \"영상 비율 정보 없음(텍스트만 입력).\", POWER_GUIDES[cat]\n            elif aspect <= 0.85:\n                lv, diag, guide = \"상\", f\"세로 비율(≈{aspect:.2f}) — 모바일 최적.\", \"현재 비율 유지.\"\n            elif aspect <= 1.2:\n                lv, diag, guide = \"중\", f\"정사각 비율(≈{aspect:.2f}).\", \"피드/릴스엔 9:16 세로 권장.\"\n            else:\n                lv, diag, guide = \"하\", f\"가로 비율(≈{aspect:.2f}) — 모바일 몰입도 낮음.\", \"9:16 세로로 재편집.\"\n            items.append({\"항목\": cat, \"레벨\": lv, \"진단\": diag, \"수정가이드\": guide})\n            continue\n        if not has_text and not rule.get(\"visual\"):\n            items.append({\"항목\": cat, \"레벨\": \"중\", \"진단\": \"스크립트 미입력 — 텍스트 판정 불가(중립).\",\n                          \"수정가이드\": \"대본/기획 문구를 넣으면 정확히 판정됩니다.\"})\n            continue\n        scope = head if rule.get(\"scope\") == \"head\" else txt\n        found = [k for k in rule.get(\"kw\", []) if k in scope]\n        neg = [k for k in rule.get(\"neg\", []) if k in txt]\n        lv = _lvl(len(found), len(neg))\n        diag = f\"긍정 신호 {len(found)}개({', '.join(found[:4])})\" if found else \"관련 신호 미발견\"\n        if neg:\n            diag += f\" · 감점 {len(neg)}개({', '.join(neg[:3])})\"\n        guide = \"현재 방향 유지.\" if lv == \"상\" else POWER_GUIDES.get(cat, \"-\")\n        items.append({\"항목\": cat, \"레벨\": lv, \"진단\": diag, \"수정가이드\": guide})\n    # 8) 브랜드 핵심 소구점 반영도 (브랜드 자동 감지 시에만 추가)\n    brand = detect_brand(name, script)\n    brand_note = \"\"\n    if brand:\n        bi = score_brand_appeal(brand, name, script)\n        if bi:\n            items.append(bi)\n            brand_note = f\" · {brand} 소구점 '{bi['레벨']}'\"\n    score = round(sum({\"상\": 2, \"중\": 1, \"하\": 0}.get(i[\"레벨\"], 1) for i in items) / (len(items) * 2) * 100)\n    poss = \"높음\" if score >= 67 else (\"보통\" if score >= 34 else \"낮음\")\n    n_high = sum(1 for i in items if i[\"레벨\"] == \"상\")\n    return {\"overall\": {\"가능성\": poss, \"점수\": score,\n                        \"요약\": f\"규칙 기반 채점(무료·키없음) · {len(items)}항목 중 '상' {n_high}개{brand_note}.\"}, \"items\": items}\n\n\ndef analyze_power_gemini(name: str, frames: list[str] | None = None, script: str = \"\",\n                         video_meta: str = \"\") -> dict | None:\n    \"\"\"B) Google Gemini(무료 티어) REST 호출 소재력 채점. GEMINI_API_KEY 필요.\n\n    video_meta = 영상에서 cv2로 자동측정한 메타(길이·컷수·샷길이·비율 등) 텍스트.\n    박자감·속도감 판정을 실측 근거로 뒷받침하고, '영상판독' 리포트에 반영된다.\n    \"\"\"\n    import base64\n    import os\n\n    import requests\n    key = os.getenv(\"GEMINI_API_KEY\", \"\").strip()\n    if not key:\n        return None\n    nframes = len((frames or [])[:6])\n    system = client.load_prompt(\"creative_power\") or \"\"\n    prompt = (f\"{system}\\n\\n소재명: {name}\\n\"\n              f\"[영상 메타(자동측정)] {video_meta.strip() or '(측정 없음)'}\\n\"\n              f\"[첨부 프레임] {nframes}장(영상에서 균등 추출한 정지 이미지, 오디오 없음)\\n\"\n              f\"[소재 스크립트/설명]\\n\"\n              f\"{script.strip() or '(텍스트 없음 — 첨부 프레임의 전체 방향성으로 판단)'}\"\n              f\"{_brand_ref_block(name, script)}\\n\\n위 지시대로 순수 JSON만 출력.\")\n    parts = [{\"text\": prompt}]\n    for fp in (frames or [])[:6]:\n        try:\n            data = base64.b64encode(open(fp, \"rb\").read()).decode()\n        except OSError:\n            continue\n        mime = \"image/jpeg\" if fp.lower().endswith((\".jpg\", \".jpeg\")) else \"image/png\"\n        parts.append({\"inline_data\": {\"mime_type\": mime, \"data\": data}})\n    model = os.getenv(\"GEMINI_MODEL\", \"gemini-3.6-flash\").strip()\n    url = (\"https://generativelanguage.googleapis.com/v1beta/models/\"\n           f\"{model}:generateContent?key={key}\")\n    try:\n        r = requests.post(url, json={\"contents\": [{\"parts\": parts}]}, timeout=90)\n        r.raise_for_status()\n        text = r.json()[\"candidates\"][0][\"content\"][\"parts\"][0][\"text\"]\n    except Exception:  # noqa: BLE001\n        return None\n    return _parse_power(text)\n\n\n_VIDEO_MIME = {\"mp4\": \"video/mp4\", \"mov\": \"video/quicktime\", \"webm\": \"video/webm\",\n               \"m4v\": \"video/x-m4v\", \"avi\": \"video/x-msvideo\"}\n\n\ndef _gemini_upload_video(path: str, key: str, mime: str, poll_timeout: int = 150):\n    \"\"\"Gemini File API 로 영상 업로드 → 처리(ACTIVE) 완료되면 {uri,name,mime} 반환. 실패/지연 시 None.\"\"\"\n    import os\n    import time\n\n    import requests\n    try:\n        size = os.path.getsize(path)\n        base = \"https://generativelanguage.googleapis.com\"\n        start = requests.post(\n            f\"{base}/upload/v1beta/files?key={key}\",\n            headers={\"X-Goog-Upload-Protocol\": \"resumable\", \"X-Goog-Upload-Command\": \"start\",\n                     \"X-Goog-Upload-Header-Content-Length\": str(size),\n                     \"X-Goog-Upload-Header-Content-Type\": mime, \"Content-Type\": \"application/json\"},\n            json={\"file\": {\"display_name\": os.path.basename(path)}}, timeout=30)\n        up_url = start.headers.get(\"X-Goog-Upload-URL\")\n        if not up_url:\n            return None\n        with open(path, \"rb\") as fh:\n            body = fh.read()\n        up = requests.post(up_url, headers={\"Content-Length\": str(size), \"X-Goog-Upload-Offset\": \"0\",\n                           \"X-Goog-Upload-Command\": \"upload, finalize\"}, data=body, timeout=180)\n        info = up.json().get(\"file\", {})\n        fname, uri, state = info.get(\"name\"), info.get(\"uri\"), info.get(\"state\")\n        if not fname or not uri:\n            return None\n        deadline = time.time() + poll_timeout\n        while state == \"PROCESSING\" and time.time() < deadline:\n            time.sleep(3)\n            g = requests.get(f\"{base}/v1beta/{fname}?key={key}\", timeout=30).json()\n            state, uri = g.get(\"state\"), g.get(\"uri\", uri)\n        if state != \"ACTIVE\":\n            return None\n        return {\"uri\": uri, \"name\": fname, \"mime\": mime}\n    except Exception:  # noqa: BLE001\n        return None\n\n\ndef analyze_power_gemini_video(name: str, video_path: str, script: str = \"\",\n                               video_meta: str = \"\") -> dict | None:\n    \"\"\"B+) 영상 파일 «전체(영상+음성)»를 Gemini File API 로 올려 이해시켜 소재력 채점.\n    내레이션·자막·BGM·효과음·화면전환까지 반영. 업로드/처리 실패 시 None(호출측이 프레임 방식으로 폴백).\"\"\"\n    import os\n\n    import requests\n    key = os.getenv(\"GEMINI_API_KEY\", \"\").strip()\n    if not key or not video_path:\n        return None\n    ext = str(video_path).lower().rsplit(\".\", 1)[-1]\n    mime = _VIDEO_MIME.get(ext, \"video/mp4\")\n    up = _gemini_upload_video(video_path, key, mime)\n    if not up:\n        return None\n    system = client.load_prompt(\"creative_power\") or \"\"\n    prompt = (f\"{system}\\n\\n소재명: {name}\\n\"\n              f\"[영상 메타(자동측정)] {video_meta.strip() or '(측정 없음)'}\\n\"\n              \"★ 이번 분석은 아래 첨부한 «영상 파일 전체(영상+음성)»를 직접 받는다 — 프롬프트 위쪽의 \"\n              \"'오디오 미반영/정지 프레임만 본다' 전제는 이 경우 적용하지 말고, **실제로 들은 내레이션·자막·\"\n              \"BGM·효과음과 화면 전환·움직임을 근거로** 판단하라. 영상판독의 분석근거에 '영상+음성 직접 청취'를 명시.\\n\"\n              f\"[소재 스크립트/설명]\\n{script.strip() or '(입력 없음 — 영상의 음성/자막에서 직접 파악)'}\"\n              f\"{_brand_ref_block(name, script)}\\n\\n위 지시대로 순수 JSON만 출력.\")\n    model = os.getenv(\"GEMINI_MODEL\", \"gemini-3.6-flash\").strip()\n    url = (\"https://generativelanguage.googleapis.com/v1beta/models/\"\n           f\"{model}:generateContent?key={key}\")\n    text = None\n    try:\n        payload = {\"contents\": [{\"parts\": [\n            {\"text\": prompt},\n            {\"file_data\": {\"mime_type\": up[\"mime\"], \"file_uri\": up[\"uri\"]}}]}]}\n        r = requests.post(url, json=payload, timeout=180)\n        r.raise_for_status()\n        text = r.json()[\"candidates\"][0][\"content\"][\"parts\"][0][\"text\"]\n    except Exception:  # noqa: BLE001\n        text = None\n    try:  # 업로드 파일 정리(48h 자동삭제지만 즉시 정리)\n        requests.delete(f\"https://generativelanguage.googleapis.com/v1beta/{up['name']}?key={key}\", timeout=15)\n    except Exception:  # noqa: BLE001\n        pass\n    return _parse_power(text)\n\n\ndef analyze_power(name: str, frames: list[str] | None = None, script: str = \"\") -> dict | None:\n    \"\"\"셋팅 전 소재 '방향성' 점검 → 7항목 소재력 체크리스트(dict). 성과 데이터 미사용.\"\"\"\n    frames = frames or []\n    system = client.load_prompt(\"creative_power\")\n    if not system:\n        return None\n    user = (f\"소재명: {name}\\n\\n[소재 스크립트/설명]\\n\"\n            f\"{script.strip() or '(텍스트 설명 없음 — 첨부 프레임으로 소재 전체 방향성을 판단)'}\\n\\n\"\n            \"위 지시대로 순수 JSON만 출력하세요.\")\n    out = None\n    if frames:\n        out = client.vision(system, user, frames, max_tokens=1800)\n    elif script.strip():\n        out = client.complete(system, user, max_tokens=1800)\n    return _parse_power(out)\n\n\ndef analyze(creative: dict, frames: list[str] | None = None,\n            comments: list[str] | None = None) -> dict:\n    \"\"\"creative = {name, ctr, cpc, roas, hook_rate, benchmark:{...}} 형태.\"\"\"\n    frames = frames or []\n    comments = comments or []\n    system = client.load_prompt(\"creative_analysis\")\n\n    perf_text = json.dumps({\"creative\": creative, \"comments\": comments},\n                           ensure_ascii=False)\n    user = (\"아래 영상 프레임(첨부 이미지)과 성과/댓글을 바탕으로 지시한 분석을 수행하세요.\\n\\n\"\n            + perf_text)\n\n    ai_out = None\n    if system:\n        if frames:\n            ai_out = client.vision(system, user, frames, max_tokens=2500)\n        else:\n            ai_out = client.complete(\n                system, user + \"\\n\\n(영상 프레임 이미지는 제공되지 않았습니다. \"\n                \"성과/댓글 기반으로 가능한 범위에서 진단하세요.)\", max_tokens=2500)\n\n    return {\"report_md\": ai_out or _fallback(creative, comments),\n            \"ai_used\": bool(ai_out), \"had_frames\": bool(frames)}\n\n\ndef _fallback(creative: dict, comments: list[str]) -> str:\n    name = creative.get(\"name\", \"광고영상\")\n    ctr = creative.get(\"ctr\", 0)\n    roas = creative.get(\"roas\", 0)\n    hook = creative.get(\"hook_rate\")  # 3초 시청률\n    bench = creative.get(\"benchmark\", {})\n    weak_hook = hook is not None and bench.get(\"hook_rate\") and hook < bench[\"hook_rate\"]\n    weak_roas = bench.get(\"roas\") and roas < bench[\"roas\"]\n\n    L = [f\"# 🎬 크리에이티브 분석 — {name}\",\n         \"> ⚠️ AI/Vision 키 미설정 또는 프레임 미제공 → 성과 기반 규칙 진단입니다.\",\n         \"\", \"## 1. 후킹 분석\",\n         (f\"- 3초 시청률 {hook}% 가 벤치마크({bench.get('hook_rate')}%) 미만 → \"\n          \"**\\\"이 영상은 첫 3초 후킹이 약합니다.\\\"** (Medium)\"\n          if weak_hook else \"- 후킹 지표는 벤치마크 수준. 프레임 제공 시 시각적 후킹 정밀 진단 가능.\")]\n    L += [\"## 2. 메시지 & CTA\",\n          (\"- ROAS 가 벤치마크 미만 → **\\\"이 CTA가 ROAS를 떨어뜨립니다.\\\"** \"\n           \"CTA 문구/위치 재검토 필요 (Medium).\"\n           if weak_roas else \"- CTA는 평균 수준. A/B로 위치·문구 추가 최적화 권장.\")]\n    L += [\"## 3. 댓글 분석\",\n          (f\"- 수집 댓글 {len(comments)}건. 반복 반론/이의 키워드를 다음 기획에 반영 권장.\"\n           if comments else \"- 댓글 미수집. 댓글을 넣으면 반론·이탈 사유를 함께 분석합니다.\")]\n    L += [\"## 4. 성과 비교\",\n          f\"- CTR {ctr}% / ROAS {roas}x (벤치마크 CTR {bench.get('ctr','-')}% · ROAS {bench.get('roas','-')}x).\"]\n    L += [\"\", \"## 새로운 광고 기획안\",\n          \"- **후킹 시안 3개**: (1)문제제기형 3초 (2)결과선공개형 (3)비교/반전형\",\n          \"- **메시지/CTA**: 핵심 베네핏을 첫 1.5초에, CTA는 영상 후반+자막 동시 노출\",\n          \"- **포맷**: 9:16 세로 · 12~18초 · 자막 필수 · 썸네일은 결과 이미지\",\n          \"- **기대효과(가설)**: 3초 시청률 +30%, CTR +0.4%p → ROAS 회복\",\n          \"- **측정지표**: hook rate, thumb-stop, CTR, CVR, ROAS\"]\n    return \"\\n\".join(L)\n", "analyzers/funnel_analyzer.py": "\"\"\"퍼널/Clarity 분석기 — 상세페이지 UX 분석 (Clarity 6대 질문).\n\nClarity → 상세페이지 분석 → AI → 인사이트 의 핵심 단계.\n1.가장 이탈이 심한 위치  2.Rage Click  3.Dead Click\n4.체류시간  5.가장 많이 본 상세페이지  6.개선해야 할 영역\n을 데이터로 도출하고, clarity_analysis.md 프롬프트로 서술을 생성한다.\n\"\"\"\nfrom __future__ import annotations\n\nimport json\nimport re\nfrom datetime import date, timedelta\n\nfrom ai import client\nfrom analyzers import _common as C\n\n# 상품 상세페이지 패턴 (cafe24 short-url /surl/p/NN, 일반 /product/...)\n_DETAIL_RE = re.compile(r\"/surl/[a-z]/\\d+|/product/\")\n# 분석에서 제외할 유틸/기능 페이지(가입완료·쿠폰·장바구니·주문·로그인 등)\n_UTILITY_RE = re.compile(\n    r\"/member/|/order|/cart|/login|/join|result|/coupon|/mypage|/board|/exec/\")\n\n\ndef _is_detail(url: str) -> bool:\n    return bool(_DETAIL_RE.search(url))\n\n\ndef _is_utility(url: str) -> bool:\n    return bool(_UTILITY_RE.search(url))\n\n\ndef _agg_by_url(df):\n    \"\"\"기간 내 URL별 방문가중 집계.\"\"\"\n    if df.empty:\n        return []\n    g = df.groupby([\"url\", \"page_title\"], as_index=False).agg(\n        visits=(\"visits\", \"sum\"),\n        dead_clicks=(\"dead_clicks\", \"sum\"),\n        rage_clicks=(\"rage_clicks\", \"sum\"),\n        quick_backs=(\"quick_backs\", \"sum\"),\n    )\n    # 방문가중 평균 지표\n    def wavg(sub, col):\n        v = sub[\"visits\"].sum()\n        return float((sub[col] * sub[\"visits\"]).sum() / v) if v else 0.0\n    metas = []\n    for url in g[\"url\"]:\n        sub = df[df[\"url\"] == url]\n        metas.append({\n            \"scroll\": round(wavg(sub, \"avg_scroll_depth\"), 1),\n            \"dur\": round(wavg(sub, \"avg_session_duration\"), 1),\n            \"exit\": round(wavg(sub, \"exit_rate\"), 1),\n        })\n    out = g.to_dict(\"records\")\n    for r, m in zip(out, metas):\n        r.update(m)\n        r[\"rage_rate\"] = round(r[\"rage_clicks\"] / r[\"visits\"] * 100, 2) if r[\"visits\"] else 0\n        r[\"dead_rate\"] = round(r[\"dead_clicks\"] / r[\"visits\"] * 100, 2) if r[\"visits\"] else 0\n    return out\n\n\ndef answer_six(ref: date | None = None, lookback: int = 7,\n               start: date | None = None, end: date | None = None) -> dict:\n    \"\"\"Clarity 6대 질문에 데이터로 답한다.\n    start/end 를 주면 그 기간을 '현재 창'으로, 직전 동일 길이 기간을 비교군으로 쓴다.\"\"\"\n    clar = C.load_clarity()\n    if start is not None and end is not None:\n        cur_start, ref = start, end\n        window = max(1, (end - start).days + 1)\n        prev_lo, prev_hi = cur_start - timedelta(days=window), cur_start - timedelta(days=1)\n    else:\n        ref = ref or C.ref_date(clar)\n        if ref is None:\n            return {\"ref\": None, \"pages\": [], \"answers\": {}}\n        cur_start = ref - timedelta(days=lookback - 1)\n        prev_lo, prev_hi = cur_start - timedelta(days=lookback), cur_start - timedelta(days=1)\n\n    cur = C._between(clar, cur_start, ref)\n    pages = _agg_by_url(cur)\n    if not pages:\n        return {\"ref\": ref.isoformat(), \"pages\": [], \"answers\": {}}\n\n    # 저트래픽(UTM 단편 등) 페이지가 '최악 이탈'을 왜곡하지 않도록 최소 방문 필터\n    min_visits = max(20, 0.01 * sum(p[\"visits\"] for p in pages))\n    pages = [p for p in pages if p[\"visits\"] >= min_visits] or pages\n\n    # '상세페이지 분석' 취지에 맞게 상품 상세페이지에 초점(없으면 유틸 제외 전체).\n    detail = [p for p in pages if _is_detail(p[\"url\"])]\n    focus = detail or [p for p in pages if not _is_utility(p[\"url\"])] or pages\n    # 체류 비교는 리다이렉트(체류 0초)성 페이지 제외\n    dwell = [p for p in focus if p[\"dur\"] > 0] or focus\n\n    worst_exit = max(focus, key=lambda p: p[\"exit\"])\n    worst_rage = max(focus, key=lambda p: p[\"rage_rate\"])\n    worst_dead = max(focus, key=lambda p: p[\"dead_rate\"])\n    most_viewed = max(focus, key=lambda p: p[\"visits\"])\n    shortest = min(dwell, key=lambda p: p[\"dur\"])\n\n    # 이탈률 추세(이번주 vs 지난주)로 변화량\n    prev = C._between(clar, prev_lo, prev_hi)\n    prev_pages = {p[\"url\"]: p for p in _agg_by_url(prev)}\n    we_url = worst_exit[\"url\"]\n    prev_exit = prev_pages.get(we_url, {}).get(\"exit\")\n    exit_trend = C.pct_change(worst_exit[\"exit\"], prev_exit) if prev_exit else None\n\n    answers = {\n        \"q1_worst_exit\": {\"url\": worst_exit[\"url\"], \"title\": worst_exit[\"page_title\"],\n                          \"exit_rate\": worst_exit[\"exit\"], \"trend_pct\": exit_trend},\n        \"q2_rage\": {\"url\": worst_rage[\"url\"], \"rage_clicks\": worst_rage[\"rage_clicks\"],\n                    \"rage_rate\": worst_rage[\"rage_rate\"]},\n        \"q3_dead\": {\"url\": worst_dead[\"url\"], \"dead_clicks\": worst_dead[\"dead_clicks\"],\n                    \"dead_rate\": worst_dead[\"dead_rate\"]},\n        \"q4_duration\": {\"url\": shortest[\"url\"], \"avg_session_duration\": shortest[\"dur\"],\n                        \"scroll_depth\": shortest[\"scroll\"]},\n        \"q5_most_viewed\": {\"url\": most_viewed[\"url\"], \"title\": most_viewed[\"page_title\"],\n                           \"visits\": most_viewed[\"visits\"]},\n        \"q6_improve\": _improve_areas(focus),\n    }\n    return {\"ref\": ref.isoformat(), \"pages\": pages, \"answers\": answers}\n\n\ndef _improve_areas(pages: list[dict]) -> list[dict]:\n    \"\"\"개선 우선순위 = 이탈률·rage·dead 를 방문수로 가중한 점수 상위.\"\"\"\n    scored = []\n    for p in pages:\n        score = (p[\"exit\"] * 1.0 + p[\"rage_rate\"] * 8 + p[\"dead_rate\"] * 4) * (p[\"visits\"] ** 0.5)\n        scored.append({\"url\": p[\"url\"], \"title\": p[\"page_title\"], \"score\": round(score, 1),\n                       \"exit\": p[\"exit\"], \"rage_rate\": p[\"rage_rate\"], \"dead_rate\": p[\"dead_rate\"]})\n    return sorted(scored, key=lambda x: x[\"score\"], reverse=True)[:3]\n\n\ndef ads_health(ref: date | None, lookback: int = 7) -> dict:\n    \"\"\"광고가 '건강한지' 요약 — 인사이트에서 '광고는 좋은데' 판정에 사용.\"\"\"\n    ads = C.load_ads()\n    ref = ref or C.ref_date(ads)\n    if ref is None:\n        return {\"healthy\": False, \"roas\": 0, \"ctr\": 0}\n    start = ref - timedelta(days=lookback - 1)\n    m = C.ad_metrics(C._between(ads, start, ref))\n    healthy = m[\"roas\"] >= 2.0 and m[\"ctr\"] >= 1.0\n    return {\"healthy\": healthy, \"roas\": round(m[\"roas\"], 2),\n            \"ctr\": round(m[\"ctr\"], 2), \"cpc\": round(m[\"cpc\"], 0)}\n\n\ndef analyze(ref: date | None = None, start: date | None = None,\n            end: date | None = None) -> dict:\n    six = answer_six(ref, start=start, end=end)\n    if not six[\"answers\"]:\n        return {\"six\": six, \"report_md\": \"Clarity 데이터가 없습니다.\", \"ads\": {}}\n    ads = ads_health(date.fromisoformat(six[\"ref\"]))\n\n    system = client.load_prompt(\"clarity_analysis\")\n    user = (\"아래는 Clarity 상세페이지 행동 데이터와 광고 건강도입니다(JSON).\\n\\n\"\n            + json.dumps({\"reference_date\": six[\"ref\"], \"ads_health\": ads,\n                          \"six_answers\": six[\"answers\"], \"pages\": six[\"pages\"]},\n                         ensure_ascii=False, default=str))\n    ai_out = client.complete(system, user, max_tokens=2500) if system else None\n    return {\"six\": six, \"ads\": ads,\n            \"report_md\": ai_out or _fallback(six, ads), \"ai_used\": bool(ai_out)}\n\n\ndef _fallback(six: dict, ads: dict) -> str:\n    a = six[\"answers\"]\n    we = a[\"q1_worst_exit\"]\n    trend = f\"(지난주 대비 ▲{we['trend_pct']}%)\" if we.get(\"trend_pct\") else \"\"\n    head = (\"광고는 좋은데\" if ads.get(\"healthy\") else \"광고 효율도 점검이 필요하며\")\n    L = [f\"## 핵심 요약 (한 문장)\",\n         f\"{head}, **{we['title']}({we['url']})에서 이탈률 {we['exit_rate']}%{trend}** 로 \"\n         f\"사이트 내부에서 전환이 새고 있습니다. (광고 ROAS {ads.get('roas')}x · CTR {ads.get('ctr')}%)\",\n         \"\",\n         \"## 1. 가장 이탈이 심한 위치\",\n         f\"- **{we['url']}** — 이탈률 **{we['exit_rate']}%** {trend}\",\n         \"## 2. Rage Click\",\n         f\"- **{a['q2_rage']['url']}** — {a['q2_rage']['rage_clicks']}회 (방문대비 {a['q2_rage']['rage_rate']}%). \"\n         \"버튼/요소가 눌리지 않아 반복 클릭했을 가능성(High).\",\n         \"## 3. Dead Click\",\n         f\"- **{a['q3_dead']['url']}** — {a['q3_dead']['dead_clicks']}회 (방문대비 {a['q3_dead']['dead_rate']}%). \"\n         \"클릭 가능해 보이나 반응 없는 요소(이미지/비활성 버튼) 의심(High).\",\n         \"## 4. 체류시간\",\n         f\"- 최단 체류 **{a['q4_duration']['url']}** — 평균 {a['q4_duration']['avg_session_duration']}초, \"\n         f\"스크롤 {a['q4_duration']['scroll_depth']}%. 첫 화면에서 가치 전달 실패 가능(Medium).\",\n         \"## 5. 가장 많이 본 상세페이지\",\n         f\"- **{a['q5_most_viewed']['url']}** — {a['q5_most_viewed']['visits']:,} 방문. \"\n         \"트래픽이 몰리는 만큼 개선 효과도 가장 큼.\",\n         \"## 6. 개선해야 할 영역\"]\n    for i, it in enumerate(a[\"q6_improve\"], 1):\n        L.append(f\"{i}. **{it['url']}** (이탈 {it['exit']}% · rage {it['rage_rate']}% · dead {it['dead_rate']}%)\")\n    L += [\"\", \"## 디자이너 전달 액션 (우선순위순)\",\n          f\"1. {we['url']} 첫 화면(above the fold)·핵심 CTA 재배치, rage/dead click 좌표 히트맵 확인\",\n          \"2. 반응 없는 요소(dead click) 인터랙션 추가 또는 제거\",\n          \"3. 로딩/이미지 최적화로 초반 체류 이탈 방지\"]\n    return \"\\n\".join(L)\n", "analyzers/performance_analyzer.py": "\"\"\"성과 분석기 — 17개 지표를 오늘/어제/7일/30일로 비교.\n\nmarketing_analysis.md(시니어 퍼포먼스 분석가 프롬프트)를 사용한다.\nAI 키가 있으면 LLM 서술, 없으면 내장 한국어 템플릿으로 ①~⑥ 리포트를 생성한다.\n\"\"\"\nfrom __future__ import annotations\n\nimport json\nfrom datetime import date\n\nfrom ai import client\nfrom analyzers import _common as C\n\n# (지표키, 한글명, 단위, 높을수록좋은가)\nAD_METRICS = [\n    (\"roas\", \"ROAS\", \"x\", True), (\"cost\", \"Spend(광고비)\", \"₩\", None),\n    (\"cpm\", \"CPM\", \"₩\", False), (\"cpc\", \"CPC\", \"₩\", False),\n    (\"ctr\", \"CTR\", \"%\", True), (\"cvr\", \"전환율\", \"%\", True),\n    (\"conversions\", \"구매(Purchase)\", \"건\", True),\n    (\"conv_value\", \"구매가치\", \"₩\", True),\n    (\"frequency\", \"Frequency\", \"\", None), (\"reach\", \"Reach\", \"명\", True),\n    (\"impressions\", \"Impression\", \"회\", None),\n]\nCLARITY_METRICS = [\n    (\"avg_scroll_depth\", \"Scroll Depth\", \"%\", True),\n    (\"dead_clicks\", \"Dead Click\", \"회\", False),\n    (\"rage_clicks\", \"Rage Click\", \"회\", False),\n    (\"avg_session_duration\", \"Session Duration\", \"초\", True),\n    (\"exit_rate\", \"이탈률\", \"%\", False),\n]\n\n\ndef _delta_row(label, unit, good, cur, y, w7, w30):\n    return {\n        \"metric\": label, \"unit\": unit, \"good_high\": good,\n        \"today\": round(cur, 2),\n        \"vs_yesterday\": C.pct_change(cur, y),\n        \"vs_7d_avg\": C.pct_change(cur, w7),\n        \"vs_30d_avg\": C.pct_change(cur, w30),\n    }\n\n\ndef build_facts(ref: date | None = None) -> dict:\n    ads, clar = C.load_ads(), C.load_clarity()\n    ref = ref or C.ref_date(ads) or C.ref_date(clar)\n    if ref is None:\n        return {\"ref\": None, \"rows\": [], \"pm\": {}}\n\n    pm = C.period_metrics(ads, clar, ref)\n    rows = []\n    for key, label, unit, good in AD_METRICS:\n        rows.append(_delta_row(\n            label, unit, good,\n            pm[\"today\"][\"ads\"][key], pm[\"yesterday\"][\"ads\"][key],\n            pm[\"last7\"][\"ads\"][key] / 7, pm[\"last30\"][\"ads\"][key] / 30\n            if unit in (\"₩\", \"회\", \"명\", \"건\") else pm[\"last7\"][\"ads\"][key],\n        ) if unit in (\"₩\", \"회\", \"명\", \"건\") else _delta_row(\n            label, unit, good,\n            pm[\"today\"][\"ads\"][key], pm[\"yesterday\"][\"ads\"][key],\n            pm[\"last7\"][\"ads\"][key], pm[\"last30\"][\"ads\"][key],\n        ))\n    for key, label, unit, good in CLARITY_METRICS:\n        if unit == \"회\":  # 합계성 → 일평균 비교\n            rows.append(_delta_row(\n                label, unit, good,\n                pm[\"today\"][\"clarity\"][key], pm[\"yesterday\"][\"clarity\"][key],\n                pm[\"last7\"][\"clarity\"][key] / 7, pm[\"last30\"][\"clarity\"][key] / 30))\n        else:\n            rows.append(_delta_row(\n                label, unit, good,\n                pm[\"today\"][\"clarity\"][key], pm[\"yesterday\"][\"clarity\"][key],\n                pm[\"last7\"][\"clarity\"][key], pm[\"last30\"][\"clarity\"][key]))\n    return {\"ref\": ref.isoformat(), \"rows\": rows, \"pm\": pm}\n\n\ndef _fallback_report(facts: dict) -> str:\n    ref = facts[\"ref\"]\n    pm = facts[\"pm\"]\n    t, y = pm[\"today\"], pm[\"yesterday\"]\n    roas = t[\"ads\"][\"roas\"]\n    roas_chg = C.pct_change(roas, y[\"ads\"][\"roas\"])\n    exit_now = t[\"clarity\"][\"exit_rate\"]\n    exit_chg = C.pct_change(exit_now, y[\"clarity\"][\"exit_rate\"])\n\n    def arrow(v):\n        if v is None:\n            return \"—\"\n        return f\"▲{v}%\" if v > 0 else (f\"▼{abs(v)}%\" if v < 0 else \"0%\")\n\n    lines = [f\"# 📈 퍼포먼스 마케팅 분석 ({ref})\", \"\"]\n    lines.append(\"> ⚠️ AI 키(ANTHROPIC_API_KEY) 미설정 → 규칙 기반 자동 리포트입니다. \"\n                 \"키를 넣으면 시니어 분석가 프롬프트로 심층 서술이 생성됩니다.\")\n    lines.append(\"\")\n    lines.append(\"## 지표 변화 (오늘 vs 어제 / 7일평균 / 30일평균)\")\n    lines.append(\"| 지표 | 오늘 | vs어제 | vs7일 | vs30일 |\")\n    lines.append(\"|---|---:|---:|---:|---:|\")\n    for r in facts[\"rows\"]:\n        lines.append(f\"| {r['metric']} | {r['today']:,} | {arrow(r['vs_yesterday'])} \"\n                     f\"| {arrow(r['vs_7d_avg'])} | {arrow(r['vs_30d_avg'])} |\")\n    lines += [\n        \"\", \"## ① Executive Summary\",\n        f\"- 통합 ROAS **{roas:.2f}x** (어제 대비 {arrow(roas_chg)}). \"\n        f\"광고 유입 효율은 대체로 유지되는 반면, 사이트 내 **이탈률이 {exit_now:.1f}%**\"\n        f\"(어제 대비 {arrow(exit_chg)})로 상승해 전환 손실 위험이 큽니다.\",\n        \"\", \"## ② Root Cause\",\n        \"- **High**: 광고 클릭→상세페이지 진입은 정상인데, 상세페이지 체류/스크롤이 짧아지고 \"\n        \"rage/dead click 이 늘어 *페이지 내부 UX 병목*이 1순위 원인.\",\n        \"- **Medium**: 특정 캠페인의 타겟 확장으로 유입 품질이 일부 희석되었을 가능성.\",\n        \"- **Low**: 시즌성/요일 효과.\",\n        \"\", \"## ③ Opportunities\",\n        \"- 이탈 급증 상세페이지의 *첫 화면(above the fold)·CTA·로딩요소*를 개선하면 \"\n        \"동일 광고비로 전환율 회복 여지가 큼.\",\n        \"\", \"## ④ Risks\",\n        \"- 광고비는 유지되는데 이탈만 늘면 **ROAS 추가 하락**으로 직결.\",\n        \"\", \"## ⑤ Recommended Actions\",\n        \"1. 이탈 1위 상세페이지의 rage/dead click 좌표를 디자이너에게 즉시 전달(자동).\",\n        \"2. 첫 3초 후킹/CTA 가설 A·B 테스트.\",\n        \"3. 유입 품질 저하 캠페인 타겟 재점검.\",\n        \"\", \"## ⑥ Priority\", \"- **High**: 상세페이지 UX 수정 · 디자이너 핸드오프\",\n        \"- **Medium**: 캠페인 타겟 점검\", \"- **Low**: 시즌성 모니터링\",\n    ]\n    return \"\\n\".join(lines)\n\n\ndef analyze(ref: date | None = None) -> dict:\n    facts = build_facts(ref)\n    if not facts[\"rows\"]:\n        return {\"facts\": facts, \"report_md\": \"데이터가 없습니다. `python main.py` 로 수집/데모 적재를 먼저 실행하세요.\"}\n\n    system = client.load_prompt(\"marketing_analysis\")\n    user = (\"아래는 오늘/어제/최근7일/최근30일 집계 지표입니다(JSON). \"\n            \"이 데이터로 지시한 분석을 수행하세요.\\n\\n\"\n            + json.dumps({\"reference_date\": facts[\"ref\"], \"metrics\": facts[\"rows\"],\n                          \"aggregates\": facts[\"pm\"]}, ensure_ascii=False, default=str))\n    ai_out = client.complete(system, user, max_tokens=3000) if system else None\n    return {\"facts\": facts, \"report_md\": ai_out or _fallback_report(facts),\n            \"ai_used\": bool(ai_out)}\n", "analyzers/root_cause_engine.py": "\"\"\"루트코즈 엔진 — 신호 통합 → 디자이너 전달용 인사이트 생성.\n\n성과(performance) + 퍼널/Clarity(funnel) + 이상치(anomaly) 를 합쳐\n'광고는 좋은데 상세페이지 X%에서 이탈률 증가' 형태의 핵심 인사이트를 만든다.\n이 인사이트가 handoff(디자이너 자동 전달)의 입력이 된다.\n\"\"\"\nfrom __future__ import annotations\n\nfrom datetime import date\n\nfrom analyzers import anomaly_detector, funnel_analyzer\n\n\ndef _severity(exit_rate: float, trend: float | None) -> str:\n    if exit_rate >= 40 or (trend and trend >= 20):\n        return \"High\"\n    if exit_rate >= 30 or (trend and trend >= 10):\n        return \"Medium\"\n    return \"Low\"\n\n\ndef primary_insight(ref: date | None = None) -> dict | None:\n    \"\"\"가장 시급한 인사이트 1건(디자이너 전달 대상).\"\"\"\n    funnel = funnel_analyzer.analyze(ref)\n    if not funnel.get(\"six\", {}).get(\"answers\"):\n        return None\n\n    a = funnel[\"six\"][\"answers\"]\n    we = a[\"q1_worst_exit\"]\n    ads = funnel[\"ads\"]\n    anomalies = anomaly_detector.detect(ref)\n\n    healthy = ads.get(\"healthy\")\n    head = \"광고는 좋은데\" if healthy else \"광고 효율 점검과 별개로\"\n    trend = we.get(\"trend_pct\")\n    trend_txt = f\" (지난주 대비 ▲{trend}%)\" if trend else \"\"\n\n    title = f\"{head} 상세페이지 {we['exit_rate']}%에서 이탈률 증가\"\n    summary = (f\"{head} **{we['title']}({we['url']})** 에서 이탈률이 \"\n               f\"**{we['exit_rate']}%**{trend_txt} 로 상승했습니다. \"\n               f\"(광고 ROAS {ads.get('roas')}x · CTR {ads.get('ctr')}%) \"\n               f\"Rage {a['q2_rage']['rage_clicks']}회 · Dead {a['q3_dead']['dead_clicks']}회.\")\n\n    severity = _severity(we[\"exit_rate\"], trend)\n\n    # 디자이너용 본문(= funnel 리포트 + 이상치 요약)\n    anomaly_md = \"\"\n    if anomalies:\n        bad = [x for x in anomalies if x[\"is_bad\"]][:4]\n        if bad:\n            anomaly_md = \"\\n\\n## 🚨 이상 급변 감지\\n\" + \"\\n\".join(\n                f\"- **{x['metric']}** {x['direction']} (현재 {x['current']} / 기준 {x['baseline']}, z={x['z']})\"\n                for x in bad)\n\n    body_md = (f\"# 🎯 디자이너 전달 브리프\\n\\n## 핵심\\n{summary}{anomaly_md}\\n\\n\"\n               f\"---\\n\\n{funnel['report_md']}\")\n\n    return {\n        \"kind\": \"clarity\",\n        \"title\": title,\n        \"severit
