      & ad[\"campaign_name\"].astype(str).str.contains(re.escape(qq), case=False, na=False)].copy()\n        m = m_all[(m_all[\"d\"] >= pv_start) & (m_all[\"d\"] <= pv_end)]\n        if not recs and m_all.empty:\n            st.info(f\"‘{qq}’ 로 검색된 소재가 없습니다. (검증전 기록·집행 데이터 모두 없음)\")\n        else:\n            colp, cola = st.columns(2)\n            with colp:\n                st.markdown(\"**🧪 검증전 예측 (소재력)**\")\n                if recs:\n                    r0 = recs[0]\n                    ov = r0.get(\"overall\", {})\n                    st.markdown(f\"소재명 `{r0.get('소재명','')}` · {r0.get('방식','-')} · {r0.get('분석일','')}\")\n                    st.markdown(f\"예측 → **가능성 {ov.get('가능성','?')} · {ov.get('점수','?')}점**\")\n                    with st.expander(\"항목별 상세 (7항목 + 브랜드 소구점 + AI 통찰)\"):\n                        render_power(r0)\n                    if len(recs) > 1:\n                        st.caption(f\"※ 매칭 기록 {len(recs)}건 중 최신 1건 표시.\")\n                else:\n                    st.info(\"검증전 예측 기록 없음 (공란).\")\n            with cola:\n                st.markdown(\"**✅ 실제 집행 결과**\")\n                if not m_all.empty:\n                    # 운영중/운영종료 판정은 조회 기간과 무관하게 전체 이력 기준(현재 상태를 보여줘야 하므로)\n                    active_all = m_all[m_all[\"cost\"] > 0]\n                    if not active_all.empty:\n                        first_day, last_day = active_all[\"d\"].min(), active_all[\"d\"].max()\n                        if last_day >= latest:\n                            status = f\"🟢 **운영중** · {first_day}부터 집행\"\n                        else:\n                            status = f\"⏸️ **운영종료** · {first_day} ~ {last_day} 운영\"\n                    else:\n                        status = \"지출 기록 없음\"\n                    st.markdown(status)\n                    st.caption(f\"📅 아래 집계는 선택한 조회 기간(**{pv_start} ~ {pv_end}**) 기준입니다.\")\n                    if m.empty:\n                        st.info(\"선택한 조회 기간에는 집행 데이터가 없습니다(전체 기간에는 있음 — 기간을 넓혀보세요).\")\n                    else:\n                        gg = m.groupby(\"platform\").agg(cost=(\"cost\", \"sum\"), cv=(\"conv_value\", \"sum\"))\n                        tcost, tcv = float(gg[\"cost\"].sum()), float(gg[\"cv\"].sum())\n                        st.markdown(f\"총지출 **{won(tcost)}** · 통합 ROAS **{(tcv/tcost*100 if tcost else 0):.0f}%**\")\n                        best, lines = None, []\n                        for pf, ko in [(\"meta\", \"메타\"), (\"tiktok\", \"틱톡\"), (\"google\", \"구글\")]:\n                            if pf in gg.index and gg.loc[pf, \"cost\"] > 0:\n                                c = float(gg.loc[pf, \"cost\"])\n                                ro = gg.loc[pf, \"cv\"] / c * 100\n                                lines.append(f\"- {ko}: {won(c)} · ROAS {ro:.0f}%\")\n                                if best is None or ro > best[1]:\n                                    best = (ko, ro)\n                            else:\n                                lines.append(f\"- {ko}: —\")\n                        st.markdown(\"\\n\".join(lines))\n                        if best:\n                            st.markdown(f\"최고효율 → **{best[0]} {best[1]:.0f}%**\")\n                        st.caption(f\"소재 {m['campaign_name'].nunique()}종 집계 · 채널 ROAS는 플랫폼 자체 보고(기여) 기준.\")\n                else:\n                    st.info(\"실제 집행 데이터 없음 (공란).\")\n", "dashboards/demographics_report.py": "\"\"\"연령·성별 광고 분석 대시보드.\n\n데이터: cafe24-dashboard 스냅샷 demo (채널·브랜드·성별·나이대별 광고 성과).\ndim = age(나이대별) / gender(성별별) / cross(성별×나이대 교차).\n※ 일자 차원이 없는 스냅샷 집계이므로 '현재 기준' 분석이다.\n\n실행:  streamlit run dashboards/demographics_report.py\n\"\"\"\nfrom __future__ import annotations\n\nimport sys\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parent.parent\nsys.path.insert(0, str(ROOT))\n\nimport numpy as np  # noqa: E402\nimport pandas as pd  # noqa: E402\nimport plotly.express as px  # noqa: E402\nimport streamlit as st  # noqa: E402\n\nfrom collectors import cafe24_snapshot as S  # noqa: E402\n\nPLAT_KO = {\"메타\": \"메타\", \"구글\": \"구글\", \"틱톡\": \"틱톡\"}\n# 성별 색을 모든 그래프에서 고정 (남성=파랑, 여성=핑크, 미상=회색)\nGENDER_COLORS = {\"남성\": \"#4C7DF0\", \"여성\": \"#EF6FA6\", \"미상\": \"#9AA5B4\"}\nGENDER_ORDER = [\"남성\", \"여성\", \"미상\"]\n\ntry:\n    st.set_page_config(page_title=\"연령·성별 광고 분석\", layout=\"wide\")\nexcept Exception:\n    pass\nfrom analyzers import _common as C  # noqa: E402\nfrom dashboards._style import brand_pills, fmt_df, inject_css, page_intro  # noqa: E402\ninject_css()\n\n\n@st.cache_data(ttl=600)\ndef load() -> pd.DataFrame:\n    return S.demographics()\n\n\ndef derive(d: pd.DataFrame) -> pd.DataFrame:\n    d = d.copy()\n    d[\"브랜드\"] = C.to_brand5(d[\"브랜드\"])  # 5개 브랜드(안티칼→안티칼알파), 에이징핏 분리 유지\n    if \"일자\" in d.columns:\n        d[\"일자\"] = pd.to_datetime(d[\"일자\"], errors=\"coerce\")\n    for c in [\"지출\", \"노출\", \"클릭\", \"구매전환수\", \"구매전환값\"]:\n        d[c] = pd.to_numeric(d[c], errors=\"coerce\").fillna(0)\n    d[\"ROAS\"] = d[\"구매전환값\"] / d[\"지출\"].replace(0, np.nan)\n    d[\"CTR\"] = d[\"클릭\"] / d[\"노출\"].replace(0, np.nan) * 100\n    d[\"CPC\"] = d[\"지출\"] / d[\"클릭\"].replace(0, np.nan)\n    return d\n\n\nCHAN_PLAT = {\"메타\": \"meta\", \"구글\": \"google\", \"틱톡\": \"tiktok\"}  # 상단 채널 → 광고 플랫폼\nPERIOD_DAYS = {\"최근 1일\": 1, \"최근 7일\": 7, \"최근 14일\": 14, \"최근 21일\": 21, \"최근 28일\": 28}\n\n\n@st.cache_data(ttl=600)\ndef _load_ads_df() -> pd.DataFrame:\n    return C.add_ad_brand(C.load_ads())\n\n\ndef _ctype(name) -> str:\n    n = str(name)\n    if \"범퍼\" in n:\n        return \"범퍼형\"\n    if \"영상\" in n or \".mp4\" in n.lower() or \"동영상\" in n:\n        return \"영상\"\n    if \"이미지\" in n:\n        return \"이미지\"\n    return \"기타\"\n\n\n@st.cache_data(ttl=600)\ndef _load_demo_ad() -> pd.DataFrame:\n    return S.demographics_ad()\n\n\ndemo = load()\nst.title(\"👥 연령·성별 광고 분석\")\npage_intro(\"광고가 어떤 성별·연령대에서 효율이 좋은지 분석합니다(메타·구글). \"\n           \"상단에서 기간·브랜드·채널을 선택해 보세요.\")\n\nif demo.empty:\n    st.warning(\"연령·성별(demo) 데이터가 없습니다. 개요의 ‘실시간 API 취합’(cafe24 포함) 실행.\")\n    st.stop()\n\ndemo = derive(demo)\n_ads_all = _load_ads_df()\n_ad_plats = set(_ads_all[\"platform\"].unique()) if not _ads_all.empty else set()\n# 브랜드: 5개 표준 순서로(있는 것만). demo 집계엔 에이징핏이 없어(안티칼로만 집계) 광고/소재 데이터까지\n# 합쳐 5개를 노출한다 — 에이징핏은 소재(ad-level) 섹션에서만 분리 표시된다.\n_brand_pool = set(demo[\"브랜드\"]) | (set(_ads_all[\"brand\"]) if not _ads_all.empty else set())\nbrands = [b for b in C.AD_BRANDS if b in _brand_pool] or sorted(demo[\"브랜드\"].dropna().unique())\nchans = [k for k, v in CHAN_PLAT.items() if (k in set(demo[\"채널\"])) or (v in _ad_plats)]\nhas_date = (\"일자\" in demo.columns) and demo[\"일자\"].notna().any()\n\n# 상단 필터 (최근 N일 · 브랜드 · 채널)\nds = de = None\nfrom datetime import timedelta\nif has_date:\n    _dmax = demo[\"일자\"].max().date()\n    fc = st.columns([2.8, 0.2, 2.9, 2.9])\n    with fc[0]:\n        sel_period = st.radio(\"기간\", list(PERIOD_DAYS), index=0, horizontal=True, key=\"dem_period\")  # 기본=최신 1일\n        de = _dmax\n        ds = de - timedelta(days=PERIOD_DAYS[sel_period] - 1)\n    with fc[2]:\n        sel_brands = brand_pills(brands, key=\"dem_b\")\n    with fc[3]:\n        sel_chans = brand_pills(chans, key=\"dem_c\", label=\"채널\")\n    st.caption(f\"기간: **{sel_period}** ({ds} ~ {de})\")\nelse:\n    fc = st.columns([3.5, 3.5])\n    with fc[0]:\n        sel_brands = brand_pills(brands, key=\"dem_b\")\n    with fc[1]:\n        sel_chans = brand_pills(chans, key=\"dem_c\", label=\"채널\")\nst.divider()\n\ndf = demo[demo[\"브랜드\"].isin(sel_brands) & demo[\"채널\"].isin(sel_chans)]\nif has_date and ds is not None:\n    df = df[(df[\"일자\"].dt.date >= ds) & (df[\"일자\"].dt.date <= de)]\nif df.empty:\n    # 집계(성별/연령) 데이터가 없어도 멈추지 않는다 — 에이징핏은 집계엔 없고 아래 소재 섹션에만 있다.\n    st.info(\"선택 조건의 **성별·연령 집계** 데이터가 없습니다(에이징핏은 집계에 없고 아래 **소재 유형별** 섹션에서만 분리 표시됩니다).\")\n\n# ⚠️ 과집계('장난질') 자동 감지 — 전환매출이 비정상적으로 크고 ROAS가 과도한 행(어트리뷰션 중복/집계 오류)\n_oc = C.flag_overcount(df[\"구매전환값\"], df[\"지출\"]) if not df.empty else pd.Series([], dtype=bool)\nif bool(_oc.any()):\n    _ocdf = df[_oc].copy()\n    _ocdf[\"ROAS\"] = (_ocdf[\"구매전환값\"] / _ocdf[\"지출\"].replace(0, np.nan)).round(1)\n    _n = int(_oc.sum())\n    _sum = _ocdf[\"구매전환값\"].sum()\n    st.warning(f\"⚠️ **과집계('장난질') 의심 {_n}건** 감지 — 전환매출 합 {_sum/1e8:.1f}억. \"\n               \"지출 대비 전환매출이 비현실적으로 큰(ROAS 수십~수천 배) 행으로, 플랫폼 어트리뷰션 중복/집계 오류로 추정됩니다.\")\n    excl = st.toggle(\"🧹 과집계 의심 제외하고 분석 (권장)\", value=True, key=\"dem_excl_oc\")\n    with st.expander(f\"의심 내역 {_n}건 보기\", expanded=False):\n        _ocols = [c for c in [\"일자\", \"채널\", \"브랜드\", \"dim\", \"성별\", \"나이대\", \"지출\", \"구매전환값\", \"ROAS\"]\n                  if c in _ocdf.columns]\n        _show = _ocdf[_ocols].rename(columns={\"구매전환값\": \"전환매출\"}).sort_values(\"전환매출\", ascending=False)\n        st.dataframe(fmt_df(_show), use_container_width=True, hide_index=True)\n    if excl:\n        df = df[~_oc]\n        st.caption(\"→ 위 의심 행을 **제외**하고 아래 분석을 표시합니다.\")\n\nage = df[df[\"dim\"] == \"age\"]\ngender = df[df[\"dim\"] == \"gender\"]\ncross = df[df[\"dim\"] == \"cross\"]\n\n# ---------------- 요약 KPI ----------------\ntot_spend = df.drop_duplicates([\"채널\", \"브랜드\", \"dim\"])  # 중복합산 방지용 참고\nk1, k2, k3 = st.columns(3)\nk1.metric(\"분석 채널\", \", \".join(sel_chans))\nk2.metric(\"분석 브랜드 수\", f\"{len(sel_brands)}\")\nk3.metric(\"세그먼트(행)\", f\"{len(df):,}\")\nst.divider()\n\n# ---------------- 소재 유형별 TOP 3 (영상·이미지·범퍼형) ----------------\ndef _render_type_age(ds, de, has_date, sel_brands):\n    \"\"\"소재(ad) 단위 demo 를 유형(영상/이미지/범퍼형) × 연령대로 집계해 표시.\"\"\"\n    dad = _load_demo_ad()\n    if dad is None or dad.empty:\n        st.caption(\"소재 단위 연령 데이터가 비어 있습니다.\")\n        return\n    dad = dad.copy()\n    # 소재명 기준 5개 브랜드로 분리(안티칼 계정 소재 → 에이징/에이징핏 키워드면 에이징핏, 그 외 안티칼알파)\n    dad[\"브랜드\"] = [C.ad_brand(b, s) for b, s in zip(dad[\"브랜드\"], dad[\"소재\"])]\n    for cc in (\"지출\", \"구매전환값\"):\n        dad[cc] = pd.to_numeric(dad[cc], errors=\"coerce\").fillna(0)\n    if \"일자\" in dad.columns and has_date and ds is not None:\n        dad[\"일자\"] = pd.to_datetime(dad[\"일자\"], errors=\"coerce\")\n        dad = dad[(dad[\"일자\"].dt.date >= ds) & (dad[\"일자\"].dt.date <= de)]\n    dad = dad[dad[\"브랜드\"].isin(sel_brands)]\n    dad[\"유형\"] = dad[\"소재\"].map(_ctype)\n    at = dad[dad[\"유형\"].isin([\"영상\", \"이미지\", \"범퍼형\"])].groupby(\n        [\"유형\", \"나이대\"], as_index=False).agg(지출=(\"지출\", \"sum\"), 전환매출=(\"구매전환값\", \"sum\"))\n    if at.empty:\n        st.caption(\"해당 조건의 소재 연령 데이터 없음\")\n        return\n    at[\"ROAS\"] = (at[\"전환매출\"] / at[\"지출\"].replace(0, np.nan)).round(2)\n    c1, c2 = st.columns(2)\n    c1.plotly_chart(px.bar(at, x=\"나이대\", y=\"전환매출\", color=\"유형\", barmode=\"group\",\n                           title=\"유형 × 연령대 전환매출\"), use_container_width=True)\n    c2.plotly_chart(px.bar(at, x=\"나이대\", y=\"ROAS\", color=\"유형\", barmode=\"group\",\n                           title=\"유형 × 연령대 ROAS\"), use_container_width=True)\n\n\nst.subheader(\"🎬 소재 유형별 TOP 3 (영상 · 이미지 · 범퍼형)\")\nst.caption(\"선택한 **상단 채널·브랜드·기간**의 광고 소재를 유형으로 분류해 **전환매출 상위 3개**를 봅니다.\")\n\n_ads = _ads_all\nif _ads.empty:\n    st.info(\"광고 데이터 없음\")\nelse:\n    sel_p = [CHAN_PLAT[c] for c in sel_chans if c in CHAN_PLAT]  # 상단 채널 → 광고 플랫폼\n    aa = _ads[_ads[\"brand\"].isin(sel_brands) & _ads[\"platform\"].isin(sel_p)].copy()\n    if has_date and ds is not None:\n        aa = aa[(aa[\"date\"].dt.date >= ds) & (aa[\"date\"].dt.date <= de)]\n    if aa.empty:\n        st.info(\"선택한 상단 채널·브랜드·기간에 소재 데이터가 없습니다.\")\n    else:\n        aa[\"유형\"] = aa[\"campaign_name\"].map(_ctype)\n        gg = aa.groupby([\"유형\", \"campaign_name\"], as_index=False).agg(\n            지출=(\"cost\", \"sum\"), 전환매출=(\"conv_value\", \"sum\"),\n            노출=(\"impressions\", \"sum\"), 클릭=(\"clicks\", \"sum\"))\n        gg[\"ROAS\"] = (gg[\"전환매출\"] / gg[\"지출\"].replace(0, np.nan)).round(2)\n        gg[\"CTR%\"] = (gg[\"클릭\"] / gg[\"노출\"].replace(0, np.nan) * 100).round(2)\n        tcols = st.columns(3)\n        for col, t in zip(tcols, [\"영상\", \"이미지\", \"범퍼형\"]):\n            grp = gg[gg[\"유형\"] == t]\n            sub = grp.nlargest(3, \"전환매출\")\n            with col:\n                st.markdown(f\"**🏆 {t} TOP 3**  ·  {len(grp)}개 소재\")\n                if sub.empty:\n                    st.caption(\"해당 유형 소재 없음\")\n                else:\n                    show = sub[[\"campaign_name\", \"지출\", \"전환매출\", \"ROAS\", \"CTR%\"]].rename(\n                        columns={\"campaign_name\": \"소재\"})\n                    st.dataframe(fmt_df(show), use_container_width=True, hide_index=True)\n        # 유형별 연령대 분석 — 소재 단위 demo(메타 ad-level) 수집 시 표시\n        st.markdown(\"**유형별 연령대 분석**\")\n        if S.has_demo_ad():\n            _render_type_age(ds, de, has_date, sel_brands)\n        else:\n            st.caption(\"⏳ 소재(ad) 단위 연령·성별 데이터를 아직 안 모았습니다. \"\n                       \"메타 ad-level 데모(약 36MB) 수집을 켜면 유형별 연령대 성과가 여기 표시됩니다.\")\nst.divider()\n\n\n# ---------------- 성별 ----------------\nst.subheader(\"성별 성과\")\nif not gender.empty:\n    g = gender.groupby(\"성별\", as_index=False).agg(\n        지출=(\"지출\", \"sum\"), 전환값=(\"구매전환값\", \"sum\"),\n        클릭=(\"클릭\", \"sum\"), 노출=(\"노출\", \"sum\"), 전환=(\"구매전환수\", \"sum\"))\n    g[\"ROAS\"] = (g[\"전환값\"] / g[\"지출\"].replace(0, np.nan)).round(2)\n    g[\"CTR%\"] = (g[\"클릭\"] / g[\"노출\"].replace(0, np.nan) * 100).round(2)\n    g[\"성별\"] = pd.Categorical(g[\"성별\"], categories=GENDER_ORDER, ordered=True)\n    g = g.sort_values(\"성별\")\n    c1, c2, c3 = st.columns([1, 1, 2])\n    pie = px.pie(g, names=\"성별\", values=\"지출\", hole=0.55, title=\"지출 비중 (성별)\",\n                 color=\"성별\", color_discrete_map=GENDER_COLORS,\n                 category_orders={\"성별\": GENDER_ORDER})\n    pie.update_traces(textinfo=\"label+percent\")\n    c1.plotly_chart(pie, use_container_width=True)\n    bar = px.bar(g, x=\"성별\", y=\"ROAS\", color=\"성별\", title=\"성별 ROAS\", text=\"ROAS\",\n                 color_discrete_map=GENDER_COLORS, category_orders={\"성별\": GENDER_ORDER})\n    bar.update_traces(texttemplate=\"%{text:.2f}x\", textposition=\"outside\")\n    bar.update_layout(showlegend=False, yaxis_title=\"ROAS(배)\")\n    c2.plotly_chart(bar, use_container_width=True)\n    c3.dataframe(fmt_df(g), use_container_width=True, hide_index=True)\nelse:\n    st.info(\"성별(dim=gender) 데이터 없음\")\n\n# ---------------- 연령대 ----------------\nst.subheader(\"연령대 성과\")\nif not age.empty:\n    a = age.groupby(\"나이대\", as_index=False).agg(\n        지출=(\"지출\", \"sum\"), 전환값=(\"구매전환값\", \"sum\"),\n        클릭=(\"클릭\", \"sum\"), 노출=(\"노출\", \"sum\"), 전환=(\"구매전환수\", \"sum\"))\n    a[\"ROAS\"] = (a[\"전환값\"] / a[\"지출\"].replace(0, np.nan)).round(2)\n    a[\"CTR%\"] = (a[\"클릭\"] / a[\"노출\"].replace(0, np.nan) * 100).round(2)\n    a = a.sort_values(\"나이대\")\n    c1, c2 = st.columns(2)\n    c1.plotly_chart(px.bar(a, x=\"나이대\", y=\"지출\", title=\"연령대별 지출\"),\n                    use_container_width=True)\n    c2.plotly_chart(px.bar(a, x=\"나이대\", y=\"ROAS\", title=\"연령대별 ROAS\",\n                           color=\"ROAS\", color_continuous_scale=\"Blues\"),\n                    use_container_width=True)\n    st.dataframe(fmt_df(a), use_container_width=True, hide_index=True)\nelse:\n    st.info(\"연령대(dim=age) 데이터 없음\")\n\n# ---------------- 성별 × 연령 교차 ----------------\nst.subheader(\"성별 × 연령대 교차 (히트맵)\")\nif not cross.empty:\n    metric = st.radio(\"지표\", [\"지출\", \"구매전환값\", \"ROAS\", \"CTR\"], horizontal=True)\n    cc = cross.groupby([\"성별\", \"나이대\"], as_index=False).agg(\n        지출=(\"지출\", \"sum\"), 구매전환값=(\"구매전환값\", \"sum\"),\n        클릭=(\"클릭\", \"sum\"), 노출=(\"노출\", \"sum\"))\n    cc[\"ROAS\"] = (cc[\"구매전환값\"] / cc[\"지출\"].replace(0, np.nan)).round(2)\n    cc[\"CTR\"] = (cc[\"클릭\"] / cc[\"노출\"].replace(0, np.nan) * 100).round(2)\n    piv = cc.pivot(index=\"성별\", columns=\"나이대\", values=metric).reindex(GENDER_ORDER).dropna(how=\"all\")\n    st.plotly_chart(px.imshow(piv, text_auto=\".0f\" if metric in (\"지출\", \"구매전환값\") else \".2f\",\n                              aspect=\"auto\", color_continuous_scale=\"Tealgrn\",\n                              labels=dict(color=metric)), use_container_width=True)\nelse:\n    st.info(\"교차(dim=cross) 데이터 없음\")\n", "dashboards/executive_report.py": "\"\"\"통합 요약(Executive) 대시보드 — 광고 + 매출 + UX 한 화면.\n\n상단: 기간·브랜드 필터 + 실시간 API 취합(cafe24·쿠팡·스마트스토어·광고 항상 포함)\n브랜드는 5개(안티칼알파·에이징핏·림데이·뉴로포커스·씨코랩)로 분리, 판매채널(카페24/쿠팡/스마트스토어)별 매출 표시.\n핵심 인사이트: 광고효율(캠페인 ROAS) · 매출 페이지(상품 구매액). 그 아래 간결 AI 분석.\n\"\"\"\nfrom __future__ import annotations\n\nimport subprocess\nimport sys\nfrom datetime import timedelta\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parent.parent\nsys.path.insert(0, str(ROOT))\n\nimport numpy as np  # noqa: E402\nimport pandas as pd  # noqa: E402\nimport streamlit as st  # noqa: E402\n\nimport config  # noqa: E402\nfrom analyzers import _common as C, root_cause_engine  # noqa: E402\nfrom collectors import cafe24_snapshot  # noqa: E402\n\ntry:\n    st.set_page_config(page_title=\"통합 요약 리포트\", layout=\"wide\")\nexcept Exception:\n    pass\nfrom dashboards._style import brand_pills, fmt_df, inject_css, page_intro, roas_pct  # noqa: E402\ninject_css()\n# 핵심 KPI 강조(빨간 네모): 순매출·상품구매액·통합ROAS·상품ROAS 카드\nst.markdown(\"\"\"\n<style>\ndiv[class*=\"st-key-hlkpi\"] { padding:0 !important; }\ndiv[class*=\"st-key-hlkpi\"] div[data-testid=\"stMetric\"] {\n  border:2px solid #E03131 !important;\n  box-shadow:0 0 0 3px rgba(224,49,49,.10) !important;\n}\n/* 최다 판매 옵션 카드: 값이 st.metric이 아니라 커스텀 HTML(줄바꿈 전체표시) */\n</style>\n\"\"\", unsafe_allow_html=True)\n\n\ndef won(x):\n    return f\"₩{x:,.0f}\"\n\n\n@st.cache_data(ttl=600)\ndef load():\n    ads = C.add_ad_brand(C.load_ads())\n    orders = C.load_orders()\n    if not orders.empty:\n        orders[\"brand\"] = C.to_brand5(orders[\"brand\"])\n    visitors = C.load_visitors()\n    if not visitors.empty:\n        visitors[\"brand\"] = C.to_brand5(visitors[\"brand\"])\n    sales = C.load_sales5()\n    return ads, orders, visitors, sales\n\n\n@st.cache_data(ttl=600)\ndef load_product_sales():\n    p = cafe24_snapshot.product_sales_df()\n    if p.empty:\n        return p\n    p = p.copy()\n    p[\"브랜드\"] = C.to_brand5(p[\"브랜드\"])\n    for col in [\"구매액\", \"주문수\"]:\n        p[col] = pd.to_numeric(p[col], errors=\"coerce\").fillna(0)\n    p[\"AOV\"] = (p[\"구매액\"] / p[\"주문수\"].replace(0, np.nan)).round(0)\n    return p\n\n\n@st.cache_data(ttl=600)\ndef load_product_daily():\n    \"\"\"일자별 상품 판매(구매건수·구매액). 기간 필터용(날짜 연동).\"\"\"\n    df = cafe24_snapshot.product_sales_daily()\n    if df.empty:\n        return df\n    df = df.copy()\n    df[\"일자\"] = pd.to_datetime(df[\"일자\"], errors=\"coerce\")\n    df = df[df[\"일자\"].notna()]\n    for c in (\"구매액\", \"주문수\"):\n        if c in df.columns:\n            df[c] = pd.to_numeric(df[c], errors=\"coerce\").fillna(0)\n    return df\n\n\n@st.cache_data(ttl=600)\ndef load_carts():\n    \"\"\"상품별 조회수(유입). 스냅샷 집계(일자 없음) — 전환율의 분모로 사용.\"\"\"\n    df = cafe24_snapshot.carts_df()\n    if df.empty:\n        return df\n    df = df.copy()\n    df[\"조회수\"] = pd.to_numeric(df[\"조회수\"], errors=\"coerce\").fillna(0)\n    return df\n\n\n@st.cache_data(ttl=600)\ndef insight():\n    return root_cause_engine.primary_insight()\n\n\nSNAP_LOCK = cafe24_snapshot.SNAP_DIR.parent / \"snapshot_refresh.lock\"\n_LOCK_STALE_SEC = 45 * 60  # 45분 넘은 lock 은 죽은 프로세스로 간주\n\n\ndef refresh_running() -> bool:\n    \"\"\"전체 수집이 진행 중인지(lock 존재 + 신선) 여부.\"\"\"\n    if not SNAP_LOCK.exists():\n        return False\n    import time\n    if time.time() - SNAP_LOCK.stat().st_mtime > _LOCK_STALE_SEC:\n        return False  # 오래된 lock = 중단된 작업\n    return True\n\n\ndef refresh_snapshot_bg() -> None:\n    \"\"\"전체 재수집을 **백그라운드(비동기)** 로 실행한다:\n    ① cafe24·쿠팡·스마트스토어·메타·구글·틱톡 스냅샷 재수집(datastore.py)\n    → ② DB 적재(main.py --collect-only) 까지 연쇄. ~15~20분 걸려 UI를 막지 않도록 detached.\n    진행 중에는 snapshot_refresh.lock 이 존재하고, 끝나면 자동 삭제된다.\"\"\"\n    from datetime import datetime as _dt\n    cafe = cafe24_snapshot.SNAP_DIR.parent           # cafe24-dashboard\n    mi = Path(__file__).resolve().parent.parent      # marketing-intelligence\n    gpy = r\"C:\\Python314\\python.exe\"\n    if not Path(gpy).exists():\n        gpy = \"python\"\n    vpy = mi / \".venv\" / \"Scripts\" / \"python.exe\"\n    vpy = str(vpy) if vpy.exists() else \"python\"\n    log = cafe / \"snapshot_refresh.log\"\n    SNAP_LOCK.write_text(_dt.now().isoformat(timespec=\"seconds\"), encoding=\"utf-8\")\n    # cmd: 스냅샷 수집 → (성공 시) DB 적재 → (성공·실패 무관) lock 삭제\n    chain = (f'cd /d \"{cafe}\" && \"{gpy}\" -u datastore.py >> \"{log}\" 2>&1 '\n             f'&& cd /d \"{mi}\" && \"{vpy}\" -u main.py --collect-only >> \"{log}\" 2>&1 '\n             f'& del \"{SNAP_LOCK}\"')\n    flags = 0\n    if hasattr(subprocess, \"CREATE_NEW_PROCESS_GROUP\"):  # Windows: 부모와 분리해 detach\n        flags = subprocess.CREATE_NEW_PROCESS_GROUP | getattr(subprocess, \"DETACHED_PROCESS\", 0)\n    # ⚠️ 반드시 '문자열' 명령줄로 넘긴다. 리스트([\"cmd\",\"/c\",chain])로 주면 Python list2cmdline 이\n    # chain 안의 따옴표를 \\\" 로 이스케이프하는데 cmd 는 \\\" 를 못 알아듣는다. 경로에 공백(예:\n    # \"바탕 화면\")이 있어 따옴표가 필수라, 리스트로 주면 \"directory name syntax incorrect\" 로\n    # 체인 전체가 실행조차 안 돼 수집이 안 된다(=실시간 수집 버튼이 먹통). 문자열은 그대로 전달됨.\n    subprocess.Popen(f'cmd /c \"{chain}\"', creationflags=flags)\n\n\ndef run_quick_collect(status=None):\n    \"\"\"빠른 취합: **기존 스냅샷 → DB 적재 + 틱톡·네이버·Clarity 실시간 보충**(수십 초).\n    무거운 cafe24·메타 재스크랩 없이 대시보드 DB를 갱신한다(스냅샷은 매일 9시 자동 갱신).\"\"\"\n    import main as _main\n    if status:\n        status.write(\"스냅샷 → DB 적재 + 틱톡·네이버·Clarity 실시간 수집…\")\n    return _main.collect(60, daily=False)\n\n\nst.title(\"📌 통합 요약 (Executive)\")\npage_intro(\"광고·매출·고객·UX를 한 화면에 요약합니다. 매출은 **카페24·쿠팡·스마트스토어** 합산이며, \"\n           \"상단 ‘실시간 API 취합’은 cafe24까지 모두 새로 수집합니다.\")\n\nads, orders, visitors, sales = load()\npsales = load_product_sales()\n\nif ads.empty and orders.empty and sales.empty:\n    if refresh_running():\n        st.info(\"⏳ 전체 실시간 수집 진행 중입니다(약 15~20분). 완료 후 새로고침(F5)하세요.\")\n        st.stop()\n    if getattr(config, \"ARCHIVE_MODE\", False):\n        # 보존 사본(읽기전용)에는 수집기·토큰·subprocess 가 없어 버튼이 눌리면 반드시 실패한다.\n        st.info(\"📁 **보존 사본(읽기전용)** — 실시간 수집은 제공하지 않습니다. \"\n                \"데이터가 비어 있다면 보존본을 다시 생성해야 합니다.\")\n        st.stop()\n    st.warning(\"데이터가 없습니다. 아래 **실시간 수집**(전체 새로 받기, 약 15~20분)을 누르세요.\")\n    if st.button(\"🔄 실시간 수집\", type=\"primary\"):\n        refresh_snapshot_bg()\n        st.success(\"전체 수집을 백그라운드에서 시작했습니다(약 15~20분). 완료 후 새로고침(F5)하세요.\")\n    st.stop()\n\n# 날짜 범위\ndts = []\nfor d in (ads, orders, visitors, sales):\n    if not d.empty:\n        dts += [d[\"date\"].min().date(), d[\"date\"].max().date()]\ndmin, dmax = min(dts), max(dts)\n\n# ===== 최상단: 기간 · 브랜드 · 실시간 API 취합(항상 cafe24 포함) =====\nfc = st.columns([2.6, 0.2, 3.4, 1.6])\nwith fc[0]:\n    rng = st.date_input(\"기간\", value=(dmax, dmax),   # 기본=최신 1일(필요시 사용자가 넓힘)\n                        min_value=dmin, max_value=dmax, key=\"exec_date\")\n    start, end = (rng if isinstance(rng, tuple) and len(rng) == 2 else (dmin, dmax))\nwith fc[2]:\n    sel_brands = brand_pills(C.AD_BRANDS, key=\"exec_brand\")\nwith fc[3]:\n    st.write(\"\")\n    if getattr(config, \"ARCHIVE_MODE\", False):\n        _running = False\n        do_collect = False\n        st.caption(\"📁 **보존 사본(읽기전용)** — 실시간 수집 없음\")\n    else:\n        _running = refresh_running()\n        do_collect = st.button(\"🔄 실시간 수집\", type=\"primary\", use_container_width=True,\n                               disabled=_running,\n                               help=\"cafe24·쿠팡·스마트스토어·메타·구글·틱톡을 전부 새로 수집합니다(약 15~20분). \"\n                                    \"백그라운드로 돌고 완료되면 자동 반영됩니다.\")\nif do_collect:\n    refresh_snapshot_bg()\n    _running = True\n    st.success(\"🔄 **전체 실시간 수집을 시작했습니다** — cafe24·쿠팡·스마트스토어·메타·구글·틱톡 전부 새로 받습니다. \"\n               \"약 15~20분 백그라운드로 진행되며 **완료되면 자동 반영**됩니다. 잠시 후 페이지를 새로고침(F5)하세요.\")\n# 진행/마지막 수집 상태\nif _running:\n    st.caption(\"⏳ **전체 실시간 수집 진행 중…** (약 15~20분) — 완료 후 새로고침(F5)하면 최신 데이터가 반영됩니다.\")\nelse:\n    _info = cafe24_snapshot.meta_info()\n    if _info.get(\"refreshed_at\"):\n        st.caption(f\"🗂️ 마지막 전체 수집: **{_info['refreshed_at']}**  ·  매일 오전 9시 자동 갱신\")\nst.divider()\n\n\ndef inr(df, brand_col=None):\n    if df.empty:\n        return df\n    d = df[\"date\"].dt.date\n    out = df[(d >= start) & (d <= end)]\n    if brand_col and brand_col in out.columns:\n        out = out[out[brand_col].isin(sel_brands)]\n    return out\n\n\na = inr(ads, \"brand\")\n# ⚠️ 과집계('장난질') 자동 제외 — 전환매출이 비현실적으로 크고 ROAS가 과도한 행(어트리뷰션 중복/집계 오류)\n_oc = C.flag_overcount(a[\"conv_value\"], a[\"cost\"]) if not a.empty else None\n_oc_n = int(_oc.sum()) if _oc is not None else 0\n_oc_sum = float(a.loc[_oc, \"conv_value\"].sum()) if _oc_n else 0.0\nif _oc_n:\n    a = a[~_oc].copy()\no = inr(orders, \"brand\")\nv = inr(visitors, \"brand\")\ns = inr(sales, \"brand\")\nov = o[o[\"is_cancel\"] == 0] if not o.empty else o\nps = psales[psales[\"브랜드\"].isin(sel_brands)] if not psales.empty else psales\n\n# ===== 핵심 KPI (매출=카페24+쿠팡+스마트스토어) =====\nad_cost = a[\"cost\"].sum() if not a.empty else 0\nad_val = a[\"conv_value\"].sum() if not a.empty else 0\nnet_rev = s[\"sales_amount\"].sum() if not s.empty else 0\n# 상품구매액(정가, 쿠폰·적립금 반영 전) — 카페24만 정가, 쿠팡/스토어는 sales_amount와 동일\ngross_rev = (s[\"order_price_amount\"].sum() if (\"order_price_amount\" in s.columns and not s.empty)\n             else net_rev)\nn_orders = int(s[\"order_count\"].sum()) if not s.empty else 0\naov = (net_rev / n_orders) if n_orders else 0\n# 재구매율 = 구매액 기준 (카페24 어드민 '구매액 기준 재구매율'과 같은 정의):\n#   재구매 매출(회원 & 첫주문 아님) ÷ 전체 매출(취소 제외, 비회원 포함).\n#   ※ 카페24 어드민은 비회원까지 이름·전화·이메일로 교차식별해 재구매로 잡아 이보다 몇 %p 높게 나온다\n#     (주문 API의 first_order 플래그는 회원 기준이라 비회원 재구매를 못 잡음). 금액 베이스는 거의 일치.\nif not ov.empty and \"sales_amount\" in ov.columns:\n    _tot_amt = ov[\"sales_amount\"].sum()\n    _mid = ov[\"member_id\"].astype(str).str.strip()\n    _rep_amt = ov.loc[(ov[\"is_first\"] == 0) & (~_mid.isin([\"\", \"nan\", \"None\", \"0\"])), \"sales_amount\"].sum()\n    repeat = (_rep_amt / _tot_amt * 100) if _tot_amt else 0\nelse:\n    _tot_amt = _rep_amt = 0\n    repeat = 0\n\nst.caption(f\"기간: **{start} ~ {end}**  ·  브랜드: {', '.join(sel_brands)}\")\nst.caption(\"※ **순매출(실결제)** = 카페24 실결제액(쿠폰·할인 반영, 취소 제외) + 쿠팡 + 스마트스토어. \"\n           \"**상품구매액(환불제외)** = 카페24 정가 기준(쿠폰·적립금 반영 전, 취소·환불 제외) + 쿠팡 + 스마트스토어. \"\n           \"**통합 ROAS = 순매출 ÷ 광고비**(신뢰 기준), **상품 ROAS = 상품구매액 ÷ 광고비**, \"\n           \"**광고 ROAS = 플랫폼 보고 전환 ÷ 광고비**(중복·과대).\")\nr1 = st.columns(5)\nwith r1[0].container(key=\"hlkpi_net\"):\n    st.metric(\"순매출(실결제)\", won(net_rev), help=\"카페24 실결제액 + 쿠팡 + 스마트스토어 (쿠폰·할인 반영, 취소 제외)\")\nwith r1[1].container(key=\"hlkpi_gross\"):\n    st.metric(\"상품구매액\", won(gross_rev), help=\"카페24 정가(쿠폰·적립금 반영 전) + 쿠팡 + 스마트스토어\")\nr1[2].metric(\"광고비\", won(ad_cost))\nwith r1[3].container(key=\"hlkpi_troas\"):\n    st.metric(\"통합 ROAS(실결제)\", roas_pct(net_rev / ad_cost if ad_cost else 0),\n              help=\"순매출(실결제) ÷ 광고비\")\nwith r1[4].container(key=\"hlkpi_sroas\"):\n    st.metric(\"상품 ROAS\", roas_pct(gross_rev / ad_cost if ad_cost else 0),\n              help=\"상품구매액 ÷ 광고비\")\n# 최다 판매 옵션 — products 스냅샷의 상품명(=옵션 단위: 카페24=상품명+옵션, 쿠팡/스토어=수량·회분)\n#   을 **선택 기간(데일리)** 으로 필터해 주문수 1위 산출. 3채널 모두 일자 데이터 보유.\n_op = None\n_pd_opt = load_product_daily()\nif not _pd_opt.empty:\n    _tmp = _pd_opt[(_pd_opt[\"일자\"].dt.date >= start) & (_pd_opt[\"일자\"].dt.date <= end)].copy()\n    _tmp[\"brand5\"] = C.to_brand5(_tmp[\"브랜드\"])\n    _tmp = _tmp[_tmp[\"brand5\"].isin(sel_brands)]\n    if not _tmp.empty and _tmp[\"주문수\"].sum() > 0:\n        _op = _tmp\n\n\ndef _top_option(frame, n=1):\n    \"\"\"상품명(옵션) 단위 주문수 상위 n행(주문수·구매액). 없으면 None(n=1) / 빈 DF(n>1).\"\"\"\n    if frame is None or frame.empty or frame[\"주문수\"].sum() == 0:\n        return None if n == 1 else pd.DataFrame()\n    g = (frame.groupby(\"상품명\", as_index=False)\n         .agg(주문수=(\"주문수\", \"sum\"), 구매액=(\"구매액\", \"sum\"))\n         .sort_values(\"주문수\", ascending=False))\n    return g.iloc[0] if n == 1 else g.head(n)\n\n\n# 서브브랜드별 신규구매자 매출(신규 구매자 ROAS 타일 + 아래 브랜드표 공용). daily_orders는 몰단위(\"안티칼\")라\n# 에이징핏/안티칼알파max로 못 나눠서, 수집단계에서 order_id→서브브랜드로 분배한 new_buyer_sales.pkl 사용.\n_nbs = cafe24_snapshot.new_buyer_sales_daily()\n_nbs_by_brand = {}\nif not _nbs.empty and \"일자\" in _nbs.columns:\n    _nbs = _nbs.copy(); _nbs[\"일자\"] = pd.to_datetime(_nbs[\"일자\"])\n    _nbs = _nbs[(_nbs[\"일자\"].dt.date >= start) & (_nbs[\"일자\"].dt.date <= end)]\n    if not _nbs.empty:\n        _nbs[\"b5\"] = C.to_brand5(_nbs[\"브랜드\"])\n        _nbs_by_brand = _nbs.groupby(\"b5\")[\"매출\"].sum().to_dict()\n\nr2 = st.columns(5)\nr2[0].metric(\"주문수 (3채널)\", f\"{n_orders:,.0f}\",\n             help=\"카페24·쿠팡·스마트스토어 3개 판매채널의 실제 주문건수 합계(광고 전환수 아님)\")\nr2[1].metric(\"AOV\", won(aov))\nr2[2].metric(\"재구매율(카페24·구매액)\", f\"{repeat:,.1f}%\",\n             f\"재구매매출 {won(_rep_amt)} / 전체 {won(_tot_amt)}\" if _tot_amt else None)\nr2[3].metric(\"방문수\", f\"{(v['visits'].sum() if not v.empty else 0):,.0f}\")\nwith r2[4].container(key=\"new_roas\"):\n    # 신규 구매자 ROAS = 신규구매자 매출(서브브랜드 분배 · new_buyer_sales.pkl) ÷ 전체 광고비.\n    # ★ov(daily_orders)는 몰단위라 에이징핏/안티칼알파max 필터 시 0이 나옴 → _nbs_by_brand 사용해\n    #   선택 브랜드 합으로 계산(브랜드표 컬럼과 동일 소스, 서브브랜드 필터에서도 정확).\n    _new_rev = sum(_nbs_by_brand.get(b, 0) for b in sel_brands)\n    _new_roas = (_new_rev / ad_cost) if ad_cost else 0\n    st.metric(\"신규 구매자 ROAS\", roas_pct(_new_roas),\n              (f\"신규구매 {won(_new_rev)} / 광고비 {won(ad_cost)}\" if ad_cost else \"광고비 0\"),\n              delta_color=\"off\",\n              help=\"신규 구매자 매출(회원 첫구매 + 비회원 첫구매, 주문의 상품을 order_id→서브브랜드로 분배) \"\n                   \"÷ 전체 광고비(메타+구글+틱톡+GFA). 취소 제외. 서브브랜드(에이징핏/안티칼알파max)별로도 정확.\")\n# 채널별 최다 판매 옵션(카페24·쿠팡·스마트스토어 각 1위) — 상품명이 길어 st.table로 전체 표시\nif _op is not None:\n    _rows_ch = []\n    for _ch_name in (\"카페24\", \"쿠팡\", \"스마트스토어\"):\n        _r = _top_option(_op[_op[\"채널\"] == _ch_name])\n        _rows_ch.append({\"채널\": _ch_name,\n                         \"최다 판매 옵션\": str(_r[\"상품명\"]) if _r is not None else \"(기간 내 판매 없음)\",\n                         \"주문수\": f\"{int(_r['주문수']):,}건\" if _r is not None else \"-\",\n                         \"매출\": won(_r[\"구매액\"]) if _r is not None else \"-\"})\n    with st.expander(\"🏆 채널별 최다 판매 옵션 (카페24 · 쿠팡 · 스마트스토어) · 선택 기간\", expanded=True):\n        st.table(pd.DataFrame(_rows_ch).set_index(\"채널\"))\n        st.caption(\"※ 선택한 **기간·브랜드** 기준 · 상품명(옵션) 단위 주문수 1위. \"\n                   \"카페24는 상품명 뒤 ‘· 옵션’으로 개수/BOX 옵션까지 표시. \"\n                   \"쿠팡 로켓그로스 상품은 옵션 분해에서 빠질 수 있음(판매자배송 기준).\")\nif _oc_n:\n    st.caption(f\"⚠️ 과집계('장난질') 의심 **{_oc_n}건**(전환매출 {_oc_sum/1e8:.1f}억)을 광고 지표에서 자동 제외했습니다 \"\n               \"— 지출 대비 ROAS가 비현실적으로 높은 행(어트리뷰션 중복/집계 오류 추정). 상세는 ‘통합 광고 리포트’ 참고.\")\n\n# ===== 브랜드별 요약 (채널별 매출 + 광고) =====\nst.subheader(\"브랜드별 요약 (판매채널 · 광고)\")\n\n\ndef _ch(sb, ch, col):\n    return sb[sb[\"채널\"] == ch][col].sum() if not sb.empty else 0\n\n\ndef _repeat_pct(brand):\n    \"\"\"브랜드별 재구매율(구매액 기준 — 상단 KPI와 동일 산식).\n    = 재구매 매출(회원 & 첫주문 아님) ÷ 전체 매출(취소 제외, 비회원 포함).\n    에이징핏은 daily_orders에서 안티칼(알파) 계정에 합산돼 별도 산출 불가 → '-'.\"\"\"\n    if ov.empty or \"sales_amount\" not in ov.columns:\n        return \"-\"\n    g = ov[ov[\"brand\"] == brand]\n    tot = g[\"sales_amount\"].sum() if not g.empty else 0\n    if not tot:\n        return \"-\"\n    mid = g[\"member_id\"].astype(str).str.strip()\n    rep = g.loc[(g[\"is_first\"] == 0) & (~mid.isin([\"\", \"nan\", \"None\", \"0\"])), \"sales_amount\"].sum()\n    return f\"{rep / tot * 100:.1f}%\"\n\n\nrows = []\nfor b in sel_brands:\n    sb = s[s[\"brand\"] == b] if not s.empty else s\n    ab = a[a[\"brand\"] == b] if not a.empty else a\n    cost = ab[\"cost\"].sum() if not ab.empty else 0\n    val = ab[\"conv_value\"].sum() if not ab.empty else 0\n    net = sb[\"sales_amount\"].sum() if not sb.empty else 0\n    gross = sb[\"order_price_amount\"].sum() if (\"order_price_amount\" in sb.columns and not sb.empty) else net\n    _bopt = _top_option(_op[_op[\"brand5\"] == b]) if _op is not None else None\n    _bopt_txt = (f\"{str(_bopt['상품명'])} ({int(_bopt['주문수']):,}건)\" if _bopt is not None else \"-\")\n    rows.append({\"브랜드\": b,\n                 \"순매출\": net,\n                 \"실매출ROAS\": round(net / cost, 2) if cost else 0.0,   # 통합 ROAS = 실매출 ÷ 광고비\n                 \"신규구매ROAS\": round(_nbs_by_brand.get(b, 0) / cost, 2) if cost else 0.0,   # 신규구매자매출 ÷ 광고비(서브브랜드별)\n                 \"상품구매액(환불제외)\": gross,\n                 \"상품ROAS\": round(gross / cost, 2) if cost else 0.0,   # 상품구매액 ÷ 광고비\n                 \"매출:카페24\": _ch(sb, \"카페24\", \"sales_amount\"),\n                 \"재구매율\": _repeat_pct(b),   # 회원 고객수 기준(카페24). 에이징핏은 안티칼 합산이라 '-'\n                 \"매출:쿠팡\": _ch(sb, \"쿠팡\", \"sales_amount\"),\n                 \"매출:스마트스토어\": _ch(sb, \"스마트스토어\", \"sales_amount\"),\n                 \"주문수\": int(sb[\"order_count\"].sum()) if not sb.empty else 0,\n                 \"주문:카페24\": int(_ch(sb, \"카페24\", \"order_count\")),\n                 \"주문:쿠팡\": int(_ch(sb, \"쿠팡\", \"order_count\")),\n                 \"주문:스마트스토어\": int(_ch(sb, \"스마트스토어\", \"order_count\")),\n                 \"인기 옵션(1위·기간)\": _bopt_txt,\n                 \"광고비\": cost,\n                 \"광고ROAS\": round(val / cost, 2) if cost else 0.0})\nbdf = pd.DataFrame(rows)\nbc = st.columns(len(sel_brands))\nfor i, b in enumerate(sel_brands):\n    row = bdf[bdf[\"브랜드\"] == b].iloc[0]\n    if row[\"광고비\"]:\n        delta = (f\"광고 {won(row['광고비'])} · ROAS {roas_pct(row['실매출ROAS'])}  |  \"\n                 f\"상품구매 {won(row['상품구매액(환불제외)'])}({roas_pct(row['상품ROAS'])})\")\n    else:\n        delta = \"광고 미운영\"\n    bc[i].metric(b, won(row[\"순매출\"]), delta, delta_color=\"off\")\nst.dataframe(fmt_df(bdf), use_container_width=True, hide_index=True)\nst.caption(\"※ 재구매율 = **구매액 기준**(재구매 매출[회원·첫주문 아님] ÷ 전체 매출, 취소 제외). \"\n           \"카페24 어드민 ‘구매액 기준 재구매율’과 같은 정의지만, 어드민은 비회원까지 교차식별해 재구매로 잡아 \"\n           \"이 값보다 몇 %p 높게 나옵니다(주문 API의 first_order는 회원 기준). \"\n           \"에이징핏은 daily_orders에서 안티칼(알파)에 합산돼 별도 산출 불가 → ‘-’.\")\nst.divider()\n\n# ===== 핵심 인사이트 =====\nst.subheader(\"🎯 핵심 인사이트\")\nic1, ic2 = st.columns(2)\n\nwith ic1:\n    st.markdown(\"**광고 효율 (캠페인 ROAS 기준)**\")\n    if not a.empty:\n        _PLAT_KO = {\"meta\": \"메타\", \"google\": \"구글\", \"tiktok\": \"틱톡\",\n                    \"naver\": \"네이버\", \"naver_gfa\": \"GFA\"}\n        camp = a.groupby([\"platform\", \"brand\", \"campaign_name\"], as_index=False).agg(\n            지출=(\"cost\", \"sum\"), 전환매출=(\"conv_value\", \"sum\"))\n        camp[\"채널\"] = camp[\"platform\"].map(_PLAT_KO).fillna(camp[\"platform\"])\n        camp[\"ROAS\"] = (camp[\"전환매출\"] / camp[\"지출\"].replace(0, np.nan)).round(2)\n        spenders = camp[camp[\"지출\"] >= max(100000, camp[\"지출\"].sum() * 0.005)].dropna(subset=[\"ROAS\"])\n        ren = {\"brand\": \"브랜드\", \"campaign_name\": \"캠페인\"}\n        _cols = [\"brand\", \"campaign_name\", \"채널\", \"지출\", \"ROAS\"]\n        if not spenders.empty:\n            best = spenders.nlargest(5, \"ROAS\")[_cols]\n            worst = spenders.nsmallest(5, \"ROAS\")[_cols]\n            st.caption(\"🟢 좋은 효율 TOP5\")\n            st.dataframe(fmt_df(best.rename(columns=ren)), use_container_width=True, hide_index=True)\n            st.caption(\"🔴 낮은 효율 (지출 있는데 ROAS 하위)\")\n            st.dataframe(fmt_df(worst.rename(columns=ren)), use_container_width=True, hide_index=True)\n        else:\n            st.info(\"유의미한 지출 캠페인이 없습니다.\")\n    else:\n        st.info(\"광고 데이터 없음\")\n\nwith ic2:\n    st.markdown(\"**매출 페이지 (선택 기간 기준)**\")\n    _pd = load_product_daily()\n    if _pd.empty:\n        st.info(\"상품 일별 판매(products) 데이터 없음 — ‘실시간 API 취합’ 실행\")\n    else:\n        # 선택 기간 + 브랜드로 상품(도메인+상품번호) 단위 집계 — 날짜 연동\n        pp = _pd[(_pd[\"일자\"].dt.date >= start) & (_pd[\"일자\"].dt.date <= end)].copy()\n        pp[\"brand5\"] = C.to_brand5(pp[\"브랜드\"])\n        pp = pp[pp[\"brand5\"].isin(sel_brands)]\n        pp[\"dom\"] = pp[\"상품URL\"].astype(str).str.extract(r\"https?://([^/]+)\")\n        pp[\"pno\"] = pp[\"상품URL\"].astype(str).str.extract(r\"product_no=(\\d+)\")\n        pp = pp.dropna(subset=[\"pno\"])\n        if pp.empty or pp[\"주문수\"].sum() == 0:\n            st.info(\"선택 기간·브랜드에 상품 판매 데이터가 없습니다.\")\n        else:\n            grp = pp.groupby([\"dom\", \"pno\"], as_index=False).agg(\n                브랜드=(\"brand5\", \"first\"), 구매건수=(\"주문수\", \"sum\"), 구매액=(\"구매액\", \"sum\"))\n            rep = (pp.sort_values(\"주문수\", ascending=False)\n                   .drop_duplicates([\"dom\", \"pno\"])[[\"dom\", \"pno\", \"상품명\"]])\n            grp = grp.merge(rep, on=[\"dom\", \"pno\"], how=\"left\")\n\n            # 🟢 잘 팔리는 = 구매건수 TOP (선택 기간)\n            good = grp.sort_values(\"구매건수\", ascending=False).head(7)\n            st.caption(\"🟢 잘 팔리는 (구매건수 TOP · 선택기간)\")\n            st.dataframe(fmt_df(good[[\"브랜드\", \"상품명\", \"구매건수\", \"구매액\"]]),\n                         use_container_width=True, hide_index=True)\n\n            # 🔴 안 팔리는 = 유입(조회수) 대비 전환율 하위 페이지\n            #   전환율은 '페이지 구조적 품질'이라 충분한 표본이 필요 → 누적 기준\n            #   (구매건수/조회수 모두 상품 누적). 기간 의존 best 와 역할을 분리.\n            _carts = load_carts()\n            if _carts.empty or ps.empty:\n                st.info(\"조회수(carts) 또는 상품 판매 데이터가 없어 전환율 분석 불가 — ‘실시간 API 취합’ 실행\")\n            else:\n                pt = ps.copy()\n                pt[\"dom\"] = pt[\"상품URL\"].astype(str).str.extract(r\"https?://([^/]+)\")\n                pt[\"pno\"] = pt[\"상품URL\"].astype(str).str.extract(r\"product_no=(\\d+)\")\n                pt = pt.dropna(subset=[\"pno\"])\n                ptg = pt.groupby([\"dom\", \"pno\"], as_index=False).agg(\n                    브랜드=(\"브랜드\", \"first\"), 구매건수=(\"주문수\", \"sum\"))\n                ptr = (pt.sort_values(\"주문수\", ascending=False)\n                       .drop_duplicates([\"dom\", \"pno\"])[[\"dom\", \"pno\", \"상품명\"]])\n                ptg = ptg.merge(ptr, on=[\"dom\", \"pno\"], how=\"left\")\n                cv = _carts.copy()\n                cv[\"dom\"] = cv[\"상품URL\"].astype(str).str.extract(r\"https?://([^/]+)\")\n                cv[\"pno\"] = pd.to_numeric(cv[\"상품번호\"], errors=\"coerce\").astype(\"Int64\").astype(str)\n                cvg = cv.groupby([\"dom\", \"pno\"], as_index=False)[\"조회수\"].sum()\n                conv = ptg.merge(cvg, on=[\"dom\", \"pno\"], how=\"left\")\n                conv[\"조회수\"] = conv[\"조회수\"].fillna(0)\n                conv = conv[conv[\"조회수\"] >= 100]              # 유의미한 유입만(노이즈 제외)\n                conv[\"전환율%\"] = (conv[\"구매건수\"] / conv[\"조회수\"].replace(0, np.nan) * 100).round(2)\n                conv = conv.dropna(subset=[\"전환율%\"])\n                if conv.empty:\n                    st.info(\"유입(조회수≥100) 대비 전환율을 계산할 상품이 없습니다.\")\n                else:\n                    slow = conv.sort_values(\"전환율%\").head(7)\n                    st.caption(\"🔴 안 팔리는 (유입 대비 전환율 하위 · 누적 기준) — 조회수 대비 구매전환이 낮은 페이지\")\n                    st.dataframe(fmt_df(slow[[\"브랜드\", \"상품명\", \"조회수\", \"구매건수\", \"전환율%\"]]),\n                                 use_container_width=True, hide_index=True)\n\nst.divider()\n\n# ===== 자사몰 직접전환(전용링크) ↔ 광고 기여 괴리 (메타·틱톡·구글) =====\nimport plotly.express as _px  # noqa: E402\n\nst.subheader(\"🔗 자사몰 직접전환(UTM·전용링크) ↔ 광고 기여 괴리\")\nst.caption(\"플랫폼 **전용링크 상품 매출**(SNS=메타 · 유튜브=구글 · 틱톡 광고전용)을 자사몰 직접전환으로 보고, \"\n           \"**플랫폼이 보고한 기여 전환매출**과 비교합니다. ‘괴리(배수)’가 클수록 플랫폼이 과대보고한 것입니다.\")\nst.caption(\"⚠️ 전용링크 매출은 누적 집계(기간 무관)이고, 대부분 주문은 공통링크로 들어와 미귀속이라 **직접전환은 하한값**입니다. \"\n           \"또 플랫폼 기여는 어트리뷰션(클릭+뷰) 기준이라 정확한 1:1 매칭은 아니며 ‘과대 정도’의 가늠자로 보세요.\")\n\nPLAT_CODE = {\"메타\": \"meta\", \"틱톡\": \"tiktok\", \"구글\": \"google\"}\n# 플랫폼별 전용링크 매체 태그(_tag_of 결과와 매칭)\n_PLAT_DETAIL = {\"메타\": \"메타/SNS\", \"틱톡\": \"틱톡\", \"구글\": \"유튜브(구글)\"}\n\n\ndef _tag_of(name):\n    n = str(name)\n    if \"유튜브\" in n:\n        return \"유튜브(구글)\"\n    if \"틱톡\" in n:\n        return \"틱톡\"\n    if \"N광고\" in n:\n        return \"네이버\"\n    if \"SNS\" in n:\n        return \"메타/SNS\"\n    # 인플루언서 콜라보 '비밀특가' 링크([인플루언서 x 브랜드 1+1 비밀특가!])는 메타 전용(사용자 정책)\n    # — 브랜드 무관이라 향후 안티칼알파/에이징핏 비밀특가도 자동 메타로 인식된다.\n    if \"비밀특가\" in n:\n        return \"메타/SNS\"\n    # 무라벨 [광고전용 최저가링크](유튜브/틱톡/N광고/SNS 키워드 없음) → 메타 귀속(사용자 정책)\n    if \"광고전용\" in n:\n        return \"메타/SNS\"\n    return \"공통/기타\"\n\n\nimport unicodedata  # noqa: E402\n\n_EMOJI_STRIP = {\"️\", \"‍\"}  # 변형선택자(VS16) · ZWJ\n\n\ndef _norm_link_name(s):\n    \"\"\"전용링크 상품명 정규화 — 🔒 등 이모지/기호 제거 + 공백 정리.\n    같은 링크가 자물쇠(🔒) 유무로 두 행으로 갈려 중복 집계되는 것을 막는다.\"\"\"\n    out = [c for c in str(s)\n           if c not in _EMOJI_STRIP and unicodedata.category(c) != \"So\"]\n    return \" \".join(\"\".join(out).split())\n\n\n@st.cache_data(ttl=600)\ndef _product_daily():\n    return cafe24_snapshot.product_sales_daily()\n\n\npdl = _product_daily()\nif not pdl.empty:\n    pdl = pdl.copy()\n    pdl[\"브랜드\"] = C.to_brand5(pdl[\"브랜드\"])\n    pdl[\"구매액\"] = pd.to_numeric(pdl[\"구매액\"], errors=\"coerce\").fillna(0)\n    if \"일자\" in pdl.columns:\n        pdl[\"일자\"] = pd.to_datetime(pdl[\"일자\"], errors=\"coerce\")\n        pdl = pdl[(pdl[\"일자\"].dt.date >= start) & (pdl[\"일자\"].dt.date <= end)]\n    pdl = pdl[pdl[\"브랜드\"].isin(sel_brands)]\n\n\ndef _direct_sales(pko):\n    \"\"\"플랫폼 전용링크 직접전환 합 — _tag_of 분류와 일치(무라벨 광고전용=메타).\"\"\"\n    if pdl is None or pdl.empty:\n        return 0.0\n    tags = pdl[\"상품명\"].map(_tag_of)\n    return float(pdl.loc[tags == _PLAT_DETAIL[pko], \"구매액\"].sum())\n\n\ngrows = []\nfor pko in [\"메타\", \"틱톡\", \"구글\"]:\n    ap = a[a[\"platform\"] == PLAT_CODE[pko]] if not a.empty else a\n    cost = ap[\"cost\"].sum() if not ap.empty else 0\n    attr = ap[\"conv_value\"].sum() if not ap.empty else 0\n    direct = _direct_sales(pko)\n    grows.append({\"플랫폼\": pko, \"광고비\": cost,\n                  \"광고기여매출\": attr, \"광고ROAS\": round(attr / cost, 2) if cost else 0,\n                  \"직접전환(전용링크)\": direct, \"직접ROAS\": round(direct / cost, 2) if cost else 0,\n                  \"실제반영률\": round(direct / attr * 100, 1) if attr else None,\n                  \"괴리(광고÷직접)\": round(attr / direct, 1) if direct else None})\ngdf = pd.DataFrame(grows)\n\n# 표시용: 괴리율을 쉬운 수치로 — '실제반영률%'(직접÷광고기여) + '과대배수'\n_disp = gdf.rename(columns={\"실제반영률\": \"실제반영률%\", \"괴리(광고÷직접)\": \"과대배수\"})\n_disp = _disp[[\"플랫폼\", \"광고비\", \"광고기여매출\", \"광고ROAS\",\n               \"직접전환(전용링크)\", \"직접ROAS\", \"실제반영률%\", \"과대배수\"]]\ngc1, gc2 = st.columns([1.6, 1])\nwith gc1:\n    st.dataframe(fmt_df(_disp), use_container_width=True, hide_index=True)\n    st.caption(\"**실제반영률** = 직접전환 ÷ 광고기여매출 → 플랫폼이 보고한 매출 중 전용링크로 실제 확인되는 비율(높을수록 좋음). \"\n               \"**과대배수** = 광고기여 ÷ 직접전환(클수록 부풀림).\")\n    for _, r in gdf.iterrows():\n        if r[\"실제반영률\"] is not None:\n            infla = max(0.0, 100 - r[\"실제반영률\"])\n            st.markdown(\n                f\"- **{r['플랫폼']}**: 플랫폼 보고 기여매출 **{won(r['광고기여매출'])}** 중 전용링크로 실측되는 \"\n                f\"직접전환은 **{won(r['직접전환(전용링크)'])}** → **보고의 {r['실제반영률']:.0f}%만 실제 확인** \"\n                f\"(나머지 {infla:.0f}%는 미확증 · 약 {r['괴리(광고÷직접)']}배 부풀림)\")\nwith gc2:\n    melt = gdf.melt(id_vars=\"플랫폼\", value_vars=[\"광고기여매출\", \"직접전환(전용링크)\"],\n                    var_name=\"구분\", value_name=\"매출\")\n    fig = _px.bar(melt, x=\"플랫폼\", y=\"매출\", color=\"구분\", barmode=\"group\",\n                  title=\"광고 기여 vs 자사몰 직접전환\")\n    fig.update_layout(height=320, legend_title=\"\", margin=dict(t=40))\n    st.plotly_chart(fig, use_container_width=True)\n\n# 플랫폼별 상세 — 표 바로 아래 탭으로 인라인 표시(펼칠 필요 없이 바로 보임)\nst.markdown(\"**🔎 플랫폼별 괴리 지표 + 전용링크(UTM) 상품 세부**\")\nst.caption(\"메타=SNS+무라벨 광고전용 · 구글=유튜브광고전용 · 틱톡=틱톡광고전용. 그 외 공통/회원 링크는 플랫폼 미귀속.\")\nif pdl is not None and not pdl.empty:\n    _det = pdl.copy()\n    _det[\"매체\"] = _det[\"상품명\"].map(_tag_of)\nelse:\n    _det = pd.DataFrame()\n\n\ndef _render_platform_detail(pko):\n    gr = gdf[gdf[\"플랫폼\"] == pko].iloc[0]\n    gap = gr[\"괴리(광고÷직접)\"]\n    mc = st.columns(4)\n    mc[0].metric(\"광고비\", won(gr[\"광고비\"]))\n    mc[1].metric(\"광고 기여매출\", won(gr[\"광고기여매출\"]), f\"ROAS {roas_pct(gr['광고ROAS'])}\")\n    mc[2].metric(\"직접전환(전용링크)\", won(gr[\"직접전환(전용링크)\"]), f\"ROAS {roas_pct(gr['직접ROAS'])}\")\n    mc[3].metric(\"괴리(과대보고)\", f\"{gap}배\" if gap else \"-\")\n    st.caption(f\"↳ {pko} 전용링크 상품(직접전환 대상) — 링크별 직접전환·비중·직접ROAS\")\n    if _det.empty:\n        st.caption(\"데이터 없음\")\n        return\n    sub = _det[_det[\"매체\"] == _PLAT_DETAIL[pko]]\n    if sub.empty:\n        st.caption(\"선택 기간·브랜드에 해당 전용링크 상품 매출이 없습니다.\")\n        return\n    sub = sub.assign(상품명=sub[\"상품명\"].map(_norm_link_name))  # 🔒 유무 중복 병합\n    dd = sub.groupby([\"브랜드\", \"상품명\"], as_index=False)[\"구매액\"].sum()\n    dd = dd.sort_values(\"구매액\", ascending=False).head(30)\n    _tot = float(dd[\"구매액\"].sum())\n    _cost = float(gr[\"광고비\"] or 0)\n    dd = dd.rename(columns={\"구매액\": \"직접전환(구매액)\"})\n    dd[\"비중%\"] = (dd[\"직접전환(구매액)\"] / _tot * 100).round(1) if _tot else 0.0\n    dd[\"직접ROAS\"] = (dd[\"직접전환(구매액)\"] / _cost).round(3) if _cost else 0.0\n    st.dataframe(fmt_df(dd), use_container_width=True, hide_index=True)\n    st.caption(\"**직접ROAS** = 해당 전용링크 직접전환 ÷ 플랫폼 총광고비 \"\n               \"(모든 링크를 더하면 위 카드의 ‘직접전환 ROAS’와 같아짐). \"\n               \"**비중%** = 이 플랫폼 직접전환 중 차지하는 몫. \"\n               \"※ ‘과대배수(괴리)’는 광고비를 링크별로 분리할 수 없어 플랫폼 단위 지표입니다(상단 카드 참고).\")\n\n\n_tabs = st.tabs([\"📘 메타\", \"📕 틱톡\", \"📗 구글\"])\nfor _t, _pko in zip(_tabs, [\"메타\", \"틱톡\", \"구글\"]):\n    with _t:\n        _render_platform_detail(_pko)\n\nst.caption(\"상세 → 좌측 메뉴: 광고 · 매출·고객 · UX·퍼널 · 퍼포먼스 액션\")\n", "dashboards/funnel_report.py": "\"\"\"상품/전환 퍼널 대시보드.\n\n상단: 날짜 기반 전환 퍼널 — 방문(visitors) → 구매(orders) → 매출. 기간/브랜드로 유동.\n하단: 상품 관심도 — 조회 → 장바구니(carts, 스냅샷 집계로 기간 무관).\n\n실행:  streamlit run dashboards/funnel_report.py\n\"\"\"\nfrom __future__ import annotations\n\nimport json\nimport subprocess\nimport sys\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parent.parent\nsys.path.insert(0, str(ROOT))\n\nimport numpy as np  # noqa: E402\nimport pandas as pd  # noqa: E402\nimport plotly.express as px  # noqa: E402\nimport plotly.graph_objects as go  # noqa: E402\nimport streamlit as st  # noqa: E402\n\nfrom analyzers import _common as C  # noqa: E402\nfrom collectors import cafe24_snapshot as S  # noqa: E402\n\ntry:\n    st.set_page_config(page_title=\"상품/전환 퍼널\", layout=\"wide\")\nexcept Exception:\n    pass\nfrom dashboards._style import fmt_df, inject_css, page_intro, top_filter  # noqa: E402\ninject_css()\n\n\ndef won(x):\n    return f\"₩{x:,.0f}\"\n\n\n@st.cache_data(ttl=600)\ndef load():\n    return S.carts_df(), C.load_orders(), C.load_visitors(), S.product_sales_df()\n\n\ncarts, orders, visitors, products = load()\nst.title(\"🔻 전환 퍼널 — 방문 → 구매\")\npage_intro(\"선택 기간의 방문 → 구매 → 매출 전환을 봅니다(날짜 기반). \"\n           \"아래 ‘상품 관심도’는 조회·장바구니 집계로, 개선이 필요한 상세페이지를 찾습니다.\")\n\nif orders.empty and visitors.empty and carts.empty:\n    st.warning(\"데이터가 없습니다. 개요의 ‘실시간 API 취합’(cafe24 포함) 실행.\")\n    st.stop()\n\n# ---- carts 정제(상품 관심도용, 기간 무관) ----\nif not carts.empty:\n    carts = carts.copy()\n    carts[\"브랜드\"] = C.norm_brand(carts[\"브랜드\"])\n    for c in [\"조회수\", \"장바구니수\", \"장바구니율\"]:\n        carts[c] = pd.to_numeric(carts[c], errors=\"coerce\").fillna(0)\n    raw_n = len(carts)\n    carts = carts[(carts[\"조회수\"] > 0) & (carts[\"장바구니수\"] >= 0)\n                  & (carts[\"장바구니수\"] <= carts[\"조회수\"])].copy()\n    carts[\"장바구니율\"] = (carts[\"장바구니수\"] / carts[\"조회수\"] * 100).round(2)\n    dropped = raw_n - len(carts)\nelse:\n    dropped = 0\n\n# ---- 기간/브랜드 필터 ----\nbrand_pool = sorted(set(\n    list(orders[\"brand\"].dropna().unique() if not orders.empty else [])\n    + list(visitors[\"brand\"].dropna().unique() if not visitors.empty else [])))\nif not orders.empty:\n    _od = orders[\"date\"].dt.date\n    start, end, sel_brands = top_filter(brand_pool, _od.min(), _od.max(), key=\"fun\")\nelif not visitors.empty:\n    _vd = visitors[\"date\"].dt.date\n    start, end, sel_brands = top_filter(brand_pool, _vd.min(), _vd.max(), key=\"fun\")\nelse:\n    start, end, sel_brands = top_filter(brand_pool, key=\"fun\", with_date=False)\n\n\ndef in_range_brand(df):\n    if df.empty:\n        return df\n    out = df.copy()\n    out[\"d\"] = out[\"date\"].dt.date\n    if start is not None:\n        out = out[(out[\"d\"] >= start) & (out[\"d\"] <= end)]\n    return out[out[\"brand\"].isin(sel_brands)]\n\n\nvf = in_range_brand(visitors)\novf = in_range_brand(orders[orders[\"is_cancel\"] == 0]) if not orders.empty else orders\n\nvisits = float(vf[\"visits\"].sum()) if not vf.empty else 0\nn_buy = int(len(ovf)) if not ovf.empty else 0\nrev = float(ovf[\"sales_amount\"].sum()) if not ovf.empty else 0\nconv = (n_buy / visits * 100) if visits else 0\naov = (rev / n_buy) if n_buy else 0\n\nst.caption(f\"기간: **{start} ~ {end}**  ·  브랜드: {', '.join(sel_brands)}\")\n\n# ---- KPI (날짜 기반) ----\nk = st.columns(5)\nk[0].metric(\"방문수\", f\"{visits:,.0f}\")\nk[1].metric(\"구매수(유효주문)\", f\"{n_buy:,.0f}\")\nk[2].metric(\"구매전환율\", f\"{conv:,.2f}%\")\nk[3].metric(\"순매출\", won(rev))\nk[4].metric(\"AOV(객단가)\", won(aov))\nst.divider()\n\nc1, c2 = st.columns([1, 1.3])\nwith c1:\n    st.subheader(\"전환 퍼널\")\n    if visits or n_buy:\n        fig = go.Figure(go.Funnel(y=[\"방문\", \"구매\"], x=[visits, n_buy],\n                                  textinfo=\"value+percent initial\",\n                                  marker=dict(color=[\"#5B8FF9\", \"#F6BD16\"])))\n        fig.update_layout(height=300, margin=dict(t=10))\n        st.plotly_chart(fig, use_container_width=True)\n    else:\n        st.info(\"방문/구매 데이터가 없습니다.\")\nwith c2:\n    st.subheader(\"일자별 방문·구매·전환율\")\n    if not vf.empty or not ovf.empty:\n        vday = vf.groupby(\"d\")[\"visits\"].sum().rename(\"방문\") if not vf.empty else pd.Series(dtype=float)\n        oday = ovf.groupby(\"d\").size().rename(\"구매\") if not ovf.empty else pd.Series(dtype=float)\n        daily = pd.concat([vday, oday], axis=1).fillna(0).reset_index(names=\"일자\")\n        daily[\"구매전환율\"] = (daily[\"구매\"] / daily[\"방문\"].replace(0, np.nan) * 100).round(2)\n        fig2 = px.bar(daily, x=\"일자\", y=[\"방문\", \"구매\"], barmode=\"group\")\n        fig2.add_scatter(x=daily[\"일자\"], y=daily[\"구매전환율\"], name=\"구매전환율(%)\",\n                         yaxis=\"y2\", mode=\"lines+markers\", line=dict(color=\"#E8684A\"))\n        fig2.update_layout(height=320, margin=dict(t=10),\n                           yaxis2=dict(overlaying=\"y\", side=\"right\", showgrid=False, title=\"전환율%\"),\n                           legend=dict(orientation=\"h\", y=1.12))\n        st.plotly_chart(fig2, use_container_width=True)\n    else:\n        st.info(\"일자별 데이터가 없습니다.\")\n\n# ---- 브랜드별 전환율 ----\nif not vf.empty and not ovf.empty:\n    st.subheader(\"브랜드별 방문 → 구매 전환율\")\n    vb = vf.groupby(\"brand\")[\"visits\"].sum()\n    ob = ovf.groupby(\"brand\").size()\n    bt = pd.concat([vb.rename(\"방문\"), ob.rename(\"구매\")], axis=1).fillna(0)\n    bt[\"구매전환율\"] = (bt[\"구매\"] / bt[\"방문\"].replace(0, np.nan) * 100).round(2)\n    bt = bt.reset_index().rename(columns={\"brand\": \"브랜드\"}).sort_values(\"구매전환율\", ascending=False)\n    st.dataframe(fmt_df(bt), use_container_width=True, hide_index=True)\n\nst.divider()\n\n# ---- 기간별 장바구니 분석 (cafe24 실시간 조회) ----\nst.subheader(\"🛒 기간별 장바구니 분석 (선택 기간 자동 조회)\")\nst.caption(\"상단의 **기간 선택**을 바꾸면 그 기간을 cafe24 에 조회해 **조회 → 장바구니 → 구매** 퍼널이 \"\n           \"자동으로 갱신됩니다. (평소 carts 집계와 달리 기간이 반영됩니다. 새 기간은 cafe24 API 호출이라 \"\n           \"처음 한 번 몇 초 걸릴 수 있어요.)\")\n\n\n@st.cache_data(ttl=1800, show_spinner=\"cafe24 장바구니 조회 중...\")\ndef fetch_cart_period(s_iso: str, e_iso: str):\n    \"\"\"선택 기간을 cafe24 에 조회(서브프로세스). (records, error) 반환. 기간별로 캐시.\"\"\"\n    cafe = S.SNAP_DIR.parent\n    gpy = r\"C:\\Python314\\python.exe\"\n    if not Path(gpy).exists():\n        gpy = \"python\"\n    try:\n        r = subprocess.run([gpy, \"cart_range_export.py\", s_iso, e_iso],\n                           cwd=str(cafe), capture_output=True, text=True, timeout=120)\n    except Exception as ex:  # noqa: BLE001\n        return None, str(ex)\n    if r.returncode != 0:\n        return None, (r.stderr or \"조회 실패\")[-300:]\n    try:\n        line = [ln for ln in r.stdout.strip().splitlines() if ln.strip().startswith(\"[\")][-1]\n        return json.loads(line), None\n    except Exception as ex:  # noqa: BLE001\n        return None, f\"파싱 실패: {ex} / {r.stdout[-200:]}\"\n\n\nif start is None:\n    st.info(\"상단에서 기간을 선택하면 해당 기간 장바구니 퍼널이 자동으로 표시됩니다.\")\nelse:\n    records, err = fetch_cart_period(start.isoformat(), end.isoformat())\n    if err:\n        st.warning(f\"장바구니 조회 실패: {err}\")\n    elif not records:\n        st.info(\"선택 기간에 장바구니 데이터가 없습니다. 기간을 더 넓게 선택해 보세요.\")\n    else:\n        dcp = pd.DataFrame(records)\n        dcp[\"브랜드\"] = C.norm_brand(dcp[\"브랜드\"])\n        for c in [\"조회수\", \"장바구니수\", \"장바구니율\"]:\n            dcp[c] = pd.to_numeric(dcp[c], errors=\"coerce\").fillna(0)\n        dcp = dcp[(dcp[\"조회수\"] > 0) & (dcp[\"장바구니수\"] <= dcp[\"조회수\"])]\n        dcp = dcp[dcp[\"브랜드\"].isin(sel_brands)]\n        pv, pc = dcp[\"조회수\"].sum(), dcp[\"장바구니수\"].sum()\n        cart_to_buy = (n_buy / pc * 100) if pc else 0\n        mk = st.columns(4)\n        mk[0].metric(\"조회수(기간)\", f\"{pv:,.0f}\")\n        mk[1].metric(\"장바구니수(기간)\", f\"{pc:,.0f}\", f\"조회→장바구니 {(pc/pv*100 if pv else 0):.2f}%\")\n        mk[2].metric(\"구매수(기간)\", f\"{n_buy:,.0f}\", f\"장바구니→구매 {cart_to_buy:.1f}%\")\n        mk[3].metric(\"추정 장바구니 금액\", won(pc * aov), help=\"장바구니수 × 평균객단가(AOV) 추정\")\n        fcol, tcol = st.columns([1, 1.3])\n        with fcol:\n            figf = go.Figure(go.Funnel(y=[\"조회\", \"장바구니\", \"구매\"], x=[pv, pc, n_buy],\n                                       textinfo=\"value+percent initial\",\n                                       marker=dict(color=[\"#5B8FF9\", \"#5AD8A6\", \"#F6BD16\"])))\n            figf.update_layout(height=320, margin=dict(t=10))\n            st.plotly_chart(figf, use_container_width=True)\n        with tcol:\n            st.caption(\"장바구니 많은 상품 TOP (기간)\")\n            topc = dcp.sort_values(\"장바구니수\", ascending=False).head(12)\n            st.dataframe(fmt_df(topc[[\"브랜드\", \"상품명\", \"조회수\", \"장바구니수\", \"장바구니율\"]]\n                         .rename(columns={\"장바구니율\": \"장바구니율%\"})),\n                         use_container_width=True, hide_index=True)\n\nst.divider()\n\n# ---- 상품별 장바구니 → 구매 추적 (carts + products 결합) ----\nst.subheader(\"🛒➡️🧾 상품별 장바구니 → 구매 추적 (전체 집계)\")\nst.caption(\"장바구니에 담긴 상품이 실제 구매로 이어졌는지 추적합니다. \"\n           \"조회·장바구니 = carts, 구매수·구매액 = products(상품별 판매) 를 상품 단위로 결합. \"\n           \"※ 둘 다 스냅샷 집계라 기간 필터와 무관합니다.\")\n\nif carts.empty or products.empty:\n    st.info(\"carts/products 데이터가 필요합니다. 개요의 ‘실시간 API 취합’(cafe24 포함) 실행.\")\nelse:\n    prod = products.copy()\n    prod[\"브랜드\"] = C.norm_brand(prod[\"브랜드\"])\n    prod[\"pno\"] = prod[\"상품URL\"].astype(str).str.extract(r\"product_no=(\\d+)\")\n    for c in [\"구매액\", \"주문수\"]:\n        prod[c] = pd.to_numeric(prod[c], errors=\"coerce\").fillna(0)\n    prod = prod.groupby([\"브랜드\", \"pno\"], as_index=False).agg(구매수=(\"주문수\", \"sum\"),\n                                                             구매액=(\"구매액\", \"sum\"))\n    cc = carts.copy()\n    cc[\"pno\"] = pd.to_numeric(cc[\"상품번호\"], errors=\"coerce\").astype(\"Int64\").astype(str)\n    m = cc.merge(prod, on=[\"브랜드\", \"pno\"], how=\"left\")\n    m[\"구매수\"] = m[\"구매수\"].fillna(0)\n    m[\"구매액\"] = m[\"구매액\"].fillna(0)\n    m = m[m[\"브랜드\"].isin(sel_brands)]\n    m[\"장바구니→구매율\"] = (m[\"구매수\"] / m[\"장바구니수\"].replace(0, np.nan) * 100).round(1)\n\n    tot_cart = m[\"장바구니수\"].sum()\n    tot_buy_p = m[\"구매수\"].sum()\n    tot_rev_p = m[\"구매액\"].sum()\n    kk = st.columns(4)\n    kk[0].metric(\"총 장바구니수\", f\"{tot_cart:,.0f}\")\n    kk[1].metric(\"총 구매수(상품)\", f\"{tot_buy_p:,.0f}\",\n                 f\"장바구니→구매 {(tot_buy_p/tot_cart*100 if tot_cart else 0):.1f}%\")\n    kk[2].metric(\"총 구매액\", won(tot_rev_p))\n    matched = int((m[\"구매수\"] > 0).sum())\n    kk[3].metric(\"구매 연결 상품수\", f\"{matched:,} / {len(m):,}\")\n\n    st.markdown(\"**상품별 장바구니 → 구매 (구매액 상위)**\")\n    show = m.sort_values(\"구매액\", ascending=False).head(20)\n    st.dataframe(fmt_df(show[[\"브랜드\", \"상품명\", \"조회수\", \"장바구니수\", \"구매수\", \"구매액\", \"장바구니→구매율\"]]\n                 .rename(columns={\"장바구니→구매율\": \"장바구니→구매율%\"})),\n                 use_container_width=True, hide_index=True)\n\n    st.markdown(\"**🔎 개선 후보: 장바구니는 많은데 구매로 덜 이어진 상품** \"\n                \"(장바구니 상위 50% 중 전환율 하위)\")\n    cand = m[m[\"장바구니수\"] >= m[\"장바구니수\"].quantile(0.5)].copy()\n    cand = cand.sort_values(\"장바구니→구매율\").head(10)\n    st.dataframe(fmt_df(cand[[\"브랜드\", \"상품명\", \"조회수\", \"장바구니수\", \"구매수\", \"장바구니→구매율\"]]\n                 .rename(columns={\"장바구니→구매율\": \"장바구니→구매율%\"})),\n                 use_container_width=True, hide_index=True)\n\n    fig3 = px.scatter(m[m[\"장바구니수\"] > 0], x=\"장바구니수\", y=\"장바구니→구매율\",\n                      size=\"구매액\", color=\"브랜드\", hover_name=\"상품명\",\n                      labels={\"장바구니→구매율\": \"장바구니→구매율 %\"},\n                      title=\"장바구니수 vs 장바구니→구매율 (오른쪽 아래일수록 개선 여지 큼)\")\n    fig3.update_layout(height=420, margin=dict(t=40))\n    st.plotly_chart(fig3, use_container_width=True)\n", "dashboards/handoff_page.py": "\"\"\"디자이너 전달 페이지 (좌측 메뉴 항목). 기존 app.py ③탭을 독립 페이지로.\"\"\"\nfrom __future__ import annotations\n\nimport sys\nfrom datetime import datetime\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parent.parent\nsys.path.insert(0, str(ROOT))\n\nimport pandas as pd  # noqa: E402\nimport streamlit as st  # noqa: E402\n\nimport db  # noqa: E402\nfrom analyzers import root_cause_engine  # noqa: E402\nfrom handoff import designer  # noqa: E402\n\ntry:\n    st.set_page_config(page_title=\"디자이너 전달\", layout=\"wide\")\nexcept Exception:\n    pass\nfrom dashboards._style import inject_css  # noqa: E402\ninject_css()\n\nst.title(\"📨 디자이너 전달\")\nst.info(\"ℹ️ 디자이너 자동전달 로직은 재정의 예정입니다. 아래는 현재 동작(수동 전달/이력) 미리보기입니다.\")\n\ninsight = root_cause_engine.primary_insight()\nif not insight:\n    st.info(\"전달할 인사이트가 없습니다.\")\nelse:\n    sev = {\"High\": \"🔴\", \"Medium\": \"🟡\", \"Low\": \"🟢\"}.get(insight[\"severity\"], \"🔵\")\n    st.markdown(f\"### {sev} {insight['title']}\")\n    st.markdown(insight[\"summary\"])\n    st.code(f\"대상 페이지: {insight['target_url']}\", language=\"text\")\n    if st.button(\"📨 디자이너에게 전달하기\", type=\"primary\"):\n        res = designer.send(insight, now=datetime.now().isoformat(timespec=\"seconds\"))\n        (st.success if res[\"status\"] == \"sent\" else st.error)(\n            f\"{res['status']} → {res['channel']}\\n\\n{res['detail']}\")\n    with st.expander(\"전달 브리프 미리보기\"):\n        st.markdown(insight[\"body_md\"])\n\nst.divider()\nst.subheader(\"📜 전달 이력\")\ntry:\n    hist = pd.read_sql_table(\"insights\", db.engine)\n    if not hist.empty:\n        st.dataframe(hist[[\"created_at\", \"severity\", \"title\", \"target_url\",\n                           \"handoff_status\", \"handoff_channel\"]]\n                     .sort_values(\"created_at\", ascending=False),\n                     use_container_width=True, hide_index=True)\n    else:\n        st.info(\"아직 전달 이력이 없습니다.\")\nexcept Exception:\n    st.info(\"아직 전달 이력이 없습니다.\")\n", "dashboards/Home.py": "\"\"\"마케팅 인텔리전스 스위트 — 단일 통합 웹 대시보드.\n\n좌측 사이드바 메뉴(개요/광고/매출·고객/UX)로 모든 리포트를 한 앱에서 본다.\n\n실행:\n  cd marketing-intelligence\n  streamlit run dashboards/Home.py\n  →  브라우저(localhost:8501)에서 좌측 메뉴로 페이지 전환\n\n개별 대시보드도 그대로 단독 실행 가능:\n  streamlit run dashboards/ad_report.py   등\n\"\"\"\nfrom __future__ import annotations\n\nimport sys\nfrom pathlib import Path\n\nimport streamlit as st\n\nst.set_page_config(page_title=\"마케팅 인텔리전스 스위트\", page_icon=\"📊\", layout=\"wide\")\n\nDASH = Path(__file__).resolve().parent\nsys.path.insert(0, str(DASH.parent))  # marketing-intelligence 루트(analyzers/collectors)\n\nfrom dashboards._style import brand_sidebar, inject_css  # noqa: E402\n\ninject_css()\nbrand_sidebar()\n\n# 좌측 그룹 네비게이션 (datanugget 스타일) — 모든 하위 메뉴 취합\npages = {\n    \"개요\": [\n        st.Page(\"executive_report.py\", title=\"통합 요약\", icon=\"📌\", default=True),\n        st.Page(\"hourly_sales_page.py\", title=\"시간대별 매출 확인\", icon=\"⏱️\"),\n    ],\n    \"광고\": [\n        st.Page(\"ad_report.py\", title=\"통합 광고 리포트\", icon=\"📣\"),\n        st.Page(\"pa_report.py\", title=\"PA소재 분석\", icon=\"👤\"),\n        st.Page(\"lowspend_report.py\", title=\"저금액 소재(재셋팅)\", icon=\"⚠️\"),\n        st.Page(\"demographics_report.py\", title=\"연령·성별 분석\", icon=\"👥\"),\n        st.Page(\"creative_page.py\", title=\"크리에이티브 분석\", icon=\"🎬\"),\n    ],\n    \"매출·고객\": [\n        st.Page(\"weekly_trend.py\", title=\"7일치 동향\", icon=\"📈\"),\n        st.Page(\"weekly_compare.py\", title=\"주차별 비교\", icon=\"📅\"),\n    ],\n    \"UX · 퍼널\": [\n        st.Page(\"ux_funnel_page.py\", title=\"UX·퍼널 분석\", icon=\"🧭\"),\n        st.Page(\"funnel_report.py\", title=\"상품 퍼널\", icon=\"🔻\"),\n        st.Page(\"clarity_page.py\", title=\"Clarity 분석\", icon=\"🖱️\"),\n    ],\n    \"퍼포먼스 액션\": [\n        st.Page(\"performance_action.py\", title=\"퍼포먼스 액션\", icon=\"🎯\"),\n    ],\n}\n\nst.navigation(pages).run()\n", "dashboards/hourly_sales_data.py": "# -*- coding: utf-8 -*-\n\"\"\"「시간대별 매출 확인」 데이터 계층 — 라이브 주문 API + 보존 DB(hourly_sales).\n\n화면(hourly_sales_page.py)과 수집기(scripts/collect_hourly_sales.py)가 같은 로직을 쓰도록\n여기로 분리했다. 화면은 Streamlit 캐시를 씌워 부르고, 수집기는 그냥 부른다.\n\n**왜 DB 사본이 필요한가**: 이 페이지는 주문 API 를 매번 라이브로 부른다. 그래서 토큰·네트워크가\n없는 보존 사본 사이트(stlite 정적 /app)에서는 통째로 빈 화면이 된다. 완료된 날의 결과를\nhourly_sales 테이블에 적재해 두면 그런 환경도 '지난 날' 을 그릴 수 있다.\n\n**채널별 시각(hour) 해상도** — 되는 것과 안 되는 것이 갈린다(2026-08-07 실측):\n  · 카페24      : 주문 API 가 과거 어느 날이든 order_date(초 단위)를 준다 → 시간대별 O, 백필 O\n  · 스마트스토어 : 커머스 API 는 '변경분(lastChanged)' 조회뿐이라 지난 날 결제분을 못 준다\n                   (2026-08-01 조회 = 0원, 실제 1,329,400원). D-3 안쪽도 절반쯤만 잡힌다\n                   (08-06 조회 259,500 vs 실제 724,600) → **일 총액만**(products.pkl) 보존\n  · 쿠팡        : 로켓그로스 정산 지연으로 애초에 시각이 못 믿을 값 → **일 총액만**(products.pkl)\n시각을 못 주는 채널은 hour=-1 한 행에 일 총액으로 적재한다.\n\"\"\"\nfrom __future__ import annotations\n\nimport datetime as dt\nimport sys\nfrom pathlib import Path\n\nimport pandas as pd\n\nROOT = Path(__file__).resolve().parent.parent\nif str(ROOT) not in sys.path:\n    sys.path.insert(0, str(ROOT))\n\n_CAFE24_DIR = ROOT.parent.parent / \"cafe24-dashboard\"\nif str(_CAFE24_DIR) not in sys.path:\n    sys.path.insert(0, str(_CAFE24_DIR))\n\nPRODUCTS_PKL = _CAFE24_DIR / \"snapshot\" / \"products.pkl\"\n\n# 화면에 노출하는 브랜드 → 카페24 몰\nBRAND_MALL = {\n    \"림데이\": \"lymday\", \"안티칼알파\": \"antical\", \"에이징핏\": \"antical\",\n    \"안티칼알파max\": \"antical\", \"뉴로포커스\": \"neurofocus\", \"씨코랩\": \"cicolab\",\n}\nHOUR_CHANNELS = [\"카페24\"]                  # 시각(0~23)까지 있는 채널\nDAY_ONLY_CHANNELS = [\"스마트스토어\", \"쿠팡\"]  # 일 총액만 있는 채널(hour=-1)\nDAY_TOTAL_HOUR = -1\n\n\n# ==================================================================\n# 라이브 — 주문 API 직접 조회(토큰 필요. 보존 사본 환경에서는 불가)\n# ==================================================================\n\ndef live_available() -> bool:\n    \"\"\"이 환경에서 주문 API 조회가 가능한가(모듈·설정이 있는가).\"\"\"\n    try:\n        import cafe24_api  # noqa: F401\n        from common import load_config  # noqa: F401\n    except Exception:  # noqa: BLE001  (stlite=모듈 없음, 로컬=설정 없음)\n        return False\n    return True\n\n\ndef fetch_cafe24_hourly(mall_id: str, day_iso: str) -> list[dict]:\n    \"\"\"카페24 한 몰의 하루치 실주문 → [{\"시\", \"브랜드\", \"매출\"}]. 매출=실결제액(취소 제외).\"\"\"\n    from brands import brand_map, canonicalize\n    from cafe24_api import Cafe24Client, _actual_payment, _item_list_price, _item_revenue\n    from common import load_config, load_tokens\n\n    cfg_all = load_config()\n    cfg = cfg_all[\"cafe24\"]\n    m = next((x for x in cfg_all[\"malls\"] if x[\"id\"] == mall_id), None)\n    if not m:\n        return []\n    client = Cafe24Client(mall_id, cfg, load_tokens(),\n                          m.get(\"client_id\") or cfg.get(\"client_id\"),\n                          m.get(\"client_secret\") or cfg.get(\"client_secret\"))\n    bmap = brand_map()\n    day = dt.date.fromisoformat(day_iso)\n    orders = client.fetch_orders(day, day, embed=\"items\")\n\n    rows = []\n    for o in orders:\n        try:\n            t = dt.datetime.fromisoformat(o.get(\"order_date\") or \"\")\n        except ValueError:\n            continue\n        pay = _actual_payment(o)\n        items = o.get(\"items\") or []\n        if not items:\n            rows.append({\"시\": t.hour, \"브랜드\": m.get(\"label\", mall_id), \"매출\": pay})\n            continue\n        # 주문 실결제액을 항목 비중으로 쪼개 브랜드에 귀속.\n        # ★폴백 체인은 공식 수집기(cafe24_api.fetch_daily_sales)와 같아야 한다:\n        #   항목 결제액 비율 → (전부 0이면) 정가 비율 → (그것도 0이면) 균등.\n        #   예전 이 페이지 코드는 첫 단계만 있어서, 항목 결제액이 전부 0인 주문(비밀특가·\n        #   쿠폰 전액할인 등)의 매출이 통째로 사라졌다 — 림데이 2026-08-06 기준 199만원(8.8%).\n        grosses = [_item_revenue(it) for it in items]\n        itot = sum(grosses)\n        prices = [_item_list_price(it) for it in items]\n        ptot = sum(prices)\n        if itot > 0:\n            weights, denom = grosses, itot\n        elif ptot > 0:\n            weights, denom = prices, ptot\n        else:\n            weights, denom = [1.0] * len(items), float(len(items))\n        for w, it in zip(weights, items):\n            name = it.get(\"product_name\") or it.get(\"product_name_default\") or \"\"\n            br = canonicalize(name, bmap, default=m.get(\"label\", mall_id))\n            rows.append({\"시\": t.hour, \"브랜드\": br, \"매출\": pay * (w / denom)})\n    return rows\n\n\ndef fetch_smartstore_hourly(day_iso: str) -> list[dict]:\n    \"\"\"스마트스토어 하루치(변경분 기준) → [{\"시\", \"브랜드\", \"매출\"}].\n\n    ⚠ 지난 날에는 **불완전**하다(모듈 docstring 참고). 오늘 화면용으로만 쓰고,\n    보존 DB 에는 넣지 않는다.\n    \"\"\"\n    from brands import brand_map, canonicalize\n    from common import load_config\n    from smartstore_api import EXCLUDE_STATUS, _accounts, _changed_ids, _query, _token\n\n    accts = _accounts(load_config())\n    if not accts:\n        return []\n    bmap = brand_map()\n    day = dt.date.fromisoformat(day_iso)\n\n    rows = []\n    for a in accts:\n        try:\n            tok = _token(a[\"client_id\"], a[\"client_secret\"])\n        except Exception:  # noqa: BLE001\n            continue\n        for po in _query(tok, _changed_ids(tok, day, day)):\n            o = po.get(\"order\") or {}\n            p = po.get(\"productOrder\") or {}\n            if (p.get(\"productOrderStatus\") or \"\") in EXCLUDE_STATUS:\n                continue\n            try:\n                t = dt.datetime.fromisoformat(o.get(\"paymentDate\") or o.get(\"orderDate\") or \"\")\n            except ValueError:\n                continue\n            if t.date() != day:\n                continue\n            name = p.get(\"productName\") or \"\"\n            rows.append({\"시\": t.hour,\n                         \"브랜드\": canonicalize(name, bmap, default=\"기타(스마트스토어)\"),\n                         \"매출\": float(p.get(\"totalPaymentAmount\") or 0)})\n    return rows\n\n\ndef fetch_coupang_live(day_iso: str) -> list[dict]:\n    \"\"\"쿠팡 라이브(판매자배송+로켓그로스) — 오늘의 '부분값' 총액용. 시각은 신뢰하지 않는다.\"\"\"\n    from brands import brand_map, canonicalize\n    from common import load_config\n    from coupang_api import CoupangClient, _accounts, _item_amount, _rg_orders_raw\n\n    accts = _accounts(load_config())\n    if not accts:\n        return []\n    bmap = brand_map()\n    day = dt.date.fromisoformat(day_iso)\n\n    rows: list[dict] = []\n    seen_boxes: set = set()\n    seen_order_ids: set = set()\n    for a in accts:\n        cl = CoupangClient(a[\"vendor_id\"], a[\"access_key\"], a[\"secret_key\"])\n        try:\n            orders = cl.fetch_ordersheets(day, day)\n        except Exception:  # noqa: BLE001\n            continue\n        for o in orders:\n            box_id = o.get(\"shipmentBoxId\")\n            if box_id in seen_boxes:\n                continue\n            seen_boxes.add(box_id)\n            try:\n                t = dt.datetime.fromisoformat(\n                    o.get(\"orderedAt\") or o.get(\"paidAt\") or o.get(\"createdAt\") or \"\")\n            except ValueError:\n                continue\n            if t.date() != day:\n                continue\n            oid = o.get(\"orderId\")\n            if oid is not None:\n                seen_order_ids.add(str(oid))\n            for item in o.get(\"orderItems\") or []:\n                name = item.get(\"vendorItemName\") or item.get(\"sellerProductName\") or \"\"\n                rows.append({\"시\": t.hour,\n                             \"브랜드\": canonicalize(name, bmap, default=\"기타(쿠팡)\"),\n                             \"매출\": _item_amount(item)})\n    try:\n        rg_rows = _rg_orders_raw(accts, day, day)\n    except Exception:  # noqa: BLE001\n        rg_rows = []\n    for r in rg_rows:\n        if str(r.get(\"orderId\")) in seen_order_ids:\n            continue\n        ms = r.get(\"paidAt\")\n        if not ms:\n            continue\n        t = dt.datetime.fromtimestamp(int(ms) / 1000, dt.timezone.utc) + dt.timedelta(hours=9)\n        if t.date() != day:\n            continue\n        for it in (r.get(\"orderItems\") or []):\n            rows.append({\"시\": t.hour,\n                         \"브랜드\": canonicalize(it.get(\"productName\") or \"\", bmap, default=\"기타(쿠팡)\"),\n                         \"매출\": float(it.get(\"salesQuantity\") or 0) * float(it.get(\"unitSalesPrice\") or 0)})\n    return rows\n\n\n# ==================================================================\n# 스냅샷(products.pkl) — 마감된 날의 채널 일 총액(시각 없음)\n# ==================================================================\n\nCHANNEL_MALL = {\"쿠팡\": \"coupang\", \"스마트스토어\": \"smartstore\", \"카페24\": \"cafe24\"}\n\n\ndef _daily_sales_total(channel: str, brand: str, day_iso: str) -> float | None:\n    \"\"\"data.db `daily_sales` 폴백 — products.pkl 롤링창(60일) 밖 날짜용. 못 읽으면 None.\"\"\"\n    mall = CHANNEL_MALL.get(channel)\n    if not mall:\n        return None\n    try:\n        import db as _db\n        with _db.engine.connect() as conn:\n            row = conn.exec_driver_sql(\n                \"select sum(sales_amount) from daily_sales \"\n                \"where date=? and mall_id=? and brand=?\", (day_iso, mall, brand)).fetchone()\n    except Exception:  # noqa: BLE001  (보존 사본 환경 등)\n        return None\n    return float(row[0]) if row and row[0] is not None else None\n\n\ndef snapshot_daily_total(channel: str, brand: str, day_iso: str) -> float:\n    \"\"\"수집된(완전) 채널 일 총액 — products.pkl 기준. 없으면 0.0.\n\n    ★products.pkl 은 **롤링 60일**이라 그보다 오래된 날은 통째로 비어 있다(2026-08-19 확인:\n      6/12~6/20 쿠팡이 0). 그 경우 스냅샷이 아니라 `daily_sales`(DB)에서 읽어야 옛 행이\n      갱신되지 않고 남는 일이 없다. 그 날짜가 pkl 에 **아예 없을 때만** 폴백한다\n      — 있는데 0이면 진짜 매출 0이므로 폴백하면 안 된다.\n    \"\"\"\n    try:\n        prod = pd.read_pickle(PRODUCTS_PKL)\n    except Exception:  # noqa: BLE001\n        prod = None\n    if prod is not None:\n        prod = prod.copy()\n        prod[\"일자\"] = pd.to_datetime(prod[\"일자\"])\n        day = pd.Timestamp(day_iso)\n        # ★롤링창의 «첫날»은 잘려 있을 수 있다(6/21 쿠팡 7,064,340 vs 실제 7,296,250) → 폴백 대상\n        edge = prod[\"일자\"].min()\n        if (prod[\"일자\"] == day).any() and day != edge:\n            m = (prod[\"채널\"] == channel) & (prod[\"브랜드\"] == brand) & (prod[\"일자\"] == day)\n            return float(prod.loc[m, \"구매액\"].sum())\n    fb = _daily_sales_total(channel, brand, day_iso)\n    return float(fb) if fb is not None else 0.0\n\n\ndef snapshot_days() -> list[str]:\n    \"\"\"products.pkl 이 담고 있는 날짜(ISO) 목록 — 백필 가능 범위 확인용.\"\"\"\n    try:\n        prod = pd.read_pickle(PRODUCTS_PKL)\n    except Exception:  # noqa: BLE001\n        return []\n    return sorted(pd.to_datetime(prod[\"일자\"]).dt.date.astype(str).unique())\n\n\n# ==================================================================\n# 보존 DB(hourly_sales) — 읽기/쓰기\n# ==================================================================\n\ndef _empty_hours() -> \"pd.Series\":\n    return pd.Series(0.0, index=range(24))\n\n\ndef db_available_days() -> list[str]:\n    \"\"\"hourly_sales 에 들어있는 날짜(ISO) 오름차순. 테이블이 없으면 [].\"\"\"\n    import db as _db\n    try:\n        with _db.engine.connect() as conn:\n            rows = conn.exec_driver_sql(\n                \"select distinct date from hourly_sales order by date\").fetchall()\n    except Exception:  # noqa: BLE001  (테이블 없음 = 아직 수집 전)\n        return []\n    return [str(r[0]) for r in rows]\n\n\ndef db_load_day(brand: str, day: dt.date) -> tuple[dict[str, \"pd.Series\"], dict[str, float]]:\n    \"\"\"(시간대 채널 Series, 일총액 채널 dict) — 그 날 그 브랜드의 보존 데이터.\"\"\"\n    import db as _db\n    hours: dict[str, \"pd.Series\"] = {}\n    totals: dict[str, float] = {}\n    try:\n        with _db.engine.connect() as conn:\n            rows = conn.exec_driver_sql(\n                \"select channel, hour, revenue from hourly_sales where date=? and brand=?\",\n                (day.isoformat(), brand)).fetchall()\n    except Exception:  # noqa: BLE001\n        return hours, totals\n    for ch, hr, rev in rows:\n        if hr == DAY_TOTAL_HOUR:\n            totals[ch] = totals.get(ch, 0.0) + float(rev or 0)\n        else:\n            s = hours.setdefault(ch, _empty_hours())\n            s.loc[int(hr)] = s.loc[int(hr)] + float(rev or 0)\n    return hours, totals\n\n\ndef collect_day(day: dt.date, brands: list[str] | None = None) -> list[dict]:\n    \"\"\"하루치 보존 행 생성 — 카페24=시간대별(주문 API), 스마트스토어·쿠팡=일 총액(스냅샷).\n\n    같은 몰을 공유하는 브랜드(안티칼알파·에이징핏·안티칼알파max)는 API 를 몰당 한 번만 부른다.\n    \"\"\"\n    brands = brands or list(BRAND_MALL)\n    day_iso = day.isoformat()\n    rows: list[dict] = []\n\n    per_mall: dict[str, list[dict]] = {}\n    for mall in {BRAND_MALL[b] for b in brands}:\n        per_mall[mall] = fetch_cafe24_hourly(mall, day_iso)\n\n    for brand in brands:\n        for r in per_mall[BRAND_MALL[brand]]:\n            if r[\"브랜드\"] != brand:\n                continue\n            rows.append({\"date\": day, \"brand\": brand, \"channel\": \"카페24\",\n                         \"hour\": int(r[\"시\"]), \"revenue\": float(r[\"매출\"])})\n        for ch in DAY_ONLY_CHANNELS:\n            amt = snapshot_daily_total(ch, brand, day_iso)\n            if amt:\n                rows.append({\"date\": day, \"brand\": brand, \"channel\": ch,\n                             \"hour\": DAY_TOTAL_HOUR, \"revenue\": amt})\n\n    # 같은 (브랜드·채널·시각) 여러 주문 → 합산\n    if rows:\n        df = (pd.DataFrame(rows)\n              .groupby([\"date\", \"brand\", \"channel\", \"hour\"], as_index=False)[\"revenue\"].sum())\n        rows = df.to_dict(\"records\")\n    return rows\n", "dashboards/hourly_sales_page.py": "\"\"\"⏱ 시간대별 매출 확인 — 카페24·스마트스토어·쿠팡 통합, 실주문 API 기준(GA4 추정 아님).\n\n기존 \"브랜드별 매출속도\" 리포트(scripts/build_sales_pace_report.py)는 시간 해상도가 GA4 dateHour\n뿐이라 실매출 총액에 스케일 보정한 추정값이었다(실측과 비교해보니 특정 시각 값이 최대 5%가량\n어긋남을 확인, 2026-07-22). 카페24/스마트스토어/쿠팡 주문 API는 전부 실제 타임스탬프를 반환하는데\n기존 수집 코드가 전부 날짜만 남기고 잘라 저장해왔다 — 여기서는 그 truncation 을 거치지 않고\n실제 주문시각으로 집계한다.\n\n**데이터 출처는 두 갈래다(2026-08-07 개편, dashboards/hourly_sales_data.py):**\n  · 마감된 날 = **보존 DB(hourly_sales)** — 매일 수집기가 적재. 토큰·네트워크가 없는\n    보존 사본 사이트(stlite 정적 /app)에서도 지난 날이 그려진다(당일이 없는 건 정상).\n  · 오늘      = 주문 API 라이브(로컬에서만).\n**누적 곡선은 카페24만** 쓴다. 스마트스토어는 커머스 API 가 지난 날 결제분을 못 돌려주고\n(2026-08-01 조회 0원 vs 실제 132만원), 쿠팡은 로켓그로스 정산 지연으로 시각을 못 믿는다 —\n두 채널을 어떤 날은 넣고 어떤 날은 빼면 속도 비교 자체가 틀어지므로 **항상 일 총액으로만** 표시한다.\n\"\"\"\nfrom __future__ import annotations\n\nimport datetime as dt\nimport sys\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parent.parent\nsys.path.insert(0, str(ROOT))\n\nimport pandas as pd  # noqa: E402\nimport streamlit as st  # noqa: E402\n\ntry:\n    st.set_page_config(page_title=\"시간대별 매출 확인\", layout=\"wide\")\nexcept Exception:\n    pass\nfrom dashboards import hourly_sales_data as H  # noqa: E402\nfrom dashboards._style import inject_css  # noqa: E402\n\ninject_css()\n\nLIVE = H.live_available()\n\n\ndef won(v: float) -> str:\n    return f\"{v:,.0f}원\"\n\n\n# ==================================================================\n# 데이터 — 마감된 날은 보존 DB, 오늘은 라이브 API\n# ==================================================================\n\n@st.cache_data(ttl=600, show_spinner=False)\ndef _db_days() -> list[str]:\n    return H.db_available_days()\n\n\n@st.cache_data(ttl=600, show_spinner=False)\ndef _db_day(brand: str, day_iso: str):\n    hours, totals = H.db_load_day(brand, dt.date.fromisoformat(day_iso))\n    return hours.get(\"카페24\", pd.Series(0.0, index=range(24))), totals\n\n\n@st.cache_data(ttl=600, show_spinner=False)\ndef _live_cafe24(mall_id: str, day_iso: str) -> list[dict]:\n    return H.fetch_cafe24_hourly(mall_id, day_iso)\n\n\n@st.cache_data(ttl=600, show_spinner=False)\ndef _live_smartstore(day_iso: str) -> list[dict]:\n    return H.fetch_smartstore_hourly(day_iso)\n\n\n@st.cache_data(ttl=600, show_spinner=False)\ndef _live_coupang(day_iso: str) -> list[dict]:\n    return H.fetch_coupang_live(day_iso)\n\n\n@st.cache_data(ttl=600, show_spinner=False)\ndef _snap_total(channel: str, brand: str, day_iso: str) -> float:\n    return H.snapshot_daily_total(channel, brand, day_iso)\n\n\ndef _hours_from(rows: list[dict], brand: str) -> \"pd.Series\":\n    df = pd.DataFrame([r for r in rows if r[\"브랜드\"] == brand], columns=[\"시\", \"브랜드\", \"매출\"])\n    if df.empty:\n        return pd.Series(0.0, index=range(24))\n    return df.groupby(\"시\")[\"매출\"].sum().reindex(range(24), fill_value=0.0)\n\n\ndef day_data(brand: str, day: dt.date, today: dt.date) -> dict:\n    \"\"\"그 날의 데이터 한 묶음.\n\n    반환: {\"hours\": 카페24 시간대 Series, \"totals\": {채널: 일총액}, \"full\": 마감된 값인가,\n           \"src\": 'db'|'live'|'none'}\n    \"\"\"\n    day_iso = day.isoformat()\n    if day < today and day_iso in _db_days():\n        hours, totals = _db_day(brand, day_iso)\n        return {\"hours\": hours, \"totals\": totals, \"full\": True, \"src\": \"db\"}\n    if not LIVE:\n        return {\"hours\": pd.Series(0.0, index=range(24)), \"totals\": {}, \"full\": False, \"src\": \"none\"}\n\n    hours = _hours_from(_live_cafe24(H.BRAND_MALL[brand], day_iso), brand)\n    totals: dict[str, float] = {}\n    if day < today:   # 마감된 날인데 DB 에 없음 → 총액은 스냅샷(완전값)에서\n        for ch in H.DAY_ONLY_CHANNELS:\n            totals[ch] = _snap_total(ch, brand, day_iso)\n        return {\"hours\": hours, \"totals\": totals, \"full\": True, \"src\": \"live\"}\n    # 오늘 = 진행 중. 스마트스토어·쿠팡은 라이브 부분값(마감 시 늘어난다).\n    totals[\"스마트스토어\"] = float(sum(r[\"매출\"] for r in _live_smartstore(day_iso) if r[\"브랜드\"] == brand))\n    totals[\"쿠팡\"] = float(sum(r[\"매출\"] for r in _live_coupang(day_iso) if r[\"브랜드\"] == brand))\n    return {\"hours\": hours, \"totals\": totals, \"full\": False, \"src\": \"live\"}\n\n\n# ==================================================================\n# 화면 — 따뜻한 톤 카드/SVG (기존 리포트 시리즈와 동일 팔레트)\n# ==================================================================\nst.markdown(\"\"\"\n<style>\n:root { --bg:#f7f4ef; --card:#ffffff; --line:#e6ded0; --tx:#2c2620; --mut:#8a8072;\n  --good:#1f9d74; --bad:#d0483f; --acc:#c9702b; --warn:#a8760a; }\n.hs-wrap * { box-sizing:border-box; }\n.hs-card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px 22px;\n  margin-bottom:16px; box-shadow:0 1px 2px rgba(60,40,10,.04); font-family:'Pretendard','Malgun Gothic',sans-serif; }\n.hs-card.hyp { border-left:4px solid var(--acc); }\n.hs-card p { margin:0 0 8px; font-size:14.5px; color:var(--tx); line-height:1.6; }\n.hs-card p:last-child { margin-bottom:0; }\n.hs-label { font-size:12px; color:var(--mut); margin-bottom:6px; }\n.hs-note { font-size:12.5px; color:var(--mut); margin-top:10px; }\n.hs-kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; }\n.hs-kpi { background:#fbf7ef; border:1px solid var(--line); border-radius:10px; padding:12px 16px; }\n.hs-kpi .n { font-size:21px; font-weight:700; color:var(--tx); }\n.hs-kpi .n.acc { color:var(--acc); }\n.hs-kpi .l { font-size:11.5px; color:var(--
